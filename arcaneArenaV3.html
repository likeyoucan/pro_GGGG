        }
        if (ARENA.stone) c.drawImage(ARENA.stone, -ARENA.cx, -ARENA.cy);
        if (M.mode === "arena" && M.safeR < M.R - 1) {
          c.save();
          c.beginPath();
          c.moveTo(M.R, 0);
          c.ellipse(0, 0, M.R, M.R * K, 0, 0, TAU);
          c.moveTo(M.safeR, 0);
          c.ellipse(0, 0, M.safeR, M.safeR * K, 0, 0, TAU);
          c.clip("evenodd");
          c.fillStyle =
            "rgba(255,70,10," + (0.32 + 0.12 * Math.sin(t * 6)) + ")";
          c.fillRect(-M.R - 10, -M.R * K - 10, 2 * M.R + 20, M.R * K * 2 + 20);
          c.restore();
          c.strokeStyle =
            "rgba(255,210,90," + (0.6 + 0.3 * Math.sin(t * 5)) + ")";
          c.lineWidth = 4;
          c.beginPath();
          c.ellipse(0, 0, M.safeR, M.safeR * K, 0, 0, TAU);
          c.stroke();
        }
        for (const z of M.zones) {
          const k = Math.min(1, z.t / 0.3) * Math.min(1, (z.dur - z.t) / 0.6);
          c.save();
          c.translate(z.x, z.y * K);
          c.scale(1, K);
          c.globalAlpha = Math.max(0, k);
          const g = c.createRadialGradient(0, 0, 0, 0, 0, z.r);
          if (z.type === "lava") {
            g.addColorStop(0, "rgba(255,238,0,.9)");
            g.addColorStop(0.6, "rgba(255,90,20,.75)");
            g.addColorStop(1, "rgba(160,30,0,0)");
          } else {
            g.addColorStop(0, "rgba(220,250,255,.65)");
            g.addColorStop(0.7, "rgba(120,220,255,.5)");
            g.addColorStop(1, "rgba(120,220,255,0)");
          }
          c.fillStyle = g;
          c.beginPath();
          c.arc(0, 0, z.r, 0, TAU);
          c.fill();
          c.restore();
        }
        for (const f of M.fx) if (f.ground && f.draw) f.draw(c, f);
        DR.length = 0;
        for (const o of M.obst) DR.push(o);
        for (const p of M.pk) DR.push(p);
        for (const e of M.monsters) DR.push(e);
        for (const m of M.mages) DR.push(m);
        DR.sort((a, b) => a.y - b.y);
        for (const e of DR) {
          const px = e.x,
            py = e.y * K;
          if (px < cull.x0 || px > cull.x1 || py < cull.y0 || py > cull.y1)
            continue;
          if (e.kind === "mage") {
            if (!e.dead || e.deathT < 1.8)
              drawShadow(c, e.x, e.y, 14, 0.4, e.z);
          } else if (e.kind === "mon")
            drawShadow(c, e.x, e.y, e.r * e.s * 1.1, 0.35, e.z);
          else if (e.kind === "pillar") {
            c.fillStyle = "rgba(0,0,0,.35)";
            c.beginPath();
            c.ellipse(e.x + 30, e.y * K + 6, e.r + 28, e.r * 0.55, 0.2, 0, TAU);
            c.fill();
          } else if (e.kind === "crystal") {
            c.fillStyle = "rgba(0,0,0,.3)";
            c.beginPath();
            c.ellipse(e.x + 8, e.y * K + 3, 16, 7, 0, 0, TAU);
            c.fill();
          } else {
            const g = c.createRadialGradient(e.x, e.y * K, 2, e.x, e.y * K, 28);
            g.addColorStop(0, rgba(e.def.col, 0.55));
            g.addColorStop(1, rgba(e.def.col, 0));
            c.globalCompositeOperation = "lighter";
            c.fillStyle = g;
            c.beginPath();
            c.ellipse(e.x, e.y * K, 28, 14, 0, 0, TAU);
            c.fill();
            c.globalCompositeOperation = "source-over";
          }
        }
        const mul = 1 + 0.05 * (M.t / 30),
          aura = mul > 1.15 ? Math.min(0.4, (mul - 1.15) * 1.5) : 0;
        for (const e of DR) {
          const px = e.x,
            py = e.y * K;
          if (px < cull.x0 || px > cull.x1 || py < cull.y0 || py > cull.y1)
            continue;
          switch (e.kind) {
            case "mage":
              drawMageEnt(c, e, t);
              break;
            case "pillar":
              drawPillar(c, e);
              break;
            case "crystal":
              drawCrystal(c, e, t);
              break;
            case "pickup": {
              if (e.life < 5 && Math.floor(e.t * 8) % 2) break;
              const b = Math.sin(e.t * 3 + e.x) * 4;
              drawIcon(c, iconOfPk(e.def), e.x, e.y * K - 28 - b, 42);
              break;
            }
            case "mon": {
              if (Math.abs(e.vx) > 8) e.f = e.vx < 0 ? -1 : 1;
              drawMon(c, e.x, e.y * K, e.idx, {
                t: e.t || t,
                s: e.s,
                flash:
                  e.flash > 0 ||
                  (e.cwind > 0 && Math.floor(e.t * 20) % 2 === 0),
                elite: e.elite,
                boss: e.boss,
                z: e.z,
                f: e.f || 1,
                aura: aura && !e.dummy ? aura : 0,
              });
              const sy = e.y * K - (e.z || 0);
              if (e.st.frozen > 0) {
                c.fillStyle = "rgba(150,225,255,.5)";
                c.strokeStyle = "#CFF";
                c.lineWidth = 3;
                rr(
                  c,
                  e.x - e.r,
                  sy - e.r * e.s * 2.2,
                  e.r * 2,
                  e.r * e.s * 2.3,
                  6,
                );
                c.fill();
                c.stroke();
              }
              if (e.hp < e.maxHp && !e.boss && !e.dummy) {
                const w = e.r * 1.8;
                c.fillStyle = "rgba(0,0,0,.6)";
                c.fillRect(e.x - w / 2, sy - e.r * e.s * 2.1 - 8, w, 4);
                c.fillStyle = "#FF4040";
                c.fillRect(
                  e.x - w / 2,
                  sy - e.r * e.s * 2.1 - 8,
                  w * clamp(e.hp / e.maxHp, 0, 1),
                  4,
                );
              }
              break;
            }
          }
        }
        c.globalCompositeOperation = "lighter";
        for (const p of PR) {
          if (!p.a) continue;
          const s = p.r * 4.6;
          c.drawImage(ORB[p.orb], p.x - s / 2, p.y * K - 20 - s / 2, s, s);
        }
        c.globalCompositeOperation = "source-over";
        for (const f of M.fx) if (!f.ground && f.draw) f.draw(c, f);
        drawParticles(c, cull);
        drawFT(c);
        c.restore();
        if (G.flash > 0.01) {
          c.globalAlpha = clamp(G.flash, 0, 1);
          c.fillStyle = G.flashCol;
          c.fillRect(0, 0, W, H);
          c.globalAlpha = 1;
        }
        const p = M.player,
          hpP = p.hp / p.maxHp;
        if (hpP < 0.2 && !p.dead) {
          const a = 0.45 + 0.15 * Math.sin(t * TAU * 1.5),
            g = c.createRadialGradient(
              W / 2,
              H / 2,
              Math.min(W, H) * 0.3,
              W / 2,
              H / 2,
              Math.max(W, H) * 0.75,
            );
          g.addColorStop(0, "rgba(255,0,0,0)");
          g.addColorStop(1, "rgba(255,0,0," + a + ")");
          c.fillStyle = g;
          c.fillRect(0, 0, W, H);
        }
        drawHUD(c);
      }

      // ---------- HUD ----------
      function glass(c, x, y, w, h, r, a) {
        a = a === undefined ? 1 : a;
        rr(c, x, y, w, h, r);
        const g = c.createLinearGradient(x, y, x, y + h);
        g.addColorStop(0, "rgba(80,44,140," + 0.6 * a + ")");
        g.addColorStop(1, "rgba(14,8,34," + 0.72 * a + ")");
        c.fillStyle = g;
        c.fill();
        c.lineWidth = 1.5;
        c.strokeStyle = "rgba(255,215,120," + 0.45 * a + ")";
        c.stroke();
      }
      function drawBtn(c, b, icon, o) {
        const r = b.r,
          u = G.u;
        c.save();
        if (o.ready) {
          const g = c.createRadialGradient(
              b.x,
              b.y,
              r * 0.6,
              b.x,
              b.y,
              r * 1.8,
            ),
            pa = 0.45 + 0.3 * Math.sin(G.realT * 7);
          g.addColorStop(0, "rgba(255,215,80," + pa + ")");
          g.addColorStop(1, "rgba(255,215,80,0)");
          c.fillStyle = g;
          c.fillRect(b.x - r * 2, b.y - r * 2, r * 4, r * 4);
        }
        const sc = o.down ? 0.92 : 1;
        c.translate(Math.round(b.x), Math.round(b.y));
        c.scale(sc, sc);
        const g = c.createRadialGradient(0, -r * 0.3, r * 0.1, 0, 0, r);
        g.addColorStop(0, "rgba(90,50,150,.88)");
        g.addColorStop(1, "rgba(16,8,36,.92)");
        c.fillStyle = g;
        c.beginPath();
        c.arc(0, 0, r, 0, TAU);
        c.fill();
        drawIcon(c, icon, 0, 0, r * 1.45);
        if (o.cd > 0) {
          c.fillStyle = "rgba(0,0,0,.62)";
          c.beginPath();
          c.moveTo(0, 0);
          c.arc(0, 0, r, -Math.PI / 2, -Math.PI / 2 + TAU * o.cd);
          c.closePath();
          c.fill();
        }
        c.lineWidth = 3 * u;
        c.strokeStyle = o.ready ? "#FFE066" : "rgba(255,215,120,.7)";
        c.beginPath();
        c.arc(0, 0, r, 0, TAU);
        c.stroke();
        if (o.prog !== undefined) {
          c.lineWidth = 5 * u;
          c.strokeStyle = "rgba(255,255,255,.15)";
          c.beginPath();
          c.arc(0, 0, r + 6 * u, 0, TAU);
          c.stroke();
          c.strokeStyle = o.ready ? "#FFE066" : "#FFB020";
          c.beginPath();
          c.arc(0, 0, r + 6 * u, -Math.PI / 2, -Math.PI / 2 + TAU * o.prog);
          c.stroke();
        }
        c.restore();
      }
      function drawHUD(c) {
        const W = G.W,
          H = G.H,
          u = G.u,
          p = M.player,
          t = G.realT,
          R = Math.round;
        c.textBaseline = "middle";
        c.lineJoin = "round";
        const px = R(14 * u),
          py = R(14 * u);
        glass(c, px, py, R(236 * u), R(72 * u), 12 * u);
        const cx = px + R(38 * u),
          cy = py + R(36 * u);
        c.save();
        c.beginPath();
        c.arc(cx, cy, 26 * u, 0, TAU);
        c.clip();
        const bg = c.createRadialGradient(cx, cy, 2, cx, cy, 28 * u);
        bg.addColorStop(0, "#4a2a8b");
        bg.addColorStop(1, "#12081f");
        c.fillStyle = bg;
        c.fillRect(cx - 30 * u, cy - 30 * u, 60 * u, 60 * u);
        drawMage(c, cx, cy + 36 * u, {
          col: p.col,
          skin: p.skin,
          s: 1.5 * u,
          f: 1,
          t,
          eye: p.eye,
          noStaff: true,
          flash: p.flash,
          death: p.dead ? 1 : 0,
        });
        c.restore();
        c.beginPath();
        c.arc(cx, cy, 26 * u, 0, TAU);
        c.lineWidth = 2.5;
        c.strokeStyle = "#DAA520";
        c.stroke();
        const bx = px + R(72 * u),
          bw = R(150 * u);
        c.textAlign = "left";
        otext(c, p.name, bx, py + R(14 * u), 12 * u, "#fff", 2);
        p.hpD = p.hpD === undefined ? p.hp : lerp(p.hpD, p.hp, 0.12);
        const hy = py + R(26 * u),
          hh = R(15 * u),
          hp = clamp(p.hp / p.maxHp, 0, 1),
          hpd = clamp(p.hpD / p.maxHp, 0, 1);
        c.fillStyle = "rgba(0,0,0,.55)";
        rr(c, bx, hy, bw, hh, 4 * u);
        c.fill();
        if (bw * hp > 3) {
          c.fillStyle = "hsl(" + ((hp * 120) | 0) + ",85%,48%)";
          rr(c, bx, hy, bw * hp, hh, 4 * u);
          c.fill();
        }
        c.lineWidth = 2;
        c.strokeStyle = "#000";
        rr(c, bx, hy, bw, hh, 4 * u);
        c.stroke();
        c.textAlign = "center";
        otext(
          c,
          Math.ceil(p.hp) + "/" + Math.round(p.maxHp),
          bx + bw / 2,
          hy + hh / 2 + 1,
          10 * u,
          "#fff",
          2,
        );
        const my = hy + hh + R(5 * u),
          mh = R(8 * u);
        c.fillStyle = "rgba(0,0,0,.55)";
        rr(c, bx, my, bw, mh, 3 * u);
        c.fill();
        if ((bw * p.mana) / p.maxMana > 3) {
          c.fillStyle = "#3080FF";
          rr(c, bx, my, bw * clamp(p.mana / p.maxMana, 0, 1), mh, 3 * u);
          c.fill();
        }
        c.textAlign = "center";
        otext(c, fmtT(M.t), R(W / 2), R(24 * u), 30 * u, "#fff", 4);
        let sub = "";
        if (M.pvp)
          sub =
            "PvP · " + (M.isHostNet ? L("Хост", "Host") : L("Гость", "Guest"));
        else if (M.mode === "arena")
          sub =
            L("Живы ", "Alive ") +
            M.mages.filter((m) => !m.dead).length +
            "/" +
            M.mages.length +
            " · " +
            L("Зона ", "Zone ") +
            Math.min(5, M.ph + 1) +
            "/5";
        else if (M.mode === "survival")
          sub =
            L("Волна ", "Wave ") +
            M.wave +
            " · " +
            L("Убийств ", "Kills ") +
            M.kills +
            " · Lv " +
            M.lvl;
        if (sub) otext(c, sub, R(W / 2), R(50 * u), 13 * u, "#FFE9A0", 3);
        const pb = UIL.pause;
        c.globalAlpha = 0.9;
        drawIcon(c, "ui_pause", pb.x, pb.y, pb.r * 2);
        c.globalAlpha = 1;
        // Кнопки
        const ready = p.ult >= 100 && !p.cast,
          key = ultKey(p);
        const foe = nearestFoe(p, 60),
          meleeMode =
            p.mana < RCOST ||
            (foe && Math.hypot(foe.x - p.x, foe.y - p.y) - foe.r < 45);
        const atkIcon = meleeMode
          ? "ui_staff"
          : p.runes.length
            ? "e" + p.runes[p.runes.length - 1]
            : "ui_atk";
        drawBtn(c, UIL.dash, "ui_dash", {
          cd: p.dashCd > 0 ? clamp(p.dashCd / (2 * p.up.dcd), 0, 1) : 0,
          down: IN.down.dash,
        });
        drawBtn(c, UIL.atk, atkIcon, {
          cd: p.atkCd > 0 ? clamp(p.atkCd / 0.4, 0, 1) : 0,
          down: IN.down.atk,
        });
        drawBtn(c, UIL.ult, ultIcon(key), {
          prog: p.ult / 100,
          ready,
          down: IN.down.ult,
        });
        if (ready) {
          c.textAlign = "center";
          otext(
            c,
            L("ГОТОВО!", "READY!"),
            R(UIL.ult.x),
            R(UIL.ult.y - UIL.ult.r - 16 * u),
            11 * u,
            "#FFE066",
            3,
          );
        }
        if (IN.joy) {
          const j = IN.joy,
            dx = j.x - j.ox,
            dy = j.y - j.oy,
            l = Math.hypot(dx, dy),
            k = l > 55 ? 55 / l : 1;
          c.fillStyle = "rgba(255,255,255,.08)";
          c.strokeStyle = "rgba(255,255,255,.35)";
          c.lineWidth = 3;
          c.beginPath();
          c.arc(R(j.ox), R(j.oy), 55, 0, TAU);
          c.fill();
          c.stroke();
          c.fillStyle = "rgba(255,230,160,.55)";
          c.beginPath();
          c.arc(R(j.ox + dx * k), R(j.oy + dy * k), 24, 0, TAU);
          c.fill();
        }
        if (M.ann) {
          const a = M.ann,
            al = a.t > a.dur - 0.3 ? clamp((a.dur - a.t) / 0.3, 0, 1) : 1;
          c.save();
          c.globalAlpha = al;
          c.translate(R(W / 2), R(H * 0.3));
          c.textAlign = "center";
          c.shadowColor = a.col;
          c.shadowBlur = 24;
          otext(
            c,
            a.text,
            0,
            0,
            Math.min(72 * u, W / (a.text.length * 0.62)) * a.sz,
            a.col,
            Math.max(4, 72 * u * 0.08),
            "Georgia,serif",
          );
          c.restore();
        }
      }

      // ---------- Меню ----------
      const MN = { arcs: [], arcT: 0, eL: null, eR: null, port: null };
      function menuInit() {
        if (MN.eL) return;
        const mk = (e, r) => ({
          hp: 1,
          maxHp: 1,
          dead: false,
          face: 1,
          x: 0,
          y: 0,
          z: 0,
          runes: [r],
          eye: e,
        });
        MN.eL = mk(mkEye(), 0);
        MN.eR = mk(mkEye(), 1);
        MN.eL.eye.st = "fire";
        MN.eR.eye.st = "cast";
        MN.port = {
          hp: 1,
          maxHp: 1,
          dead: false,
          face: 1,
          x: 0,
          y: 0,
          z: 0,
          runes: [],
          eye: mkEye(),
        };
      }
      function renderMenu(c, dt) {
        menuInit();
        const W = G.W,
          H = G.H,
          t = G.realT;
        IN.px = lerp(IN.px, IN.tpx, 0.06);
        IN.py = lerp(IN.py, IN.tpy, 0.06);
        const th = ARENA.th || THEMES[0];
        c.fillStyle = th.bg;
        c.fillRect(0, 0, W, H);
        drawOcean(c, t, IN.px * -18, IN.py * -10);
        const sc = clamp(Math.min(W / 1000, H / 560), 0.5, 1.6),
          cx = W * 0.44 + IN.px * 16,
          gy = H * 0.8 + IN.py * 8,
          fy = gy - 60 * sc;
        if (ARENA.stone && ARENA.lava) {
          c.save();
          c.translate(cx, gy);
          c.scale(sc * 1.2, sc * 1.2);
          c.fillStyle = th.dk;
          c.beginPath();
          c.ellipse(0, 0, ARENA.R, ARENA.R * K, 0, 0, TAU);
          c.fill();
          c.globalAlpha = 0.8 + 0.2 * Math.sin(t * TAU * 1.5);
          c.drawImage(ARENA.lava, -ARENA.cx, -ARENA.cy);
          c.globalAlpha = 1;
          c.drawImage(ARENA.stone, -ARENA.cx, -ARENA.cy);
          c.restore();
        }
        const ms = 3.4 * sc,
          xl = cx - 150 * sc,
          xr = cx + 150 * sc,
          Cc = { x: cx, y: fy - 34 * ms },
          bob = Math.sin(t * 2) * 1.5 * ms * 0.3;
        for (const q of [
          [MN.eL, xl],
          [MN.eR, xr],
        ]) {
          q[0].x = q[1];
          q[0].y = fy / K;
          q[0].z = 24 * ms - 30;
          q[0].face = q[1] < cx ? 1 : -1;
          updEye(q[0], dt);
        }
        for (const q of [
          [xl, -1],
          [xr, 1],
        ]) {
          const fl = 1 + 0.12 * Math.sin(t * 9) + 0.05 * Math.sin(t * 23);
          c.fillStyle = "rgba(0,0,0,.5)";
          c.beginPath();
          c.ellipse(
            q[0] + q[1] * 70 * ms * fl * 0.9,
            fy + 3 * ms,
            80 * ms * fl,
            10 * ms,
            q[1] * 0.05,
            0,
            TAU,
          );
          c.fill();
        }
        drawMage(c, xl, fy + bob, {
          col: "#B02A2A",
          skin: SKIN0,
          f: 1,
          s: ms,
          t,
          eye: MN.eL.eye,
          noStaff: true,
          look: 0.8,
        });
        drawMage(c, xr, fy + bob, {
          col: "#2F5A9B",
          skin: SKIN0,
          f: -1,
          s: ms,
          t,
          eye: MN.eR.eye,
          noStaff: true,
          look: -0.8,
        });
        const hl = { x: xl + 11 * ms, y: fy - 11 * ms + bob },
          hr = { x: xr - 11 * ms, y: fy - 11 * ms + bob };
        const dS = (h, col, design) => {
          const dx = Cc.x - h.x,
            dy = Cc.y - h.y,
            x1 = Cc.x + dx * 0.5,
            y1 = Cc.y + dy * 0.5;
          c.save();
          c.scale(ms, ms);
          drawStaff(
            c,
            (h.x - dx * 0.3) / ms,
            (h.y - dy * 0.3) / ms,
            x1 / ms,
            y1 / ms,
            col,
            2.4,
            design,
            t,
          );
          c.restore();
          return { x: x1, y: y1 };
        };
        const tl = dS(hl, "#FF5A1A", 0),
          tr = dS(hr, "#40E8FF", 2);
        c.globalCompositeOperation = "lighter";
        const pu = 1 + 0.15 * Math.sin(t * 14) + 0.08 * Math.sin(t * 31);
        let g = c.createRadialGradient(
          Cc.x,
          Cc.y,
          0,
          Cc.x,
          Cc.y,
          150 * ms * pu * 0.7,
        );
        g.addColorStop(0, "rgba(255,255,255,.95)");
        g.addColorStop(0.25, "rgba(210,160,255,.7)");
        g.addColorStop(0.6, "rgba(120,40,200,.3)");
        g.addColorStop(1, "rgba(80,0,160,0)");
        c.fillStyle = g;
        c.fillRect(Cc.x - 160 * ms, Cc.y - 160 * ms, 320 * ms, 320 * ms);
        c.globalCompositeOperation = "source-over";
        if (Math.random() < dt * 70) {
          const a = rnd(0, TAU),
            v = rnd(80, 320);
          emit(
            Cc.x,
            Cc.y / K,
            0,
            Math.cos(a) * v,
            0,
            Math.sin(a) * v,
            rnd(0.3, 0.8),
            rnd(1.5, 3),
            pick(["#fff", "#E0B0FF", "#FFD23A"]),
            1,
            0,
            1,
          );

      function energyTick() {
        const now = Date.now();
        if (S.energy >= 5) {
          S.eT = now;
          return;

        const per = 300000,
          n = Math.floor((now - S.eT) / per);
        if (n > 0) {
          S.energy = Math.min(5, S.energy + n);
          S.eT += n * per;
          if (S.energy >= 5) S.eT = now;
        }
      }

      async function loadLB(kind) {
        const name = kind === "wins" ? "arcane_wins" : "survival_waves";
        try {
          if (ysdk && ysdk.getLeaderboards) {
            const lb = await ysdk.getLeaderboards(),
              r = await lb.getLeaderboardEntries(name, {
                quantityTop: 10,
                includeUser: true,
                quantityAround: 2,
              });
            return r.entries.map((e) => ({
              n: (e.player && e.player.publicName) || "Player",
              s: e.score,
              r: e.rank,
            }));
          }
        } catch (e) {}
        const base = NICKS.map((n, i) => ({
          n,
          s: Math.max(1, Math.round((kind === "wins" ? 60 : 34) / (i + 1.4))),
        }));
        base.push({
          n: S.name + " ★",
          s: kind === "wins" ? S.wins : S.bestWave,
        });
        base.sort((a, b) => b.s - a.s);
        return base.slice(0, 10).map((e, i) => ({ n: e.n, s: e.s, r: i + 1 }));
      }

      function openLevelUp() {
        const up = M.player.up,
          pool = UPG.filter(
            (u) =>
              !(
                (u.id === "pierce" && up.pierce) ||
                (u.id === "magnet" && up.magnet) ||
                (u.id === "expl" && up.expl) ||
                (u.id === "regen" && up.regen) ||
                (u.id === "multi" && up.multi >= 3)
              ),
          );
        const opts = pool.sort(() => Math.random() - 0.5).slice(0, 3);
        releaseAll();
        sfx("level");
        openPanel("levelup", { opts });

      function applyUpg(id) {
        const p = M.player,
          u = p.up;
        switch (id) {
          case "dmg":
            u.dmg *= 1.2;
            break;
          case "hp":
            p.maxHp *= 1.25;
            p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.25);
            break;
          case "spd":
            u.spd *= 1.12;
            break;
          case "mreg":
            u.mreg *= 1.3;
            break;
          case "ugain":
            u.ugain *= 1.35;
            break;
          case "multi":
            u.multi++;
            break;
          case "pierce":
            u.pierce = 1;
            break;
          case "melee":
            u.melee *= 1.5;
            break;
          case "dcd":
            u.dcd *= 0.75;
            break;
          case "magnet":
            u.magnet = 1;
            break;
          case "expl":
            u.expl = 1;
            break;
          case "regen":
            u.regen = 1;
            break;
        }
        // ФИКС: баффаем только СОЮЗНИКОВ (team==="p"), не врагов
        M.mages.forEach((m) => {
          if (!m.isP && m.team === "p")
            m.dmgMul = Math.min(1.8, m.dmgMul + 0.05);
        });
      }
      function finishMatch(kind) {
        const p = M.player;
        let gems = 0,
          xp = 20,
          place = 0;
        if (M.mode === "arena" || M.pvp) {
          place = kind === "victory" ? 1 : p.place || M.mages.length;
          gems = (place === 1 ? 15 : place === 2 ? 8 : 3) + p.kills * 2;
          xp = 30 + p.kills * 10 + (place === 1 ? 40 : 0);
          if (kind === "victory") {
            S.wins++;
            S.st.wins++;
          }
        } else {
          gems = M.wave * 2 + Math.floor(M.kills / 10);
          xp = M.wave * 8 + M.kills;
          if (kind === "victory") {
            gems += 100;
            S.wins++;
            S.st.wins++;
          }
          if (M.wave > S.bestWave) S.bestWave = M.wave;
        }
        if (S.vip) gems = Math.round(gems * 1.5);
        S.gems += gems;
        S.xp += xp;
        while (S.xp >= S.lvl * 100) {
          S.xp -= S.lvl * 100;
          S.lvl++;
        }
        S.passXp += xp;
        checkAch();
        save();
        submitScores();
        M.rew = { gems, xp, place };
        setState(kind === "death" ? "DEATH" : "VICTORY");
        openPanel("result", { kind });
      }

              if (!G.panel || G.panel.name !== "pvp") {
                clearInterval(chk);

              if (Net.conns.size > 0) {
                clearInterval(chk);

            toast(L("Код: 4 символа", "Code: 4 chars"));
            return;
          }
          try {
            toast(L("Подключение…", "Connecting…"));

            toast(L("Не удалось подключиться", "Failed to connect"));

            save();
            refreshMenu();
            rerender();
          }
        },
        claimDaily() {
          const d = dailyState(),
            R = [10, 15, 20, 25, 30, 40];
          if (!d.can) return;
          if (d.day < 6) S.gems += R[d.day];
          else {
            S.gems += 100;
            const lg = SKINS.filter(
              (s) => s.tier === 3 && !S.owned.includes(s.id),
            );
            if (lg.length) {
              const s = pick(lg);
              S.owned.push(s.id);
              toast("🎁 " + L(s.ru, s.en));
            }
          }
          S.cal = { day: (d.day + 1) % 7, last: d.today };
          save();
          sfx("pickup");
          refreshMenu();
          rerender();
        },
        resume() {
          if (G.state !== "PAUSED") return;
          closePanelRaw();
          setState(M.cfg.mode === "ftue" ? "FTUE" : "PLAYING");
        },
        quit() {
          closePanelRaw();
          if (Net.hostConn) {
            try {
              Net.hostConn.send({ t: "leave" });
            } catch (e) {}
          }
          goMenu();
        },
        pickUpg(d) {
          applyUpg(d.id);
          closePanelRaw();
          setState("PLAYING");
          sfx("pickup");
        },
        revive() {
          showRewarded(() => {
            const p = M.player;
            p.dead = false;
            p.hp = p.maxHp * 0.6;
            p.hpD = p.hp;
            p.inv = 2.5;
            p.deathT = 0;
            p.dis = false;
            p.place = 0;
            p.eye.st = "idle";
            p.eye.until = 0;
            M.over = null;
            M.fin = false;
            M.revived = true;
            G.flash = 0.6;
            closePanelRaw();
            setState("PLAYING");
          });
        },
        x2() {
          showRewarded(() => {
            S.gems += M.rew.gems;
            M.doubled = true;
            save();
            toast("+" + M.rew.gems + " 💎");
            rerender();
          });
        },
        replay() {
          const cfg = M.cfg;
          showInterstitial(() => {
            startMatch(cfg);
          });
        },
        toMenu() {
          showInterstitial(() => goMenu());
        },
        skipFtue() {
          if (G.state === "FTUE") finishFtue();
        },
      };
      $("ui").addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (!el) return;
        auInit();
        const a = el.dataset.act;
        if (ACT[a]) {
          sfx("click");
          ACT[a](el.dataset, el);
        }
      });
      $("ui").addEventListener("input", (e) => {
        const t = e.target;
        if (t && t.dataset && t.dataset.set) setOpt(t.dataset.set, t);
      });

      // ---------- SDK ----------
      function initSDK() {
        return new Promise((res) => {
          let done = false;
          const fin = () => {
            if (!done) {
              done = true;
              res();
            }
          };
          try {
            const s = document.createElement("script");
            s.src = "https://yandex.ru/games/sdk/v2";
            s.onload = () => {
              try {
                YaGames.init()
                  .then((y) => {
                    ysdk = y;
                    return y
                      .getPlayer({ scopes: false })
                      .then((p) => {
                        player = p;
                      })
                      .catch(() => {});
                  })
                  .then(fin)
                  .catch(fin);
              } catch (e) {
                fin();
              }
            };
            s.onerror = fin;
            document.head.appendChild(s);
          } catch (e) {
            fin();
          }
          setTimeout(fin, 2500);
        });
      }

      // ---------- Boot ----------
      async function boot() {
        const had = !!localStorage.getItem(SAVE_KEY);
        loadSave();
        G.qual = S.opt.q === "low" ? "low" : "high";
        pQual = S.opt.q === "low" ? 0.5 : 1;
        resize();
        $("ls").textContent = "A Game by " + CONFIG.STUDIO_NAME;
        setLoad(5, L("Подключение…", "Connecting…"));
        await initSDK();
        if (!had && ysdk) {
          try {
            const l = ysdk.environment.i18n.lang;
            S.opt.lang = ["ru", "be", "kk", "uk", "uz"].includes(l)
              ? "ru"
              : "en";
          } catch (e) {}
        }
        if (player) {
          try {
            if (player.getData) {
              const d = await player.getData();
              if (d && d.s) mergeSave(d.s);
            }
            if (!had && player.getName) {
              const n = player.getName();
              if (n)
                S.name = String(n)
                  .replace(/[<>&"']/g, "")
                  .slice(0, 14);
            }
          } catch (e) {}
        }
        setLoad(25, L("Иконки…", "Icons…"));
        await tick();
        genIcons();
        setLoad(55, L("Сферы…", "Orbs…"));
        await tick();
        genOrbs();
        setLoad(75, L("Арена…", "Arena…"));
        await tick();
        buildArena(520, THEMES[0]);
        setLoad(92, L("Почти готово…", "Almost…"));
        await tick();
        buildMenu();
        refreshMenu();
        menuInit();
        loadLB("wins")
          .then((l) => {
            lbNames = l
              .map((e) => e.n.replace(" ★", ""))
              .filter((n) => n !== S.name);
          })
          .catch(() => {});
        setLoad(100, "");
        await new Promise((r) => setTimeout(r, 300));
        try {
          if (
            ysdk &&
            ysdk.features &&
            ysdk.features.LoadingAPI &&
            ysdk.features.LoadingAPI.ready
          )
            ysdk.features.LoadingAPI.ready();
        } catch (e) {}
        requestAnimationFrame(loop);
        if (!S.ftue)
          startMatch({ mode: "ftue", count: 1, sub: "ai", arena: 0 });
        else goMenu();
        setInterval(() => {
          if (G.state === "MENU" || G.state === "MODE_SELECT") renderEnergy();
          if (G.panel && G.panel.name === "energy") rerender();
        }, 1000);
        setInterval(save, 15000);
      }
      const MATCH_ST = [
        "PLAYING",
        "FTUE",
        "PAUSED",
        "LEVELUP",
        "DEATH",
        "VICTORY",
      ];

      // ---------- Main loop ----------
      let lastTs = 0;
      function loop(ts) {
        requestAnimationFrame(loop);
        const dtr = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
        lastTs = ts;
        G.realT += dtr;
        G.dtr = dtr;
        if (isPlay() && G.fpsT < 3) {
          G.fpsT += dtr;
          G.fpsAcc += dtr;
          G.fpsN++;
          if (
            G.fpsT >= 3 &&
            S.opt.q === "auto" &&
            G.fpsN / G.fpsAcc < 45 &&
            G.qual !== "low"
          ) {
            G.qual = "low";
            pQual = 0.5;
            resize();
          }
        }
        pollGP();
        IN.atk = Math.max(0, IN.atk - dtr);
        IN.dash = Math.max(0, IN.dash - dtr);
        IN.ult = Math.max(0, IN.ult - dtr);
        G.shake *= Math.exp(-dtr * 9);
        G.zoomKick *= Math.exp(-dtr * 5);
        G.ca *= Math.exp(-dtr * 4);
        G.flash = Math.max(0, G.flash - dtr * 2.2);
        if (G.windup > 0) G.windup -= dtr;
        if (G.darkT > 0) G.darkT -= dtr;
        G.dark = lerp(
          G.dark,
          G.darkT > 0 ? 0.4 : 0,
          1 - Math.exp(-dtr * (G.darkT > 0 ? 10 : 5)),
        );
        if (G.tint) {
          G.tint.t += dtr;
          if (G.tint.t >= G.tint.dur) G.tint = null;
        }
        if (G.wob > 0) G.wob -= dtr;
        if (G.hitstop > 0) G.hitstop -= dtr;
        if (G.slow > 0) G.slow -= dtr;
        G.ts = lerp(G.ts, G.slow > 0 ? 0.3 : 1, 1 - Math.exp(-dtr * 14));
        if (isPlay() && M) {
          const sd = G.hitstop > 0 ? 0 : dtr * G.ts;
          if (sd > 0) {
            // PvP: гость не симулирует физику — только интерполирует
            if (M.pvp && !M.isHostNet) {
              M.t += sd;
              updateMatchVisualOnly(sd);
            } else {
              updateMatch(sd);
            }
            updParticles(sd);
            updFT(sd);
            // Хост шлёт снапшоты
            if (M.pvp && M.isHostNet) Net.pushSnapshots(sd);
          }
        } else if (!M || G.state === "DEATH" || G.state === "VICTORY") {
          G.simT += dtr;
          updParticles(dtr);
          updFT(dtr);
          if (M && M.fx) updFx(dtr);
        }
        ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
        try {
          if (M && MATCH_ST.includes(G.state)) renderMatch(ctx);
          else renderMenu(ctx, dtr);
        } catch (err) {
          ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
          ctx.fillStyle = "#07030a";
          ctx.fillRect(0, 0, G.W, G.H);
          if (!G.errShown) {
            G.errShown = 1;
            console.error(err);
          }
        }
      }

      // Гость в PvP: только визуал (интерполяция получена в _applySnap)
      function updateMatchVisualOnly(dt) {
        if (!M) return;
        // Плавно двигаем магов к их netTarget
        const k = 1 - Math.exp(-dt * 18);
        for (const m of M.mages) {
          if (m._netT) {
            m.x = lerp(m.x, m._netT.x, k);
            m.y = lerp(m.y, m._netT.y, k);
            m.z = lerp(m.z, m._netT.z, k);
          }
          updEye(m, dt);
          if (m.dead) m.deathT += dt;
        }
        // Монстры анимируются (уже позиционированы снапшотом)
        for (const e of M.monsters) {
          e.t = (e.t || 0) + dt;
        }
        // FX и зоны обновляем
        updFx(dt);
        updZones(dt);
        // Камера следует за игроком
        const p = M.player,
          kc = 1 - Math.exp(-dt * 8);
        CAM.x += (p.x - CAM.x) * kc;
        CAM.y += (p.y * K - 20 - CAM.y) * kc;
        // Комбат-флаг для музыки
        let comb = false;
        for (const e of M.monsters)
          if (Math.hypot(e.x - p.x, e.y - p.y) < 380) {
            comb = true;
            break;
          }
        if (!comb)
          for (const m of M.mages)
            if (m !== p && !m.dead && Math.hypot(m.x - p.x, m.y - p.y) < 420) {
              comb = true;
              break;
            }
        M.combat = comb;
        if (M.ann) {
          M.ann.t += dt;
          if (M.ann.t > M.ann.dur) M.ann = null;
        }
        if (M.over) {
          M.over.t += dt;
          if (!M.fin && M.over.t > 3) {
            M.fin = true;
            finishMatch(M.over.kind);
          }
        }
      }

      boot();
    </script>
  </body>
</html>
