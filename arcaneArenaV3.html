<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>Arcane Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07030a;
        font-family: "Trebuchet MS", Verdana, sans-serif;
        color: #fff;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: none;
        pointer-events: none;
      }
      .screen.on {
        display: block;
      }
      .screen > * {
        pointer-events: auto;
      }
      .dim {
        background: rgba(5, 2, 12, 0.62);
      }
      .glass {
        background: linear-gradient(
          160deg,
          rgba(70, 36, 125, 0.55),
          rgba(15, 8, 35, 0.68)
        );
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 215, 120, 0.4);
        box-shadow:
          inset 0 0 22px rgba(255, 200, 100, 0.12),
          0 8px 30px rgba(0, 0, 0, 0.55);
        border-radius: 14px;
      }
      .small {
        font-size: 12px;
        opacity: 0.8;
      }
      .title {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 900;
        letter-spacing: 0.06em;
        margin: 0;
        font-size: clamp(34px, 7.2vw, 96px);
        line-height: 1;
        text-transform: uppercase;
        background: linear-gradient(
          180deg,
          #fff7b8 0%,
          #ffd23a 30%,
          #ff8a1a 55%,
          #ffd23a 78%,
          #fff7b8 100%
        );
        background-size: 100% 220%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 0 #5a2000)
          drop-shadow(0 0 16px rgba(255, 150, 0, 0.75));
        animation:
          flame 2.2s linear infinite,
          bob 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes flame {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 0 220%;
        }
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-7px);
        }
      }
      .studio {
        font-family: Georgia, serif;
        font-style: italic;
        letter-spacing: 0.18em;
        font-size: clamp(11px, 1.6vw, 17px);
        color: #f3d9a0;
        text-shadow: 0 2px 6px #000;
        margin-top: 8px;
      }
      #s-load {
        background: radial-gradient(ellipse at center, #2a1250 0%, #07030a 75%);
      }
      .loadbox {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: min(90vw, 560px);
      }
      .bar {
        height: 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        margin: 26px 0 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 215, 120, 0.4);
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #ff8a1a, #ffe04a);
        transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #portrait {
        position: absolute;
        left: 14px;
        top: 14px;
        display: flex;
        gap: 10px;
        padding: 8px 16px 8px 8px;
        align-items: center;
      }
      #portrait canvas {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle, #3a2070, #12081f);
        border: 2px solid #daa520;
      }
      #energy {
        position: absolute;
        right: 14px;
        top: 14px;
        padding: 8px 12px;
        display: flex;
        gap: 5px;
        align-items: center;
        cursor: pointer;
      }
      #energy img {
        width: 26px;
        height: 26px;
        transition:
          opacity 0.3s,
          filter 0.3s;
      }
      #titleBox {
        position: absolute;
        left: 0;
        right: 0;
        top: 6%;
        text-align: center;
        pointer-events: none !important;
      }
      #menuBtns {
        position: absolute;
        right: 3%;
        top: 52%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(250px, 36vw);
      }
      #menuFoot {
        position: absolute;
        left: 14px;
        bottom: 10px;
        pointer-events: none !important;
      }
      .btn {
        font:
          800 16px "Trebuchet MS",
          Verdana,
          sans-serif;
        color: #fff;
        padding: 13px 16px;
        border-radius: 12px;
        border: 2px solid rgba(255, 215, 120, 0.55);
        cursor: pointer;
        text-align: left;
        background: linear-gradient(
          160deg,
          rgba(80, 40, 140, 0.7),
          rgba(20, 10, 45, 0.85)
        );
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow:
          inset 0 0 16px rgba(255, 200, 100, 0.15),
          0 6px 18px rgba(0, 0, 0, 0.5);
        text-shadow: 0 2px 3px #000;
        transition:
          transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.3s,
          filter 0.3s;
        display: flex;
        align-items: center;
        gap: 10px;
        touch-action: manipulation;
      }
      .btn:hover {
        transform: translateX(-6px) scale(1.04);
        filter: brightness(1.2);
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.pri {
        font-size: 22px;
        padding: 16px;
        background: linear-gradient(160deg, #ffcf3a, #e07a10);
        color: #2a1000;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        animation: pulse 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .btn.off {
        opacity: 0.45;
        pointer-events: none;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow:
            0 0 10px 2px rgba(255, 200, 60, 0.5),
            0 6px 18px rgba(0, 0, 0, 0.5);
        }
        50% {
          box-shadow:
            0 0 26px 8px rgba(255, 200, 60, 0.9),
            0 6px 18px rgba(0, 0, 0, 0.5);
        }
      }
      .btn img {
        width: 28px;
        height: 28px;
      }
      .panel {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(940px, 96vw);
        max-height: 92vh;
        display: flex;
        flex-direction: column;
        padding: 14px 18px;
        animation: pop 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -46%) scale(0.94);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      .ph {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .ph h2 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 26px;
        color: #ffd86a;
        text-shadow:
          0 2px 0 #000,
          0 0 12px rgba(255, 170, 0, 0.5);
      }
      .x {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        width: 38px;
        height: 38px;
        font-size: 18px;
        cursor: pointer;
      }
      .pbody {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        touch-action: pan-y;
        padding-right: 4px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .card {
        padding: 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 215, 120, 0.25);
        text-align: center;
        font-size: 13px;
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card img {
        width: 56px;
        height: 56px;
      }
      .card b {
        display: block;
        margin: 4px 0;
        color: #ffe08a;
      }
      .card.sel {
        border-color: #ffd23a;
        box-shadow: 0 0 14px rgba(255, 210, 60, 0.6);
      }
      .card.lock {
        opacity: 0.55;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .chip {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 215, 120, 0.4);
        background: rgba(255, 255, 255, 0.07);
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        touch-action: manipulation;
      }
      .chip.on {
        background: linear-gradient(160deg, #ffcf3a, #e07a10);
        color: #2a1000;
        box-shadow: 0 0 12px rgba(255, 200, 60, 0.6);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 8px 0;
      }
      .sbtn {
        padding: 8px 14px;
        border-radius: 10px;
        border: 0;
        font-weight: 800;
        cursor: pointer;
        background: linear-gradient(160deg, #ffcf3a, #e07a10);
        color: #2a1000;
        touch-action: manipulation;
      }
      .sbtn.g {
        background: linear-gradient(160deg, #4cb860, #1f7a33);
        color: #fff;
      }
      .sbtn.b {
        background: linear-gradient(160deg, #6a8cff, #2b3fb0);
        color: #fff;
      }
      .sbtn.off {
        opacity: 0.4;
        pointer-events: none;
      }
      .pbar {
        height: 12px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .pbar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #ff8a1a, #ffe04a);
      }
      input[type="range"] {
        width: 200px;
        accent-color: #ffb020;
      }
      input[type="text"] {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 215, 120, 0.5);
        color: #fff;
        padding: 8px;
        border-radius: 8px;
        font-size: 16px;
        width: 160px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%) translateY(20px);
        padding: 10px 18px;
        border-radius: 12px;
        background: rgba(20, 10, 40, 0.92);
        border: 1px solid #ffd23a;
        opacity: 0;
        transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
        z-index: 50;
        font-weight: 700;
        text-align: center;
        max-width: 90vw;
      }
      #toast.on {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #ad {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        z-index: 60;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-size: 22px;
        pointer-events: auto;
      }
      #ad.on {
        display: flex;
      }
      #skip {
        position: absolute;
        right: 14px;
        bottom: 14px;
        display: none;
        padding: 8px 14px;
        border-radius: 10px;
        font-weight: 800;
        pointer-events: auto;
      }
      #skip.on {
        display: block;
      }
      table.t {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      table.t td {
        padding: 6px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .cm {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
        max-width: 420px;
      }
      .cm div {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 215, 120, 0.2);
      }
      .cm div img {
        width: 80%;
        height: 80%;
      }
      .cm div.on {
        border-color: #ffd23a;
        box-shadow: 0 0 10px #ffd23a;
      }
      @media (max-aspect-ratio: 1/1) {
        #menuBtns {
          top: auto;
          bottom: 3%;
          left: 5%;
          right: 5%;
          width: auto;
          transform: none;
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        #menuBtns .pri {
          grid-column: 1/3;
        }
        .btn:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <div id="s-load" class="screen on">
        <div class="loadbox">
          <h1 class="title">ARCANE ARENA</h1>
          <div class="studio" id="ls"></div>
          <div class="bar"><i id="lb"></i></div>
          <div id="lm" class="small"></div>
        </div>
      </div>
      <div id="s-menu" class="screen">
        <div id="portrait" class="glass">
          <canvas id="pcv" width="112" height="112"></canvas>
          <div>
            <b id="pn"></b>
            <div id="pl" class="small"></div>
            <div id="pg"></div>
          </div>
        </div>
        <div id="energy" class="glass" data-act="energyAd"></div>
        <div id="titleBox">
          <h1 class="title">ARCANE ARENA</h1>
          <div class="studio" id="ms"></div>
        </div>
        <div id="menuBtns"></div>
        <div id="menuFoot" class="small"></div>
      </div>
      <div id="s-panel" class="screen dim">
        <div class="panel glass">
          <div class="ph">
            <h2 id="ptitle"></h2>
            <button class="x" id="pclose" data-act="close">✕</button>
          </div>
          <div class="pbody" id="pbody"></div>
        </div>
      </div>
      <button id="skip" class="btn" data-act="skipFtue"></button>
      <div id="toast"></div>
      <div id="ad"></div>
    </div>
    <script>
      "use strict";
      // ARCANE ARENA v15.1 — fixes + PvP via PeerJS + improved AI + bigger arena
      const CONFIG = {
        STUDIO_NAME: "YOUR_STUDIO_NAME_HERE",
        GAME_VERSION: "15.1.0",
        IS_PRODUCTION: true,
        DEFAULT_LANGUAGE: "ru",
      };
      const K = 0.5,
        TAU = Math.PI * 2;
      const $ = (id) => document.getElementById(id);
      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      const rnd = (a, b) => a + Math.random() * (b - a);
      const rndi = (a, b) => Math.floor(rnd(a, b + 1));
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
      const easeInOut = (t) => {
        t = clamp(t, 0, 1);
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      };
      const tick = () => new Promise((r) => setTimeout(r, 0));
      const _hc = new Map();
      function hexRgb(h) {
        let v = _hc.get(h);
        if (!v) {
          const n = parseInt(h.slice(1), 16);
          v = [n >> 16, (n >> 8) & 255, n & 255];
          _hc.set(h, v);
        }
        return v;
      }
      function rgba(h, a) {
        const v = hexRgb(h);
        return "rgba(" + v[0] + "," + v[1] + "," + v[2] + "," + a + ")";
      }
      function shade(h, f) {
        const v = hexRgb(h);
        let r = v[0],
          g = v[1],
          b = v[2];
        if (f < 1) {
          r *= f;
          g *= f;
          b *= f;
        } else {
          const t = f - 1;
          r += (255 - r) * t;
          g += (255 - g) * t;
          b += (255 - b) * t;
        }
        return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
      }
      function mixHex(a, b, t) {
        const x = hexRgb(a),
          y = hexRgb(b);
        const f = (i) =>
          Math.round(lerp(x[i], y[i], t))
            .toString(16)
            .padStart(2, "0");
        return "#" + f(0) + f(1) + f(2);
      }
      function mkc(w, h) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        return c;
      }
      function rr(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }
      function otext(c, s, x, y, size, fill, sw, font) {
        c.font =
          "800 " + size + "px " + (font || "'Trebuchet MS',Verdana,sans-serif");
        c.lineJoin = "round";
        c.lineWidth = sw || 3;
        c.strokeStyle = "#000";
        c.strokeText(s, x, y);
        c.fillStyle = fill || "#fff";
        c.fillText(s, x, y);
      }
      const fmtT = (s) => {
        s = Math.max(0, s | 0);
        return (
          String((s / 60) | 0).padStart(2, "0") +
          ":" +
          String(s % 60).padStart(2, "0")
        );
      };

      // ---------- СОХРАНЕНИЕ ----------
      const SAVE_KEY = "arcane_arena_v15";
      function defSave() {
        return {
          name: "Маг" + rndi(100, 999),
          gems: 30,
          xp: 0,
          lvl: 1,
          wins: 0,
          bestWave: 0,
          owned: ["def"],
          skin: "def",
          energy: 5,
          eT: Date.now(),
          lastAd: 0,
          cal: { day: 0, last: "" },
          passXp: 0,
          passClaimed: 0,
          ach: {},
          st: {
            kills: 0,
            wins: 0,
            matches: 0,
            ults: 0,
            mega: 0,
            dashes: 0,
            pickups: 0,
            wave: 0,
            clutch: 0,
            combos: 0,
            melee: 0,
            survT: 0,
            runes: 0,
          },
          combosSeen: {},
          opt: {
            sfx: 1,
            music: 1,
            lang: CONFIG.DEFAULT_LANGUAGE,
            tv: 0,
            vib: 1,
            q: "auto",
          },
          ftue: 0,
          vip: 0,
          noAds: 0,
        };
      }
      let S = defSave();
      function loadSave() {
        try {
          const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
          if (d) mergeSave(d);
        } catch (e) {}
      }
      function mergeSave(d) {
        for (const k in d) {
          if (
            d[k] &&
            typeof d[k] === "object" &&
            !Array.isArray(d[k]) &&
            S[k] &&
            typeof S[k] === "object"
          )
            Object.assign(S[k], d[k]);
          else S[k] = d[k];
        }
      }
      let _sv = 0;
      function save() {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify(S));
        } catch (e) {}
        clearTimeout(_sv);
        _sv = setTimeout(() => {
          try {
            if (player && player.setData) player.setData({ s: S }, true);
          } catch (e) {}
        }, 1500);
      }
      const L = (ru, en) => (S.opt.lang === "ru" ? ru : en);

      // ---------- ДАННЫЕ ----------
      const EL = [
        { k: "fire", ru: "Огонь", en: "Fire", col: "#FF4500", lt: "#FFB347" },
        { k: "ice", ru: "Лёд", en: "Ice", col: "#00DDFF", lt: "#C8F6FF" },
        {
          k: "light",
          ru: "Молния",
          en: "Lightning",
          col: "#FFEE00",
          lt: "#FFFBB0",
        },
        { k: "air", ru: "Воздух", en: "Air", col: "#B0E0E6", lt: "#FFFFFF" },
        { k: "void", ru: "Пустота", en: "Void", col: "#6A0DAD", lt: "#C060FF" },
      ];
      const COMBO = {
        "00": [
          "Метеоритный шторм",
          "Meteor Storm",
          "5 метеоров, радиус 80, красный экран",
          "5 meteors, 80px AoE, red screen tint",
        ],
        "01": [
          "Термошок",
          "Thermal Shock",
          "Паровой взрыв: замедляет и ослепляет",
          "Steam blast: slows and blinds",
        ],
        "02": [
          "Плазменная нова",
          "Plasma Nova",
          "Цепная молния на 5 целей",
          "Chain lightning on 5 targets",
        ],
        "03": [
          "Огненный шторм",
          "Firestorm",
          "Огненный торнадо преследует врагов",
          "A fire tornado chases enemies",
        ],
        "04": [
          "Врата ада",
          "Hellgate",
          "Тёмный портал затягивает и жжёт",
          "A dark portal sucks and burns",
        ],
        11: [

          used: [],
          upd(f, dt) {
            f.acc += dt;
            while (f.acc >= 0.09 && f.i < n) {
              f.acc -= 0.09;
              f.i++;
              let best = null,
                bd = 420;
              const chk = (e) => {

                const d = Math.hypot(e.x - f.cur.x, e.y - f.cur.y);
                if (d < bd) {
                  bd = d;
                  best = e;
                }

              M.mages.forEach(chk);
              M.monsters.forEach(chk);
              if (!best) {
                f.used.length = 0;
                M.mages.forEach(chk);
                M.monsters.forEach(chk);
              }
              if (!best) break;
              f.used.push(best);
              boltFx(
                f.cur.x,
                f.cur.y * K - f.cur.z,
                best.x,
                best.y * K - 24,
                "#FFEE00",

      function ultKey(m) {

      function ultName(key) {

      function startUlt(m) {

      // ---------- PvP-хук: гость не считает физику ----------
      const NET_GUEST = () => M && M.pvp && !M.isHostNet;

      // ---------- ИГРОК ----------
      function playerCtl(m) {
        const c = m.ctl;
        let mx = 0,
          my = 0;
        const k = IN.keys;
        if (k.KeyA || k.ArrowLeft) mx -= 1;
        if (k.KeyD || k.ArrowRight) mx += 1;
        if (k.KeyW || k.ArrowUp) my -= 1;
        if (k.KeyS || k.ArrowDown) my += 1;
        if (IN.joy) {

            dy = IN.joy.y - IN.joy.oy,

        if (IN.gp) {
          mx += IN.gp.x;
          my += IN.gp.y;
        }
        let l = Math.hypot(mx, my);
        if (l > 1) {
          mx /= l;
          my /= l;
          l = 1;
        }
        if (l > 0.05) {
          const wy = my / K,
            wl = Math.hypot(mx, wy) || 1;
          c.mx = (mx / wl) * l;
          c.my = (wy / wl) * l;
        } else {
          c.mx = 0;
          c.my = 0;
        }
        let ax = m.face,
          ay = 0,
          got = false;
        if (IN.mouse.has && !IN.touch && !IN.gp) {
          const wx = (IN.mouse.x - G.W / 2) / G.zoom + CAM.x,
            wy = ((IN.mouse.y - G.H / 2) / G.zoom + CAM.y) / K;
          ax = wx - m.x;
          ay = wy - m.y;
          got = true;
        } else {
          const f = nearestFoe(m, 520);
          if (f) {
            ax = f.x - m.x;
            ay = f.y - m.y;
            got = true;
          }
        }
        if (!got && (c.mx || c.my)) {
          ax = c.mx;
          ay = c.my;
        }
        const al = Math.hypot(ax, ay) || 1;
        c.ax = ax / al;
        c.ay = ay / al;
        c.atk = IN.atk > 0;
        c.dash = IN.dash > 0;
        c.ult = IN.ult > 0;
        // PvP гость — отправляем ввод хосту
        if (
          NET_GUEST() &&
          m.isP &&
          typeof Net !== "undefined" &&
          Net.hostConn

          Net.sendToHost({
            t: "input",
            mx: c.mx,
            my: c.my,
            ax: c.ax,
            ay: c.ay,
            atk: c.atk,
            dash: c.dash,
            ult: c.ult,
            face: m.face,
          });
        }
        return c;
      }

      // ---------- УЛУЧШЕННЫЙ ИИ ----------
      function aiCtl(m, dt) {
        const c = m.ctl,
          ai = m.ai;
        c.atk = false;
        c.dash = false;
        c.ult = false;
        ai.t -= dt;
        if (ai.t <= 0) {
          ai.t = rnd(0.15, 0.35);
          let best = null,
            bestScore = -Infinity;
          const check = (e) => {
            if (e.dead || e.team === m.team) return;
            const d = Math.hypot(e.x - m.x, e.y - m.y);
            let score = -d * 0.5;
            if (e.hp / e.maxHp < 0.35) score += 200;
            if (e.boss) score += 120;
            if (e.elite) score += 60;
            if (e.dummy) score -= 500;
            if (score > bestScore) {
              bestScore = score;
              best = e;
            }
          };
          M.mages.forEach(check);
          M.monsters.forEach(check);
          ai.tgt = best;
          // Предметы по потребности
          let bestPk = null,
            bestPkScore = -Infinity;
          for (const p of M.pk) {
            const d = Math.hypot(p.x - m.x, p.y - m.y);
            if (d > 500) continue;
            let s = -d;
            const id = p.def.id;
            if (id === "hp" && m.hp < m.maxHp * 0.7) s += 400;
            if (id === "shield" && m.hp < m.maxHp * 0.6) s += 350;
            if (id === "mana" && m.mana < 30) s += 250;
            if (id === "gem") s += 150;
            if (id === "freeze" && M.monsters.length > 6) s += 200;
            if (id === "haste" && m.dashCd > 0) s += 100;
            if (s > bestPkScore) {
              bestPkScore = s;
              bestPk = p;
            }
          }
          ai.pk = bestPk;
          // Кол-во врагов рядом для ульты
          ai.foeCount = 0;
          const cc = (e) => {
            if (e.dead || e.team === m.team) return;
            if (Math.hypot(e.x - m.x, e.y - m.y) < 380) ai.foeCount++;
          };
          M.mages.forEach(cc);
          M.monsters.forEach(cc);
          if (Math.random() < 0.05 && m.eye.st === "idle") emo(m, "taunt", 0.3);
          if (M.mode === "survival" && M.wave > 10)
            ai.skill = Math.min(0.97, ai.skill + 0.002);
        }
        let mx = 0,
          my = 0;
        const tg = ai.tgt && !ai.tgt.dead ? ai.tgt : null,
          dc = Math.hypot(m.x, m.y);
        let ax = m.face,
          ay = 0;
        if (M.mode === "arena" && dc > M.safeR - 60) {
          mx = -m.x / dc;
          my = -m.y / dc;
        } else if (ai.pk && !ai.pk.dead) {
          const dx = ai.pk.x - m.x,
            dy = ai.pk.y - m.y,
            l = Math.hypot(dx, dy) || 1;
          mx = dx / l;
          my = dy / l;
        } else if (tg) {
          const dx = tg.x - m.x,
            dy = tg.y - m.y,
            d = Math.hypot(dx, dy),
            l = d || 1,
            ux = dx / l,
            uy = dy / l,
            want = m.team === "p" ? 200 : 190;
          if (d > want + 70) {
            mx = ux + uy * ai.str * 0.3;
            my = uy - ux * ai.str * 0.3;
          } else if (d < want - 60) {
            mx = -ux * 0.8 - uy * ai.str * 0.4;
            my = -uy * 0.8 + ux * ai.str * 0.4;
          } else {
            mx = -uy * ai.str;
            my = ux * ai.str;
          }
          // Прицел с предсказанием
          const predT = d / 520,
            px = tg.x + (tg.vx || 0) * predT * 0.7,
            py = tg.y + (tg.vy || 0) * predT * 0.7;
          const err = (1 - ai.skill) * rnd(-0.3, 0.3),
            ang = Math.atan2(py - m.y, px - m.x) + err;
          ax = Math.cos(ang);
          ay = Math.sin(ang);

            if (

              m.atkCd <= 0 &&
              m.mana > RCOST &&
              Math.random() < dt * 6 * ai.skill + 0.05
            )
              c.atk = true;
            if (d - tg.r < 42 && m.atkCd <= 0) c.atk = true;
          }
          // Умная ульта
          if (m.ult >= 100 && !m.cast) {
            if (ai.foeCount >= 2 && d < 400 && Math.random() < dt * 2.5)
              c.ult = true;
            else if (m.hp < m.maxHp * 0.35 && Math.random() < dt * 3)
              c.ult = true;
            else if (tg.boss && d < 500 && Math.random() < dt * 2) c.ult = true;
            else if (d < 250 && Math.random() < dt * 0.5) c.ult = true;
          }
          // Даш
          if (m.dashCd <= 0) {
            if (m.hp < m.maxHp * 0.3 && d < 150 && Math.random() < dt * 3) {
              c.dash = true;
              mx = -ux;
              my = -uy;
            } else if (d > 350 && Math.random() < dt * 0.5) {
              c.dash = true;
              mx = ux;
              my = uy;
            }
          }
        } else if (m.team === "p" && !m.isP) {
          const p = M.player,
            dx = p.x - m.x,
            dy = p.y - m.y,
            d = Math.hypot(dx, dy) || 1;
          if (d > 130) {
            mx = dx / d;
            my = dy / d;
          }
        }
        // Уклонение от снарядов
        if (m.dashCd <= 0 && !c.dash) {
          for (const p of PR) {
            if (!p.a || p.team === m.team) continue;
            const dx = m.x - p.x,
              dy = m.y - p.y,
              d = Math.hypot(dx, dy);
            if (d > 150) continue;
            const pv = Math.hypot(p.vx, p.vy) || 1,
              dot = (dx * p.vx + dy * p.vy) / (d * pv);
            if (dot > 0.85 && Math.random() < dt * 8 * ai.skill) {
              c.dash = true;
              mx = (-p.vy / pv) * ai.str;
              my = (p.vx / pv) * ai.str;
              break;
            }
          }
        }
        const l = Math.hypot(mx, my);
        if (l > 1) {
          mx /= l;
          my /= l;
        }
        c.mx = mx;
        c.my = my;
        c.ax = ax;
        c.ay = ay;
        return c;
      }

      function startDash(m, ctl) {
        let dx = ctl.mx,
          dy = ctl.my;
        if (Math.hypot(dx, dy) < 0.1) {
          dx = ctl.ax;
          dy = ctl.ay;
        }
        const l = Math.hypot(dx, dy) || 1;
        m.dashDx = dx / l;
        m.dashDy = dy / l;
        m.dashT = DASH_D;
        m.inv = 0.3;
        m.dashCd = 2 * m.up.dcd;
        m.flare = 1;
        m.ghost.length = 0;
        burst(m.x, m.y, 4, 10, "#cfc0a0", 120, 0.5, 3, 2, 0);
        sfx("dash");
        if (m.isP) {
          IN.dash = 0;
          S.st.dashes++;
          vib(15);
        }
      }
      function doAttack(m, ctl) {
        let ax = ctl.ax,
          ay = ctl.ay;
        const foe = nearestFoe(m, 60);
        const melee =
          m.mana < RCOST ||
          (foe && Math.hypot(foe.x - m.x, foe.y - m.y) - foe.r < 45);
        if (m.isP) IN.atk = 0;
        if (melee) {
          if (foe) {
            const dx = foe.x - m.x,
              dy = foe.y - m.y,
              l = Math.hypot(dx, dy) || 1;
            ax = dx / l;
            ay = dy / l;
          }
          m.atkCd = 0.5;
          m.swing = 0.001;
          sfx("melee");
          let hit = false;
          const ang = Math.atan2(ay, ax);
          const test = (e) => {
            if (e.dead || e.team === m.team) return;
            const dx = e.x - m.x,
              dy = e.y - m.y,
              d = Math.hypot(dx, dy);
            if (d > 70 + e.r) return;
            let da = Math.atan2(dy, dx) - ang;
            da = Math.atan2(Math.sin(da), Math.cos(da));
            if (Math.abs(da) > 1.15 && d > e.r + 12) return;
            if (
              hurt(e, 22 * m.dmgMul * m.up.dmg * m.up.melee, m, {
                kx: (dx / (d || 1)) * 660,
                ky: (dy / (d || 1)) * 660,
                melee: 1,
              })
            )
              hit = true;
          };
          for (const e of M.mages) test(e);
          for (const e of M.monsters) test(e);
          for (const o of M.obst)
            if (!o.dead && Math.hypot(o.x - m.x, o.y - m.y) < 62 + o.r)
              hitObst(o, 1, m);
          if (hit) {
            m.mana = Math.min(m.maxMana, m.mana + m.maxMana * 0.15);
            feel(0.06, 3, m.isP);
            if (m.isP) S.st.melee++;
          }
        } else {
          m.mana -= RCOST;
          m.atkCd = 0.36;
          const el = m.runes.length ? m.runes[m.runes.length - 1] : -1,
            n = 1 + m.up.multi,
            base = Math.atan2(ay, ax);
          for (let i = 0; i < n; i++) {
            const a = base + (i - (n - 1) / 2) * 0.2;
            shoot(m, m.x + Math.cos(a) * 16, m.y + Math.sin(a) * 16, a, {
              dmg: 12 * m.dmgMul * m.up.dmg,
              el,
              pierce: m.up.pierce ? 2 : 0,
              expl: m.up.expl,
            });
          }
          sfx("shoot", el < 0 ? 0 : el);
          if (m.isP) G.shake = Math.max(G.shake, 0.8);
        }
      }
      function updMage(m, dt) {
        updEye(m, dt);
        if (m.dead) {
          m.deathT += dt;
          return;
        }
        for (const k in m.st) if (m.st[k] > 0) m.st[k] -= dt;
        m.inv -= dt;
        m.atkCd -= dt;
        m.dashCd -= dt;
        m.flash -= dt;
        m.flare = Math.max(0, m.flare - dt * 3);
        if (m.landT > 0) m.landT -= dt;
        if (m.swing > 0) {
          m.swing += dt * 5.5;
          if (m.swing >= 1) m.swing = 0;
        }
        if (m.st.burn > 0) {
          m.bt = (m.bt || 0) - dt;
          if (m.bt <= 0) {
            m.bt = 0.4;
            hurt(m, 5, m.burnSrc, { dot: 1 });
          }
        }
        if (m.dead) return;
        m.mana = Math.min(m.maxMana, m.mana + 9.6 * m.up.mreg * dt);
        m.ult = Math.min(100, m.ult + (100 / 30) * m.up.ugain * dt);
        if (m.up.regen && m.hp < m.maxHp)
          m.hp = Math.min(m.maxHp, m.hp + 1.5 * m.up.regen * dt);
        if (M.ft && M.ft.step < 2 && m.isP) m.ult = 0;
        if (M.ft && M.ft.step === 2 && m.isP) m.ult = 100;

        // PvP-гость: позицию/анимации обновляет интерполятор, физику не считаем
        if (NET_GUEST() && !m.isP) {
          updEye(m, dt);
          return;
        }
        // PvP-хост: гость-маг управляется через netInput
        let ctl;
        if (M.pvp && m.isP && !M.isHostNet)
          ctl = m.ctl; // гость — свой ввод (но host управляет)
        else if (m.isP) ctl = playerCtl(m);
        else if (M.pvp && m.netId && m.netId !== "PENDING")
          ctl = m.ctl; // хост-маг другого игрока
        else ctl = aiCtl(m, dt);

        const frozen = m.st.frozen > 0 || m.st.stun > 0;
        if (M.over && m.isP)
          ctl = {
            mx: 0,
            my: 0,
            ax: m.face,
            ay: 0,
            atk: false,
            dash: false,
            ult: false,
          };
        const lock = frozen || m.cast;
        if (Math.abs(ctl.ax) > 0.15) m.face = ctl.ax > 0 ? 1 : -1;
        m.look = ctl.ax * 0.8;
        if (m.cast) {
          m.cast.t -= dt;
          if (m.cast.t <= 0) {
            const k = m.cast.key;
            m.cast = null;
            execUlt(m, k);
          }
        } else if (ctl.ult && m.ult >= 100 && !frozen && m.dashT <= 0)
          startUlt(m);
        if (!lock && m.dashT <= 0) {
          if (ctl.dash && m.dashCd <= 0) startDash(m, ctl);
          else if (ctl.atk && m.atkCd <= 0) doAttack(m, ctl);
        }
        let tx = 0,
          ty = 0;
        const sm =
          (m.st.haste > 0 ? 1.3 : 1) * (m.st.slow > 0 ? 0.5 : 1) * m.up.spd;
        if (!lock && m.dashT <= 0) {
          let mx = ctl.mx,
            my = ctl.my;
          if (m.st.blind > 0 && !m.isP) {
            mx = Math.cos(M.t * 2 + m.x);
            my = Math.sin(M.t * 1.7 + m.y);
          }
          tx = mx * m.spd * sm;
          ty = my * m.spd * sm;
        }
        if (m.dashT > 0) {
          m.dashT -= dt;
          m.vx = m.dashDx * DASH_V;
          m.vy = m.dashDy * DASH_V;
          const u = DASH_D - Math.max(0, m.dashT);
          m.z =
            u < 0.15
              ? 15 * easeOut(u / 0.15)
              : 15 * Math.max(0, 1 - (u - 0.15) / 0.07);
          m.flare = 1;
          if (m.dashT <= 0) {
            m.dashT = 0;
            m.landT = 0.14;
            m.z = 0;
            burst(m.x, m.y, 3, 12, "#cfc0a0", 140, 0.5, 3, 2, 0);
            m.vx = m.dashDx * m.spd;
            m.vy = m.dashDy * m.spd;
          }
        } else {
          const a = Math.min(1, (onIce(m) ? 2.4 : 13) * dt);
          m.vx += (tx - m.vx) * a;
          m.vy += (ty - m.vy) * a;
          if (m.landT > 0) m.z = 4 * Math.sin(Math.PI * (1 - m.landT / 0.14));
          else
            m.z =
              M.over && M.over.kind === "victory" && m.victor
                ? lerp(m.z, 20, 0.1)
                : 0;
        }
        m.x += (m.vx + m.kx) * dt;
        m.y += (m.vy + m.ky) * dt;
        const kd = Math.exp(-6 * dt);
        m.kx *= kd;
        m.ky *= kd;
        collide(m);
        if (M.mode === "arena" && Math.hypot(m.x, m.y) > M.safeR) {
          m.lt = (m.lt || 0) - dt;
          if (m.lt <= 0) {
            m.lt = 0.25;
            hurt(m, (8 + M.ph * 4) * 0.25, null, { dot: 1, pierce: 1 });
          }
        }
        if (m.isP) {
          const hp = m.hp / m.maxHp;
          if (hp < 0.15 && !m.nd) {
            m.nd = true;
            G.slow = Math.max(G.slow, 0.4);
          }
          if (hp >= 0.2) m.nd = false;
          if (hp < 0.15 && !M.over) {
            M.lowT -= dt;

      // ---------- МОНСТРЫ ----------
      function spawnMon(idx, o) {
        const d = MON[idx],
          sh = SH[d[2]];
        // страховка от NaN
        if (!o || !isFinite(o.x) || !isFinite(o.y)) {
          const a = rnd(0, TAU);
          o = Object.assign({}, o, {
            x: Math.cos(a) * M.R * 0.85,
            y: Math.sin(a) * M.R * 0.85,
          });
        }
        const i = Math.min(idx, 29),
          w = o.wave || M.wave,
          boss = !!o.boss,
          el = !!o.elite;
        let hp = (18 + i * 6) * (1 + w * 0.08),
          dmg = 6 + i * 0.5 + w * 0.3,
          r = sh.r,
          s = 1,
          xp = 3 + i * 0.7,
          spd = 62 * sh.sp + i * 0.8;
        if (el) {
          hp *= 2.6;
          dmg *= 1.4;
          r *= 1.3;
          s = 1.3;
          xp *= 3;
        }
        if (boss) {
          hp = 900 + w * 80;
          dmg = 22;
          r = 34;
          s = 2.6;
          xp = 120;
          spd = 55;
        }
        const e = {
          kind: "mon",
          idx,
          x: o.x,
          y: o.y,
          z: 0,
          vx: 0,
          vy: 0,
          kx: 0,
          ky: 0,
          hp,
          maxHp: hp,
          r,
          spd,
          dmg,
          beh: sh.beh,
          fly: !!sh.fly,
          team: "m",
          elite: el,
          boss,
          st: {},
          inv: 0,
          flash: 0,
          hitCd: rnd(0, 0.5),
          t: rnd(0, 6),
          fcd: rnd(0.5, 2),
          ccd: rnd(1, 3),
          cwind: 0,
          cht: 0,
          cdx: 0,
          cdy: 0,
          xp: Math.round(xp),
          s,
          wave: w,
          bt1: 4,
          bt2: 6,
          dummy: !!o.dummy,
        };
        M.monsters.push(e);
        return e;
      }
      function spawnWave(n) {
        M.wave = n;
        M.waveT = 0;
        announce(L("ВОЛНА ", "WAVE ") + n, "#FF9A3A");
        if (BOSS_IDX[n]) M.spawnQ.push({ idx: BOSS_IDX[n], boss: true });
        const cnt = Math.min(70, 4 + n * 2 + (M.mages.length - 1) * 3),
          mx = Math.min(29, Math.floor(n * 1.1) + 2);
        for (let i = 0; i < cnt; i++)
          M.spawnQ.push({
            idx: Math.min(
              mx,
              Math.floor(Math.pow(Math.random(), 0.6) * (mx + 1)),
            ),
            elite: Math.random() < 0.04 + n * 0.008,
          });
        if (n > S.st.wave) S.st.wave = n;
      }
      function updMon(e, dt) {
        if (e.dead) return;
        for (const k in e.st) if (e.st[k] > 0) e.st[k] -= dt;
        e.inv -= dt;
        e.flash -= dt;
        e.hitCd -= dt;
        e.t += dt;
        if (e.st.burn > 0) {
          e.bt = (e.bt || 0) - dt;
          if (e.bt <= 0) {
            e.bt = 0.4;
            hurt(e, 5, e.burnSrc, { dot: 1 });
          }
        }
        if (e.dead) return;
        const frozen = e.st.frozen > 0 || e.st.stun > 0;
        let tg = null,
          bd = 1e9;
        for (const m of M.mages) {
          if (m.dead) continue;
          const d = Math.hypot(m.x - e.x, m.y - e.y);
          if (d < bd) {
            bd = d;
            tg = m;
          }
        }
        let mx = 0,
          my = 0;
        const sp = e.spd * (1 + 0.05 * (M.t / 30)) * (e.st.slow > 0 ? 0.5 : 1);
        if (!frozen && tg && !e.dummy) {
          const dx = tg.x - e.x,
            dy = tg.y - e.y,
            d = Math.hypot(dx, dy) || 1,
            ux = dx / d,
            uy = dy / d;
          if (e.st.blind > 0) {
            mx = Math.cos(M.t * 3 + e.x);
            my = Math.sin(M.t * 2.3 + e.y);
          } else if (e.beh === "ranged") {
            if (d > 250) {
              mx = ux;
              my = uy;
            } else if (d < 170) {
              mx = -ux;
              my = -uy;
            } else {
              mx = -uy * 0.5;
              my = ux * 0.5;
            }
            e.fcd -= dt;
            if (e.fcd <= 0 && d < 420) {
              e.fcd = rnd(1.8, 2.6);
              shoot(e, e.x, e.y, Math.atan2(dy, dx), {
                spd: 230,
                r: 7,
                dmg: e.dmg,
                el: -1,
                life: 2.5,
                col: "#FF3070",
                orb: 6,
                team: "m",
              });
            }
          } else if (e.beh === "charger") {
            if (e.cht > 0) {
              e.cht -= dt;
              mx = e.cdx * 3;
              my = e.cdy * 3;
            } else if (e.cwind > 0) {
              e.cwind -= dt;
              if (e.cwind <= 0) {
                e.cht = 0.5;
                e.cdx = ux;
                e.cdy = uy;
              }
            } else {
              mx = ux;
              my = uy;
              e.ccd -= dt;
              if (e.ccd <= 0 && d < 280) {
                e.ccd = rnd(3, 4.5);
                e.cwind = 0.4;
              }
            }
          } else {
            mx = ux;
            my = uy;
          }
          if (e.boss) {
            e.bt1 -= dt;
            if (e.bt1 <= 0) {
              e.bt1 = 4;
              for (let i = 0; i < 12; i++)
                shoot(e, e.x, e.y, (i / 12) * TAU + M.t, {
                  spd: 200,
                  r: 8,
                  dmg: e.dmg * 0.6,
                  life: 3,
                  col: "#FF3070",
                  orb: 6,
                  team: "m",
                });
              sfx("boom");
              G.shake = Math.max(G.shake, 5);
            }
            e.bt2 -= dt;
            if (e.bt2 <= 0) {
              e.bt2 = 9;
              // ФИКС: правильный вызов spawnMon с объектом
              for (let i = 0; i < 3; i++)
                spawnMon(Math.floor(rnd(8, 16)), {
                  x: e.x + rnd(-60, 60),
                  y: e.y + rnd(-60, 60),
                });
            }
          }
          if (d < e.r + tg.r + 2 && e.hitCd <= 0 && e.st.blind <= 0) {
            e.hitCd = 0.8;
            hurt(tg, e.dmg, e, { kx: ux * 260, ky: uy * 260 });
          }
        }
        const a = Math.min(1, 8 * dt);
        e.vx += (mx * sp - e.vx) * a;
        e.vy += (my * sp - e.vy) * a;
        if (frozen) {
          e.vx = 0;
          e.vy = 0;
        }
        e.x += (e.vx + e.kx) * dt;
        e.y += (e.vy + e.ky) * dt;
        const kd = Math.exp(-6 * dt);
        e.kx *= kd;
        e.ky *= kd;
        if (!e.fly) collide(e);
        else {
          const dc = Math.hypot(e.x, e.y),
            lim = M.R - e.r;
          if (dc > lim) {
            e.x *= lim / dc;
            e.y *= lim / dc;
          }
        }
        near(e.x, e.y, e.r, TMPM);
        for (const o of TMPM) {
          if (o === e || o.kind !== "mon" || o.dead) continue;
          const dx = e.x - o.x,
            dy = e.y - o.y,
            d = Math.hypot(dx, dy),
            mn = (e.r + o.r) * 0.9;
          if (d < mn && d > 0.01) {
            const f = (mn - d) * 4 * dt;
            e.x += (dx / d) * f;
            e.y += (dy / d) * f;
          }
        }
        e.z = e.fly ? 14 + Math.sin(e.t * 4) * 4 : 0;
      }

      // ---------- ПРЕДМЕТЫ ----------
      function randPickupDef() {
        const tot = PK.reduce((a, p) => a + p.w, 0);
        let r = Math.random() * tot;
        for (const p of PK) {

          if (r <= 0) return p;
        }
        return PK[0];

      function updPickups(dt) {
        M.pkT -= dt;
        if (M.pkT <= 0) {
          M.pkT = rnd(8, 15);
          spawnPickup();
        }
        for (const p of M.pk) {
          p.t += dt;
          p.life -= dt;
          if (p.life <= 0) p.dead = true;
          for (const m of M.mages) {
            if (m.dead || p.dead) continue;
            const dx = m.x - p.x,
              dy = m.y - p.y,
              d = Math.hypot(dx, dy);
            if (m.up.magnet && d < 200 && d > 1) {
              p.x += (dx / d) * 220 * dt;
              p.y += (dy / d) * 220 * dt;
            }
            if (d < m.r + p.r + 6) {
              collect(m, p);
              break;
            }
          }
        }
        for (let i = M.pk.length - 1; i >= 0; i--)
          if (M.pk[i].dead) M.pk.splice(i, 1);
      }

      // ---------- FTUE / ФАЗЫ / ВОЛНЫ ----------
      function updFtue(dt) {
        const f = M.ft,
          p = M.player;
        p.hp = p.maxHp;
        if (f.step === 0) {
          f.dist += Math.hypot(p.vx, p.vy) * dt;
          if (f.dist >= 50) {
            f.step = 1;
            f.dummy = spawnMon(0, {
              x: p.x + 150,
              y: p.y - 30,
              dummy: true,
              wave: 1,
            });
            f.dummy.hp = f.dummy.maxHp = 99999;
            p.mana = 0;
            sfx("level");
          }
        } else if (f.step === 1) {
          p.mana = 0;
          if (f.hit) {
            f.step = 2;
            p.ult = 100;
            p.runes = [0, 0];
            p.mana = p.maxMana;
            sfx("level");
          }
        } else if (f.step === 2) {
          if (f.ulted) {
            f.step = 3;
            f.t3 = 0;
            if (f.dummy) {
              f.dummy.dead = true;
              burst(f.dummy.x, f.dummy.y, 14, 50, "#FFD23A", 260, 1, 4, 0, 300);
            }
            announce(L("ТЫ ГОТОВ!", "YOU ARE READY!"), "#FFD23A");
            sfx("victory");
          }
        } else if (f.step === 3) {
          f.t3 += dt;
          if (f.t3 > 2.6 && !f.done) {
            f.done = true;
            finishFtue();
          }
        }
      }
      function updPhase(dt) {
        if (M.mode !== "arena" || M.ph >= 5) return;
        const p = PH[M.ph];
        M.phT += dt;
        if (M.phS === "hold") {
          M.safeR = M.holdR;
          if (M.phT >= p.hold) {
            M.phS = "shrink";
            M.phT = 0;
            M.from = M.safeR;
            announce(L("ЗОНА СУЖАЕТСЯ!", "ZONE SHRINKING!"), "#FF6A1A");
            sfx("windup");
          }
        } else {
          const to = M.ph < 4 ? M.R * PH[M.ph + 1].r : M.R * 0.08;
          M.safeR = lerp(M.from, to, easeInOut(M.phT / p.sh));
          if (M.phT >= p.sh) {
            M.safeR = to;
            M.holdR = to;
            M.ph++;
            M.phS = "hold";
            M.phT = 0;
          }
        }
      }
      function updWaves(dt) {
        if (M.mode !== "survival") return;
        M.waveT += dt;
        M.spawnT -= dt;
        if (M.spawnQ.length && M.spawnT <= 0 && M.monsters.length < 70) {
          const q = M.spawnQ.pop(),
            an = rnd(0, TAU);
          spawnMon(q.idx, {
            x: Math.cos(an) * M.R * 0.93,
            y: Math.sin(an) * M.R * 0.93,
            elite: q.elite,
            boss: q.boss,
          });
          M.spawnT = Math.max(0.05, 0.35 - M.wave * 0.01);
        }
        if (!M.spawnQ.length && M.monsters.length === 0) {
          M.waveDelay -= dt;
          if (M.waveDelay <= 0) {
            M.waveDelay = 2;
            spawnWave(M.wave + 1);
          }
        } else if (M.waveT > 38 && !M.spawnQ.length && M.wave < 50) {
          M.waveDelay = 2;
          spawnWave(M.wave + 1);
        }
      }
      function checkEnd() {
        if (M.over || M.mode === "ftue") return;
        const p = M.player;
        if (p.dead) {
          M.over = { kind: "death", t: 0 };
          return;
        }
        if (M.mode === "arena" || M.pvp) {
          const alive = M.mages.filter((m) => !m.dead);
          if (alive.length <= 1) startVictory();
        } else if (M.bossDown) startVictory();
      }
      function startVictory() {
        const p = M.player;
        M.over = { kind: "victory", t: 0, fw: 0 };

      // ---------- ГЛАВНЫЙ АПДЕЙТ ----------
      function updateMatch(dt) {
        M.t += dt;
        G.simT += dt;
        rebuildHash();
        for (const m of M.mages) updMage(m, dt);
        for (const e of M.monsters) updMon(e, dt);
        for (let i = M.monsters.length - 1; i >= 0; i--)
          if (M.monsters[i].dead) M.monsters.splice(i, 1);
        for (let i = M.obst.length - 1; i >= 0; i--)
          if (M.obst[i].dead) M.obst.splice(i, 1);
          else if (M.obst[i].flash > 0) M.obst[i].flash -= dt;
        updProj(dt);
        updFx(dt);
        updZones(dt);
        updPickups(dt);
        updPhase(dt);
        updWaves(dt);
        if (M.ft) updFtue(dt);
        let comb = false;
        for (const e of M.monsters)
          if (Math.hypot(e.x - M.player.x, e.y - M.player.y) < 380) {
            comb = true;
            break;
          }
        if (!comb && (M.mode === "arena" || M.pvp))
          for (const m of M.mages)
            if (
              m !== M.player &&
              !m.dead &&
              Math.hypot(m.x - M.player.x, m.y - M.player.y) < 420
            ) {
              comb = true;
              break;
            }
        M.combat = comb;
        if (M.ultFx > 0) M.ultFx -= dt;
        if (M.streakT > 0) {
          M.streakT -= dt;
          if (M.streakT <= 0) M.streak = 0;
        }
        for (let i = M.nots.length - 1; i >= 0; i--) {
          M.nots[i].t += dt;
          if (M.nots[i].t > 1.5) M.nots.splice(i, 1);
        }
        if (M.ann) {
          M.ann.t += dt;
          if (M.ann.t > M.ann.dur) M.ann = null;
        }
        if (M.mode === "survival") S.st.survT += dt;
        if (M.pendLvl > 0 && !M.over) {
          M.pendLvl--;
          openLevelUp();
        }
        checkEnd();
        if (M.over) {
          M.over.t += dt;
          if (M.over.kind === "victory") {
            M.over.fw -= dt;
            if (M.over.fw <= 0) {
              M.over.fw = 0.35;
              const p = M.player;
              burst(
                p.x + rnd(-200, 200),
                p.y + rnd(-100, 100),
                rnd(100, 200),
                30,
                pick(["#FFD23A", "#FF4060", "#40D0FF", "#80FF80"]),
                220,
                1.2,
                3,
                3,
                150,
              );
            }
          }
          if (!M.fin && M.over.t > (M.over.kind === "death" ? 2.5 : 3.2)) {
            M.fin = true;
            finishMatch(M.over.kind);
          }
        }
        const p = M.player,
          k = 1 - Math.exp(-dt * 8);
        CAM.x += (p.x - CAM.x) * k;
        CAM.y += (p.y * K - 20 - CAM.y) * k;
      }
      // ===================== PvP через PeerJS (без сервера) =====================
      const Net = {
        peer: null,
        conns: new Map(),
        hostConn: null,
        isHost: false,
        roomCode: null,
        _snapAcc: 0,
        _netProj: [],

        makeCode() {
          const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          let s = "";
          for (let i = 0; i < 4; i++) s += A[(Math.random() * A.length) | 0];
          return s;
        },

        _initPeer(customId, onReady) {
          try {
            this.peer = customId ? new Peer(customId) : new Peer();
          } catch (e) {
            toast(L("Ошибка WebRTC", "WebRTC error"));
            return;
          }
          this.peer.on("open", (id) => onReady && onReady(id));
          this.peer.on("error", (e) => {
            console.warn("Peer error", e);
            if (e.type === "peer-unavailable")
              toast(L("Комната не найдена", "Room not found"));
            else if (e.type === "unavailable-id")
              toast(L("Код занят", "Code busy"));
            else if (e.type === "network") toast(L("Нет сети", "No network"));
          });
          this.peer.on("disconnected", () => {
            try {
              this.peer.reconnect();
            } catch (e) {}
          });
        },

        host() {
          return new Promise((resolve) => {
            this.isHost = true;
            this.roomCode = this.makeCode();
            const id = "arcane-pvp-" + this.roomCode;
            this._initPeer(id, () => {
              this.peer.on("connection", (conn) => this._setupConn(conn, true));
              resolve(this.roomCode);
            });
          });
        },

        join(code) {
          return new Promise((resolve, reject) => {
            this.isHost = false;
            this.roomCode = code.toUpperCase();
            this._initPeer(null, () => {
              const conn = this.peer.connect("arcane-pvp-" + this.roomCode, {
                reliable: true,
              });
              this._setupConn(conn, false);
              let opened = false;
              conn.on("open", () => {
                opened = true;
                resolve();
              });
              setTimeout(() => {
                if (!opened) {
                  try {
                    conn.close();
                  } catch (e) {}
                  reject(new Error("timeout"));
                }
              }, 9000);
            });
          });
        },

        _setupConn(conn, asHost) {
          if (asHost) this.conns.set(conn.peer, conn);
          else this.hostConn = conn;

          conn.on("data", (msg) => {
            if (!msg || typeof msg !== "object") return;
            switch (msg.t) {
              case "input":
                if (this.isHost) this._onInput(msg, conn);
                break;
              case "snap":
                if (!this.isHost) this._applySnap(msg);
                break;
              case "start":
                if (!this.isHost) this._onStart(msg);
                break;
              case "leave":
                if (this.isHost) {
                  this.conns.delete(conn.peer);
                  this._dropGuest(conn.peer);
                } else {
                  toast(L("Хост покинул игру", "Host left"));
                  M = null;
                  goMenu();
                }
                break;
            }
          });
          conn.on("close", () => {
            if (this.isHost) {
              this.conns.delete(conn.peer);
              this._dropGuest(conn.peer);
            } else if (M) {
              toast(L("Соединение потеряно", "Connection lost"));
              M = null;
              goMenu();
            }
          });
          conn.on("error", (e) => console.warn("Conn error", e));

          if (asHost && M && M.pvp) {
            const free = M.mages.find((m) => m.netId === "PENDING");
            if (free) {
              free.netId = conn.peer;
              free.name = "Player";
              conn.send({
                t: "start",
                yourNetId: conn.peer,
                room: this.roomCode,
                arena: G.sel.arena || 0,
              });
              this._sendSnapshotTo(conn);
              sfx("join");
              toast(L("Игрок подключился!", "Player joined!"));
            }
          }
        },

        _onStart(msg) {
          startPvpMatch(false, msg.room, msg.arena, msg.yourNetId);
          toast(L("Подключено!", "Connected!"));
          sfx("join");
        },

        _dropGuest(peerId) {
          if (!M) return;
          const m = M.mages.find((x) => x.netId === peerId);
          if (m) {
            m.netId = null;
            m.isP = false;
            m.name = "AI";
            emo(m, "idle", 1, true);
          }
        },

        sendToHost(data) {
          if (this.hostConn && this.hostConn.open) {
            try {
              this.hostConn.send(data);
            } catch (e) {}
          }
        },

        _onInput(msg, conn) {
          if (!M) return;
          const m = M.mages.find((x) => x.netId === conn.peer);
          if (!m || m.dead) return;
          m.ctl.mx = clamp(msg.mx || 0, -1, 1);
          m.ctl.my = clamp(msg.my || 0, -1, 1);
          m.ctl.ax = msg.ax || 1;
          m.ctl.ay = msg.ay || 0;
          if (msg.atk) m.ctl.atk = true;
          if (msg.dash) m.ctl.dash = true;
          if (msg.ult) m.ctl.ult = true;
        },

        _snapshot() {
          if (!M) return null;
          const pack = (e) => [
            Math.round(e.x * 10) / 10,
            Math.round(e.y * 10) / 10,
            Math.round((e.z || 0) * 10) / 10,
            Math.round(e.hp),
            Math.round((e.vx || 0) * 10) / 10,
            Math.round((e.vy || 0) * 10) / 10,
            e.face || 1,
          ];
          return {
            t: "snap",
            time: M.t,
            over: M.over ? M.over.kind : null,
            mages: M.mages.map((m) => ({
              id: m.netId,
              d: pack(m),
              dead: m.dead,
              name: m.name,
              col: m.col,
              runes: m.runes.slice(),
              mana: Math.round(m.mana),
              ult: Math.round(m.ult),
              cast: m.cast ? 1 : 0,
            })),
            monsters: M.monsters.map((e) => ({
              i: e.idx,
              d: pack(e),
              s: e.s,
              el: e.elite ? 1 : 0,
              bo: e.boss ? 1 : 0,
            })),
            projectiles: PR.filter((p) => p.a).map((p) => [
              Math.round(p.x),
              Math.round(p.y),
              p.orb,
              p.r,
            ]),
            obst: M.obst
              .filter((o) => !o.dead)
              .map((o) => [
                Math.round(o.x),
                Math.round(o.y),
                o.kind,
                o.r,
                o.h || 0,
                o.flash || 0,
              ]),
            pk: M.pk.map((p) => [
              Math.round(p.x),
              Math.round(p.y),
              p.def.id,
              p.t,
            ]),
            safeR: Math.round(M.safeR),
            ph: M.ph,
            wave: M.wave,
            ft: M.ft ? { step: M.ft.step } : null,
            ann: M.ann ? M.ann.text : null,
          };
        },

        _sendSnapshotTo(conn) {
          const snap = this._snapshot();
          if (snap && conn.open) {
            try {
              conn.send(snap);
            } catch (e) {}
          }
        },

        pushSnapshots(dt) {
          if (!this.isHost || !M || !M.pvp) return;
          this._snapAcc += dt;
          if (this._snapAcc < 0.05) return;
          this._snapAcc = 0;
          const snap = this._snapshot();
          if (!snap) return;
          this.conns.forEach((c) => {
            if (c.open)
              try {
                c.send(snap);
              } catch (e) {}
          });
        },

        _applySnap(snap) {
          if (!M) return;
          const k = 1 - Math.exp(-(G.dtr || 0.016) * 18);
          snap.mages.forEach((sm) => {
            const m = M.mages.find((x) => x.netId === sm.id);
            if (!m) return;
            const [x, y, z, hp, vx, vy, face] = sm.d;
            if (!m._netT) m._netT = { x, y, z, hp };
            m._netT.x = x;
            m._netT.y = y;
            m._netT.z = z;
            m._netT.hp = hp;
            m._netT.vx = vx;
            m._netT.vy = vy;
            m._netT.face = face;
            m.x = lerp(m.x, x, k);
            m.y = lerp(m.y, y, k);
            m.z = lerp(m.z, z, k);
            m.hpD = m.hp;
            m.hp = hp;
            m.vx = vx;
            m.vy = vy;
            m.face = face;
            m.name = sm.name || m.name;
            m.runes = sm.runes;
            m.mana = sm.mana;
            m.ult = sm.ult;
            m.cast = sm.cast ? m.cast || { t: 0.5, key: ultKey(m) } : null;
            if (sm.dead && !m.dead) {
              m.dead = true;
              m.deathT = 0;
              emo(m, "death", 99, true);
            }
          });
          // Монстры
          M.monsters = snap.monsters.map((e, idx) => {
            const old = M.monsters[idx] || {};
            return Object.assign(old, {
              kind: "mon",
              idx: e.i,
              s: e.s,
              elite: !!e.el,
              boss: !!e.bo,
              x: e.d[0],
              y: e.d[1],
              z: e.d[2],
              hp: e.d[3],
              maxHp: Math.max(e.d[3], 1),
              vx: e.d[4],
              vy: e.d[5],
              dead: false,
              st: old.st || {},
              t: old.t || 0,
              r: old.r || 14,
              _net: true,
            });
          });
          // Обсткалы
          if (snap.obst)
            M.obst = snap.obst.map((o) => ({
              kind: o[2],
              x: o[0],
              y: o[1],
              r: o[3],
              h: o[4] || 46,
              hp: 3,
              maxHp: 3,
              flash: o[5] || 0,
              dead: false,
            }));
          // Предметы
          if (snap.pk)
            M.pk = snap.pk.map((p) => ({
              kind: "pickup",
              def: PK.find((x) => x.id === p[2]) || PK[0],
              x: p[0],
              y: p[1],
              z: 0,
              t: p[3] || 0,
              life: 20,
              r: 16,
              dead: false,
            }));
          // Снаряды — визуал
          this._netProj = snap.projectiles || [];
          M.safeR = snap.safeR;
          M.ph = snap.ph;
          M.wave = snap.wave;
          M.t = snap.time;
          if (snap.ann && !M.ann)
            M.ann = { text: snap.ann, col: "#FFD23A", t: 0, dur: 1.6, sz: 1 };
          if (snap.over && !M.over) {
            if (snap.over === "death") M.over = { kind: "death", t: 0 };
            else if (snap.over === "victory")
              M.over = { kind: "victory", t: 0, fw: 0 };
          }
        },
      };

      async function startPvpMatch(asHost, room, arena, myNetId) {

      // ===================== РЕНДЕР =====================
      const cv = $("c"),

      const IN = {

      const UIL = {};

      function hitBtn(x, y) {

      function pressBtn(k) {

      cv.addEventListener("pointerdown", (e) => {
        auInit();

          IN.touch = false;
          IN.mouse.has = true;
        } else IN.touch = true;
        IN.mouse.x = e.clientX;
        IN.mouse.y = e.clientY;
        if (!isPlay()) return;
        e.preventDefault();
        try {
          cv.setPointerCapture(e.pointerId);
        } catch (_) {}
        const b = hitBtn(e.clientX, e.clientY);
        if (b) {
          IN.ptr.set(e.pointerId, { role: b });
          IN.down[b] = true;
          pressBtn(b);
          return;
        }
        if (e.pointerType === "mouse") {
          if (e.button === 2) IN.ult = 0.2;
          else IN.atk = 0.2;
          IN.ptr.set(e.pointerId, { role: "mouse" });
          return;
        }
        if (e.clientX < G.W * 0.62 && !IN.joy) {
          IN.joy = {
            id: e.pointerId,
            ox: e.clientX,
            oy: e.clientY,
            x: e.clientX,
            y: e.clientY,
          };
          IN.ptr.set(e.pointerId, { role: "joy" });
        }
      });
      cv.addEventListener("pointermove", (e) => {
        if (e.pointerType === "mouse") {
          IN.mouse.has = true;
          IN.mouse.x = e.clientX;

        }
        IN.tpx = (e.clientX / G.W - 0.5) * 2;
        IN.tpy = (e.clientY / G.H - 0.5) * 2;
        if (IN.joy && IN.joy.id === e.pointerId) {
          e.preventDefault();
          IN.joy.x = e.clientX;
          IN.joy.y = e.clientY;
          const dx = IN.joy.x - IN.joy.ox,
            dy = IN.joy.y - IN.joy.oy,
            l = Math.hypot(dx, dy);
          if (l > 70) {
            IN.joy.ox += (dx / l) * (l - 70);

          }

      });
      function endPtr(e) {

        const pr = IN.gpPrev;
        const ed = (i) => {
          const v = g.buttons[i] && g.buttons[i].pressed,

          return r;

        if (ed(0) || ed(7)) IN.atk = 0.18;
        if (ed(1) || ed(5)) IN.dash = 0.18;
        if (ed(2) || ed(3) || ed(6)) IN.ult = 0.18;

      const DR = [];
      function drawOcean(c, t, ox, oy) {
        const W = G.W,
          H = G.H,
          th = ARENA.th,
          n = G.qual === "low" ? 3 : 7;
        c.globalCompositeOperation = "lighter";
        for (let i = 0; i < n; i++) {
          const x = (Math.sin(t * 0.15 + i * 2.1) * 0.5 + 0.5) * W + (ox || 0),
            y = (Math.cos(t * 0.12 + i * 1.7) * 0.5 + 0.5) * H + (oy || 0),
            r = Math.max(W, H) * 0.3;
          const g = c.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, rgba(th.c1, 0.13 + 0.05 * Math.sin(t * 1.5 + i)));
          g.addColorStop(1, rgba(th.c1, 0));
          c.fillStyle = g;
          c.fillRect(0, 0, W, H);
        }
        c.globalCompositeOperation = "source-over";
      }
      function iconOfPk(d) {

      function renderMatch(c) {
        const W = G.W,
          H = G.H,

        c.translate(Math.round(W / 2 + sx), Math.round(H / 2 + sy));

        const cull = {

        c.fillStyle = th.dk;
        c.beginPath();
        c.ellipse(0, 0, M.R, M.R * K, 0, 0, TAU);

        if (ARENA.lava) {
