      function defSave() {

      let save = defSave();
      function loadSave() {
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          if (raw) {
            const o = JSON.parse(raw),
              d = defSave();
            for (const k in d) {
              if (o[k] === undefined) o[k] = d[k];
              else if (typeof d[k] === "object" && !Array.isArray(d[k])) {
                for (const kk in d[k])
                  if (o[k][kk] === undefined) o[k][kk] = d[k][kk];
              }
            }
            save = o;
          }
        } catch (e) {
          save = defSave();
        }
      }
      let saveTimer = 0;
      function persist() {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify(save));
        } catch (e) {}
        try {
          if (window.ysdk && window.ysdk.getPlayer) {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
              window.ysdk
                .getPlayer()
                .then((p) => p.setData({ save: JSON.stringify(save) }))
                .catch(() => {});
            }, 1500);
          }
        } catch (e) {}
      }
      function t(k) {
        const l = LANG[save.set.lang] || LANG.ru;
        return l[k] !== undefined ? l[k] : LANG.ru[k] || k;
      }
      function li() {
        return save.set.lang === "en" ? 1 : 0;
      }
      function tn(a) {
        return a[li()];
      }
      function tickEnergy() {
        const now = Date.now(),
          P = 300000;
        if (save.energy >= 5) {
          save.energy = Math.min(5, save.energy);
          save.energyT = now;
          return;
        }
        while (save.energy < 5 && now - save.energyT >= P) {
          save.energy++;
          save.energyT += P;
        }
        if (save.energy >= 5) save.energyT = now;
      }

      // =====================================================================
      //  АУДИО (Web Audio API, всё процедурно)
      // =====================================================================
      const AU = {
        ctx: null,
        master: null,
        sfx: null,
        mus: null,
        nb: null,
        duck: 0,
        hum: null,
      };
      function audioInit() {
        try {
          if (AU.ctx) {
            if (AU.ctx.state === "suspended") AU.ctx.resume();
            return;
          }
          const C = window.AudioContext || window.webkitAudioContext;
          if (!C) return;
          const c = (AU.ctx = new C());
          AU.master = c.createGain();
          AU.master.connect(c.destination);
          AU.sfx = c.createGain();
          AU.sfx.connect(AU.master);
          AU.mus = c.createGain();
          AU.mus.connect(AU.master);
          const len = c.sampleRate;
          AU.nb = c.createBuffer(1, len, c.sampleRate);
          const d = AU.nb.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          setVols();
          musicStart();
        } catch (e) {
          AU.ctx = null;
        }
      }
      function setVols() {
        if (!AU.ctx) return;
        AU.sfx.gain.value = save.set.sfx;
        AU.mus.gain.setTargetAtTime(
          save.set.mus * 0.5 * (AU.duck > 0 ? 0.5 : 1),
          AU.ctx.currentTime,
          0.15,
        );
      }
      function tone(type, f0, f1, dur, vol, delay, filt, dest, att) {
        if (!AU.ctx) return;
        const c = AU.ctx,
          tt = c.currentTime + (delay || 0);
        const o = c.createOscillator(),
          g = c.createGain();
        o.type = type;
        const pv = dest ? 1 : 1 + (Math.random() - 0.5) * 0.24;
        o.frequency.setValueAtTime(f0 * pv, tt);
        if (f1)
          o.frequency.exponentialRampToValueAtTime(
            Math.max(20, f1 * pv),
            tt + dur,
          );
        const a = att || Math.min(0.01, dur * 0.2);
        g.gain.setValueAtTime(0.0001, tt);
        g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), tt + a);
        g.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
        let last = o,
          f = null;
        if (filt) {
          f = c.createBiquadFilter();
          f.type = filt.type;
          f.frequency.value = filt.f;
          o.connect(f);
          last = f;
        }
        last.connect(g);
        g.connect(dest || AU.sfx);
        o.start(tt);
        o.stop(tt + dur + 0.05);
        o.onended = () => {
          o.disconnect();
          g.disconnect();
          if (f) f.disconnect();
        };
      }
      function noise(dur, vol, ftype, f0, f1, delay, dest) {
        if (!AU.ctx) return;
        const c = AU.ctx,
          tt = c.currentTime + (delay || 0);
        const s = c.createBufferSource();
        s.buffer = AU.nb;
        s.playbackRate.value = 1 + (Math.random() - 0.5) * 0.24;
        const f = c.createBiquadFilter();
        f.type = ftype || "lowpass";
        f.frequency.setValueAtTime(f0 || 1000, tt);
        if (f1) f.frequency.exponentialRampToValueAtTime(f1, tt + dur);
        const g = c.createGain();
        g.gain.setValueAtTime(Math.max(0.0002, vol), tt);
        g.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
        s.connect(f);
        f.connect(g);
        g.connect(dest || AU.sfx);
        s.start(tt, Math.random() * 0.5, dur + 0.05);
        s.onended = () => {
          s.disconnect();
          f.disconnect();
          g.disconnect();
        };
      }
      const lastSfx = {};
      function sfx(name, el) {
        if (!AU.ctx) return;
        const now = performance.now();
        if (lastSfx[name] && now - lastSfx[name] < 45) return;
        lastSfx[name] = now;
        switch (name) {
          case "click":
            tone("square", 700, 350, 0.07, 0.12);
            break;
          case "hover":
            tone("sine", 900, 1000, 0.04, 0.05);
            break;
          case "shoot":
            if (el === 0) {
              tone("sawtooth", 420, 160, 0.16, 0.12);
              noise(0.14, 0.12, "bandpass", 900, 300);
            } else if (el === 1) {
              tone("triangle", 1400, 800, 0.16, 0.12);
              tone("sine", 2100, 1500, 0.1, 0.06);
            } else if (el === 2) {
              tone("square", 200, 2200, 0.1, 0.09);
              noise(0.1, 0.1, "highpass", 3000, 6000);
            } else if (el === 3) {
              noise(0.2, 0.16, "bandpass", 500, 2500);
              tone("sine", 500, 900, 0.15, 0.06);
            } else {
              tone("sine", 180, 60, 0.22, 0.16);
              tone("sawtooth", 90, 50, 0.2, 0.07);
            }
            break;
          case "hit":
            noise(0.08, 0.18, "lowpass", 2200, 300);
            tone("square", 220, 90, 0.08, 0.1);
            break;
          case "melee":
            noise(0.14, 0.16, "bandpass", 900, 250);
            tone("triangle", 300, 120, 0.12, 0.1);
            break;
          case "kill":
            tone("sawtooth", 320, 50, 0.32, 0.16);
            noise(0.25, 0.18, "lowpass", 1800, 200);
            break;
          case "dash":
            noise(0.2, 0.16, "bandpass", 400, 2400);
            tone("sine", 300, 700, 0.15, 0.05);
            break;
          case "windup":
            tone("sawtooth", 80, 420, 0.5, 0.1);
            tone("sine", 160, 840, 0.5, 0.08);
            break;
          case "boom":
            tone("sine", 120, 28, 0.9, 0.35);
            noise(0.7, 0.3, "lowpass", 2400, 120);
            break;
          case "pickup":
            tone("sine", 600, 600, 0.1, 0.12);
            tone("sine", 900, 900, 0.1, 0.12, 0.08);
            tone("sine", 1300, 1300, 0.16, 0.12, 0.16);
            break;
          case "heart":
            tone("sine", 58, 40, 0.14, 0.35);
            tone("sine", 52, 36, 0.16, 0.3, 0.16);
            break;
          case "lvl":
            [523, 659, 784, 1047].forEach((f, i) =>
              tone("triangle", f, f, 0.2, 0.14, i * 0.09),
            );
            break;
          case "win":
            [392, 523, 659, 784, 1047, 1319].forEach((f, i) =>
              tone("triangle", f, f, 0.35, 0.15, i * 0.12),
            );
            break;
          case "die":
            tone("sine", 420, 40, 1, 0.25);
            noise(0.8, 0.2, "lowpass", 1500, 100);
            break;
          case "shield":
            tone("sine", 900, 1800, 0.18, 0.14);
            tone("triangle", 1800, 900, 0.2, 0.08, 0.05);
            break;
          case "announce":
            tone("sawtooth", 160, 320, 0.3, 0.14);
            tone("square", 320, 640, 0.25, 0.06, 0.05);
            break;
          case "release":
            tone("sine", 500, 1200, 0.12, 0.14);
            noise(0.1, 0.1, "highpass", 2000, 5000);
            break;
        }
      }
      function humStart() {
        if (!AU.ctx || AU.hum) return;
        const c = AU.ctx,
          o = c.createOscillator(),
          g = c.createGain();
        o.type = "sine";
        o.frequency.value = 110;
        g.gain.value = 0.0001;
        g.gain.setTargetAtTime(0.08, c.currentTime, 0.1);
        o.connect(g);
        g.connect(AU.sfx);
        o.start();
        AU.hum = { o, g, t0: performance.now() };
      }
      function humUpdate() {
        if (!AU.hum) return;
        const p = Math.min(1, (performance.now() - AU.hum.t0) / 1500);
        AU.hum.o.frequency.setTargetAtTime(
          110 + p * 260,
          AU.ctx.currentTime,
          0.05,
        );
      }
      function humStop() {
        if (!AU.hum) return;
        const h = AU.hum;
        AU.hum = null;
        const c = AU.ctx;
        h.g.gain.setTargetAtTime(0.0001, c.currentTime, 0.04);
        setTimeout(() => {
          try {
            h.o.stop();
            h.o.disconnect();
            h.g.disconnect();
          } catch (e) {}
        }, 250);
        sfx("release");
      }
      // ---------- Динамическая музыка (3 слоя) ----------
      const MU = {
        t: 0,
        step: 0,
        g: [],
        lv: [0, 0, 0],
        tg: [1, 0, 0],
        int: 0,
        timer: null,
      };
      const SCALE = [0, 3, 5, 7, 10];
      const noteF = (s, oct) => 55 * Math.pow(2, (s + 12 * oct) / 12);
      function musicStart() {
        const c = AU.ctx;
        for (let i = 0; i < 3; i++) {
          const g = c.createGain();
          g.gain.value = 0;
          g.connect(AU.mus);
          MU.g[i] = g;
        }
        MU.t = c.currentTime + 0.1;
        MU.timer = setInterval(musicTick, 110);
      }
      function musicTick() {
        const c = AU.ctx;
        if (!c || c.state !== "running") return;
        for (let i = 0; i < 3; i++) {
          MU.lv[i] += (MU.tg[i] - MU.lv[i]) * 0.12;
          MU.g[i].gain.value = MU.lv[i] * (i === 0 ? 0.9 : 1);
        }
        MU.tg[0] = 1;
        MU.tg[1] = MU.int > 0.3 ? 1 : 0;
        MU.tg[2] = MU.int > 0.7 ? 1 : 0;
        if (AU.duck > 0) {
          AU.duck -= 0.11;
          if (AU.duck <= 0) {
            AU.duck = 0;
            setVols();
          }
        }
        if (MU.t < c.currentTime - 1) MU.t = c.currentTime;
        while (MU.t < c.currentTime + 0.3) {
          const s = MU.step,
            tt = MU.t - c.currentTime;
          if (s % 32 === 0) {
            [0, 7, 12].forEach((n) =>
              tone("sine", noteF(n, 1), 0, 6.2, 0.07, tt, null, MU.g[0], 1.5),
            );
          }
          if (s % 2 === 0) {
            const n = [0, 0, 3, 5][(s >> 1) % 4];
            tone("triangle", noteF(n, 1), 0, 0.4, 0.2, tt, null, MU.g[1]);
          }
          if (s % 4 === 1 || s % 4 === 3) {
            tone(
              "sawtooth",
              noteF(SCALE[(s * 3) % 5], 3),
              0,
              0.18,
              0.05,
              tt,
              { type: "lowpass", f: 1400 },
              MU.g[1],
            );
          }
          if (s % 4 === 0) {
            tone("sine", 130, 38, 0.22, 0.4, tt, null, MU.g[2]);
          }
          if (s % 2 === 1) {
            noise(0.05, 0.08, "highpass", 6000, 8000, tt, MU.g[2]);
          }
          tone(
            "square",
            noteF(SCALE[(s * 2 + (s >> 3)) % 5], 4),
            0,
            0.12,
            0.035,
            tt,
            { type: "lowpass", f: 2200 },
            MU.g[2],
          );
          MU.step++;
          MU.t += 0.2;
        }
      }
      function duckMusic(sec) {

      function vib(p) {

      // =====================================================================

      const canvas = $("game");
      canvas.setAttribute("tabindex", "0");
      canvas.style.outline = "none";
      const ctx = canvas.getContext("2d", { alpha: false });
      let W = 800,
        H = 600,
        dpr = 1,
        U = 1,
        baseZoom = 1,
        zoom = 1;
      const cam = { x: CXW, y: CYW, z: 1, tz: 1, shake: 0, shx: 0, shy: 0 };
      const QUAL = {
        pm: 1,
        asc: 0.5,
        shadow: true,
        chroma: true,
        name: "high",
      };
      function setQuality(n) {
        QUAL.name = n;
        if (n === "high") {
          QUAL.pm = 1;
          QUAL.asc = 0.6;
          QUAL.shadow = true;
          QUAL.chroma = true;
        } else if (n === "medium") {
          QUAL.pm = 0.6;
          QUAL.asc = 0.5;
          QUAL.shadow = true;
          QUAL.chroma = true;
        } else {
          QUAL.pm = 0.35;
          QUAL.asc = 0.4;
          QUAL.shadow = false;
          QUAL.chroma = false;
        }
      }
      function resize() {
        dpr = Math.min(
          window.devicePixelRatio || 1,
          QUAL.name === "low" ? 1 : 2,
        );
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        U = clamp(Math.min(W, H) / 560, 0.75, 1.4);
        baseZoom = clamp(Math.min(W, H) / 680, 0.7, 1.25);
        layoutUI();
      }
      // мир -> экран (учитывает тряску только мира, UI не трогаем)
      function sx(x) {
        return (x - cam.x) * zoom + W / 2 + cam.shx;
      }
      function sy(y) {
        return (y - cam.y) * zoom * YS + H / 2 + cam.shy;
      }
      const _w = { x: 0, y: 0 };
      function s2w(px, py) {
        _w.x = (px - W / 2 - cam.shx) / zoom + cam.x;
        _w.y = (py - H / 2 - cam.shy) / (zoom * YS) + cam.y;
        return _w;
      }

      // =====================================================================
      //  СПРАЙТЫ СВЕЧЕНИЯ (кэш)
      // =====================================================================
      const GLOWS = {};
      function glowSprite(col) {
        let g = GLOWS[col];
        if (g) return g;
        g = document.createElement("canvas");
        g.width = g.height = 64;
        const c = g.getContext("2d");
        const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
        gr.addColorStop(0, "rgba(255,255,255,1)");
        gr.addColorStop(0.3, "rgba(255,255,255,.55)");
        gr.addColorStop(1, "rgba(255,255,255,0)");
        c.fillStyle = gr;
        c.fillRect(0, 0, 64, 64);
        c.globalCompositeOperation = "source-in";
        c.fillStyle = col;
        c.fillRect(0, 0, 64, 64);
        GLOWS[col] = g;
        return g;
      }
      function drawGlow(c, col, x, y, r, a) {
        c.globalAlpha = a;
        c.drawImage(glowSprite(col), x - r, y - r, r * 2, r * 2);
      }

      // =====================================================================
      //  ПУЛЫ ОБЪЕКТОВ: 1500 частиц, 200 снарядов, 50 текстов
      // =====================================================================
      const NP = 1500,
        PARTS = [];
      for (let i = 0; i < NP; i++)
        PARTS.push({
          a: 0,
          x: 0,

      function emit(x, y, z, vx, vy, vz, life, s, c, k, g, d, r) {
        if (QUAL.pm < 1 && Math.random() > QUAL.pm) return null;
        for (let n = 0; n < NP; n++) {

          const p = PARTS[pIdx];

      function buildArenaFallback() {

      // =====================================================================
      //  ОТРИСОВКА МАГА + ФИЗИКА ПЛАЩА (верле)
      // =====================================================================
      function capeInit(m) {
        m.cape = { init: false, p: [], h: [] };
        for (let i = 0; i < 6; i++) m.cape.p.push({ x: 0, y: 0, px: 0, py: 0 });
        for (let i = 0; i < 4; i++) m.cape.h.push({ x: 0, y: 0, px: 0, py: 0 });
      }
      function capeReset(m) {
        if (m.cape) m.cape.init = false;

      // ox,oy — начало координат спрайта (с учётом подъёма), gy — уровень земли (в ед. спрайта)
      function capeUpdate(m, ox, oy, gy, dt, f, time, wm) {
        const cp = m.cape,
          P = cp.p,
          Hm = cp.h,
          REST = 6,
          ax = ox - f * 4,
          ay = oy - 26;
        if (!cp.init) {
          for (let i = 0; i < 6; i++) {
            const p = P[i];
            p.x = p.px = ax - f * i * 1.2;
            p.y = p.py = ay + i * REST * 0.9;
          }
          for (let i = 0; i < 4; i++) {
            const h = Hm[i];
            h.x = h.px = ox + f * (-15 + i * 10);
            h.y = h.py = oy - 3;
          }
          cp.init = true;
        }
        if (dt <= 0.0001) return; // хитстоп: физика плаща замирает вместе с миром
        const k = Math.min(dt * 60, 2.5),
          wind = Math.sin(time * 2) * 0.1 * (wm || 1);
        P[0].x = P[0].px = ax;
        P[0].y = P[0].py = ay;
        for (let i = 1; i < 6; i++) {
          const p = P[i];
          const vx = (p.x - p.px) * 0.96,
            vy = (p.y - p.py) * 0.96;
          p.px = p.x;
          p.py = p.y;
          p.x += vx + wind * k;
          p.y += vy + 0.3 * k;
        }
        for (let it = 0; it < 3; it++) {
          for (let i = 0; i < 5; i++) {
            const a = P[i],
              b = P[i + 1];
            const dx = b.x - a.x,
              dy = b.y - a.y;
            const d = Math.hypot(dx, dy) || 0.001,
              df = (d - REST) / d;
            if (i === 0) {
              b.x -= dx * df;
              b.y -= dy * df;
            } else {
              a.x += dx * df * 0.5;
              a.y += dy * df * 0.5;
              b.x -= dx * df * 0.5;
              b.y -= dy * df * 0.5;
            }
          }
        }
        for (let i = 1; i < 6; i++) if (P[i].y > gy - 1) P[i].y = gy - 1;
        // подол мантии
        for (let i = 0; i < 4; i++) {
          const h = Hm[i],
            tx = ox + f * (-15 + i * 10),
            ty = oy - 3;
          const vx = (h.x - h.px) * 0.85,
            vy = (h.y - h.py) * 0.85;
          h.px = h.x;
          h.py = h.y;
          h.x += vx + (tx - h.x) * 0.18 * k + wind * 0.3;
          h.y += vy + (ty - h.y) * 0.18 * k;
        }
        for (let it = 0; it < 3; it++)
          for (let i = 0; i < 3; i++) {
            const a = Hm[i],
              b = Hm[i + 1];
            const dx = b.x - a.x,
              dy = b.y - a.y;
            const d = Math.hypot(dx, dy) || 0.001,
              df = ((d - 10) / d) * 0.5;
            a.x += dx * df;
            a.y += dy * df;
            b.x -= dx * df;
            b.y -= dy * df;
          }
      }
      // импульс плаща (рывок)
      function capeImpulse(m, dx, dy) {
        if (!m.cape || !m.cape.init) return;
        const P = m.cape.p;
        for (let i = 1; i < 6; i++) {
          P[i].px -= dx;
          P[i].py -= dy;
        }
        for (const h of m.cape.h) {
          h.px -= dx * 0.4;

      }
      function drawCape(c, cp, ox, oy, col, white) {
        const P = cp.p,
          L = [],
          R = [];
        for (let i = 0; i < 6; i++) {
          const a = P[Math.max(0, i - 1)],
            b = P[Math.min(5, i + 1)];
          const dx = b.x - a.x,
            dy = b.y - a.y,
            d = Math.hypot(dx, dy) || 1;
          const nx = -dy / d,
            ny = dx / d,
            w = 4.2 + i * 1.1,
            x = P[i].x - ox,
            y = P[i].y - oy;
          L.push([x + nx * w, y + ny * w]);
          R.push([x - nx * w, y - ny * w]);
        }
        c.beginPath();
        c.moveTo(L[0][0], L[0][1]);
        for (let i = 1; i < 6; i++)
          c.quadraticCurveTo(
            L[i - 1][0],
            L[i - 1][1],
            (L[i - 1][0] + L[i][0]) / 2,
            (L[i - 1][1] + L[i][1]) / 2,

        c.lineTo(R[5][0], R[5][1]);

            R[i + 1][0],
            R[i + 1][1],
            (R[i + 1][0] + R[i][0]) / 2,
            (R[i + 1][1] + R[i][1]) / 2,

        c.fill();
        c.lineWidth = 3;
        c.strokeStyle = "#000";
        c.stroke();
        c.beginPath();
        c.moveTo(L[5][0], L[5][1]);
        c.lineTo(R[5][0], R[5][1]);

        c.strokeStyle = white ? "#fff" : "#DAA520";
        c.stroke();

      function shade(hex, k) {

        const n = parseInt(hex.slice(1), 16);
        let r = (n >> 16) & 255,
          g = (n >> 8) & 255,
          b = n & 255;

          g *= 1 + k;
          b *= 1 + k;

          r += (255 - r) * k;
          g += (255 - g) * k;

      // ---- Глаза ----
      function drawEyes(c, e, t, ecol) {
        if (!e) return;
        if (e.fl > 0) {
          eyeMode(c, e.flm, 1, e, t, ecol);
          return;
        }
        if (e.mix < 1 && e.prev !== e.mode) {
          eyeMode(c, e.prev, 1 - e.mix, e, t, ecol);

      function eyeMode(c, mode, al, e, t, ecol) {
        const col = ecol || "#FFFFFF",

          c.save();
          c.translate(s < 0 ? -0.5 : 6.5, -27.5);
          if (
            mode === "idle" ||
            mode === "low" ||
            mode === "cast" ||
            mode === "dmg"
          ) {
            let a = 0.75 + 0.15 * Math.sin(t * Math.PI),
              sc = 1,
              cc = col,

              sc = 1.3;

              cc = "#FFFFFF";
            } else if (mode === "dmg") {

            for (let k = 0; k < 4; k++) {

            c.globalAlpha = g0 * al;

            c.closePath();
            c.fill();
          } else if (mode === "x") {
            c.globalAlpha = g0 * al * ea;
            c.strokeStyle = "#FFFFFF";
            c.lineWidth = 1.5;
            c.beginPath();
            c.moveTo(-2.4, -2.4);
            c.lineTo(2.4, 2.4);
            c.moveTo(2.4, -2.4);
            c.lineTo(-2.4, 2.4);
            c.stroke();
          } else if (mode === "shock") {

      // ---- Мага рисуем в спрайтовых единицах: ноги в (0,0), капюшон до ~-46 ----

      function mageStep(m, dt) {
        const inp = m.inp,
          pk = m.perks;
        m.anim += dt;
        if (m.dead) {
          m.deadT += dt;
          return;
        }
        for (let i = 0; i < TK.length; i++) {
          const k = TK[i];
          if (m[k] > 0) m[k] -= dt;
        }
        if (m.swingT > 0) m.swingT -= dt;
        const frozen = m.frz > 0 || m.stun > 0,
          casting = m.castT > 0;
        let mx = inp.mx,
          my = inp.my;
        if (frozen || casting) {
          mx = 0;
          my = 0;
        }
        const ml = Math.hypot(mx, my);
        if (ml > 1) {
          mx /= ml;
          my /= ml;
        }
        if (inp.dash) {
          inp.dash = false;
          if (m.dashCd <= 0 && m.dashT <= 0 && !frozen && !casting)
            startDash(m, inp.da);
        }
        const spd =
          230 *
          pk.spd *
          (m.haste > 0 ? 1.3 : 1) *
          (m.slow > 0 || m.tfz > 0 ? 0.5 : 1);
        if (m.dashT > 0) {
          m.x += m.dashDx * 1000 * dt;
          m.y += m.dashDy * 1000 * dt;
          m.dashT -= dt;
          m.z = 15 * Math.sin(Math.PI * clamp(1 - m.dashT / 0.18, 0, 1));
          m.trT -= dt;
          if (m.trT <= 0) {
            m.trT = 0.035;
            const tr = m.trail[m.trIdx];
            tr.x = m.x;
            tr.y = m.y;
            tr.a = 1;
            tr.f = m.f;
            m.trIdx = (m.trIdx + 1) % 5;
          }
          if (m.dashT <= 0) {
            m.z = 0;
            m.vx = m.dashDx * spd * 0.4;
            m.vy = m.dashDy * spd * 0.4;
            burst(m.x, m.y, 3, 9, "#B8A890", 120, 0.5, 6, 0);
          }
        } else {
          m.z = Math.max(0, m.z - dt * 120);
          const ac = isOnIce(m.x, m.y) ? 2.2 : 16,
            k = Math.min(1, dt * ac);
          m.vx += (mx * spd - m.vx) * k;
          m.vy += (my * spd - m.vy) * k;
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          if (Math.abs(mx) > 0.1) m.f = mx > 0 ? 1 : -1;
          if (ml > 0.3 && Math.random() < dt * 10)
            emit(
              m.x,
              m.y,
              2,
              rnd(-20, 20),
              rnd(-20, 20),
              15,
              0.4,
              4,
              "#8A7A6A",
              0,
              0,
              1,
            );
        }
        for (const tr of m.trail) if (tr.a > 0) tr.a -= dt * 3.2;
        m.x += m.kx * dt;
        m.y += m.ky * dt;
        const kf = Math.pow(0.88, dt * 60);
        m.kx *= kf;
        m.ky *= kf;
        clampArena(m);
        for (const o of G.terr) {

            m.x = o.x + ((m.x - o.x) / d) * mn;
            m.y = o.y + ((m.y - o.y) / d) * mn;
          }
        }
      }

      // ---------- ИИ ботов и союзников ----------
      function botThink(m, dt) {

              ? Math.random() < 0.7
              : Math.random() < 0.2;
        }
        const tg = ai.tg && !ai.tg.dead ? ai.tg : null;
        let mx = 0,
          my = 0;
        const dc = dist(m.x, m.y, CXW, CYW),
          safe = G.R - 90;
        let d = tg ? dist(m.x, m.y, tg.x, tg.y) : 9999;
        if (dc > safe) {
          mx = (CXW - m.x) / dc;
          my = (CYW - m.y) / dc;
        } else {
          let pk = null,
            pd = 520;
          if (ai.greedy) {
            for (const q of G.pick) {
              const dd = dist(m.x, m.y, q.x, q.y);
              if (dd < pd) {
                pd = dd;
                pk = q;
              }
            }
          }
          if (pk) {
            const dd = pd || 1;
            mx = (pk.x - m.x) / dd;
            my = (pk.y - m.y) / dd;
          } else if (tg) {
            const ideal = G.mode === "survival" ? 280 : 300,
              ax = (tg.x - m.x) / d,
              ay = (tg.y - m.y) / d;
            if (d > ideal + 70) {
              mx = ax;
              my = ay;
            } else if (d < ideal - 80) {
              mx = -ax;
              my = -ay;
            } else {
              mx = -ay * ai.strafe;
              my = ax * ai.strafe;
            }
          } else if (G.mode === "survival" && G.me && m !== G.me) {
            const dd = dist(m.x, m.y, G.me.x, G.me.y);
            if (dd > 200) {
              mx = (G.me.x - m.x) / dd;
              my = (G.me.y - m.y) / dd;
            }
          }
          if (
            G.mode === "survival" &&
            G.me &&
            m !== G.me &&
            tg &&
            dist(m.x, m.y, G.me.x, G.me.y) > 520
          ) {
            const dd = dist(m.x, m.y, G.me.x, G.me.y);
            mx = (G.me.x - m.x) / dd;
            my = (G.me.y - m.y) / dd;
          }

        if (dc > AR - 140) {
          mx += ((CXW - m.x) / dc) * 1.5;
          my += ((CYW - m.y) / dc) * 1.5;
        }
        const ml = Math.hypot(mx, my) || 1;
        const sp = 0.85 + 0.1 * diff;
        inp.mx = (mx / ml) * Math.min(1, ml) * sp;
        inp.my = (my / ml) * Math.min(1, ml) * sp;
        if (ml < 0.01) {
          inp.mx = 0;
          inp.my = 0;
        }
        // уклонение от снарядов
        if (ai.dodgeT <= 0 && m.dashCd <= 0 && Math.random() < 0.5 * diff) {
          for (let i = 0; i < NPR; i++) {
            const p = PROJ[i];
            if (!p.a || p.team === m.team) continue;
            const dd = dist(p.x, p.y, m.x, m.y);
            if (dd > 150) continue;
            const sp2 = Math.hypot(p.vx, p.vy) || 1;
            const dot = (p.vx * (m.x - p.x) + p.vy * (m.y - p.y)) / (sp2 * dd);
            if (dot > 0.85) {
              const side = Math.random() < 0.5 ? 1 : -1;
              inp.dash = true;
              inp.da = Math.atan2(p.vy, p.vx) + (side * Math.PI) / 2;
              ai.dodgeT = 1;
              break;
            }
          }
        }
        if (
          tg &&
          m.hp < m.maxHp * 0.3 &&
          d < 160 &&
          m.dashCd <= 0 &&
          !inp.dash
        ) {
          inp.dash = true;
          inp.da = Math.atan2(m.y - tg.y, m.x - tg.x);
        }
        // атака
        if (tg && d < 620 && m.atkCd <= 0 && ai.fireT <= 0 && m.castT <= 0) {
          const lead = (d / 640) * 0.55 * Math.min(1, diff);
          const px = tg.x + (tg.vx || 0) * lead,
            py = tg.y + (tg.vy || 0) * lead;
          let ang =
            Math.atan2(py - m.y, px - m.x) +
            rnd(-1, 1) * (0.22 / diff) +
            (m.blind > 0 ? rnd(-1, 1) * 0.8 : 0);
          inp.atk = true;
          inp.a = ang;
          ai.fireT =
            (rnd(0.55, 1.1) / Math.min(1.4, diff)) * (d < 80 ? 0.5 : 1);
        }
        if (m.ult >= 100 && tg && d < 480 && !m.pend && Math.random() < 0.04) {
          inp.ult = true;
          inp.tx = tg.x;
          inp.ty = tg.y;
        }

            ph = k;

        c.fillRect(x - 3, y - 3, w + 6, h + 6);
        c.fillStyle = "#1a0a14";
        c.fillRect(x, y, w, h);
        const g = c.createLinearGradient(x, 0, x + w, 0);
        g.addColorStop(0, g0);
        g.addColorStop(1, g1);
        c.fillStyle = g;
        c.fillRect(x, y, Math.round(w * clamp(ratio, 0, 1)), h);
        if (ticks) {
          c.fillStyle = "rgba(0,0,0,.65)";
          for (let i = 1; i < ticks; i++)

        c.lineWidth = 2;
        c.strokeRect(x - 1, y - 1, w + 2, h + 2);

      function drawMinimap(c, me, tm) {

          range = 900,
          k = r / range;

        c.arc(cx, cy, r, 0, TAU);

        c.fillStyle = "rgba(8,4,14,.8)";

          ay = cy + (CYW - me.y) * k;
        c.fillStyle = "rgba(60,20,8,.9)";
        c.beginPath();
        c.arc(ax, ay, AR * k, 0, TAU);
        c.fill();
        c.strokeStyle = "rgba(255,140,40,.9)";
        c.lineWidth = 2;
        c.stroke();
        if (G.shrink || G.R < AR - 1) {

            c.strokeStyle = "rgba(255,50,40,1)";
            c.lineWidth = 2.5;

            c.arc(ax, ay, G.R * k, 0, TAU);

            c.lineWidth = 1.8;

            c.arc(ax, ay, G.nextR * k, 0, TAU);

            y = cy + (o.y - me.y) * k;

        for (const m of G.mages) {

          c.lineWidth = 1.5;

        c.stroke();
        c.restore();
        c.restore();

        c.lineWidth = 6;

          txt(c, a.text, 0, 0, sz, a.col, "center", Math.max(6, sz / 9));
          c.restore();
        }
      }
      // =====================================================================
      //  ГЛАВНОЕ МЕНЮ: два гигантских мага, скрещённые посохи, взрыв в центре
      // =====================================================================
      const MN = {
        t: 0,
        px: 0,
        py: 0,
        tx: 0,
        ty: 0,
        arcs: [],
        arcT: 0,
        rings: [],
        ringT: 0,
        mp: [],
        emb: [],
        smoke: [],
        L: null,
        R: null,
        ready: false,
        gust: 0,
      };
      function mkMenuMage(col, ecol, orb) {
        const o = {
          col,
          ecol,
          orb,
          eye: {
            mode: "idle",
            prev: "idle",
            mix: 1,
            raw: 1,
            chg: 9,
            fl: 0,
            flm: "cast",
            flick: 1,
            flickT: 0,
            fireT: 0,
            a: 1,
          },
        };
        capeInit(o);
        return o;
      }
      function initMenu() {
        MN.L = mkMenuMage("#8B2F3F", "#FFA040", "#FF5A10");
        MN.R = mkMenuMage("#2F5A8B", "#66EEFF", "#00DDFF");
        for (let i = 0; i < 70; i++)
          MN.emb.push({
            x: Math.random(),
            y: Math.random(),
            v: rnd(0.02, 0.08),
            s: rnd(1.5, 3),
            ph: rnd(0, 6),
          });
        for (let i = 0; i < 8; i++)
          MN.smoke.push({
            x: Math.random(),
            y: rnd(0.1, 0.9),
            v: rnd(0.01, 0.03),
            s: rnd(0.25, 0.5),
          });
        MN.ready = true;
      }
      window.addEventListener("mousemove", (e) => {
        MN.tx = (e.clientX / W - 0.5) * 2;
        MN.ty = (e.clientY / H - 0.5) * 2;
      });
      window.addEventListener("deviceorientation", (e) => {
        if (e.gamma === null || e.gamma === undefined) return;
        MN.tx = clamp((e.gamma || 0) / 30, -1, 1);
        MN.ty = clamp(((e.beta || 45) - 45) / 30, -1, 1);
      });
      function menuGeom() {
        const s = Math.min(H / 150, W / 250),
          gap = clamp(W * 0.26, 70, 380);
        return {
          s,
          baseY: H * 0.8,
          cx: W / 2,
          cy: H * 0.5,
          lx: W / 2 - gap,
          rx: W / 2 + gap,
        };
      }
      function menuStaff(m, x, f, geo, lift) {
        const s = geo.s,
          hx = x + f * 11.5 * s + MN.px * 5,
          hy = geo.baseY - (13 + lift) * s + MN.py * 5,
          tx = geo.cx + MN.px * 5,
          ty = geo.cy + MN.py * 5;
        const ang = Math.atan2(ty - hy, tx - hx),
          d = Math.hypot(tx - hx, ty - hy);
        m.sa = f === 1 ? ang : Math.PI - ang;
        m.sl = (d / s) * 1.16;
        m.tipX = hx + Math.cos(ang) * d * 1.16;
        m.tipY = hy + Math.sin(ang) * d * 1.16;
      }
      function updateMenu(dt) {
        if (!MN.ready) return;
        MN.t += dt;
        MN.px += (MN.tx - MN.px) * Math.min(1, dt * 4);
        MN.py += (MN.ty - MN.py) * Math.min(1, dt * 4);
        const geo = menuGeom();
        const liftL = 2 + Math.sin(MN.t * 2) * 1.5,
          liftR = 2 + Math.sin(MN.t * 2 + 1.2) * 1.5;
        menuStaff(MN.L, geo.lx, 1, geo, liftL);
        menuStaff(MN.R, geo.rx, -1, geo, liftR);
        capeUpdate(MN.L, 0, 0, 0, dt, 1, MN.t, 3);
        capeUpdate(MN.R, 0, 0, 0, dt, -1, MN.t + 1, 3);
        MN.gust -= dt;
        if (MN.gust <= 0) {
          MN.gust = 1.1;
          capeImpulse(MN.L, -5, -1);
          capeImpulse(MN.R, 5, -1);
        }
        MN.arcT -= dt;
        if (MN.arcT <= 0) {
          MN.arcT = 0.07;
          MN.arcs.length = 0;
          const n = QUAL.pm < 0.5 ? 4 : 8;
          for (let i = 0; i < n; i++) {
            const a = rnd(0, TAU),
              len = Math.min(W, H) * rnd(0.15, 0.38),
              pts = [[0, 0]];
            let px = 0,
              py = 0;
            for (let k = 1; k <= 7; k++) {
              px = (Math.cos(a) * len * k) / 7 + rnd(-1, 1) * len * 0.07;
              py =
                ((Math.sin(a) * len * k) / 7) * 0.8 + rnd(-1, 1) * len * 0.07;
              pts.push([px, py]);
            }
            MN.arcs.push(pts);
          }
        }
        MN.ringT -= dt;
        if (MN.ringT <= 0) {
          MN.ringT = 0.9;
          MN.rings.push({ t: 0 });
        }
        for (let i = MN.rings.length - 1; i >= 0; i--) {
          MN.rings[i].t += dt;
          if (MN.rings[i].t > 0.9) MN.rings.splice(i, 1);
        }
        const cols = ["#FFFFFF", "#C080FF", "#FFEE80", "#FF9040", "#80E8FF"];
        const nsp = Math.round(5 * QUAL.pm) + 1;
        for (let i = 0; i < nsp; i++) {
          const a = rnd(0, TAU),
            v = rnd(120, 420);
          if (MN.mp.length < 260)
            MN.mp.push({
              x: geo.cx,
              y: geo.cy,
              vx: Math.cos(a) * v,
              vy: Math.sin(a) * v * 0.8,
              life: rnd(0.4, 1),
              max: 1,
              s: rnd(3, 8),
              c: cols[(Math.random() * 5) | 0],
            });
        }
        for (const m of [MN.L, MN.R])
          if (Math.random() < 0.8 * QUAL.pm && MN.mp.length < 260)
            MN.mp.push({
              x: m.tipX - MN.px * 5,
              y: m.tipY - MN.py * 5,
              vx: rnd(-30, 30),
              vy: rnd(-90, -30),
              life: rnd(0.5, 1),
              max: 1,
              s: rnd(3, 7),
              c: m.orb,
            });
        for (let i = MN.mp.length - 1; i >= 0; i--) {
          const p = MN.mp[i];
          p.life -= dt;
          if (p.life <= 0) {
            MN.mp.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.98;
          p.vy *= 0.98;
          p.max = p.max;
        }
        for (const e of MN.emb) {
          e.y -= e.v * dt;
          e.x += Math.sin(MN.t + e.ph) * 0.01 * dt;
          if (e.y < -0.05) {
            e.y = 1.05;
            e.x = Math.random();
          }
        }
        for (const s of MN.smoke) {
          s.x += s.v * dt;
          if (s.x > 1.3) s.x = -0.3;
        }
      }
      function renderMenu(c) {
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        let g = c.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#08040f");
        g.addColorStop(0.55, "#241008");
        g.addColorStop(1, "#0e0503");
        c.fillStyle = g;
        c.fillRect(0, 0, W, H);
        if (!MN.ready) return;
        const geo = menuGeom(),
          px = MN.px,
          py = MN.py,
          tm = MN.t,
          cx = geo.cx + px * 5,
          cy = geo.cy + py * 5;
        // дымное небо
        for (const s of MN.smoke) {
          c.globalAlpha = 0.22;
          c.drawImage(
            glowSprite("#3a3030"),
            s.x * W - s.s * W * 0.5 + px * 3,
            s.y * H - s.s * W * 0.35 + py * 3,
            s.s * W,
            s.s * W * 0.7,
          );
        }
        c.globalAlpha = 1;
        // круглая изометрическая арена под ногами
        if (arenaCv) {
          const rx = Math.min(W * 0.5, H * 1.0),
            ry = rx * 0.5,
            ex = geo.cx + px * 4,
            ey = geo.baseY + ry * 0.12 + py * 4;
          c.drawImage(
            arenaCv,
            0,
            0,
            arenaCv.width,
            arenaCv.height,
            ex - rx,
            ey - ry,
            rx * 2,
            ry * 2,
          );
          c.globalAlpha = 0.8 + 0.2 * Math.sin(tm * TAU * 1.5);
          c.drawImage(
            glowCv,
            0,
            0,
            glowCv.width,
            glowCv.height,
            ex - rx,
            ey - ry,
            rx * 2,
            ry * 2,
          );
          c.globalAlpha = 1;
          c.strokeStyle = "#FF5A10";
          c.lineWidth = 10;
          c.beginPath();
          c.ellipse(ex, ey, rx - 5, ry - 2.5, 0, 0, TAU);
          c.stroke();
          c.strokeStyle = "#FFEE00";
          c.globalAlpha = 0.5;
          c.lineWidth = 3;
          c.beginPath();
          c.ellipse(ex, ey, rx - 8, ry - 4, 0, 0, TAU);
          c.stroke();
          c.globalAlpha = 1;
        }
        const s = geo.s,
          baseY = geo.baseY;
        const liftL = 2 + Math.sin(tm * 2) * 1.5,
          liftR = 2 + Math.sin(tm * 2 + 1.2) * 1.5;
        c.fillStyle = "rgba(0,0,0,.45)";
        ellipseS(c, geo.lx + px * 5, baseY + py * 5 + 2, 16 * s, 6 * s);
        c.fill();
        ellipseS(c, geo.rx + px * 5, baseY + py * 5 + 2, 16 * s, 6 * s);
        c.fill();
        drawMage(c, {
          x: geo.lx + px * 5,
          y: baseY + py * 5,
          s: s,
          f: 1,
          col: MN.L.col,
          t: tm,
          lift: liftL,
          eye: MN.L.eye,
          eyeCol: MN.L.ecol,
          cape: MN.L.cape,
          ox: 0,
          oy: 0,
          staffA: MN.L.sa,
          staffL: MN.L.sl,
          orbC: MN.L.orb,
        });
        drawMage(c, {
          x: geo.rx + px * 5,
          y: baseY + py * 5,
          s: s,
          f: -1,
          col: MN.R.col,
          t: tm,
          lift: liftR,
          eye: MN.R.eye,
          eyeCol: MN.R.ecol,
          cape: MN.R.cape,
          ox: 0,
          oy: 0,
          staffA: MN.R.sa,
          staffL: MN.R.sl,
          orbC: MN.R.orb,
        });
        // взрыв магии в точке столкновения посохов
        const R = Math.min(W, H) * 0.28,
          pu = 0.9 + 0.1 * Math.sin(tm * 9);
        c.globalCompositeOperation = "lighter";
        drawGlow(c, "#7A30D0", cx, cy, R * 1.5 * pu, 0.7);
        drawGlow(c, "#C080FF", cx, cy, R * 0.9 * pu, 0.8);
        drawGlow(c, "#FFFFFF", cx, cy, R * 0.4 * pu, 0.95);
        drawGlow(c, "#FFB060", geo.lx + px * 5, baseY - 30 * s, s * 50, 0.12);
        drawGlow(c, "#80D8FF", geo.rx + px * 5, baseY - 30 * s, s * 50, 0.12);
        c.strokeStyle = "rgba(255,255,255,.55)";
        c.lineWidth = 2;
        c.beginPath();
        for (let i = 0; i < 14; i++) {
          const a = tm * 0.8 + (i * TAU) / 14,
            l =
              R *
              (0.5 + (0.5 * ((i * 7) % 5)) / 5) *
              (0.8 + 0.2 * Math.sin(tm * 12 + i));
          c.moveTo(cx + Math.cos(a) * R * 0.1, cy + Math.sin(a) * R * 0.1);
          c.lineTo(cx + Math.cos(a) * l, cy + Math.sin(a) * l);
        }
        c.stroke();
        c.lineJoin = "round";
        for (const pts of MN.arcs) {
          c.beginPath();
          pts.forEach((p, i) => {
            i ? c.lineTo(cx + p[0], cy + p[1]) : c.moveTo(cx + p[0], cy + p[1]);
          });
          c.strokeStyle = "rgba(170,90,255,.5)";
          c.lineWidth = 6;
          c.stroke();
          c.strokeStyle = "#fff";
          c.lineWidth = 2;
          c.stroke();
        }
        for (const r of MN.rings) {
          const k = r.t / 0.9;
          c.globalAlpha = 1 - k;
          c.strokeStyle = "#E0C0FF";
          c.lineWidth = 5 * (1 - k) + 1;
          c.beginPath();
          c.ellipse(
            cx,
            cy,
            R * 2.2 * easeOut(k),
            R * 1.5 * easeOut(k),
            0,
            0,
            TAU,
          );
          c.stroke();
        }
        c.globalAlpha = 1;
        for (const p of MN.mp) {
          const al = clamp(p.life / 0.6, 0, 1);
          drawGlow(
            c,
            p.c,
            p.x + px * 5,
            p.y + py * 5,
            p.s * 1.6 * (0.4 + al * 0.6),
            al,
          );
        }
        c.globalAlpha = 1;
        drawGlow(c, "#B070FF", cx, cy, Math.max(W, H) * 0.45, 0.12);
        c.globalCompositeOperation = "source-over";
        // летящие угольки (передний план, параллакс 7px)
        c.fillStyle = "#FF8A2A";
        for (const e of MN.emb) {
          c.globalAlpha = 0.4 + 0.5 * Math.sin(MN.t * 3 + e.ph) * 0.5 + 0.1;
          c.beginPath();
          c.arc(e.x * W + px * 7, e.y * H + py * 7, e.s, 0, TAU);
          c.fill();
        }
        c.globalAlpha = 1;
        g = c.createRadialGradient(
          W / 2,
          H / 2,
          Math.min(W, H) * 0.45,
          W / 2,
          H / 2,
          Math.max(W, H) * 0.8,
        );
        g.addColorStop(0, "rgba(0,0,0,0)");
        g.addColorStop(1, "rgba(0,0,0,.65)");
        c.fillStyle = g;
        c.fillRect(0, 0, W, H);
      }

      // =====================================================================

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

          let h = 0;
          for (const ch of today) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
          const rng = mulberry32(h);
          const T = [
            [
              "kills",
              [10, 20, 40],
              [30, 50, 80],
              "Убей врагов",
              "Defeat enemies",
            ],
            [

          const idx = T.map((_, i) => i);

          while (qs.length < 3) {

      function genCode() {

      function hostOnData(c, d) {

        if (pl) pl.lastRx = performance.now();
        if (d.type === "join") {

          used.push(c);

          net.status = t("unavail");
          renderOnline();
          return;
        }
        net.peer.on("open", () => {
          const c = net.peer.connect("arcane-arena-" + code, {
            reliable: true,
            serialization: "json",
          });
          net.hostConn = c;
          const to = setTimeout(() => {
            if (!c.open) {
              net.status = t("notFound");
              renderOnline();
              try {
                c.close();
              } catch (e) {}
            }
          }, 10000);
          c.on("open", () => {
            clearTimeout(to);
            net.status = t("connected");
            net.lastRx = performance.now();
            c.send({ type: "join", name: save.name, col: SKINS[save.skin].c });
            net.ui = "client";
            renderOnline();
          });
          c.on("data", clientOnData);
          c.on("close", clientOnClose);
          c.on("error", () => {
            net.status = t("notFound");
            renderOnline();
          });
        });
        net.peer.on("error", (err) => {

          renderOnline();
        });

          case "full":
            net.status = t("full");

            G.slowmo = 0.5;
          }
        }
      }
      function clientUpdate(sdt, dt) {
        const me = G.me;
        if (!me) return;
        const now = performance.now();
        if (now - net.lastRx > 5000 && !G.ended && !G.over) {
          if (!net.hostLost) {
            net.hostLost = true;
            showHostLeft();
          }
          return;
        }
        // интерполяция удалённых игроков (буфер 100 мс)
        const rt = now - 100,
          S = G.snaps;
        if (S.length >= 1) {
          let a = S[0],
            b = S[S.length > 1 ? 1 : 0];
          for (let i = S.length - 1; i > 0; i--) {
            if (S[i - 1].t <= rt) {
              a = S[i - 1];
              b = S[i];
              break;
            }
          }
          const k = b.t > a.t ? clamp((rt - a.t) / (b.t - a.t), 0, 1) : 1;
          for (const m of G.mages) {
            if (m === me) continue;
            const sa = a.p[m.id],
              sb = b.p[m.id];
            if (!sa || !sb) continue;
            const nx = lerp(sa.x, sb.x, k),
              ny = lerp(sa.y, sb.y, k);
            if (dt > 0) {
              m.vx = lerp(m.vx, clamp((nx - m.x) / dt, -1200, 1200), 0.3);
              m.vy = lerp(m.vy, clamp((ny - m.y) / dt, -1200, 1200), 0.3);
            }
            m.x = nx;
            m.y = ny;
            m.anim += dt;
            if (m.flash > 0) m.flash -= dt;
          }
        }
        if (sdt > 0) {
          me.inp.mx = In.mx;
          me.inp.my = In.my;
          mageStep(me, sdt);
          me.mana = me.mana;
          for (const f of G.fx) f.t += sdt;
          for (let i = 0; i < NPR; i++) {
            const p = PROJ[i];
            if (!p.a) continue;
            p.x += p.vx * sdt;
            p.y += p.vy * sdt;
            if (p.ghost) {
              p.life -= sdt;
              if (p.life <= 0) p.a = 0;
            }
          }
          for (const p of G.pick) p.t += sdt;
          for (const o of G.terr) if (o.flash > 0) o.flash -= sdt;
        }
        // отправка ввода 15 Гц
        net.inputT += dt;
        if (net.inputT >= 1 / 15) {
          net.inputT = 0;
          netFlushInput();
        }
        net.pingT += dt;
        if (net.pingT >= 2) {
          net.pingT = 0;
          sendTo(net.hostConn, { type: "ping", t: performance.now() });
        }
      }
      // ---- Хост: рассылка состояния 20 Гц, события, пинг, таймауты ----
      function packFx(f) {
        return {
          k: f.k,
          x: Math.round(f.x),
          y: Math.round(f.y),
          x2: f.x2 === undefined ? undefined : Math.round(f.x2),
          y2: f.y2 === undefined ? undefined : Math.round(f.y2),
          r: Math.round(f.r || 0),
          aoe: Math.round(f.aoe || 0),
          t: Math.round(f.t * 100) / 100,
          dur: f.dur,
          el: f.el,
          fire: f.fire,
          storm: f.storm,
          big: f.big,
          hell: f.hell,
          kill: f.kill,
          style: f.style,
          fog: f.fog,
          c: f.c,
          a: f.a,
          pulse: f.pulse,
          strobe: f.strobe,
          ot: f.own ? f.own.team : undefined,
        };
      }
      const FX_NET = {
        meteor: 1,
        strike: 1,
        tornado: 1,
        hole: 1,
        zone: 1,
        arc: 1,
        crystal: 1,
        tint: 1,
        bolt: 1,
      };
      function packState() {
        const g = G,
          r1 = (v) => Math.round(v * 10) / 10;
        const players = g.mages.map((m, i) => ({
          id: i,
          x: r1(m.x),
          y: r1(m.y),
          vx: Math.round(m.vx),
          vy: Math.round(m.vy),
          h: Math.round(m.hp),
          mh: m.maxHp,
          m: Math.round(m.mana),
          u: Math.round(m.ult),
          f: m.f,
          z: r1(m.z),
          d: m.dead ? 1 : 0,
          dt: r1(m.deadT),
          r: m.runes,
          ae: m.ael,
          s: m.shield ? 1 : 0,
          fz: m.frz > 0 ? 1 : 0,
          sl: m.slow > 0 || m.tfz > 0 ? 1 : 0,
          bn: m.burn > 0 ? 1 : 0,
          hs: m.haste > 0 ? 1 : 0,
          ct: m.castT > 0 ? 1 : 0,
          sw: r1(m.swingT),
          dc: r1(m.dashCd),
          iv: m.invT > 0 ? 1 : 0,
          am: m.amp > 0 ? 1 : 0,
          vi: m.victory ? 1 : 0,
          state: m.dead
            ? "dead"
            : m.castT > 0
              ? "casting"
              : m.dashT > 0
                ? "dash"
                : "idle",
          facing: m.f,
        }));
        const pr = [];
        for (let i = 0; i < NPR; i++) {
          const q = PROJ[i];
          if (q.a && !q.ghost)
            pr.push([
              Math.round(q.x),
              Math.round(q.y),
              Math.round(q.vx),
              Math.round(q.vy),
              q.el,
              q.r,
              q.mon ? 1 : 0,
            ]);
        }
        const fx = [];
        for (const f of g.fx) if (FX_NET[f.k]) fx.push(packFx(f));
        return {
          type: "state",
          tick: ++net.tick,
          players,
          projectiles: pr,
          pickups: g.pick.map((q) => [
            q.id,
            Math.round(q.x),
            Math.round(q.y),
            q.type,
          ]),
          fx,
          ground: g.ground.map((q) => [
            q.k === "lava" ? 1 : 0,
            Math.round(q.x),
            Math.round(q.y),
            Math.round(q.r),
            r1(q.t),
            q.dur,
          ]),
          terr: g.terr.map((o) => o.hp),
          arenaRadius: r1(g.R),
          nR: g.nextR,
          w: r1(g.warn),
          sh: g.shrinking ? 1 : 0,
          time: r1(g.t),
        };
      }
      function hostNetUpdate(dt) {
        const now = performance.now();
        const conns = net.players.filter((p) => p.conn && p.conn.open);
        if (G.ev.length) {
          const m = { type: "event", events: G.ev };
          for (const p of conns) sendTo(p.conn, m);
          G.ev = [];
        }
        net.sendT += dt;
        if (net.sendT >= 0.05) {
          net.sendT = 0;
          if (conns.length) {
            const s = packState();
            for (const p of conns) sendTo(p.conn, s);
          }
        }
        net.pingT += dt;
        if (net.pingT >= 2) {
          net.pingT = 0;
          for (const p of conns)
            sendTo(p.conn, { type: "ping", t: performance.now() });
        }
        for (const p of net.players) {
          if (p.conn && now - p.lastRx > 5000) {
            const m = G.mages[p.mi];
            if (m) {
              m.kind = "bot";
              m.conn = null;
              m.ai.diff = 1;
            }
            try {
              p.conn.close();
            } catch (e) {}
            p.conn = null;
          }
        }
      }
      // ---- Экран онлайн-лобби ----
      function renderOnline() {
        const b = $("online-body");
        const players = () =>
          net.players
            .map(
              (p, i) =>
                '<div class="pl"><i style="background:' +
                esc(p.col) +
                '"></i><span>' +
                esc(p.name) +
                '</span><span style="margin-left:auto;font-size:12px;opacity:.8">' +
                (p.host || (net.role === "host" && i === 0)
                  ? t("host")
                  : "✔ " + t("ready")) +
                "</span></div>",
            )
            .join("");
        if (typeof Peer === "undefined") {
          b.innerHTML =
            "<h2>🌐 " +
            t("online") +
            '</h2><p style="text-align:center">' +
            t("unavail") +
            '</p><div class="row"><button class="gbtn sm" data-act="back">' +
            t("back") +
            "</button></div>";
          return;
        }
        if (net.ui === "menu") {
          b.innerHTML =
            "<h2>🌐 " +
            t("online") +
            '</h2><div class="row" style="flex-direction:column"><button class="gbtn sm" style="width:260px" data-act="create">➕ ' +
            t("create") +
            '</button><button class="gbtn sm" style="width:260px" data-act="joinui">🔑 ' +
            t("join") +
            '</button><button class="gbtn sm" style="width:260px" data-act="back">' +
            t("back") +
            "</button></div>" +
            (net.status
              ? '<div style="text-align:center;color:#FF8080">' +
                esc(net.status) +
                "</div>"
              : "");
        } else if (net.ui === "host") {
          const can =
            net.players.length >= 2 || (net.fill && net.players.length >= 1);
          b.innerHTML =
            "<h2>🌐 " +
            t("roomLabel") +
            '</h2><div class="bigcode">' +
            fmtCode(net.code) +
            '</div><div style="text-align:center;font-size:13px;opacity:.8">' +
            t("share") +
            '</div><div class="row"><button class="gbtn sm" data-act="copy">📋 ' +
            t("copy") +
            "</button></div>" +
            (net.status
              ? '<div style="text-align:center">' + esc(net.status) + "</div>"
              : "") +
            '<div style="font-weight:800">' +
            t("players") +
            " (" +
            net.players.length +
            "/" +
            net.max +
            ")</div>" +
            players() +
            (net.players.length < 2
              ? '<div style="text-align:center;opacity:.7;font-size:13px">' +
                t("waiting") +
                "</div>"
              : "") +
            '<div class="setrow"><span>' +
            t("maxPl") +
            '</span><div class="sel">' +
            [2, 3, 4, 5]
              .map(
                (n) =>
                  '<button data-act="max" data-v="' +
                  n +
                  '" class="' +
                  (net.max === n ? "on" : "") +
                  '">' +
                  n +
                  "</button>",
              )
              .join("") +
            "</div></div>" +
            '<div class="setrow"><span>' +
            t("arena") +
            '</span><button class="gbtn sm" data-act="shrink" style="min-width:150px">' +
            (net.shrink ? t("shrinkOn") : t("shrinkOff")) +
            "</button></div>" +
            '<div class="setrow"><span>' +
            t("fillBots") +
            '</span><button class="gbtn sm" data-act="fill" style="min-width:90px">' +
            (net.fill ? t("on") : t("off")) +
            "</button></div>" +
            '<div class="row"><button class="gbtn sm ' +
            (can ? "" : "dis") +
            '" data-act="start">▶ ' +
            t("start") +
            '</button><button class="gbtn sm" data-act="leave">' +
            t("leave") +
            "</button></div>";
        } else if (net.ui === "join") {
          b.innerHTML =
            "<h2>🔑 " +
            t("join") +
            '</h2><div style="text-align:center;margin-bottom:8px">' +
            t("enterCode") +
            '</div><div class="row"><input type="text" id="code-in" maxlength="7" placeholder="ABC-XYZ" autocomplete="off" autocapitalize="characters" spellcheck="false" style="font-size:28px;letter-spacing:3px;width:200px"></div>' +
            '<div style="text-align:center;min-height:22px;font-weight:800;color:' +
            (net.status === t("connected") ? "#6F6" : "#FFD966") +
            '">' +
            esc(net.status) +
            '</div><div class="row"><button class="gbtn sm" data-act="connect">' +
            t("connect") +
            '</button><button class="gbtn sm" data-act="back2">' +
            t("back") +
            "</button></div>";
        } else {
          b.innerHTML =
            "<h2>🌐 " +
            t("roomLabel") +
            '</h2><div style="text-align:center;color:#6F6;font-weight:800">' +
            t("connected") +
            '</div><div style="font-weight:800">' +
            t("players") +
            " (" +
            net.players.length +
            "/" +
            net.max +
            ")</div>" +
            players() +
            '<div style="text-align:center;opacity:.8;margin:8px">' +
            t("lobbyWait") +
            '</div><div class="row"><button class="gbtn sm" data-act="leave">' +
            t("leave") +
            "</button></div>";
        }
      }
      $("online-body").addEventListener("click", (e) => {
        const a = e.target.closest("[data-act]");
        if (!a) return;
        const act = a.dataset.act;
        if (act === "back") {
          leaveRoom();
          setState("MENU");
        } else if (act === "create") hostCreate(0);
        else if (act === "joinui") {
          net.ui = "join";
          net.status = "";
          renderOnline();
        } else if (act === "back2") {
          leaveRoom();
          net.ui = "menu";
          renderOnline();
        } else if (act === "connect") {
          const v = $("code-in");
          joinRoom(v ? v.value : "");
        } else if (act === "leave") {
          leaveRoom();
          net.ui = "menu";
          renderOnline();
        } else if (act === "copy") {
          try {
            navigator.clipboard.writeText(fmtCode(net.code));
            toast("✔ " + fmtCode(net.code));
          } catch (err) {
            toast(fmtCode(net.code));
          }
        } else if (act === "max") {
          net.max = Math.max(+a.dataset.v, net.players.length);
          broadcastLobby();
        } else if (act === "shrink") {
          net.shrink = !net.shrink;
          broadcastLobby();
        } else if (act === "fill") {
          net.fill = !net.fill;
          broadcastLobby();
        } else if (act === "start") {
          if (net.players.length >= 2 || net.fill) hostStart();
          else toast(t("needMore"));
        }
      });
      $("online-body").addEventListener("input", (e) => {
        if (e.target.id === "code-in") {
          e.target.value = fmtCode(e.target.value);
        }
      });
      window.addEventListener("beforeunload", () => {
        try {
          if (net.role !== "none") cleanupNet(true);
        } catch (e) {}
      });

      // =====================================================================
      //  ЗАГРУЗКА (BOOT -> LOADING -> MENU) С ВАЛИДАЦИЕЙ АРЕНЫ
      // =====================================================================
      let loadStage = 0,
        timeScale = 1;
      function loadStep() {
        const stages = [
          ["icons", () => buildIcons()],
          [
            "arena",
            () => {
              try {
                buildArena();
              } catch (e) {
                buildArenaFallback();
              }
            },
          ],
          [
            "validate",
            () => {
              if (!arenaOk()) {
                try {
                  buildArena();
                } catch (e) {}
              }
              if (!arenaOk()) buildArenaFallback();
            },
          ],
          ["scene", () => initMenu()],
          [
            "ui",
            () => {
              initDaily();
              applyLang();
            },
          ],
        ];
        if (loadStage < stages.length) {
          $("ld-txt").textContent = stages[loadStage][0] + "...";
          try {
            stages[loadStage][1]();
          } catch (e) {
            console.warn("load stage failed", stages[loadStage][0], e);
          }
          loadStage++;
          $("ld-bar").style.width =
            Math.round((loadStage / stages.length) * 100) + "%";
        } else {
          YA.ready();
          setState("MENU");
          if (dailyClaimable())
            setTimeout(() => {
              if (state === "MENU") toast("🎁 " + t("daily"));
            }, 600);
        }
      }
      // =====================================================================
      //  ГЛАВНЫЙ ЦИКЛ
      // =====================================================================
      function gameUpdate(dt) {
        const running =
          state === "PLAYING" ||
          state === "DEATH" ||
          state === "VICTORY" ||
          (state === "PAUSED" && G.role !== "solo");
        if (state === "PLAYING" || (state === "PAUSED" && G.role !== "solo"))
          inputUpdate(dt);
        let sdt = 0;
        if (running) {
          let target = In.aiming ? 0.7 : 1;
          if (G.slowmo > 0) {
            target = 0.1;
            G.slowmo -= dt;
          }
          timeScale += (target - timeScale) * Math.min(1, dt * 10);
          if (G.hitstop > 0) {
            G.hitstop -= dt;
            sdt = 0;
          } else sdt = dt * timeScale;
          if (G.role === "client") clientUpdate(sdt, dt);
          else if (sdt > 0) {
            simUpdate(sdt);
            if (G.role === "host") hostNetUpdate(dt);
          } else if (G.role === "host") hostNetUpdate(dt);
          if (sdt > 0) {
            updateParticles(sdt);
            updateTexts(sdt);
          }
          if (G.over) {
            G.endT -= dt;
            if (G.endT <= 0 && !G.ended && state === "PLAYING") finishMatch();
          }
          if (
            G.me &&
            G.me.dead &&
            G.role !== "solo" &&
            !G.over &&
            state === "PLAYING"
          ) {
            const bn = $("banner");
            bn.textContent = t("specText");
            bn.style.display = "block";
          } else if (state === "PLAYING") $("banner").style.display = "none";
        }
        updateVisuals(dt, sdt);
      }
      let fpsAcc = 0,
        fpsN = 0,
        fpsT = 0;
      function update(dt) {
        if (state === "LOADING" || state === "BOOT") {
          loadStep();
          updateMenu(dt);
          return;
        }
        const inGame =
          G &&
          (state === "PLAYING" ||
            state === "DEATH" ||
            state === "VICTORY" ||
            state === "PAUSED" ||
            state === "LEVELUP");
        if (!inGame) {
          updateMenu(dt);
          if (state === "SHOP") updateShop(dt);
          return;
        }
        gameUpdate(dt);
        // авто-производительность: если FPS < 45 за 3 сек — упрощаем эффекты
        if (state === "PLAYING") {
          fpsAcc += dt;
          fpsN++;
          fpsT += dt;
          if (fpsT >= 3) {
            const fps = fpsN / fpsAcc;
            fpsAcc = 0;
            fpsN = 0;
            fpsT = 0;
            if (save.set.quality === "auto" && fps < 45) {
              if (QUAL.name === "high") setQuality("medium");
              else if (QUAL.name === "medium") {
                setQuality("low");
                resize();
              }
            }
          }
        }
      }
      function render() {
        const inGame =
          G &&
          G.me &&
          (state === "PLAYING" ||
            state === "DEATH" ||
            state === "VICTORY" ||
            state === "PAUSED" ||
            state === "LEVELUP");
        if (inGame) renderGame(ctx);
        else renderMenu(ctx);
      }
      let lastT = performance.now();
      function frame(now) {
        const dt = Math.min(Math.max((now - lastT) / 1000, 0), 0.1);
        lastT = now;
        try {
          update(dt);
          render();
        } catch (e) {
          if (CONFIG.DEBUG_MODE) console.error(e);
          else console.warn(e);
        }
        requestAnimationFrame(frame);
      }
      // ---- Инициализация ----
      (function init() {
        loadSave();
        applyQualitySetting();
        window.addEventListener("resize", resize);
        window.addEventListener("orientationchange", () =>
          setTimeout(resize, 200),
        );
        resize();
        $("b-play").onclick = () => {
          audioInit();
          openSetup("arena");
        };
        $("b-surv").onclick = () => {
          audioInit();
          openSetup("survival");
        };
        $("b-online").onclick = () => {
          audioInit();
          openOnline();
        };
        $("b-shop").onclick = () => {
          audioInit();
          renderShop();
          setState("SHOP");
        };
        $("b-codex").onclick = () => {
          audioInit();
          renderCodex("chains");
          setState("CODEX");
        };
        $("b-set").onclick = () => {
          audioInit();
          renderSettings();
          setState("SETTINGS");
        };
        $("b-lb").onclick = () => {
          audioInit();
          renderLB("wins");
          setState("LEADERBOARD");
        };
        $("chip-daily").onclick = () => {
          audioInit();
          renderDaily();
          setState("DAILY");
        };
        document.addEventListener("pointerover", (e) => {
          if (e.target.closest && e.target.closest(".gbtn")) sfx("hover");
        });
        document.addEventListener("click", (e) => {
          if (
            e.target.closest &&
            e.target.closest(".gbtn,.tab,.card,.sel button")
          ) {
            audioInit();
            sfx("click");
          }
        });
        document.addEventListener("pointerdown", () => audioInit(), {
          once: true,
        });
        applyLang();
        canvas.focus();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
