        }
        netCleanup();
        roomCode = generateRoomCode();
        netStarted = false;
        try {
          hostPeer = new Peer("arcane-arena-" + roomCode, peerOpts());
        } catch (e) {
          showError(t("conn_lost"));
          return;
        }
        $("roomCodeBig").textContent = "......";
        showLobbyPart("host");
        $("lobbyStatusH").textContent = t("connecting");
        hostPeer.on("open", () => {
          lobbyPlayers = [
            { id: 0, nick: save.nick, skin: save.skin, conn: null },
          ];
          $("roomCodeBig").textContent =
            roomCode.slice(0, 3) + "-" + roomCode.slice(3);
          refreshLobbyHost();
          clearInterval(lobbyTimer);
          lobbyTimer = setInterval(() => {
            if (!G)
              netBroadcast({ type: "lobby", players: pubList(), max: hostMax });
          }, 1000);
        });
        hostPeer.on("connection", (conn) => handleClientConnection(conn));
        hostPeer.on("disconnected", () => {
          try {
            hostPeer.reconnect();
          } catch (e) {}
        });
        hostPeer.on("error", (err) => {
          if (err && err.type === "unavailable-id" && !retry) {
            createRoom(true);
            return;
          }
          if (!G) {
            showError(t("conn_lost"));
            showLobbyPart("choose");
          }
        });
      }
      function refreshLobbyHost() {
        $("lobbyPlayers").innerHTML = playersHTML(lobbyPlayers, 0);
        const ok = lobbyPlayers.length >= 2;
        $("btnLobbyStart").classList.toggle("dis", !ok);
        $("lobbyStatusH").textContent = ok ? "" : t("waiting");
        netBroadcast({ type: "lobby", players: pubList(), max: hostMax });
      }
      function handleClientConnection(conn) {
        conn.on("data", (d) => handleClientMessage(conn, d));
        conn.on("close", () => onClientLeft(conn));
        conn.on("error", () => onClientLeft(conn));
      }
      function handleClientMessage(conn, d) {
        if (!d || typeof d !== "object") return;
        if (d.type === "join") {
          if (G && !lobbyPlayers.find((q) => q.conn === conn)) {
            netSendTo(conn, { type: "kick", reason: "started" });
            return;
          }
          let p = lobbyPlayers.find((q) => q.conn === conn);
          if (!p) {
            if (lobbyPlayers.length >= hostMax) {
              netSendTo(conn, { type: "kick", reason: "full" });
              setTimeout(() => {
                try {
                  conn.close();
                } catch (e) {}
              }, 400);
              return;
            }
            const ids = lobbyPlayers.map((q) => q.id),
              usedSk = lobbyPlayers.map((q) => q.skin);
            let id = 1;
            while (ids.indexOf(id) >= 0) id++;
            let sk = d.skin | 0;
            if (usedSk.indexOf(sk) >= 0 || sk < 0 || sk > 7) {
              for (let s = 0; s < 8; s++)
                if (usedSk.indexOf(s) < 0) {
                  sk = s;
                  break;
                }
            }
            p = {
              id: id,
              nick: String(d.nick || "Mage").slice(0, 14),
              skin: sk,
              conn: conn,
            };
            lobbyPlayers.push(p);
            conn._pid = id;
            refreshLobbyHost();
            sfx("pickup");
          }
          netSendTo(conn, {
            type: "welcome",
            id: p.id,
            players: pubList(),
            max: hostMax,
          });
        } else if (d.type === "input") {
          if (!G || !G.net || G.net.role !== "host") return;
          const m = mageById(conn._pid);
          if (!m) return;
          m.lastMsg = Math.max(G.time, 0.001);
          m.ctl.mx = clamp(+d.moveX || 0, -1, 1);
          m.ctl.my = clamp(+d.moveY || 0, -1, 1);
          if (isFinite(d.aimAngle)) m.aim = +d.aimAngle;
          if (Array.isArray(d.acts))
            d.acts.forEach((a) => {
              if (a && a.id > m.ackId) {
                m.ackId = a.id;
                if (
                  ["dash", "attack", "ult"].indexOf(a.k) >= 0 &&
                  isFinite(a.a)
                )
                  mageAct(m, a.k, +a.a, +a.tx || m.x, +a.ty || m.y);
              }
            });
        } else if (d.type === "ping") netSendTo(conn, { type: "pong", t: d.t });
        else if (d.type === "leave") onClientLeft(conn);
      }
      function onClientLeft(conn) {
        const i = lobbyPlayers.findIndex((q) => q.conn === conn);
        if (i < 0) return;
        const p = lobbyPlayers[i];
        if (G) {
          const m = mageById(p.id);
          if (m && m.remote) {
            m.remote = false;
            m.bot = newBot();
            m.name += " 🤖";
          }
          p.conn = null;
        } else {
          lobbyPlayers.splice(i, 1);
          refreshLobbyHost();
        }
      }
      function startPvpHost() {
        if (lobbyPlayers.length < 2) {
          toast(t("pvp_need"));
          return;
        }
        clearInterval(lobbyTimer);
        const list = pubList(),
          seed = ((Math.random() * 1e6) | 0) + 1;
        netStarted = true;
        const msg = { type: "start", players: list, seed: seed };
        netBroadcast(msg);
        setTimeout(() => netBroadcast(msg), 250);
        setTimeout(() => netBroadcast(msg), 600);
        initAudio();
        startMatch("pvp", {
          seed: seed,
          net: { role: "host", players: list, localId: 0 },
        });
      }
      function joinRoom(code) {
        if (!isPeerJSAvailable()) {
          showError(t("unavailable"));
          return;
        }
        netCleanup();
        netStarted = false;
        $("joinStatus").textContent = t("connecting");
        let welcomed = false;
        try {
          clientPeer = new Peer(null, peerOpts());
        } catch (e) {
          showError(t("conn_lost"));
          return;
        }
        const fail = () => {
          if (!welcomed) {
            $("joinStatus").textContent = t("room_not_found");
            sfx("error");
          }
        };
        clientPeer.on("open", () => {
          hostConn = clientPeer.connect("arcane-arena-" + code, {
            reliable: false,
          });
          hostConn.on("open", () => {
            $("joinStatus").textContent = t("connected");
            let tries = 0;
            clearInterval(joinTimer);
            joinTimer = setInterval(() => {
              if (netMyId > 0 || tries++ > 10) {
                clearInterval(joinTimer);
                return;
              }
              netSendTo(hostConn, {
                type: "join",
                nick: save.nick,
                skin: save.skin,
              });
            }, 800);
            netSendTo(hostConn, {
              type: "join",
              nick: save.nick,
              skin: save.skin,
            });
          });
          hostConn.on("data", handleHostMessage);
          hostConn.on("close", () => onHostLost());
          hostConn.on("error", () => fail());
          setTimeout(() => {
            if (!hostConn || !hostConn.open) fail();
          }, 9000);
        });
        clientPeer.on("error", (err) => {
          if (err && err.type === "peer-unavailable") fail();

        window._welcomedHook = () => {

      function handleHostMessage(d) {
        if (!d || typeof d !== "object") return;
        lastHostMsg = performance.now();
        switch (d.type) {
          case "welcome":
            netMyId = d.id;
            if (window._welcomedHook) window._welcomedHook();
            $("joinStatus").textContent = t("connected") + " · " + t("waiting");
            $("joinPlayers").innerHTML = playersHTML(d.players, 0);
            break;
          case "lobby":
            $("joinPlayers").innerHTML = playersHTML(d.players, 0);
            break;
          case "start":
            if (netStarted) return;

            startMatch("pvp", {
              seed: d.seed,
              net: { role: "client", players: d.players, localId: netMyId },

            lastHostMsg = performance.now();
            break;
          case "state":
            if (G && G.net && G.net.role === "client") applySnapshot(d);
            break;
          case "event":
            if (G && G.net && G.net.role === "client")
              handleNetEvents(d.events);

          case "pong":
            netPing = Math.round(performance.now() - d.t);

      function onHostLost() {

      function netCleanup() {
        clearInterval(lobbyTimer);
        clearInterval(joinTimer);
        try {
          if (hostConn) hostConn.close();
        } catch (e) {}
        try {
          if (clientPeer) clientPeer.destroy();
        } catch (e) {}
        try {
          if (hostPeer) hostPeer.destroy();
        } catch (e) {}
        hostConn = null;
        clientPeer = null;
        hostPeer = null;
        lobbyPlayers = [];
        netMyId = 0;
        actQ = [];
        netPing = 0;
      }
      function netLeave() {
        if (hostPeer) netBroadcast({ type: "kick", reason: "host_left" });
        else netSendTo(hostConn, { type: "leave" });
        setTimeout(netCleanup, 200);
      }
      // ---------- Клиент: ввод хосту ----------
      function netSendAction(k, ang, tx, ty) {
        actQ.push({
          id: ++actId,
          k: k,
          a: Math.round(ang * 100) / 100,
          tx: Math.round(tx),
          ty: Math.round(ty),
        });
        if (actQ.length > 8) actQ.shift();
        netSendInput(true);
      }
      function netSendInput(force) {
        const now = performance.now();
        if (!force && now - lastInputSend < 66) return;
        lastInputSend = now;
        if (!hostConn || !me) return;
        const has = (k) => actQ.some((a) => a.k === k);
        netSendTo(hostConn, {
          type: "input",
          seq: ++inputSeq,
          moveX: Math.round(inputMove.x * 100) / 100,
          moveY: Math.round(inputMove.y * 100) / 100,
          dash: has("dash"),
          attack: has("attack"),
          ult: has("ult"),
          aimAngle: Math.round(me.aim * 100) / 100,
          aimActive: aimActive(),
          acts: actQ,
        });
      }
      // ---------- Хост: снапшоты ----------
      function stateOf(m) {
        return !m.alive
          ? "dead"
          : m.castT > 0
            ? "casting"
            : m.moving
              ? "run"
              : "idle";
      }
      function buildSnapshot() {
        return {
          type: "state",
          tick: G.tick,
          time: Math.round(G.time * 100) / 100,
          cd: G.countdown > 0 ? Math.round(G.countdown * 100) / 100 : 0,
          arenaRadius: Math.round(G.arenaR),
          tr: Math.round(G.toR),
          sh: G.shrinking ? 1 : 0,
          ph: G.phase,
          players: G.mages.map((m) => ({
            id: m.id,
            x: r1(m.x),
            y: r1(m.y),
            hp: r1(m.hp),
            mana: r1(m.mana),
            state: stateOf(m),
            facing: m.facing,
            element: m.element,
            runes: m.runes,
            uc: Math.round(m.ultCharge),
            a: m.alive ? 1 : 0,
            mx: r1(m.mvx),
            my: r1(m.mvy),
            sh: m.shield ? 1 : 0,
            fr: m.freeze > 0 ? 1 : 0,
            bu: m.burnT > 0 ? 1 : 0,
            hs: m.hasteT > 0 ? 1 : 0,
            st: m.stun > 0 ? 1 : 0,
            sl: m.slowT > 0 ? 1 : 0,
            ct: m.castT > 0 ? 1 : 0,
            ack: m.ackId,
            dc: r1(m.dashCd),
            ac: r1(m.atkCd),
            aim: Math.round(m.aim * 100) / 100,
            bl: m.blind > 0 ? 1 : 0,
            vi: m.victory ? 1 : 0,
            nm: m.name,
          })),
          projectiles: projs
            .filter((p) => p.a && !p.vis)
            .slice(0, 70)
            .map((p) => [
              p.id,
              Math.round(p.x),
              Math.round(p.y),
              r1(p.vx),
              r1(p.vy),
              p.el,
              p.r,
              p.kind,
            ]),
          pickups: G.pickups.map((p) => [
            p.id,
            Math.round(p.x),
            Math.round(p.y),
            p.type,
            r1(p.t),
          ]),
          effects: G.effects
            .slice(0, 30)
            .map((f) => ({
              id: f.id,
              k: f.kind,
              x: Math.round(f.x),
              y: Math.round(f.y),
              r: Math.round(f.r),
              t: Math.round(f.t * 100) / 100,
              d: f.dur,
              e: f.el,
              dl: f.dl,
              pt: f.portal ? 1 : 0,
              fi: f.fire ? 1 : 0,
              li: f.lightning ? 1 : 0,
              st: f.strobe ? 1 : 0,
              hg: f.huge ? 1 : 0,
            })),
          terr: G.terrain.map((t) => (t.alive ? t.hp : 0)),
          ev: G.evBuf.filter((e) => G.time - e.tt < 0.5),
        };
      }
      function netHostTick(dt) {
        G.lastSend += dt;
        if (G.lastSend >= 0.05) {
          G.lastSend = 0;
          netBroadcast(buildSnapshot());
        }
        if (G.evNew.length) {
          netBroadcast({ type: "event", events: G.evNew });
          G.evNew = [];
        }
        while (G.evBuf.length && G.time - G.evBuf[0].tt > 1) G.evBuf.shift();
      }
      // ---------- Клиент: применение снапшотов и интерполяция ----------
      const seenEv = new Set();
      function handleNetEvents(list) {
        if (!list || !G) return;
        list.forEach((ev) => {
          if (ev.eid != null) {
            if (seenEv.has(ev.eid)) return;
            seenEv.add(ev.eid);
            if (seenEv.size > 600) seenEv.clear();
          }
          if (
            me &&
            ev.id === me.id &&
            (ev.k === "dash" || ev.k === "shoot" || ev.k === "swing")
          )
            return;
          applyEvent(ev);
        });
      }
      function applySnapshot(s) {
        if (!G || !G.net) return;
        const nowT = performance.now();
        lastHostMsg = nowT;
        G.countdown = s.cd || 0;
        G.time = s.time;
        G.arenaR = s.arenaRadius;
        G.toR = s.tr;
        G.shrinking = !!s.sh;
        G.phase = s.ph || 0;
        G.tick = s.tick;
        s.players.forEach((p) => {
          const m = mageById(p.id);
          if (!m) return;
          const was = m.alive;
          m.hp = p.hp;
          m.mana = p.mana;
          m.runes = p.runes;
          m.element = p.element;
          m.ultCharge = p.uc;
          m.alive = !!p.a;
          if (was && !m.alive) {
            m.deadT = 0.0001;
            m.flash = 0.1;
          }
          m.shield = !!p.sh;
          m.freeze = p.fr ? 1 : 0;
          m.burnT = p.bu ? 1 : 0;
          m.hasteT = p.hs ? 1 : 0;
          m.stun = p.st ? 1 : 0;
          m.slowT = p.sl ? 1 : 0;
          m.blind = p.bl ? 1 : 0;
          m.victory = !!p.vi;
          if (p.ct && m.castT <= 0) m.castT = 0.3;
          else if (!p.ct) m.castT = 0;
          if (m === me) {
            me.srv = { x: p.x, y: p.y };
            if (Math.abs(me.dashCd - p.dc) > 0.4 || p.dc === 0)
              me.dashCd = p.dc;
            me.atkCd = Math.min(me.atkCd, p.ac + 0.1);
            while (actQ.length && actQ[0].id <= p.ack) actQ.shift();
          } else {
            m.buf.push({ t: nowT, x: p.x, y: p.y });
            if (m.buf.length > 8) m.buf.shift();
            m.mvx = p.mx;
            m.mvy = p.my;
            m.moving = Math.hypot(p.mx, p.my) > 0.5;
            m.facing = p.facing;
            m.aim = p.aim;
            if (!m.buf.length || m.buf.length === 1) {
              m.x = p.x;
              m.y = p.y;
            }
          }
        });
        G.cProj = s.projectiles.map((q) => ({
          id: q[0],
          x: q[1],
          y: q[2],
          vx: q[3],
          vy: q[4],
          el: q[5],
          r: q[6],
          kind: q[7],
        }));
        G.pickups = s.pickups.map((q) => ({
          id: q[0],
          x: q[1],
          y: q[2],
          type: q[3],
          t: q[4],
        }));
        G.effects = s.effects.map((f) => ({
          id: f.id,
          kind: f.k,
          x: f.x,
          y: f.y,
          r: f.r,
          t: f.t,
          dur: f.d,
          el: f.e,
          dl: f.dl,
          portal: !!f.pt,
          fire: !!f.fi,
          lightning: !!f.li,
          strobe: !!f.st,
          huge: !!f.hg,
        }));
        s.terr.forEach((hp, i) => {
          const tr = G.terrain[i];
          if (!tr) return;
          if (hp < tr.hp) tr.hitT = 0.15;
          tr.alive = hp > 0;
          tr.hp = hp;
        });
        handleNetEvents(s.ev);
      }
      function updateClient(dt) {
        if (G.countdown > 0) G.countdown -= dt;
        pollInput(dt);
        if (!me) return;
        if (me.alive) {
          me.ctl.mx = inputMove.x;
          me.ctl.my = inputMove.y;
          if (me.dashCd > 0) me.dashCd -= dt;
          if (me.atkCd > 0) me.atkCd -= dt;
          if (me.swing > 0) me.swing = Math.max(0, me.swing - dt * 4);
          if (me.flash > 0) me.flash -= dt;
        }
        // предсказание движения локального игрока
        if (me.alive && G.countdown <= 0) {
          const blocked = me.stun > 0 || me.freeze > 0 || me.castT > 0,
            spd =
              3.3 *
              me.speedMul *
              (me.hasteT > 0 ? 1.3 : 1) *
              (me.slowT > 0 ? 0.5 : 1),
            tx = blocked ? 0 : me.ctl.mx * spd,
            ty = blocked ? 0 : me.ctl.my * spd;
          me.mvx += (tx - me.mvx) * 0.28;
          me.mvy += (ty - me.mvy) * 0.28;
          if (me.dashT > 0) {
            me.dashT -= dt;
            me.x += me.dashDX * DASH_V;
            me.y += me.dashDY * DASH_V;
          }
          me.x += me.mvx;
          me.y += me.mvy;
          me.moving = Math.hypot(me.mvx, me.mvy) > 0.5;
          if (!blocked && Math.abs(me.ctl.mx) > 0.3)
            me.facing = me.ctl.mx > 0 ? 1 : -1;
          collideTerrain(me);
          clampToArena(me);
        }
        // мягкая реконсиляция к серверной позиции (без телепортов)
        if (me.srv && me.alive) {
          const dx = me.srv.x - me.x,
            dy = me.srv.y - me.y,
            d = Math.hypot(dx, dy);
          if (d > 160) {
            me.x = me.srv.x;
            me.y = me.srv.y;
          } else {
            const k = me.dashT > 0 ? 0.02 : 0.1;
            me.x += dx * k;
            me.y += dy * k;
          }
        }
        // интерполяция остальных (буфер 100мс)
        const rt = performance.now() - 100;
        G.mages.forEach((m) => {
          if (m === me) {
            if (m.alive) updateMageVisual(m, dt);
            else updateMage(m, dt);
            return;
          }
          if (!m.alive) {
            updateMage(m, dt);

          }
          const b = m.buf;
          if (b.length >= 2) {
            let i = 0;
            while (i < b.length - 2 && b[i + 1].t < rt) i++;

          updateMageVisual(m, dt);
        });
        G.effects.forEach((f) => {
          f.t += dt;
        });
        G.effects = G.effects.filter((f) => f.t < f.dur + 0.1);
        G.cProj.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;

        });

        });
        updateProjectiles();
        netSendInput(false);
        const now = performance.now();
        if (now - lastPingSend > 2000) {
          lastPingSend = now;

        }
        if (lastHostMsg && now - lastHostMsg > 5000 && !G.ended) onHostLost();
        G.ents.length = 0;
        G.mages.forEach((m) => {
          if (m.alive) G.ents.push(m);
        }); // список целей для авто-прицела
      }

      // ============================================================
      // ГЛАВНЫЙ ЦИКЛ
      // ============================================================
      let lastTime = performance.now(),
        accumulator = 0,
        lastDelta = 1 / 60,
        musicCheckT = 0;
      function musicIntensityUpdate() {
        musicCheckT++;
        if (musicCheckT % 30 !== 0 || !me || !G) return;
        let lvl = 0;
        const f = nearestFoeOf(me.team, me.x, me.y, 520);
        if (f) lvl = 1;
        if (me.alive && me.hp < me.maxHp * 0.25) lvl = 2;
        if (

          G.mages.some((m) => m.castT > 0)

      function update(dt) {
        if (

        const realDelta = Math.min((cur - lastTime) / 1000, 0.1);

        if (aimActive() && !netGame()) target = 0.5;
        if (slowmoT > 0) {
          slowmoT -= realDelta;
          target = Math.min(target, slowmoV);

        timeScale += (target - timeScale) * Math.min(1, realDelta * 12);

        accumulator += realDelta * (G && !isMenuState() ? timeScale : 1);

        while (accumulator >= FIXED_DT && steps < 5) {
          try {
            update(FIXED_DT);

            if (CONFIG.DEBUG_MODE) console.error(e);

          accumulator -= FIXED_DT;
          steps++;
        }
        if (steps >= 5) accumulator = 0;

          render();
          if (state === "SHOP") renderShopPreviews();
          if (state === "MENU" && ++profT % 6 === 0) drawProfile();
        } catch (e) {
          if (CONFIG.DEBUG_MODE) console.error(e);
        }
        checkPerformance(realDelta);
        requestAnimationFrame(gameLoop);
      }

      // ============================================================

      let lastHover = 0;

        $("btnJoinRoom").onclick = () => {
          showLobbyPart("join");
          $("joinStatus").textContent = "";
          $("joinPlayers").innerHTML = "";
          $("joinInput").value = "";
          setTimeout(() => $("joinInput").focus(), 50);
        };
        $("btnLobbyLeave").onclick = () => {
          netBroadcast({ type: "kick", reason: "host_left" });
          setTimeout(netCleanup, 150);
          showLobbyPart("choose");
        };
        $("btnLobbyStart").onclick = startPvpHost;
        $("lobbyMax").onchange = (e) => {
          hostMax = +e.target.value;
          refreshLobbyHost();
        };
        $("btnCopy").onclick = () => {
          try {
            navigator.clipboard
              .writeText(roomCode)
              .then(() => toast(t("copied")))
              .catch(() => toast(roomCode));
          } catch (e) {
            toast(roomCode);
          }
        };
        $("joinInput").oninput = (e) => {
          let v = e.target.value
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "")
            .slice(0, 6);
          e.target.value = v.length > 3 ? v.slice(0, 3) + "-" + v.slice(3) : v;
        };
        $("btnConnect").onclick = () => {
          const code = $("joinInput").value.replace("-", "");
          if (code.length !== 6) {
            $("joinStatus").textContent = t("room_not_found");
            sfx("error");
            return;
          }
          joinRoom(code);
        };
        $("btnJoinBack").onclick = () => {
          netCleanup();
          showLobbyPart("choose");
        };
        // Клик по любой панели возвращает фокус на canvas во время игры
        document.addEventListener("pointerup", () => {
          if (state === "PLAYING") focusCanvas();
        });
      }
      async function boot() {
        try {
          state = "BOOT";
          applyLang();
          resizeCanvas();
          setProgress(8, "Icons...");
          cacheAllIcons();
          initMenuScene();
          wireUI();
          requestAnimationFrame(gameLoop);

          state = "LOADING";
          await delay(30);
          setProgress(30, "Arena...");
          buildArena();
          await delay(30);

          setProgress(55, "SDK...");
          await initYandexSDK();

          setProgress(75, "Save...");
          await loadSaveAll();
          applyLang();
          ensureQuests();
          energyTick();
          applyQualitySetting();
          syncSettingsUI();
          if (menuMages[0]) menuMages[0].m.skin = save.skin;

          setProgress(90, "PvP...");
          if (!isPeerJSAvailable()) console.log("PeerJS unavailable");

          setProgress(100, "OK");
          yandexReady();
          await delay(350);

          $("loading").classList.remove("vis");
          setTimeout(() => $("loading").classList.remove("show"), 320);
          showScreen("menu");
          setMusicIntensity(0);
          setInterval(() => {
            if (state === "MENU") updateEnergyUI();
          }, 1000);
          if (dailyInfo().can) {
            setTimeout(() => {
              if (state === "MENU") {
                renderDaily();
                showScreen("daily");
              }
            }, 700);
          }
          checkAch();
        } catch (err) {
          // Страховка: если что-то пошло не так — всё равно показываем меню, а не висим на 50%
          console.error("Boot error:", err);
          try {
            $("loading").classList.remove("vis");
            $("loading").classList.remove("show");
          } catch (e) {}
          try {
            showScreen("menu");
          } catch (e) {}
        }
      }
      window.addEventListener("load", boot);
    </script>
  </body>
</html>
