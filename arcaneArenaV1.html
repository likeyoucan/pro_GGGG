<script>
'use strict';
// ============================================================
// === КОНФИГУРАЦИЯ ИГРЫ (ЗАМЕНИТЕ ПЕРЕД ЗАГРУЗКОЙ В ЯНДЕКС) ===
// ============================================================
const CONFIG = {
    STUDIO_NAME: "YOUR_STUDIO_NAME_HERE",
    GAME_VERSION: "1.0.0",
    IS_PRODUCTION: true,
    DEFAULT_LANGUAGE: "ru"

// ===================== УТИЛИТЫ =====================
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let LANG = CONFIG.DEFAULT_LANGUAGE;
const tr = (ru, en) => LANG === 'ru' ? ru : en;
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

// ===================== ДАННЫЕ: СТИХИИ =====================
const EL = [

    { id: 'lightning', ru: 'Молния', en: 'Lightning', color: '#FFEE00', light: '#FFFBB0' },

];
const ARCANE = '#C9A0FF';
const elName = i => tr(EL[i].ru, EL[i].en);

// 15 комбинаций + 5 мега-ультов: [ru, en, описание ru, описание en]
const ULTS = {
    arcane: ['Аркановзрыв', 'Arcane Burst', 'Кольцо магии отбрасывает врагов', 'A ring of raw magic knocks enemies back'],
    '00': ['Метеоритный шторм', 'Meteor Storm', '5 метеоритов, по 80px урона по площади', '5 meteors, 80px AoE each'],
    '01': ['Термошок', 'Thermal Shock', 'Паровой взрыв ослепляет и замедляет на 4с', 'Steam blast blinds and slows for 4s'],
    '02': ['Плазменная нова', 'Plasma Nova', 'Цепная молния по 5 врагам, 50 урона', 'Chain lightning hits 5 enemies for 50'],
    '03': ['Огненный шторм', 'Firestorm', 'Огненный торнадо преследует врагов 6с', 'A fire tornado hunts enemies for 6s'],
    '04': ['Врата ада', 'Hellgate', 'Тёмный портал затягивает и жжёт', 'A dark portal drags in and burns'],
    '11': ['Ледяная тюрьма', 'Glacial Prison', 'Все враги заморожены на 3с', 'Freezes all enemies for 3s'],

    '22': ['Цепная перегрузка', 'Chain Overload', '10 цепных молний по арене', '10 chain bolts across the arena'],
    '23': ['Грозовой вихрь', 'Storm Vortex', 'Движущийся торнадо с ударами молний', 'A roaming tornado with lightning strikes'],
    '24': ['Громовая пустота', 'Void Thunder', 'Тёмные молнии самонаводятся', 'Homing dark bolts seek enemies'],
    '33': ['Циклон', 'Cyclone', 'Огромный торнадо затягивает и отбрасывает', 'A massive tornado pulls and throws'],
    '34': ['Разлом измерений', 'Dimensional Rift', 'Враги телепортируются на край арены', 'Enemies are sent to the arena edge'],
    '44': ['Чёрная дыра', 'Black Hole', 'Сингулярность тянет и калечит 5с', 'A singularity pulls and damages for 5s'],
    '000': ['Апокалипсис', 'Apocalypse', 'Метеоритный дождь и лавовый пол 10с', 'Meteor shower and a lava floor for 10s'],
    '111': ['Ледниковый период', 'Ice Age', 'Вся арена замерзает на 5с', 'The whole arena freezes for 5s'],
    '222': ['Гнев богов', 'God Wrath', 'Непрерывная гроза 8с', 'A continuous storm for 8s'],
    '333': ['Ураган', 'Hurricane', 'Гигантский вихрь сметает арену', 'A giant vortex sweeps the arena'],
    '444': ['Забвение', 'Oblivion', 'Всеобщее притяжение и зона мгновенной смерти', 'Universal pull and an instant-death zone']
};
const ultName = k => LANG === 'ru' ? ULTS[k][0] : ULTS[k][1];
const ultDesc = k => LANG === 'ru' ? ULTS[k][2] : ULTS[k][3];

// ===================== ДАННЫЕ: ПРЕДМЕТЫ =====================
const ITEMS = {
    heart: { ru: 'Зелье здоровья', en: 'Health Potion', w: 14, icon: 'it_heart', col: '#ff4a5a', d: ['+50% здоровья', '+50% HP'] },
    mana: { ru: 'Фляга маны', en: 'Mana Flask', w: 14, icon: 'it_mana', col: '#4aa0ff', d: ['+100% маны', '+100% Mana'] },
    haste: { ru: 'Эликсир скорости', en: 'Haste Elixir', w: 10, icon: 'it_haste', col: '#4aff7a', d: ['+30% скорости на 8с', '+30% speed for 8s'] },
    shield: { ru: 'Щит-амулет', en: 'Shield Charm', w: 8, icon: 'it_shield', col: '#6ab4ff', d: ['Поглощает 1 удар', 'Absorbs 1 hit'] },
    gem: { ru: 'Кристалл', en: 'Gem', w: 12, icon: 'it_gem', col: '#ffd24a', d: ['+5 кристаллов', '+5 currency'] },
    freeze: { ru: 'Заморозка времени', en: 'Time Freeze', w: 6, icon: 'it_freeze', col: '#8ff', d: ['Враги медленнее на 50% 4с', 'Enemies 50% slower for 4s'] },
    rune: { ru: 'Руна стихии', en: 'Element Rune', w: 35, icon: 'rune_', col: '#fff', d: ['Добавляется в слот ульты', 'Adds to the Ult slot'] }
};

// ===================== ДАННЫЕ: СКИНЫ =====================
const SKINS = [
    { id: 'purple', ru: 'Пурпурный', en: 'Purple', mantle: '#4A2A8B', trim: '#DAA520', price: 0 },
    { id: 'crimson', ru: 'Багровый', en: 'Crimson', mantle: '#8B2F3F', trim: '#DAA520', price: 0 },
    { id: 'emerald', ru: 'Изумрудный', en: 'Emerald', mantle: '#2F8B5A', trim: '#DAA520', price: 0 },
    { id: 'gold', ru: 'Золотой', en: 'Gold', mantle: '#B8862F', trim: '#FFF2A0', price: 0 },
    { id: 'azure', ru: 'Лазурный', en: 'Azure', mantle: '#2F5A8B', trim: '#DAA520', price: 0 },
    { id: 'royal', ru: 'Королевский пурпур', en: 'Royal Purple', mantle: '#6B2FD0', trim: '#C8D0E0', pat: 'stars', price: 120, prem: 1 },
    { id: 'ember', ru: 'Угольный красный', en: 'Ember Red', mantle: '#B8321E', trim: '#C87533', pat: 'runes', price: 150, prem: 1 },
    { id: 'frost', ru: 'Морозный белый', en: 'Frost White', mantle: '#CFE8F5', trim: '#9FB4C8', pat: 'stripes', price: 150, prem: 1 },
    { id: 'iris', ru: 'Радужная кайма', en: 'Iridescent', mantle: '#2A2A5A', trim: 'iri', pat: 'stars', gem: '#40FFE0', price: 250, prem: 1 },
    { id: 'archmage', ru: 'Архимаг Бездны', en: 'Void Archmage', mantle: '#1B0F3A', trim: '#FFD700', pat: 'runes', aura: '#9B5CFF', hood: 1, staff: 1, gem: '#C07AFF', price: 500, leg: 1 },
    { id: 'solar', ru: 'Солнечный мудрец', en: 'Solar Sage', mantle: '#C86A10', trim: '#FFF2A0', pat: 'stripes', aura: '#FFD060', hood: 1, staff: 1, gem: '#FFF', price: 600, leg: 1 }
];
const skinById = id => SKINS.find(s => s.id === id) || SKINS[0];
const skinName = s => tr(s.ru, s.en);

// ===================== СОХРАНЕНИЯ =====================
const SAVE_KEY = 'arcane_arena_v14';
let save = {
    ftue: false, gems: 50, wins: 0, matches: 0, bestWave: 0, energy: 5, energyTs: Date.now(),
    skins: ['purple', 'crimson', 'emerald', 'gold', 'azure'], skin: 'purple', lang: null, music: .6, sfx: .8,
    tv: false, vib: true, noAds: false, vip: false, loginDay: 0, loginDate: '', seasonXp: 0, seasonLvl: 1,
    nick: 'Mage', st: { kills: 0, wins: 0, matches: 0, bestWave: 0, ults: 0, dashes: 0, pickups: 0, gems: 0, mega: 0, clutch: 0 }, ach: {}, seen: {}
};
let ysdk = null, ysPlayer = null, saveTimer = 0;
function loadSave() {
    try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); Object.assign(save, d); save.st = Object.assign({ kills: 0, wins: 0, matches: 0, bestWave: 0, ults: 0, dashes: 0, pickups: 0, gems: 0, mega: 0, clutch: 0 }, d.st || {}); } catch (e) { }
}
function saveGame() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { try { ysPlayer && ysPlayer.setData({ save: JSON.stringify(save) }, true); } catch (e) { } }, 1500);
}
function refreshEnergy() {
    const now = Date.now();
    if (save.energy >= 5) { save.energy = 5; save.energyTs = now; return; }
    while (save.energy < 5 && now - save.energyTs >= 300000) { save.energy++; save.energyTs += 300000; }
    if (save.energy >= 5) save.energyTs = now;
}
function vibe(ms) { if (save.vib && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) { } }

// ===================== YANDEX SDK =====================
function initYandex() {
    return new Promise(res => {
        let done = false; const fin = () => { if (!done) { done = true; res(); } };
        setTimeout(fin, 2500);
        try {
            const s = document.createElement('script'); s.src = 'https://yandex.ru/games/sdk/v2';
            s.onload = () => {
                if (!window.YaGames) return fin();
                YaGames.init().then(async y => {
                    ysdk = y;
                    try { ysPlayer = await ysdk.getPlayer({ scopes: false }); const d = await ysPlayer.getData(['save']); if (d && d.save) { const o = JSON.parse(d.save); if ((o.matches || 0) >= (save.matches || 0)) { Object.assign(save, o); } } const nm = ysPlayer.getName(); if (nm && save.nick === 'Mage') save.nick = nm; } catch (e) { }
                    try { if (!save.lang) { const l = ysdk.environment.i18n.lang; LANG = (l === 'ru' || l === 'be' || l === 'kk' || l === 'uk' || l === 'uz') ? 'ru' : 'en'; } } catch (e) { }
                    fin();
                }).catch(fin);
            };
            s.onerror = fin; document.head.appendChild(s);
        } catch (e) { fin(); }
    });
}
function gameplay(on) { try { if (ysdk && ysdk.features) { const g = ysdk.features.GameplayAPI; g && (on ? g.start() : g.stop()); } } catch (e) { } }
let lastAdTs = Date.now() - 120000;
function muteAll(m) { if (busM) busM.gain.value = m ? 0 : 1; }
function showInterstitial(cb) {
    if (!ysdk || save.noAds || save.vip || Date.now() - lastAdTs < 180000) { cb && cb(); return; }
    lastAdTs = Date.now();
    try { ysdk.adv.showFullscreenAdv({ callbacks: { onOpen: () => muteAll(true), onClose: () => { muteAll(false); cb && cb(); }, onError: () => { muteAll(false); cb && cb(); } } }); } catch (e) { cb && cb(); }
}
function showRewarded(onReward) {
    if (ysdk) {
        let got = false;
        try { ysdk.adv.showRewardedVideo({ callbacks: { onOpen: () => muteAll(true), onRewarded: () => { got = true; }, onClose: () => { muteAll(false); if (got) onReward(); }, onError: () => { muteAll(false); toast(tr('Реклама недоступна', 'Ad unavailable')); } } }); } catch (e) { toast(tr('Реклама недоступна', 'Ad unavailable')); }
    } else { // демо-режим вне Яндекс Игр
        const a = $('#adsim'); a.style.display = 'flex'; let n = 2; a.textContent = tr('Реклама (демо) ', 'Ad (demo) ') + n;
        const iv = setInterval(() => { n--; if (n <= 0) { clearInterval(iv); a.style.display = 'none'; onReward(); } else a.textContent = tr('Реклама (демо) ', 'Ad (demo) ') + n; }, 900);
    }
}
function purchase(id) {
    const grant = () => {
        if (id === 'gems100') save.gems += 100; else if (id === 'gems500') save.gems += 600; else if (id === 'vip') { save.vip = true; save.noAds = true; save.gems += 200; } else if (id === 'noads') save.noAds = true;
        saveGame(); toast(tr('Покупка выполнена!', 'Purchase complete!')); renderScreen();
    };
    if (ysdk) { try { ysdk.getPayments({ signed: false }).then(p => p.purchase({ id })).then(grant).catch(() => toast(tr('Покупка отменена', 'Purchase cancelled'))); } catch (e) { toast('Payments error'); } }
    else { grant(); }
}
function toast(msg) { const t = $('#toast'), d = document.createElement('div'); d.textContent = msg; t.appendChild(d); setTimeout(() => d.remove(), 2200); }

// ===================== ЗВУК (Web Audio) =====================
let AC = null, busM, busS, busMus, layerG = [], noiseBuf, distCurve, voices = 0;
function aInit() {
    if (AC) return;
    try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        const comp = AC.createDynamicsCompressor(); busM = AC.createGain(); busS = AC.createGain(); busMus = AC.createGain();
        busS.connect(comp); busMus.connect(comp); comp.connect(busM); busM.connect(AC.destination);
        for (let i = 0; i < 3; i++) { const g = AC.createGain(); g.connect(busMus); layerG.push(g); }
        layerG[0].gain.value = 1; layerG[1].gain.value = 0; layerG[2].gain.value = 0;
        setVol();
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        distCurve = new Float32Array(256); for (let i = 0; i < 256; i++) { const x = i / 128 - 1; distCurve[i] = (3 + 40) * x * 20 * (Math.PI / 180) / (Math.PI + 40 * Math.abs(x)); }
        setInterval(musicTick, 100);
    } catch (e) { AC = null; }
}
function aResume() { if (AC && AC.state === 'suspended') AC.resume().catch(() => { }); }
function setVol() { if (!AC) return; busS.gain.value = save.sfx * .8; busMus.gain.value = save.music * .5; }
function tone(o) {
    if (!AC || voices > 48) return; voices++;
    const t0 = AC.currentTime + (o.delay || 0), osc = AC.createOscillator(), g = AC.createGain(); let ws = null;
    osc.type = o.type || 'sine'; const pv = o.nopitch ? 1 : 1 + rand(-.12, .12);

    LEVELUP() { return '<div class="scr dim"><div class="h2">⬆ ' + tr('НОВЫЙ УРОВЕНЬ!', 'LEVEL UP!') + '</div><div class="row">' + G.choices.map(i => { const u = UPG[i]; return '<div class="card panel" style="width:180px;cursor:pointer" data-act="upg" data-i="' + i + '"><div style="font-size:44px">' + u.e + '</div><b>' + tr(u.ru, u.en) + '</b><div style="font-size:13px;opacity:.85">' + tr(u.d[0], u.d[1]) + '</div><div style="font-size:11px;opacity:.6">' + tr('Ур. ', 'Lv ') + ((G.up[i] || 0) + 1) + '/5</div></div>'; }).join('') + '</div></div>'; },
    RESULT() {
        const r = stateData.res, win = stateData.kind === 'win', tg = SKINS.filter(s => !save.skins.includes(s.id)).sort((a, b) => a.price - b.price)[0], pct = tg ? Math.min(99, Math.floor(save.gems / tg.price * 100)) : 100;
        return '<div class="scr dim"><div class="h2" style="color:' + (win ? '#FFD76A' : '#ff6a6a') + '">' + (win ? tr('ПОБЕДА!', 'VICTORY!') : tr('ПОРАЖЕНИЕ', 'DEFEAT')) + '</div><div class="panel col"><div>⚔️ ' + tr('Убийств: ', 'Kills: ') + r.kills + (r.wave ? ' · ' + tr('Волна ', 'Wave ') + r.wave : '') + '</div><div>💎 +' + r.gems + (r.doubled ? ' (x2)' : '') + ' &nbsp; 🎟 +' + r.xp + ' XP</div>' + (tg ? '<div style="font-size:13px">' + tr('Следующая разблокировка: ', 'Next unlock: ') + skinName(tg) + ' — ' + pct + '%</div><div class="bar"><i style="width:' + pct + '%"></i></div>' : '') + '</div><div class="row"><button class="btn" data-act="replay">↻ ' + tr('Ещё раз', 'Replay') + '</button><button class="btn s" data-act="menu">🏠 ' + tr('В меню', 'Menu') + '</button></div><div class="row">' + (!r.doubled ? '<button class="btn g sm" data-act="x2">📺 x2 ' + tr('награда', 'rewards') + '</button>' : '') + (!win && !G.revived ? '<button class="btn g sm" data-act="revive">📺 ' + tr('Воскреснуть', 'Revive') + '</button>' : '') + '</div></div>';
    },
    CALENDAR() { const d = stateData.day, R = [10, 15, 20, 25, 30, 40, 0]; return '<div class="scr dim"><div class="h2">🎁 ' + tr('ЕЖЕДНЕВНАЯ НАГРАДА', 'DAILY REWARD') + '</div><div class="row">' + R.map((v, i) => '<div class="card ' + (i + 1 === d ? 'sel' : (i + 1 < d ? 'lock' : '')) + '" style="min-width:76px"><div style="font-size:12px">' + tr('День ', 'Day ') + (i + 1) + '</div><div style="font-size:26px">' + (v ? '💎' : '🎁') + '</div><b>' + (v || tr('Сундук', 'Chest')) + '</b></div>').join('') + '</div><button class="btn" data-act="claim">' + tr('Забрать', 'Claim') + '</button></div>'; }
};
SCR.DEATH = SCR.RESULT; SCR.VICTORY = SCR.RESULT;
function renderScreen() { const f = SCR[state]; UI.innerHTML = f ? f() : ''; UI.style.pointerEvents = f ? 'auto' : 'none'; }
function setState(s, data) {
    const prev = state; state = s; stateData = data || {}; releaseAll();
    if (s === 'PLAYING') { gameplay(true); if (prev !== 'PAUSED' && prev !== 'LEVELUP') { perf.t = 0; perf.n = 0; perf.c = 0; } musicStart(.55); }
    else if (prev === 'PLAYING') gameplay(false);
    if (s === 'MENU' || s === 'MODE' || s === 'SHOP' || s === 'CODEX' || s === 'SETTINGS') musicStart(.12);
    if (s === 'PAUSED') musicStart(.1);
    renderScreen();
}
function goMenu() { const today = new Date().toISOString().slice(0, 10); if (save.loginDate !== today) { const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10); const day = save.loginDate === y ? (save.loginDay % 7) + 1 : 1; setState('CALENDAR', { day }); } else setState('MENU'); }
function startPlay(m) { lastMatch = { mode: m, count: selCount, coop: false, trial: trialSkin }; trialSkin = null; startMatch(lastMatch); }
function fetchNames() {
    return new Promise(res => {
        const fb = ['Merlin99', 'Ivan_Storm', 'NightOwl', 'Zephyr', 'Katya', 'DarkLord', 'Lunar', 'Frostbite', 'Pyro_X', 'Alisa']; let done = false; const fin = n => { if (!done) { done = true; res(n); } }; setTimeout(() => fin(fb), 1300);
        if (!ysdk) return fin(fb);
        try { ysdk.getLeaderboards().then(lb => lb.getLeaderboardEntries('arcane_wins', { quantityTop: 15, includeUser: false })).then(r => { const n = r.entries.map(e => e.player.publicName).filter(Boolean); fin(n.length >= 4 ? n : fb); }).catch(() => fin(fb)); } catch (e) { fin(fb); }
    });
}
function goOnline(m) { setState('MATCHMAKING', { m }); fetchNames().then(names => setTimeout(() => { if (state !== 'MATCHMAKING') return; lastMatch = { mode: m, count: selCount, names, coop: m === 'survival' }; startMatch(lastMatch); }, 1500)); }
function showResult(kind) {
    const win = kind === 'win', st = G.stats; let gems = st.gems + (win ? 20 : 5), xp = Math.round(20 + st.kills * 3 + (win ? 60 : 0));
    if (G.mode === 'survival') { gems += G.wave * 2; xp += G.wave * 5; save.st.bestWave = Math.max(save.st.bestWave || 0, G.wave); save.bestWave = save.st.bestWave; }
    if (G.mode === 'arena' && win) { save.wins++; save.st.wins++; }
    save.matches++; save.st.matches++; save.gems += gems; addSeasonXp(xp); checkAch(); saveGame();
    try { if (ysdk) ysdk.getLeaderboards().then(lb => { if (G && G.mode === 'arena' && win) lb.setLeaderboardScore('arcane_wins', save.st.wins); if (G && G.mode === 'survival') lb.setLeaderboardScore('survival_waves', save.st.bestWave); }).catch(() => { }); } catch (e) { }
    setState(win ? 'VICTORY' : 'DEATH', { kind, res: { kills: st.kills, gems, xp, wave: G.mode === 'survival' ? G.wave : 0, doubled: false } });
}
function revivePlayer() { const p = G.player; p.dead = false; p.gone = false; p.deadT = 0; p.hp = p.maxHp * .6; p.hpD = p.hp; p.iframes = 2; G.over = null; G.overT = 0; G.shown = false; G.revived = true; G.lowFired = 5; G.lowHp = 0; if (G.units.indexOf(p) < 0) G.units.push(p); aoe(p.x, p.y, 160, 20, p, { color: '#fff', kb: 500 }); setState('PLAYING'); }
function act(a, d) {
    switch (a) {
        case 'mode': setState('MODE'); break; case 'menu': showInterstitial(() => goMenu()); break; case 'count': selCount = +d.n; renderScreen(); break;
        case 'play': startPlay(d.m); break; case 'online': goOnline(d.m); break; case 'room': stateData.room = String(randi(1000, 9999)); renderScreen(); break;
        case 'shop': setState('SHOP'); break; case 'codex': setState('CODEX', { tab: 0 }); break; case 'settings': setState('SETTINGS'); break;
        case 'tab': stateData.tab = +d.t; stateData.sel = null; renderScreen(); break; case 'sel': stateData.sel = d.k; renderScreen(); break;
        case 'buy': { const s = skinById(d.id); if (save.gems >= s.price) { save.gems -= s.price; save.skins.push(s.id); save.skin = s.id; saveGame(); toast('✔ ' + skinName(s)); } else toast(tr('Не хватает кристаллов', 'Not enough gems')); renderScreen(); break; }
        case 'equip': save.skin = d.id; saveGame(); renderScreen(); break;
        case 'try': showRewarded(() => { trialSkin = d.id; toast(tr('Пробный скин на 1 матч: ', 'Trial skin for 1 match: ') + skinName(skinById(d.id))); }); break;
        case 'iap': purchase(d.id); break;
        case 'lang': LANG = d.l; save.lang = d.l; saveGame(); renderScreen(); break;
        case 'tv': save.tv = !save.tv; saveGame(); renderScreen(); break; case 'vib': save.vib = !save.vib; saveGame(); renderScreen(); break;
        case 'reset': if (confirm(tr('Удалить весь прогресс?', 'Delete all progress?'))) { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } location.reload(); } break;
        case 'resume': setState('PLAYING'); break; case 'quit': goMenu(); break;
        case 'replay': if (lastMatch) startMatch(lastMatch); break;
        case 'x2': showRewarded(() => { const r = stateData.res; if (r.doubled) return; r.doubled = true; save.gems += r.gems; saveGame(); renderScreen(); }); break;
        case 'revive': showRewarded(() => revivePlayer()); break;
        case 'upg': applyUpgrade(G.player, +d.i); SFX.pickup(); setState('PLAYING'); break;
        case 'claim': { const day = stateData.day, R = [10, 15, 20, 25, 30, 40, 0]; if (R[day - 1]) { save.gems += R[day - 1]; toast('💎 +' + R[day - 1]); } else { const lg = SKINS.filter(s => s.leg && !save.skins.includes(s.id)); if (lg.length) { const s = pick(lg); save.skins.push(s.id); toast('🎁 ' + skinName(s)); } else { save.gems += 200; toast('💎 +200'); } } save.loginDay = day; save.loginDate = new Date().toISOString().slice(0, 10); saveGame(); setState('MENU'); break; }
        case 'adenergy': showRewarded(() => { save.energy = Math.min(5, save.energy + 3); save.energyTs = Date.now(); saveGame(); if (pendingMatch) startMatch(pendingMatch); else goMenu(); }); break;
    }
}
UI.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled || el.tagName === 'INPUT') return; aInit(); aResume(); SFX.click(); act(el.dataset.act, el.dataset); });
UI.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.act === 'vol') { save[el.dataset.k] = +el.value / 100; setVol(); saveGame(); } });
UI.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.act === 'nick') { save.nick = (el.value || 'Mage').slice(0, 14); saveGame(); } });

// ============================================================
// ===================== ГЛАВНЫЙ ЦИКЛ =====================
// ============================================================
const perf = { t: 0, n: 0, c: 0 }; let lastTs = 0, uiTick = 0;
function step(rdt) {
    if (G.over === 'win' && !G.vfx) { G.vfx = true; const w = G.winner || G.player; ring(w.x, w.y, 420, '#ffd24a', 1.3); ring(w.x, w.y, 260, '#fff', .9); burst(w.x, w.y - 10, 120, 300, 1.4, 3, '#ffe080', 1, 1.5, -20); }
    if (G.hitstop > 0) { G.hitstop -= rdt; G.shake *= Math.exp(-rdt * 4); return; }
    let dt = rdt; if (G.slowT > 0) { dt *= G.slowScale; G.slowT -= rdt; }
    updateParticles(dt); updateFT(dt); updateGame(dt);
}
function frame(ts) {
    requestAnimationFrame(frame); const raw = (ts - lastTs) / 1000 || .016; lastTs = ts; const rdt = Math.min(.05, raw);
    try {
        if (G && (state === 'MENU' || state === 'MODE' || state === 'SHOP' || state === 'CODEX' || state === 'SETTINGS' || state === 'CALENDAR' || state === 'MATCHMAKING')) { G = null; if (grayOn) { grayOn = false; cv.style.filter = ''; } }
        if (state === 'PLAYING' && G) {
            pollInput(); step(rdt); if (G) renderGame(rdt);
            perf.t += raw; perf.n++; if (perf.t > 3 && perf.c < 2) { const fps = perf.n / perf.t; if (fps < 45 && Q > .4) Q = Q > .7 ? .6 : .35; perf.t = 0; perf.n = 0; perf.c++; }
        } else if (G && G.arena && (state === 'PAUSED' || state === 'LEVELUP' || state === 'DEATH' || state === 'VICTORY' || state === 'ENERGY')) renderGame(0);
        else { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#07050f'; ctx.fillRect(0, 0, W, H); }
        uiTick += raw; if (uiTick > 1) { uiTick = 0; const cb = document.getElementById('chipbox'); if (cb) cb.innerHTML = chipsInner(); }
    } catch (e) { console.error(e); }
}
async function boot() {
    cv = $('#game'); ctx = cv.getContext('2d'); resize(); window.addEventListener('resize', resize); bindInput(); loadSave(); if (save.lang) LANG = save.lang;
    setState('LOADING', {}); lavaPat = makeLava(); requestAnimationFrame(frame);
    await initYandex(); if (save.lang) LANG = save.lang; else { save.lang = LANG; }
    await buildIcons(p => { const b = $('#lbar'); if (b) b.style.width = Math.round(p * 100) + '%'; });
    EL.forEach(e => { if (!ICONS['el_' + e.id]) icon('el_' + e.id); });
    try { if (ysdk && ysdk.features && ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready(); } catch (e) { }
    refreshEnergy(); saveGame();
    if (!save.ftue) { startMatch({ mode: 'ftue' }); } else goMenu();
}
boot();
</script>
