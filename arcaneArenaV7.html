<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>Arcane Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07030a;
        font-family: "Trebuchet MS", Verdana, sans-serif;
        color: #fff;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: none;
        pointer-events: none;
      }
      .screen.on {
        display: block;
      }
      .screen > * {
        pointer-events: auto;
      }
      .dim {
        background: rgba(5, 2, 12, 0.62);
      }
      .glass {
        background: linear-gradient(
          160deg,
          rgba(70, 36, 125, 0.55),
          rgba(15, 8, 35, 0.68)
        );
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 215, 120, 0.4);
        box-shadow:
          inset 0 0 22px rgba(255, 200, 100, 0.12),
          0 8px 30px rgba(0, 0, 0, 0.55);
        border-radius: 14px;
      }
      .small {
        font-size: 12px;
        opacity: 0.8;
      }
      .title {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 900;
        letter-spacing: 0.06em;
        margin: 0;
        font-size: clamp(34px, 7.2vw, 96px);
        line-height: 1;
        text-transform: uppercase;
        background: linear-gradient(
          180deg,
          #fff7b8 0%,
          #ffd23a 30%,
          #ff8a1a 55%,
          #ffd23a 78%,
          #fff7b8 100%
        );
        background-size: 100% 220%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 0 #5a2000)
          drop-shadow(0 0 16px rgba(255, 150, 0, 0.75));
        animation:
          flame 2.2s linear infinite,
          bob 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes flame {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 0 220%;
        }
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-7px);
        }
      }
      .studio {
        font-family: Georgia, serif;
        font-style: italic;
        letter-spacing: 0.18em;
        font-size: clamp(11px, 1.6vw, 17px);
        color: #f3d9a0;
        text-shadow: 0 2px 6px #000;
        margin-top: 8px;
      }
      #s-load {
        background: radial-gradient(ellipse at center, #2a1250 0%, #07030a 75%);
      }
      .loadbox {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: min(90vw, 560px);
      }
      .bar {
        height: 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        margin: 26px 0 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 215, 120, 0.4);
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #ff8a1a, #ffe04a);
        transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #portrait {
        position: absolute;
        left: 14px;
        top: 14px;
        display: flex;
        gap: 10px;
        padding: 8px 16px 8px 8px;
        align-items: center;
      }
      #portrait canvas {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle, #3a2070, #12081f);
        border: 2px solid #daa520;
      }
      #energy {
        position: absolute;
        right: 14px;
        top: 14px;
        padding: 8px 12px;
        display: flex;
        gap: 5px;
        align-items: center;
        cursor: pointer;
      }
      #energy img {
        width: 26px;
        height: 26px;
        transition:
          opacity 0.3s,
          filter 0.3s;
      }
      #titleBox {
        position: absolute;
        left: 0;
        right: 0;
        top: 6%;
        text-align: center;
        pointer-events: none !important;
      }
      #menuBtns {
        position: absolute;
        right: 3%;
        top: 52%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(250px, 36vw);
      }
      #menuFoot {
        position: absolute;
        left: 14px;
        bottom: 10px;
        pointer-events: none !important;
      }
      .btn {
        font:
          800 16px "Trebuchet MS",
          Verdana,
          sans-serif;
        color: #fff;
        padding: 13px 16px;
        border-radius: 12px;
        border: 2px solid rgba(255, 215, 120, 0.55);
        cursor: pointer;
        text-align: left;
        background: linear-gradient(
          160deg,
          rgba(80, 40, 140, 0.7),
          rgba(20, 10, 45, 0.85)
        );
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow:
          inset 0 0 16px rgba(255, 200, 100, 0.15),
          0 6px 18px rgba(0, 0, 0, 0.5);
        text-shadow: 0 2px 3px #000;
        transition:
          transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.3s,
          filter 0.3s;
        display: flex;
        align-items: center;
        gap: 10px;
        touch-action: manipulation;
      }
      .btn:hover {
        transform: translateX(-6px) scale(1.04);
        filter: brightness(1.2);
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.pri {
        font-size: 22px;
        padding: 16px;
        background: linear-gradient(160deg, #ffcf3a, #e07a10);
        color: #2a1000;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        animation: pulse 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .btn.off {
        opacity: 0.45;
        pointer-events: none;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow:
            0 0 10px 2px rgba(255, 200, 60, 0.5),
            0 6px 18px rgba(0, 0, 0, 0.5);
        }
        50% {
          box-shadow:
            0 0 26px 8px rgba(255, 200, 60, 0.9),
            0 6px 18px rgba(0, 0, 0, 0.5);
        }
      }
      .btn img {
        width: 28px;
        height: 28px;
      }
      .panel {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(940px, 96vw);
        max-height: 92vh;
        display: flex;
        flex-direction: column;
        padding: 14px 18px;
        animation: pop 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -46%) scale(0.94);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      .ph {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .ph h2 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 26px;
        color: #ffd86a;
        text-shadow:
          0 2px 0 #000,
          0 0 12px rgba(255, 170, 0, 0.5);
      }
      .x {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        width: 38px;
        height: 38px;
        font-size: 18px;
        cursor: pointer;
      }
      .pbody {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        touch-action: pan-y;
        padding-right: 4px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .card {
        padding: 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 215, 120, 0.25);
        text-align: center;
        font-size: 13px;
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card img {
        width: 56px;
        height: 56px;
      }
      .card b {
        display: block;
        margin: 4px 0;
        color: #ffe08a;
      }
      .card.sel {
        border-color: #ffd23a;
        box-shadow: 0 0 14px rgba(255, 210, 60, 0.6);
      }
      .card.lock {
        opacity: 0.55;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .chip {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 215, 120, 0.4);
        background: rgba(255, 255, 255, 0.07);
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        touch-action: manipulation;
      }
      .chip.on {
        background: linear-gradient(160deg, #ffcf3a, #e07a10);
        color: #2a1000;
        box-shadow: 0 0 12px rgba(255, 200, 60, 0.6);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 8px 0;
      }
      .sbtn {
        padding: 8px 14px;
        border-radius: 10px;
        border: 0;
        font-weight: 800;
        cursor: pointer;
        background: linear-gradient(160deg, #ffcf3a, #e07a10);
        color: #2a1000;
        touch-action: manipulation;
      }
      .sbtn.g {
        background: linear-gradient(160deg, #4cb860, #1f7a33);
        color: #fff;
      }
      .sbtn.b {
        background: linear-gradient(160deg, #6a8cff, #2b3fb0);
        color: #fff;
      }
      .sbtn.off {
        opacity: 0.4;
        pointer-events: none;
      }
      .pbar {
        height: 12px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .pbar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #ff8a1a, #ffe04a);
      }
      input[type="range"] {
        width: 200px;
        accent-color: #ffb020;
      }
      input[type="text"] {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 215, 120, 0.5);
        color: #fff;
        padding: 8px;
        border-radius: 8px;
        font-size: 16px;
        width: 160px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%) translateY(20px);
        padding: 10px 18px;
        border-radius: 12px;
        background: rgba(20, 10, 40, 0.92);
        border: 1px solid #ffd23a;
        opacity: 0;
        transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
        z-index: 50;
        font-weight: 700;
        text-align: center;
        max-width: 90vw;
      }
      #toast.on {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #ad {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        z-index: 60;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-size: 22px;
        pointer-events: auto;
      }
      #ad.on {
        display: flex;
      }
      #skip {
        position: absolute;
        right: 14px;
        bottom: 14px;
        display: none;
        padding: 8px 14px;
        border-radius: 10px;
        font-weight: 800;
        pointer-events: auto;
      }
      #skip.on {
        display: block;
      }
      table.t {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      table.t td {
        padding: 6px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .cm {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
        max-width: 420px;
      }
      .cm div {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 215, 120, 0.2);
      }
      .cm div img {
        width: 80%;
        height: 80%;
      }
      .cm div.on {
        border-color: #ffd23a;
        box-shadow: 0 0 10px #ffd23a;
      }
      @media (max-aspect-ratio: 1/1) {
        #menuBtns {
          top: auto;
          bottom: 3%;
          left: 5%;
          right: 5%;
          width: auto;
          transform: none;
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        #menuBtns .pri {
          grid-column: 1/3;
        }
        .btn:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <div id="s-load" class="screen on">
        <div class="loadbox">
          <h1 class="title">ARCANE ARENA</h1>
          <div class="studio" id="ls"></div>
          <div class="bar"><i id="lb"></i></div>
          <div id="lm" class="small"></div>
        </div>
      </div>
      <div id="s-menu" class="screen">
        <div id="portrait" class="glass">
          <canvas id="pcv" width="112" height="112"></canvas>
          <div>
            <b id="pn"></b>
            <div id="pl" class="small"></div>
            <div id="pg"></div>
          </div>
        </div>
        <div id="energy" class="glass" data-act="energyAd"></div>
        <div id="titleBox">
          <h1 class="title">ARCANE ARENA</h1>
          <div class="studio" id="ms"></div>
        </div>
        <div id="menuBtns"></div>
        <div id="menuFoot" class="small"></div>
      </div>
      <div id="s-panel" class="screen dim">
        <div class="panel glass">
          <div class="ph">
            <h2 id="ptitle"></h2>
            <button class="x" id="pclose" data-act="close">✕</button>
          </div>
          <div class="pbody" id="pbody"></div>
        </div>
      </div>
      <button id="skip" class="btn" data-act="skipFtue"></button>
      <div id="toast"></div>
      <div id="ad"></div>
    </div>
    <script>
      "use strict";
      const CONFIG = {
        STUDIO_NAME: "YOUR_STUDIO_NAME_HERE",
        GAME_VERSION: "15.2.0",
        IS_PRODUCTION: true,
        DEFAULT_LANGUAGE: "ru",
      };
      const K = 0.5,
        TAU = Math.PI * 2;
      const $ = (id) => document.getElementById(id);
      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      const rnd = (a, b) => a + Math.random() * (b - a);
      const rndi = (a, b) => Math.floor(rnd(a, b + 1));
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
      const easeInOut = (t) => {
        t = clamp(t, 0, 1);
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      };
      const tick = () => new Promise((r) => setTimeout(r, 0));
      const _hc = new Map();
      function hexRgb(h) {
        let v = _hc.get(h);
        if (!v) {
          const n = parseInt(h.slice(1), 16);
          v = [n >> 16, (n >> 8) & 255, n & 255];
          _hc.set(h, v);
        }
        return v;
      }
      function rgba(h, a) {
        const v = hexRgb(h);
        return "rgba(" + v[0] + "," + v[1] + "," + v[2] + "," + a + ")";
      }
      function shade(h, f) {
        const v = hexRgb(h);
        let r = v[0],
          g = v[1],
          b = v[2];
        if (f < 1) {
          r *= f;
          g *= f;
          b *= f;
        } else {
          const t = f - 1;
          r += (255 - r) * t;
          g += (255 - g) * t;
          b += (255 - b) * t;
        }
        return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
      }
      function mixHex(a, b, t) {
        const x = hexRgb(a),
          y = hexRgb(b);
        const f = (i) =>
          Math.round(lerp(x[i], y[i], t))
            .toString(16)
            .padStart(2, "0");
        return "#" + f(0) + f(1) + f(2);
      }
      function mkc(w, h) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        return c;
      }
      function rr(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }
      function otext(c, s, x, y, size, fill, sw, font) {
        c.font =
          "800 " + size + "px " + (font || "'Trebuchet MS',Verdana,sans-serif");
        c.lineJoin = "round";
        c.lineWidth = sw || 3;
        c.strokeStyle = "#000";
        c.strokeText(s, x, y);
        c.fillStyle = fill || "#fff";
        c.fillText(s, x, y);
      }
      const fmtT = (s) => {
        s = Math.max(0, s | 0);
        return (
          String((s / 60) | 0).padStart(2, "0") +
          ":" +
          String(s % 60).padStart(2, "0")
        );
      };

      const SAVE_KEY = "arcane_arena_v15";
      function defSave() {
        return {
          name: "Маг" + rndi(100, 999),
          gems: 30,
          xp: 0,
          lvl: 1,
          wins: 0,
          bestWave: 0,
          owned: ["def"],
          skin: "def",
          energy: 5,
          eT: Date.now(),
          lastAd: 0,
          cal: { day: 0, last: "" },
          passXp: 0,
          passClaimed: 0,
          ach: {},
          st: {
            kills: 0,
            wins: 0,
            matches: 0,
            ults: 0,
            mega: 0,
            dashes: 0,
            pickups: 0,
            wave: 0,
            clutch: 0,
            combos: 0,
            melee: 0,
            survT: 0,
            runes: 0,
          },
          combosSeen: {},
          opt: {
            sfx: 1,
            music: 1,
            lang: CONFIG.DEFAULT_LANGUAGE,
            tv: 0,
            vib: 1,
            q: "auto",
          },
          ftue: 0,
          vip: 0,
          noAds: 0,
        };
      }
      let S = defSave();
      function loadSave() {
        try {
          const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
          if (d) mergeSave(d);
        } catch (e) {}
      }
      function mergeSave(d) {
        for (const k in d) {
          if (
            d[k] &&
            typeof d[k] === "object" &&
            !Array.isArray(d[k]) &&
            S[k] &&
            typeof S[k] === "object"
          )
            Object.assign(S[k], d[k]);
          else S[k] = d[k];
        }
      }
      let _sv = 0;
      function save() {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify(S));
        } catch (e) {}
        clearTimeout(_sv);
        _sv = setTimeout(() => {
          try {
            if (player && player.setData) player.setData({ s: S }, true);
          } catch (e) {}
        }, 1500);
      }
      const L = (ru, en) => (S.opt.lang === "ru" ? ru : en);

      const EL = [
        { k: "fire", ru: "Огонь", en: "Fire", col: "#FF4500", lt: "#FFB347" },
        { k: "ice", ru: "Лёд", en: "Ice", col: "#00DDFF", lt: "#C8F6FF" },
        {
          k: "light",
          ru: "Молния",
          en: "Lightning",
          col: "#FFEE00",
          lt: "#FFFBB0",
        },
        { k: "air", ru: "Воздух", en: "Air", col: "#B0E0E6", lt: "#FFFFFF" },
        { k: "void", ru: "Пустота", en: "Void", col: "#6A0DAD", lt: "#C060FF" },
      ];
      const COMBO = {
        "00": ["Метеоритный шторм", "Meteor Storm", "5 метеоров", "5 meteors"],
        "01": ["Термошок", "Thermal Shock", "Паровой взрыв", "Steam blast"],
        "02": ["Плазменная нова", "Plasma Nova", "Цепь на 5", "Chain 5"],
        "03": ["Огненный шторм", "Firestorm", "Торнадо", "Tornado"],
        "04": ["Врата ада", "Hellgate", "Портал", "Portal"],
        11: ["Ледяная тюрьма", "Glacial Prison", "Freeze ALL", "Freeze ALL"],
        12: ["Гроза", "Thunderstorm", "Молнии", "Bolts"],
        13: ["Метель", "Blizzard", "Буря", "Storm"],
        14: ["Абсолютный ноль", "Absolute Zero", "Freeze+amp", "Freeze+amp"],
        22: ["Цепная перегрузка", "Chain Overload", "10 болтов", "10 bolts"],
        23: ["Штормовой вихрь", "Storm Vortex", "Торнадо", "Tornado"],
        24: ["Гром Пустоты", "Void Thunder", "Хоминг", "Homing"],

      // ---------- АРЕНА ----------
      function buildArena(R, th, force) {
        ARENA.th = th;
        ARENA.R = R;
        const pad = 40,
          rim = 34,
          ry = R * K,
          W = Math.ceil(2 * R + pad * 2),
          H = Math.ceil(2 * ry + pad * 2 + rim);
        const cx = W / 2,
          cy = pad + ry;
        ARENA.cx = cx;
        ARENA.cy = cy;
        let ok = false;
        if (!force) {
          try {
            const st = mkc(W, H),
              sx = st.getContext("2d"),
              lv = mkc(W, H),
              lx = lv.getContext("2d");
            lx.save();
            lx.beginPath();
            lx.ellipse(cx, cy, R, ry, 0, 0, TAU);
            lx.clip();
            const lg = lx.createRadialGradient(cx, cy, 10, cx, cy, R);
            lg.addColorStop(0, "#FFF0A0");
            lg.addColorStop(0.3, th.c2);
            lg.addColorStop(0.7, th.c1);
            lg.addColorStop(1, shade(th.c1, 0.3));
            lx.fillStyle = lg;
            lx.fillRect(0, 0, W, H);
            for (let i = 0; i < 220; i++) {
              lx.fillStyle = rgba(
                Math.random() < 0.4 ? "#FFF0C0" : th.c2,
                rnd(0.15, 0.55),
              );
              lx.beginPath();
              lx.arc(rnd(0, W), rnd(0, H), rnd(3, 24), 0, TAU);
              lx.fill();
            }
            lx.restore();
            sx.lineJoin = "round";
            sx.beginPath();
            sx.ellipse(cx, cy, R, ry, 0, 0, Math.PI, false);
            sx.lineTo(cx - R, cy + rim);
            sx.ellipse(cx, cy + rim, R, ry, 0, Math.PI, 0, true);
            sx.closePath();
            const rg = sx.createLinearGradient(0, cy, 0, cy + rim + ry);
            rg.addColorStop(0, "#3a342e");
            rg.addColorStop(1, "#120e0c");
            sx.fillStyle = rg;
            sx.fill();
            sx.save();
            sx.beginPath();
            sx.ellipse(cx, cy, R, ry, 0, 0, TAU);
            sx.clip();
            const tw = 56,
              thh = 28,
              N = Math.ceil(R / tw) + 4,
              sc = th.stone;
            for (let i = -N; i <= N; i++)
              for (let j = -N; j <= N; j++) {
                const x0 = cx + (i - j) * tw,
                  y0 = cy + (i + j) * thh;
                if (
                  Math.pow((x0 - cx) / (R + tw), 2) +
                    Math.pow((y0 - cy) / (ry + thh), 2) >
                  1.05
                )
                  continue;
                const v = rnd(-12, 8),
                  gap = 3.5;
                sx.fillStyle =
                  "rgb(" +
                  (sc[0] + v) +
                  "," +
                  (sc[1] + v) +
                  "," +
                  (sc[2] + v) +
                  ")";
                sx.beginPath();
                sx.moveTo(x0, y0 - thh + gap);
                sx.lineTo(x0 + tw - gap * 2, y0);
                sx.lineTo(x0, y0 + thh - gap);
                sx.lineTo(x0 - tw + gap * 2, y0);
                sx.closePath();
                sx.fill();
                sx.strokeStyle = "rgba(140,120,100,.5)";
                sx.lineWidth = 1;
                sx.beginPath();
                sx.moveTo(x0 - tw + gap * 2, y0);
                sx.lineTo(x0, y0 - thh + gap);
                sx.lineTo(x0 + tw - gap * 2, y0);
                sx.stroke();
                sx.strokeStyle = "rgba(0,0,0,.7)";
                sx.lineWidth = 1.5;
                sx.beginPath();
                sx.moveTo(x0 - tw + gap * 2, y0);
                sx.lineTo(x0, y0 + thh - gap);
                sx.lineTo(x0 + tw - gap * 2, y0);
                sx.stroke();
                if (Math.random() < 0.3) {
                  sx.save();
                  sx.globalCompositeOperation = "lighter";
                  const cg = sx.createRadialGradient(x0, y0, 0, x0, y0, 8);
                  cg.addColorStop(0, "rgba(255,120,20,.5)");
                  cg.addColorStop(1, "rgba(255,60,0,0)");
                  sx.fillStyle = cg;
                  sx.beginPath();
                  sx.arc(x0, y0, 10, 0, TAU);
                  sx.fill();
                  sx.restore();
                }
              }
            sx.restore();
            sx.beginPath();
            sx.ellipse(cx, cy, R, ry, 0, 0, TAU);
            sx.lineWidth = 5;
            sx.strokeStyle = "#000";
            sx.stroke();
            const hasA = (x, px, py) => {
              const d = x.getImageData(px | 0, py | 0, 24, 24).data;
              for (let i = 3; i < d.length; i += 4) if (d[i] > 0) return true;
              return false;
            };
            if (
              hasA(sx, cx - 12, cy + ry * 0.3) &&
              hasA(lx, cx - 12, cy - 12)
            ) {
              ARENA.stone = st;
              ARENA.lava = lv;
              ok = true;
            }
          } catch (e) {
            ok = false;
          }
        }
        if (!ok) {
          try {
            const st = mkc(W, H),
              sx = st.getContext("2d"),
              lv = mkc(W, H),
              lx = lv.getContext("2d");
            lx.fillStyle = th.c1;
            lx.beginPath();
            lx.ellipse(cx, cy, R, ry, 0, 0, TAU);
            lx.fill();
            sx.fillStyle = "#2A2520";
            sx.beginPath();
            sx.ellipse(cx, cy, R - 4, ry - 2, 0, 0, TAU);
            sx.fill();
            sx.strokeStyle = "#000";
            sx.lineWidth = 5;
            sx.stroke();
            ARENA.stone = st;
            ARENA.lava = lv;
            ok = true;
          } catch (e) {
            ARENA.stone = null;
          }
        }
        return ok;
      }

      function makeMatch(cfg, R) {

        for (let i = 0; i < n; i++) {
          const isP = i === 0;
          let col;

            const ix = cols.indexOf(col);
            if (ix >= 0) cols.splice(ix, 1);
          } else col = cols.pop();
          const ang = isP ? Math.PI / 2 : (i / n) * TAU + Math.PI / 2,
            rad = cfg.mode === "arena" ? R * 0.6 : cfg.mode === "ftue" ? 0 : 60;
          const m = newMage({
            isP,
            name: isP ? S.name : names[i % names.length],

          });
          if (cfg.mode === "survival") {

                      y,
                      r: 14,

      // ---------- БАЗА ----------
      function nearestFoe(m, maxD) {
        let b = null,
          bd = maxD || 1e9;
        const f = (e) => {
          if (e.dead || e.team === m.team) return;
          const d = Math.hypot(e.x - m.x, e.y - m.y) - e.r;
          if (d < bd) {
            bd = d;
            b = e;
          }
        };
        for (const e of M.mages) f(e);
        for (const e of M.monsters) f(e);
        return b;
      }
      function foesOf(m) {
        const a = [];
        for (const e of M.mages) if (!e.dead && e.team !== m.team) a.push(e);
        for (const e of M.monsters) if (!e.dead && e.team !== m.team) a.push(e);
        return a;
      }
      function rebuildHash() {
        const h = M.hash;
        h.forEach((a) => {
          a.length = 0;
        });
        const ins = (e) => {
          if (e.dead) return;
          const k =
            (Math.floor(e.x / 100) + 60) * 256 + (Math.floor(e.y / 100) + 60);
          let a = h.get(k);
          if (!a) {
            a = [];
            h.set(k, a);
          }
          a.push(e);
        };
        for (const e of M.mages) ins(e);
        for (const e of M.monsters) ins(e);
      }
      function near(x, y, r, out) {
        out.length = 0;
        const q = r + 60,
          x0 = Math.floor((x - q) / 100),
          x1 = Math.floor((x + q) / 100),
          y0 = Math.floor((y - q) / 100),

      function aoe(x, y, r, dmg, m, o) {

      function collide(e) {

            mn = e.r + o.r;

      function updProj(dt) {
        for (const p of PR) {

              const cur = Math.atan2(p.vy, p.vx);
              let da = Math.atan2(t.y - p.y, t.x - p.x) - cur;
              da = Math.atan2(Math.sin(da), Math.cos(da));
              const na = cur + clamp(da, -4 * dt, 4 * dt),

              p.vx = Math.cos(na) * sp;
              p.vy = Math.sin(na) * sp;
            }

          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0 || Math.hypot(p.x, p.y) > M.R + 80) {
            p.a = 0;
            continue;
          }
          let blocked = false;
          for (const o of M.obst)
            if (!o.dead && Math.hypot(p.x - o.x, p.y - o.y) < o.r + p.r) {
              hitObst(o, 1, p.own);
              blocked = true;

          if (blocked && !p.pierce) {

            continue;

          near(p.x, p.y, p.r + 10, TMPN);
          for (let i = 0; i < TMPN.length; i++) {
            const e = TMPN[i];
            if (e.dead || e.team === p.team || p.hits.includes(e)) continue;
            if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) {
              const l = Math.hypot(p.vx, p.vy) || 1;

                kx: (p.vx / l) * 220,

              if (p.pierce > 0) p.pierce--;
              else {
                p.a = 0;
                break;
              }
            }
          }
        }

        const a = M.fx;

          if (f.upd) f.upd(f, dt);

      function ringFx(x, y, r, col, dur, lw) {
        addFx({
          dur: dur || 0.5,
          ground: 1,
          draw(c, f) {
            const k = f.t / f.dur,
              q = r * easeOut(k);
            c.globalAlpha = Math.max(0, 1 - k);
            c.strokeStyle = col;
            c.lineWidth = (lw || 6) * (1 - k * 0.5);
            c.beginPath();

            c.stroke();

      function boltFx(x1, y1, x2, y2, col, dur) {
        const pts = [[x1, y1]];

          pts.push([
            lerp(x1, x2, k) + rnd(-14, 14),
            lerp(y1, y2, k) + rnd(-14, 14),
          ]);
        }
        pts.push([x2, y2]);
        addFx({
          dur: dur || 0.18,
          draw(c, f) {
            const a = 1 - f.t / f.dur;
            c.globalCompositeOperation = "lighter";

            c.lineJoin = "round";

              [9, col],

      // Заполняем недостающие ульты через arc/c00

        if (d >= 0) return "c" + d + d;

      // ---------- ИИ ----------
      function aiCtl(m, dt) {
        const c = m.ctl,
          ai = m.ai;
        c.atk = false;
        c.dash = false;
        c.ult = false;
        ai.t -= dt;
        if (ai.t <= 0) {
          ai.t = rnd(0.15, 0.35);
          let best = null,
            bestScore = -Infinity;
          const check = (e) => {
            if (e.dead || e.team === m.team) return;
            const d = Math.hypot(e.x - m.x, e.y - m.y);
            let score = -d * 0.5;
            if (e.hp / e.maxHp < 0.35) score += 200;
            if (e.boss) score += 120;
            if (score > bestScore) {
              bestScore = score;
              best = e;
            }
          };
          M.mages.forEach(check);
          M.monsters.forEach(check);
          ai.tgt = best;
          let bestPk = null,
            bestPkScore = -Infinity;
          for (const p of M.pk) {
            const d = Math.hypot(p.x - m.x, p.y - m.y);
            if (d > 500) continue;
            let s = -d;
            if (p.def.id === "hp" && m.hp < m.maxHp * 0.7) s += 400;
            if (s > bestPkScore) {
              bestPkScore = s;
              bestPk = p;
            }
          }
          ai.pk = bestPk;
        }
        let mx = 0,
          my = 0;
        const tg = ai.tgt && !ai.tgt.dead ? ai.tgt : null;
        let ax = m.face,
          ay = 0;
        if (tg) {
          const dx = tg.x - m.x,
            dy = tg.y - m.y,
            d = Math.hypot(dx, dy),
            ux = dx / (d || 1),
            uy = dy / (d || 1);
          if (d > 250) {
            mx = ux;
            my = uy;
          } else if (d < 150) {
            mx = -ux;
            my = -uy;
          } else {
            mx = -uy * ai.str;
            my = ux * ai.str;
          }
          const ang = Math.atan2(tg.y - m.y, tg.x - m.x);
          ax = Math.cos(ang);
          ay = Math.sin(ang);
          if (d - tg.r < 45 && m.atkCd <= 0) c.atk = true;
          else if (d < 520 && m.atkCd <= 0 && m.mana >= RCOST) {
            if (Math.random() < dt * 12 * ai.skill + 0.15) c.atk = true;

          if (m.ult >= 100 && d < 350 && Math.random() < dt * 2) c.ult = true;
        }
        const l = Math.hypot(mx, my);
        if (l > 1) {
          mx /= l;
          my /= l;
        }
        c.mx = mx;
        c.my = my;
        c.ax = ax;
        c.ay = ay;
        return c;
      }

      // ---------- МАГ ----------
      function playerCtl(m) {
        const c = m.ctl;
        let mx = 0,
          my = 0;
        const k = IN.keys;
        if (k.KeyA || k.ArrowLeft) mx -= 1;
        if (k.KeyD || k.ArrowRight) mx += 1;
        if (k.KeyW || k.ArrowUp) my -= 1;
        if (k.KeyS || k.ArrowDown) my += 1;
        if (IN.joy) {
          const dx = IN.joy.x - IN.joy.ox,
            dy = IN.joy.y - IN.joy.oy,
            l = Math.hypot(dx, dy);
          if (l > 8) {
            mx += (dx / l) * Math.min(1, l / 50);
            my += (dy / l) * Math.min(1, l / 50);
          }
        }
        let l = Math.hypot(mx, my);
        if (l > 1) {
          mx /= l;
          my /= l;
          l = 1;
        }
        if (l > 0.05) {
          const wy = my / K,
            wl = Math.hypot(mx, wy) || 1;
          c.mx = (mx / wl) * l;
          c.my = (wy / wl) * l;
        } else {
          c.mx = 0;
          c.my = 0;
        }
        let ax = m.face,
          ay = 0;
        if (IN.mouse.has && !IN.touch) {
          const wx = (IN.mouse.x - G.W / 2) / G.zoom + CAM.x,
            wy = ((IN.mouse.y - G.H / 2) / G.zoom + CAM.y) / K;
          ax = wx - m.x;
          ay = wy - m.y;
        } else {
          const f = nearestFoe(m, 520);
          if (f) {
            ax = f.x - m.x;
            ay = f.y - m.y;
          }
        }
        const al = Math.hypot(ax, ay) || 1;
        c.ax = ax / al;
        c.ay = ay / al;
        c.atk = IN.atk > 0;
        c.dash = IN.dash > 0;
        c.ult = IN.ult > 0;
        if (M.pvp && !M.isHostNet && Net.hostConn)
          Net.sendToHost({
            t: "input",
            mx: c.mx,
            my: c.my,
            ax: c.ax,
            ay: c.ay,
            atk: c.atk,
            dash: c.dash,
            ult: c.ult,
          });
        return c;
      }
      function startDash(m, ctl) {
        let dx = ctl.mx,
          dy = ctl.my;

          dx = ctl.ax;
          dy = ctl.ay;
        }
        const l = Math.hypot(dx, dy) || 1;
        m.dashDx = dx / l;
        m.dashDy = dy / l;
        m.dashT = DASH_D;
        m.inv = 0.3;

        if (m.isP) IN.dash = 0;
      }
      function doAttack(m, ctl) {
        let ax = ctl.ax,
          ay = ctl.ay;
        const foe = nearestFoe(m, 80);
        const melee = foe && Math.hypot(foe.x - m.x, foe.y - m.y) - foe.r < 45;
        if (!melee && m.mana < RCOST) {

        if (m.isP) IN.atk = 0;
        if (melee) {

          const ang = Math.atan2(ay, ax);

            if (e.dead || e.team === m.team) return;

            if (d > 70 + e.r) return;
            let da = Math.atan2(dy, dx) - ang;

      function updMage(m, dt) {

        else ctl = aiCtl(m, dt);
        const frozen = m.st.frozen > 0 || m.st.stun > 0;
        const lock = frozen || m.cast;
        if (Math.abs(ctl.ax) > 0.15) m.face = ctl.ax > 0 ? 1 : -1;
        if (m.cast) {

        let tx = 0,
          ty = 0;

        m.y += (m.vy + m.ky) * dt;
        m.kx *= Math.exp(-6 * dt);
        m.ky *= Math.exp(-6 * dt);

      function spawnMon(idx, o) {

            idx: Math.min(29, Math.floor(Math.random() * 5) + 2),

      function updMon(e, dt) {
        if (e.dead) return;

        if (e.st.burn > 0) {

      function dropPickup(x, y) {

      function updFtue(dt) {

      function updWaves(dt) {

      function startVictory() {

      function updateMatch(dt) {

        for (const e of M.monsters) updMon(e, dt);
        for (let i = M.monsters.length - 1; i >= 0; i--)
          if (M.monsters[i].dead) M.monsters.splice(i, 1);
        updProj(dt);
        updFx(dt);
        updZones(dt);
        updPickups(dt);
        updPhase(dt);
        updWaves(dt);
        if (M.ft) updFtue(dt);
        if (M.ann) {
          M.ann.t += dt;
          if (M.ann.t > M.ann.dur) M.ann = null;
        }
        checkEnd();
        if (M.over) {
          M.over.t += dt;
          if (!M.fin && M.over.t > (M.over.kind === "death" ? 2.5 : 3.2)) {
            M.fin = true;
            finishMatch(M.over.kind);
          }
        }
        const p = M.player,
          k = 1 - Math.exp(-dt * 8);
        CAM.x += (p.x - CAM.x) * k;
        CAM.y += (p.y * K - 20 - CAM.y) * k;
      }
      function updateMatchVisualOnly(dt) {
        const k = 1 - Math.exp(-dt * 18);
        for (const m of M.mages) {
          if (m._netT) {
            m.x = lerp(m.x, m._netT.x, k);
            m.y = lerp(m.y, m._netT.y, k);
            m.z = lerp(m.z, m._netT.z, k);
          }
          updEye(m, dt);
          if (m.dead) m.deathT += dt;
        }
        for (const e of M.monsters) {
          e.t = (e.t || 0) + dt;
        }
        updFx(dt);
        updZones(dt);
        const p = M.player,
          kc = 1 - Math.exp(-dt * 8);
        CAM.x += (p.x - CAM.x) * kc;
        CAM.y += (p.y * K - 20 - CAM.y) * kc;
        if (M.ann) {
          M.ann.t += dt;
          if (M.ann.t > M.ann.dur) M.ann = null;
        }
        if (M.over) {
          M.over.t += dt;
          if (!M.fin && M.over.t > 3) {
            M.fin = true;
            finishMatch(M.over.kind);
          }
        }
      }

      // ---------- PVP (PeerJS) ----------
      const Net = {
        peer: null,
        conns: new Map(),
        hostConn: null,
        isHost: false,
        roomCode: null,
        _snapAcc: 0,
        makeCode() {
          const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          let s = "";
          for (let i = 0; i < 4; i++) s += A[(Math.random() * A.length) | 0];
          return s;
        },
        _initPeer(customId, onReady, onError) {
          try {
            this.peer = customId ? new Peer(customId) : new Peer();
          } catch (e) {
            onError && onError(e);
            return;
          }
          this.peer.on("open", (id) => onReady && onReady(id));
          this.peer.on("error", (e) => {
            console.warn("Peer error", e);
            if (e.type === "peer-unavailable")
              toast(L("Комната не найдена", "Room not found"));
            onError && onError(e);
          });
          this.peer.on("connection", (conn) => this._setupConn(conn, true));
        },
        host() {
          return new Promise((resolve, reject) => {
            this.isHost = true;
            this.roomCode = this.makeCode();
            const id = "arcane-pvp-" + this.roomCode;
            this._initPeer(id, () => resolve(this.roomCode), reject);
          });
        },
        join(code) {
          return new Promise((resolve, reject) => {
            this.isHost = false;
            this.roomCode = code.toUpperCase();
            this._initPeer(
              null,
              () => {
                const conn = this.peer.connect("arcane-pvp-" + this.roomCode, {
                  reliable: true,
                });
                this._setupConn(conn, false);
                conn.on("open", () => resolve());
                setTimeout(() => {
                  if (!conn.open) reject(new Error("timeout"));
                }, 10000);
              },
              reject,
            );
          });
        },
        _setupConn(conn, asHost) {
          if (asHost) this.conns.set(conn.peer, conn);
          else this.hostConn = conn;
          conn.on("data", (msg) => {
            if (!msg || !msg.t) return;
            if (msg.t === "input" && this.isHost) this._onInput(msg, conn);
            else if (msg.t === "snap" && !this.isHost) this._applySnap(msg);
            else if (msg.t === "start" && !this.isHost)
              startPvpMatch(false, msg.room, msg.arena, msg.yourNetId);
          });
          if (asHost && M && M.pvp) {
            const free = M.mages.find((m) => m.netId === "PENDING");
            if (free) {
              free.netId = conn.peer;
              free.name = "Player";
              conn.send({
                t: "start",
                yourNetId: conn.peer,
                room: this.roomCode,
                arena: G.sel.arena,
              });
              this._sendSnapshotTo(conn);
              toast(L("Игрок подключился!", "Player joined!"));
            }
          }
        },
        _onInput(msg, conn) {
          if (!M) return;
          const m = M.mages.find((x) => x.netId === conn.peer);
          if (!m || m.dead) return;
          Object.assign(m.ctl, {
            mx: msg.mx || 0,
            my: msg.my || 0,
            ax: msg.ax || 1,
            ay: msg.ay || 0,
            atk: !!msg.atk,
            dash: !!msg.dash,
            ult: !!msg.ult,
          });
        },
        _snapshot() {
          if (!M) return null;
          const pack = (e) => [
            Math.round(e.x),
            Math.round(e.y),
            Math.round(e.z || 0),
            Math.round(e.hp),
            e.face || 1,
          ];
          return {
            t: "snap",
            time: M.t,
            over: M.over ? M.over.kind : null,
            mages: M.mages.map((m) => ({
              id: m.netId,
              d: pack(m),
              dead: m.dead,
              runes: m.runes,
            })),
            monsters: M.monsters.map((e) => ({
              i: e.idx,
              d: pack(e),
              s: e.s,
              bo: e.boss ? 1 : 0,
            })),
          };
        },
        _sendSnapshotTo(conn) {
          const snap = this._snapshot();
          if (snap && conn.open) conn.send(snap);
        },
        pushSnapshots(dt) {
          if (!this.isHost || !M || !M.pvp) return;
          this._snapAcc += dt;
          if (this._snapAcc < 0.05) return;
          this._snapAcc = 0;
          const snap = this._snapshot();
          this.conns.forEach((c) => {
            if (c.open) c.send(snap);
          });
        },
        _applySnap(snap) {
          if (!M) return;
          snap.mages.forEach((sm) => {
            const m = M.mages.find((x) => x.netId === sm.id);
            if (!m) return;
            m._netT = { x: sm.d[0], y: sm.d[1], z: sm.d[2] };
            m.hp = sm.d[3];
            m.runes = sm.runes;
            if (sm.dead && !m.dead) {
              m.dead = true;
              m.deathT = 0;
            }
          });
          M.monsters = snap.monsters.map((e, idx) =>
            Object.assign(M.monsters[idx] || {}, {
              kind: "mon",
              idx: e.i,
              s: e.s,
              boss: !!e.bo,
              x: e.d[0],
              y: e.d[1],
              hp: e.d[3],
              dead: false,
            }),
          );
          if (snap.over && !M.over) M.over = { kind: snap.over, t: 0 };
        },
      };
      async function startPvpMatch(asHost, room, arena, myNetId) {
        const R = 650;
        buildArena(R, THEMES[arena || 0]);
        const cfg = {
          mode: "arena",
          count: 2,
          sub: "online",
          arena: arena || 0,
          pvp: true,
          isHostNet: asHost,
        };
        M = makeMatch(cfg, R);
        M.pvp = true;
        M.isHostNet = asHost;
        M.player.netId = myNetId;
        M.player.isP = true;
        const foe = M.mages[1];
        foe.isP = false;
        foe.netId = asHost ? "PENDING" : "arcane-pvp-" + room;
        show(null);
        setState("PLAYING");
        toast(asHost ? "КОМНАТА " + room : "PVP");
        if (asHost) Net.conns.forEach((c) => Net._setupConn(c, true));
      }

      // ---------- РЕНДЕР ----------
      const cv = $("c"),
        ctx = cv.getContext("2d");
      const IN = {
        keys: {},
        mouse: { x: 0, y: 0, has: false },
        joy: null,
        ptr: new Map(),
        touch: false,
        atk: 0,
        dash: 0,
        ult: 0,
        gp: null,
        gpPrev: {},
        px: 0,
        py: 0,
        tpx: 0,
        tpy: 0,
        down: {},
      };
      const UIL = {};
      function layout() {
        const W = G.W,
          H = G.H,
          u = G.u;
        UIL.atk = { x: W - 118 * u, y: H - 100 * u, r: 46 * u };
        UIL.ult = { x: W - 54 * u, y: H - 192 * u, r: 43 * u };
        UIL.dash = { x: W - 214 * u, y: H - 62 * u, r: 33 * u };
        UIL.pause = { x: W - 34 * u, y: 146 * u, r: 20 * u };
      }
      function hitBtn(x, y) {
        for (const k of ["atk", "ult", "dash", "pause"]) {
          const b = UIL[k];
          if (Math.hypot(x - b.x, y - b.y) <= b.r + 10 * G.u) return k;
        }
        return null;
      }
      function pressBtn(k) {
        if (k === "atk") IN.atk = 0.18;
        else if (k === "dash") IN.dash = 0.18;
        else if (k === "ult") IN.ult = 0.18;
        else if (k === "pause") pauseGame();
      }
      cv.addEventListener("pointerdown", (e) => {
        auInit();
        if (e.pointerType === "mouse") {
          IN.touch = false;
          IN.mouse.has = true;
        } else IN.touch = true;
        IN.mouse.x = e.clientX;
        IN.mouse.y = e.clientY;
        if (!isPlay()) return;
        e.preventDefault();
        try {
          cv.setPointerCapture(e.pointerId);
        } catch (_) {}
        const b = hitBtn(e.clientX, e.clientY);
        if (b) {
          IN.ptr.set(e.pointerId, { role: b });
          IN.down[b] = true;
          pressBtn(b);
          return;
        }
        if (e.pointerType === "mouse") {
          if (e.button === 2) IN.ult = 0.2;
          else IN.atk = 0.2;
          IN.ptr.set(e.pointerId, { role: "mouse" });
          return;
        }
        if (e.clientX < G.W * 0.6 && !IN.joy) {
          IN.joy = {
            id: e.pointerId,
            ox: e.clientX,
            oy: e.clientY,
            x: e.clientX,
            y: e.clientY,
          };
          IN.ptr.set(e.pointerId, { role: "joy" });
        }
      });
      cv.addEventListener("pointermove", (e) => {
        if (e.pointerType === "mouse") {
          IN.mouse.has = true;
          IN.mouse.x = e.clientX;
          IN.mouse.y = e.clientY;
        }
        IN.tpx = (e.clientX / G.W - 0.5) * 2;
        IN.tpy = (e.clientY / G.H - 0.5) * 2;
        if (IN.joy && IN.joy.id === e.pointerId) {
          e.preventDefault();
          IN.joy.x = e.clientX;
          IN.joy.y = e.clientY;
        }
      });
      function endPtr(e) {
        const p = IN.ptr.get(e.pointerId);
        if (!p) return;
        if (p.role === "joy") IN.joy = null;
        else IN.down[p.role] = false;
        IN.ptr.delete(e.pointerId);
      }
      cv.addEventListener("pointerup", endPtr);
      cv.addEventListener("pointercancel", endPtr);
      cv.addEventListener("contextmenu", (e) => e.preventDefault());
      window.addEventListener("keydown", (e) => {
        auInit();
        IN.keys[e.code] = true;
        if (isPlay()) {
          if (
            [
              "Space",
              "ArrowUp",
              "ArrowDown",
              "ArrowLeft",
              "ArrowRight",
            ].includes(e.code)
          )
            e.preventDefault();
          if (e.code === "Space" || e.code === "ShiftLeft") IN.dash = 0.18;
          else if (e.code === "KeyJ") IN.atk = 0.18;
          else if (e.code === "KeyE") IN.ult = 0.18;
        }
        if (e.code === "Escape") pauseGame();
      });
      window.addEventListener("keyup", (e) => {
        delete IN.keys[e.code];
      });
      window.addEventListener("resize", () => {
        G.W = window.innerWidth;
        G.H = window.innerHeight;
        cv.width = G.W;
        cv.height = G.H;
        layout();
      });

      function renderMatch(c) {
        const W = G.W,
          H = G.H,
          t = G.realT;
        c.fillStyle = ARENA.th.bg;
        c.fillRect(0, 0, W, H);
        c.save();
        c.translate(W / 2, H / 2);
        c.scale(G.zoom, G.zoom);
        c.translate(-CAM.x, -CAM.y);
        if (ARENA.lava) c.drawImage(ARENA.lava, -ARENA.cx, -ARENA.cy);
        if (ARENA.stone) c.drawImage(ARENA.stone, -ARENA.cx, -ARENA.cy);
        DR.length = 0;
        M.obst.forEach((o) => DR.push(o));
        M.monsters.forEach((e) => DR.push(e));
        M.mages.forEach((m) => DR.push(m));
        DR.sort((a, b) => a.y - b.y);
        for (const e of DR) {
          if (e.kind === "mage")
            drawMage(c, e.x, e.y * K, {
              col: e.col,
              skin: e.skin,
              f: e.face,
              s: 1,
              t,
              eye: e.eye,
              z: e.z,
            });
          else if (e.kind === "mon")
            drawMon(c, e.x, e.y * K, e.idx, { t, s: e.s, z: 0 });
          else if (e.kind === "pillar") drawPillar(c, e);
          else if (e.kind === "crystal") drawCrystal(c, e, t);
          else if (e.kind === "pickup")
            drawIcon(c, "p_" + e.def.id, e.x, e.y * K - 20, 30);
        }
        drawParticles(c, null);
        c.restore();
        drawHUD(c);
      }
      function drawHUD(c) {
        const W = G.W,
          H = G.H,
          p = M.player;
        otext(c, Math.ceil(p.hp) + "/" + p.maxHp, W / 2, 30, 20, "#fff", 3);
        otext(c, fmtT(M.t), W / 2, 60, 16, "#FFE9A0", 2);
        drawBtn(c, UIL.atk, "ui_atk", { cd: p.atkCd > 0 ? 1 : 0 });
        drawBtn(c, UIL.ult, "ult0", { prog: p.ult / 100 });
      }
      function drawBtn(c, b, icon, o) {
        c.save();
        c.translate(b.x, b.y);
        c.fillStyle = "rgba(0,0,0,.5)";
        c.beginPath();
        c.arc(0, 0, b.r, 0, TAU);
        c.fill();
        drawIcon(c, icon, 0, 0, b.r * 1.4);
        if (o.cd > 0) {
          c.fillStyle = "rgba(0,0,0,.6)";
          c.beginPath();
          c.arc(0, 0, b.r, 0, TAU);
          c.fill();
        }
        c.restore();
      }
      function renderMenu(c, dt) {
        c.fillStyle = "#0d0516";
        c.fillRect(0, 0, G.W, G.H);
        otext(c, "ARCANE ARENA", G.W / 2, G.H / 2, 60, "#FFD23A", 6, "Georgia");
      }

      // ---------- UI / BOOT ----------
      function setState(s) {
        G.state = s;
        $("skip").classList.toggle("on", s === "FTUE");
      }
      function show(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.toggle("on", s.id === id));
      }
      function closePanelRaw() {
        $("s-panel").classList.remove("on");
      }
      function setLoad(p, m) {
        $("lb").style.width = p + "%";
        if (m !== undefined) $("lm").textContent = m;
      }
      let _tt = 0;
      function toast(m) {
        const t = $("toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(_tt);
        _tt = setTimeout(() => t.classList.remove("on"), 2400);
      }
      function useEnergy() {
        return true;
      }
      function renderEnergy() {}
      function openPanel(n) {
        $("s-panel").classList.add("on");
        $("ptitle").textContent = n;
        $("pbody").innerHTML =
          "Панель: " +
          n +
          '<button class="btn" data-act="close">Закрыть</button>';
      }
      function pauseGame() {
        if (isPlay() && M && !M.over) {
          setState("PAUSED");
          openPanel("pause");
        }
      }
      function finishFtue() {
        S.ftue = 1;
        save();
        goMenu();
      }
      function goMenu() {
        M = null;
        setState("MENU");
        show("s-menu");
      }
      function finishMatch(k) {
        save();
        goMenu();
      }
      const ACT = {
        play() {
          if (!S.ftue)
            startMatch({ mode: "ftue", count: 1, sub: "ai", arena: 0 });
          else startMatch({ mode: "arena", count: 3, sub: "ai", arena: 0 });
        },
        pvp() {
          openPanel("pvp");
        },
        async pvpHost() {
          try {
            const code = await Net.host();
            startPvpMatch(true, code, 0);
          } catch (e) {
            toast("Ошибка PvP");
          }
        },
        async pvpJoin() {
          const v = prompt("Код комнаты (4 символа):");
          if (!v) return;
          try {
            await Net.join(v);
          } catch (e) {
            toast("Не удалось подключиться");
          }
        },
        close() {
          closePanelRaw();
          if (G.state === "PAUSED") setState("PLAYING");
          else setState("MENU");
        },
        resume() {
          ACT.close();
        },
        quit() {
          goMenu();
        },
        skipFtue() {
          if (G.state === "FTUE") finishFtue();
        },
      };
      $("ui").addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (!el) return;
        auInit();
        if (ACT[el.dataset.act]) ACT[el.dataset.act]();
      });

      async function boot() {
        loadSave();
        G.W = window.innerWidth;
        G.H = window.innerHeight;
        cv.width = G.W;
        cv.height = G.H;
        G.zoom = 1;
        layout();
        genIcons();
        genOrbs();
        buildArena(650, THEMES[0]);
        $("menuBtns").innerHTML =
          '<button class="btn pri" data-act="play">▶ Играть</button><button class="btn" data-act="pvp">🌐 PvP</button>';
        setState("MENU");
        show("s-menu");
        requestAnimationFrame(loop);
      }
      let lastTs = 0;
      function loop(ts) {
        requestAnimationFrame(loop);
        const dtr = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
        lastTs = ts;
        G.realT += dtr;
        IN.atk = Math.max(0, IN.atk - dtr);
        IN.dash = Math.max(0, IN.dash - dtr);
        IN.ult = Math.max(0, IN.ult - dtr);
        if (isPlay() && M) {
          if (M.pvp && !M.isHostNet) updateMatchVisualOnly(dtr);
          else {
            updateMatch(dtr);
            if (M.pvp && M.isHostNet) Net.pushSnapshots(dtr);
          }
          updParticles(dtr);
          updFT(dtr);
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        if (M && (isPlay() || G.state === "PAUSED")) renderMatch(ctx);
        else renderMenu(ctx, dtr);
      }
      boot();
    </script>
  </body>
</html>
