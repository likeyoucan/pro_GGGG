      function updateMage(m, dt) {
        if (m.dead) {
          m.deathT += dt;
          if (m.deathT < 1.2 && Math.random() < 0.5)
            pt(
              m.x + rnd(-8, 8),
              m.y - 20,
              rnd(-10, 10),
              -rnd(30, 70),
              1.2,
              3,
              "#CFEFFF",
              0,
              true,
            );
          if (m.deathT > 1.2) {
            m.alpha = Math.max(0, 1 - (m.deathT - 1.2) / 1.2);
            if (m.alpha > 0 && Math.random() < 0.8)
              burst(
                m.x + rnd(-10, 10),
                m.y - rnd(0, 30),
                m.mantle,
                1,
                60,
                3,
                0.8,
              );
          }
          updateVisual(m, dt);
          updateEyes(m, dt);
          return;
        }
        m.atkCd -= dt;
        m.dashCd -= dt;
        m.castLock -= dt;
        m.inv -= dt;
        m.swing = Math.max(0, m.swing - dt * 5);
        m.streakT -= dt;
        if (m.streakT <= 0) m.streak = 0;
        updateStatus(m, dt);
        if (m.dead) return;
        m.mana = Math.min(100, m.mana + 10 * m.up.mregen * dt);
        m.ultCharge = Math.min(100, m.ultCharge + (100 / 20) * dt * m.up.ult);
        if (m.aura > 0) m.aura -= dt;
        if (G.role !== "client") {
          if (m.remote) {
            const n = m.netIn;
            if (n) {
              m.mx = n.mx;
              m.my = n.my;
            }
          } else if (m.isBot) aiUpdate(m, dt);
          else if (m === G.player) {
            m.mx = inp.mx;
            m.my = inp.my;
          }
        }
        let sp = 220 * m.up.spd;
        if (m.fx.haste > 0) sp *= 1.3;
        if (m.aura > 0) sp *= 1.2;
        if (m.elem === 2) sp *= 1.1;
        if (m.fx.slow > 0) sp *= m.fx.slowF;
        if (m.fx.tslow > 0) sp *= 0.5;
        if (m.castLock > 0) sp *= 0.25;
        if (m.fx.freeze > 0 || m.fx.stun > 0) sp = 0;
        let dx = m.mx,
          dy = m.my;
        const ml = Math.hypot(dx, dy);
        if (ml > 1) {
          dx /= ml;
          dy /= ml;
        }
        if (m.dashT > 0) {
          m.dashT -= dt;
          m.vx = m.dashX * 1000;
          m.vy = m.dashY * 1000;
          if (Math.random() < 0.8) {
            const dashCol = m.skin.accent || m.mantle;
            pt(
              m.x,
              m.y - 14,
              rnd(-20, 20),
              rnd(-20, 20),
              0.4,
              rnd(3, 6),
              Math.random() < 0.4 ? "#FFFFFF" : dashCol,
              0,
              true,
            );
          }
        } else {
          const k = 1 - Math.exp(-dt * 14);
          m.vx += (dx * sp - m.vx) * k;
          m.vy += (dy * sp - m.vy) * k;
          if (m.fx.freeze > 0 || m.fx.stun > 0) {
            m.vx = 0;
            m.vy = 0;
          }
        }
        m.x += m.vx * dt + m.kvx;
        m.y += m.vy * dt + m.kvy;
        m.kvx *= 0.88;
        m.kvy *= 0.88;
        if (Math.abs(m.mx) > 0.2 && m.dashT <= 0 && m.atkCd < 0.2)
          m.facing = m.mx > 0 ? 1 : -1;
        collideWorld(m);
        if (G.mode !== "survival" && dist(m.x, m.y, CX, CY) > G.safeR) {
          m.zoneT = (m.zoneT || 0) + dt;
          if (m.zoneT >= 0.5) {
            m.zoneT = 0;
            m.lastHit = null;
            dealDamage(null, m, 3 + G.phase * 2.5, {
              type: "dot",
              col: "#FF6030",
            });
          }
        }
        if (m.hp < m.maxHp * 0.25 && m === G.player) {
          m.lowHpBeat -= dt;
          if (m.lowHpBeat <= 0) {
            m.lowHpBeat = m.hp < m.maxHp * 0.15 ? 0.7 : 1.1;
            sfx("heartbeat");
          }
        }
        updateVisual(m, dt);
        updateEyes(m, dt);
      }

      function updateMonster(mo, dt) {
        mo.atkCd -= dt;
        updateStatus(mo, dt);
        if (mo.dead) return;
        mo.tT -= dt;
        if (mo.tT <= 0 || !mo.tg || mo.tg.dead) {
          mo.tT = 0.35;
          mo.tg = nearestFoe(mo, mo.x, mo.y, 1e9);
        }
        const accel = 1 + 0.05 * Math.floor(G.time / 30);
        let sp = mo.speed * accel;
        if (mo.fx.slow > 0) sp *= mo.fx.slowF;
        if (mo.fx.tslow > 0) sp *= 0.5;
        if (mo.fx.freeze > 0 || mo.fx.stun > 0) sp = 0;
        let dx = 0,
          dy = 0;
        if (mo.tg) {
          const ax = mo.tg.x - mo.x,
            ay = mo.tg.y - mo.y,
            d = Math.hypot(ax, ay) || 1;
          dx = ax / d;
          dy = ay / d;
          if (mo.boss && d < 220) {
            dx *= 0.1;
            dy *= 0.1;
          }
        }
        GRID.query(mo.x, mo.y, mo.r * 2.2, (o) => {
          if (o === mo || !o.isMonster || o.dead) return;
          const sx = mo.x - o.x,
            sy = mo.y - o.y,
            d = Math.hypot(sx, sy) || 1,
            md = mo.r + o.r;
          if (d < md) {
            dx += (sx / d) * 0.8;
            dy += (sy / d) * 0.8;
          }
        });
        const l = Math.hypot(dx, dy) || 1;
        mo.vx = (dx / l) * sp;
        mo.vy = (dy / l) * sp;
        mo.x += mo.vx * dt + mo.kvx;
        mo.y += mo.vy * dt + mo.kvy;
        mo.kvx *= 0.88;
        mo.kvy *= 0.88;
        collideWorld(mo);
        if (
          mo.tg &&
          !mo.tg.dead &&
          mo.atkCd <= 0 &&
          dist(mo.x, mo.y, mo.tg.x, mo.tg.y) < mo.r + 16
        ) {
          mo.atkCd = 0.8;
          const t = mo.tg;
          dealDamage(mo, t, mo.dmg, { type: "contact" });
          if (!t.dead) {
            const a = Math.atan2(t.y - mo.y, t.x - mo.x);
            t.kvx += Math.cos(a) * 8;
            t.kvy += Math.sin(a) * 8;
          }
        }
        if (mo.boss && mo.tg) {
          mo.shootCd -= dt;
          if (mo.shootCd <= 0) {
            mo.shootCd = 3;
            const n = 14,
              off = rnd(0, TAU);
            for (let i = 0; i < n; i++)
              spawnProj(
                mo,
                mo.x,
                mo.y - mo.r,
                off + (i / n) * TAU,
                mo.bossElem,
                10 + G.wave * 0.3,
                { speed: 260, life: 2.2, r: 8 },
              );
            sfx("shoot", mo.bossElem);
          }
        }
      }

      function matchLogic(dt) {
        const g = G;
        if (g.mode !== "survival") {
          const PH = [1250, 1000, 780, 580, 400, 250];
          g.phaseT -= dt;
          if (!g.shrinking && g.phaseT <= 0 && g.phase < 5) {
            g.shrinking = true;
            g.from = g.safeR;
            g.shrinkLeft = 15;
            g.events.push({ k: "shrink" });
            announce(
              lang === "ru" ? "ЗОНА СУЖАЕТСЯ!" : "ZONE SHRINKING!",
              "#ff5030",
            );
          }
          if (g.shrinking) {
            g.shrinkLeft -= dt;
            g.safeR = lerp(
              g.from,
              PH[g.phase + 1],
              1 - clamp(g.shrinkLeft / 15, 0, 1),
            );
            if (g.shrinkLeft <= 0) {
              g.shrinking = false;
              g.phase++;
              g.phaseT = 20;
              g.safeR = PH[g.phase];
            }
          }
        } else {
          g.spawnT -= dt;
          g.waveT += dt;
          let aliveMonsters = 0;
          for (let i = 0; i < g.monsters.length; i++)
            if (!g.monsters[i].dead) aliveMonsters++;
          const batchSize = Math.min(3, 1 + Math.floor(g.wave / 8)),
            MAX_ALIVE = 100;
          if (g.waveLeft > 0 && g.spawnT <= 0 && aliveMonsters < MAX_ALIVE) {
            for (
              let k = 0;
              k < batchSize && g.waveLeft > 0 && aliveMonsters < MAX_ALIVE;
              k++
            ) {
              spawnMonster();
              g.waveLeft--;
              aliveMonsters++;
            }
            g.spawnT = Math.max(0.15, 1.2 - g.wave * 0.035);
          }
          if (aliveMonsters === 0 && g.waveLeft > 0 && g.spawnT > 0.3) {
            for (
              let k = 0;
              k < 4 && g.waveLeft > 0 && aliveMonsters < MAX_ALIVE;
              k++
            ) {
              spawnMonster();
              g.waveLeft--;
              aliveMonsters++;
            }
            g.spawnT = 0.6;
          }
          if ((g.waveLeft <= 0 && aliveMonsters <= 2) || g.waveT > 90) {
            g.wave++;
            g.waveT = 0;
            g.waveLeft = 6 + Math.round(g.wave * 3.5);
            g.spawnT = 1.2;
            announce((lang === "ru" ? "ВОЛНА " : "WAVE ") + g.wave, "#ffd23a");
            if (BOSSES[g.wave]) {
              const a = rnd(0, TAU),
                bx = CX + Math.cos(a) * 700,
                by = CY + Math.sin(a) * 700;
              g.monsters.push(makeBoss(g.wave, bx, by));
              g.spawnFx.push({
                x: bx,
                y: by,
                t: 1.5,
                m: 1.5,
                c: "#FF3030",
                w: 40,
              });
              g.waveLeft += 6;
              announce("BOSS!", "#ff3030");
              shake(8);
            }
            if (g.wave > SAVE.stats.bestWave) SAVE.stats.bestWave = g.wave;
          }
        }
        g.pkT -= dt;
        if (g.pkT <= 0 && g.pickups.length < 9) {
          g.pkT = rnd(8, 15);
          spawnRandomPickup();
        } else if (g.pkT <= 0) g.pkT = 3;
        if (g.epicT > 0) g.epicT -= dt;
      }

      function updateTimersAndFx(dt) {
        for (let i = G.spawnFx.length - 1; i >= 0; i--) {
          G.spawnFx[i].t -= dt;
          if (G.spawnFx[i].t <= 0) G.spawnFx.splice(i, 1);
        }
        for (let i = G.celebrate.length - 1; i >= 0; i--) {
          const c = G.celebrate[i];
          c.life -= dt;
          if (c.life <= 0) {
            G.celebrate.splice(i, 1);
            continue;
          }
          c.vy += 400 * dt;
          c.x += c.vx * dt;
          c.y += c.vy * dt;
          c.rot += c.rotSpd * dt;
        }
        for (let i = G.timers.length - 1; i >= 0; i--) {
          const t = G.timers[i];
          t.t -= dt;
          if (t.t <= 0) {
            G.timers.splice(i, 1);
            try {
              t.fn();
            } catch (e) {}
          }
        }
        for (let i = G.emits.length - 1; i >= 0; i--) {
          const e = G.emits[i];
          e.t -= dt;
          e.acc += dt;
          while (e.acc >= e.every) {
            e.acc -= e.every;
            if (!e.o.dead)
              try {
                e.fn();
              } catch (er) {}
          }
          if (e.t <= 0 || e.o.dead) G.emits.splice(i, 1);
        }
        for (const arr of [G.rings, G.bolts, G.arcs])
          for (let i = arr.length - 1; i >= 0; i--) {
            arr[i].l -= dt;
            if (arr[i].l <= 0) arr.splice(i, 1);
          }
        for (const arr of [G.tele, G.fall, G.gfx])
          for (let i = arr.length - 1; i >= 0; i--) {
            arr[i].t -= dt;
            if (arr[i].t <= 0) arr.splice(i, 1);
          }
        for (let i = G.debris.length - 1; i >= 0; i--) {
          const d = G.debris[i];
          d.t += dt;
          d.vy += d.g * dt;
          d.y += d.vy * dt;
          d.ang += d.w * dt;
          if (d.y >= d.floor) {
            d.y = d.floor;
            if (!d.clat) {
              d.clat = true;
              sfx("impact");
              d.vy = -60;
              d.w *= 0.3;
            } else {
              d.vy = 0;
              d.w = 0;
              d.g = 0;
            }
          }
          if (d.t > 6) G.debris.splice(i, 1);
        }
        for (const h of G.headIcons) h.t += dt;
        G.headIcons = G.headIcons.filter((h) => h.t < 1.2);
        if (G.notice) {
          G.notice.t += dt;
          if (G.notice.t > 2) G.notice = null;
        }
        for (const a of G.ann) a.t += dt;
        G.ann = G.ann.filter((a) => a.t < 1.8);
      }

      function updateGame(dt) {
        const g = G;
        g.time += dt;
        let n = 0;
        for (let i = 0; i < g.mages.length; i++) {
          const m = g.mages[i];
          if (!m.dead) g.all[n++] = m;
        }
        for (let i = 0; i < g.monsters.length; i++) {
          const mo = g.monsters[i];
          if (!mo.dead) g.all[n++] = mo;
        }
        g.all.length = n;
        GRID.clear();
        for (const o of g.all) GRID.add(o);
        if (g.role !== "client") {
          matchLogic(dt);
          for (const m of g.mages) updateMage(m, dt);
          for (const mo of g.monsters) updateMonster(mo, dt);
          let w = 0;
          for (let i = 0; i < g.monsters.length; i++)
            if (!g.monsters[i].dead) g.monsters[w++] = g.monsters[i];
          g.monsters.length = w;
          updateProjs(dt);
          updateZones(dt);
          updatePickups(dt);
          updateTimersAndFx(dt);
          checkEnd(dt);
          if (
            g.pendingLevel > 0 &&
            g.mode === "survival" &&
            !g.player.dead &&
            !g.online
          )
            openLevelUp();
        }
      }

      function spawnCelebration(x, y) {
        const items = ["🌹", "⭐", "🎉", "💎", "🍀", "✨"];
        for (let i = 0; i < 18; i++) {
          const a = rnd(-Math.PI, 0) + rnd(-0.4, 0.4),
            sp = rnd(200, 500);
          G.celebrate.push({
            x,
            y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - rnd(100, 300),
            rot: rnd(0, TAU),
            rotSpd: rnd(-8, 8),
            emoji: pick(items),
            life: 2.5,
            maxLife: 2.5,
            size: rnd(20, 34),
          });
        }
      }

      function checkEnd(dt) {
        if (G.over) {
          G.overT += dt;
          if (G.overT > (G.winner ? 3 : 1.5) && !G.resultShown)
            endMatch(G.winner === G.player);
          return;
        }
        if (G.player && G.player.dead && !G.online && !G.resultShown) {
          G.deadT = (G.deadT || 0) + dt;
          if (G.deadT > 2.5) {
            if (G.mode === "survival" && !G.reviveUsed && !G.reviveChecked) {
              G.reviveChecked = true;
              state = "REVIVE";
              showScreen("sc-revive");
            } else endMatch(false);
          }
          return;
        }
        const alive = G.mages.filter((m) => !m.dead);
        if (G.mode === "survival") {
          if (!alive.length) {
            G.over = true;
            G.winner = null;
            G.overT = 0;
          }
        } else if (alive.length <= 1) {
          G.over = true;
          G.overT = 0;
          G.winner = alive[0] || null;
          if (G.winner) {
            G.winner.victory = true;
            if (!G.online) FX.slow = { t: 0.5, s: 0.3 };
            burst(
              G.winner.x,
              G.winner.y - 20,
              ["#FFD700", "#FFF"],
              200,
              500,
              4,
              1.4,
              true,
            );
            spawnCelebration(G.winner.x, G.winner.y - 20);
            G.rings.push({
              x: G.winner.x,
              y: G.winner.y,
              r0: 10,
              r1: 500,
              l: 0.8,
              m: 0.8,
              c: "#FFD700",
              w: 8,
            });
            G.pillar = { x: G.winner.x, y: G.winner.y, t: 3 };
            if (G.winner === G.player)
              announce(
                G.winner.hp < G.winner.maxHp * 0.25
                  ? "CLUTCH WIN!"
                  : "VICTORY!",
                "#ffd23a",
              );
            sfx("win");
          }
        }
      }

      /* CANVAS & SETUP */
      const canvas = $("gameCanvas"),
        ctx = canvas.getContext("2d", { alpha: false });
      let W = 0,
        H = 0,
        DPR = 1,
        UIS = 1,
        state = "BOOT";
      const UA = navigator.userAgent || "";
      const IS_TV =
        /SMART-TV|SmartTV|Tizen|WebOS|Android TV|AppleTV|GoogleTV|HbbTV|BRAVIA/i.test(
          UA,
        );
      const IS_MOBILE =
        /Android|iPhone|iPad|iPod|Mobile/i.test(UA) ||
        (window.matchMedia && matchMedia("(pointer:coarse)").matches);
      const IS_TABLET =
        /iPad|Tablet/i.test(UA) ||
        (IS_MOBILE && Math.min(window.innerWidth, window.innerHeight) > 700);
      let touchMode = IS_MOBILE;

      function applyQuality() {
        const q =
          SAVE.quality === "auto"
            ? IS_MOBILE && (navigator.hardwareConcurrency || 4) <= 4
              ? "low"
              : IS_MOBILE
                ? "mid"
                : "high"
            : SAVE.quality;
        if (q === "high") {
          Q.pmul = 1;
          Q.arenaScale = 0.8;
          Q.glow = true;
          Q.dprCap = 2;
        } else if (q === "mid") {
          Q.pmul = 0.8;
          Q.arenaScale = 0.6;
          Q.glow = true;
          Q.dprCap = 1.5;
        } else {
          Q.pmul = 0.55;
          Q.arenaScale = 0.5;
          Q.glow = false;
          Q.dprCap = 1.25;
        }
        Q.lvl = 0;
        Q.base = Q.pmul;
        resize();
      }
      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, Q.dprCap);
        W = window.innerWidth;
        H = window.innerHeight;
        const isPhone = IS_MOBILE && Math.min(W, H) < 700;
        Q.mobMul = isPhone ? 0.82 : IS_TV ? 1.1 : 1;
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        UIS = isPhone
          ? clamp(Math.min(W, H) / 850, 0.55, 0.85)
          : clamp(Math.min(W, H) / 700, 0.75, 1.25);
      }
      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", () =>
        setTimeout(resize, 150),
      );
      const viewScale = () => {
        let base;
        if (IS_MOBILE && Math.min(W, H) < 700) base = clamp(H / 900, 0.45, 1.1);
        else if (IS_TABLET) base = clamp(H / 650, 0.6, 1.4);
        else base = clamp(H / 750, 0.55, 1.6);
        return base * cam.z;
      };
      function w2s(x, y) {
        const s = viewScale();
        return { x: (x - cam.x) * s + W / 2, y: (y - cam.y) * s + H / 2 };
      }

      /* INPUT */
      canvas.setAttribute("tabindex", "0");
      canvas.style.outline = "none";
      let keys = {};
      const inp = { mx: 0, my: 0 },
        mouse = { x: 0, y: 0, has: false },
        joy = { on: false, pid: -1, sx: 0, sy: 0, cx: 0, cy: 0 },
        pad = { rx: 0, ry: 0, lx: 0, ly: 0, prev: {}, on: false };
      const mkBtn = () => ({
        st: 0,
        t0: 0,
        src: "",
        pid: -1,
        sx: 0,
        sy: 0,
        cx: 0,
        cy: 0,
        shake: 0,
      });
      const B = { dash: mkBtn(), attack: mkBtn(), ult: mkBtn() };
      let aiming = false;
      const GAME_KEYS = [
        "KeyW",
        "KeyA",
        "KeyS",
        "KeyD",
        "KeyQ",
        "KeyE",
        "Space",
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "KeyF",
        "Escape",
      ];
      const isTyping = () => {
        const a = document.activeElement;
        return (
          a &&
          (a.tagName === "INPUT" ||
            a.tagName === "SELECT" ||
            a.tagName === "TEXTAREA")
        );
      };
      function btnLayout() {
        const u = UIS;
        return {
          attack: { x: W - 120 * u, y: H - 110 * u, r: 45 * u },
          ult: { x: W - 62 * u, y: H - 218 * u, r: 42 * u },
          dash: { x: W - 222 * u, y: H - 62 * u, r: 33 * u },
          pause: { x: W - 24 * u, y: 22 * u, r: 15 * u },
        };
      }
      function resetAllInputs() {
        for (const k in keys) delete keys[k];
        joy.on = false;
        joy.pid = -1;
        inp.mx = 0;
        inp.my = 0;
        for (const n in B) {
          B[n].st = 0;
          B[n].pid = -1;
        }
        if (aiming) {
          aiming = false;
          stopHum();
        }
      }
      function handleKeyDown(e) {
        if (isTyping() && e.code !== "Escape") return;
        if (GAME_KEYS.includes(e.code)) e.preventDefault();
        if (e.code === "KeyF" && !e.repeat) {
          toggleFullscreen();
          return;
        }
        if (!e.repeat) {
          if (e.code === "Escape") {
            if (state === "PLAYING") pauseGame();
            else if (state === "PAUSED") resumeGame();
            return;
          }
          if (state === "PLAYING" && G && G.player && !G.player.dead) {
            if (e.code === "Space") btnDown("dash", "key", 0, 0, -2);
            else if (e.code === "KeyQ" || e.code === "KeyE")
              btnDown("ult", "key", 0, 0, -3);
          }
        }
        keys[e.code] = true;
      }
      function handleKeyUp(e) {
        if (GAME_KEYS.includes(e.code) && !isTyping()) e.preventDefault();
        delete keys[e.code];
        if (e.code === "Space" && B.dash.src === "key") btnUp("dash", false);
        if ((e.code === "KeyQ" || e.code === "KeyE") && B.ult.src === "key")
          btnUp("ult", false);
      }
      window.addEventListener("keydown", handleKeyDown);
      window.addEventListener("keyup", handleKeyUp);
      window.addEventListener("blur", () => resetAllInputs());
      canvas.addEventListener("pointerdown", () => canvas.focus());
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      function enterFullscreen() {
        const el = document.documentElement,
          rfs =
            el.requestFullscreen ||
            el.webkitRequestFullscreen ||
            el.mozRequestFullScreen ||
            el.msRequestFullscreen;
        if (rfs) {
          const p = rfs.call(el);
          if (p && p.then)
            p.then(() => setTimeout(() => canvas.focus(), 100)).catch(() => {});
        }
      }
      function toggleFullscreen() {
        const fe =

          c.moveTo(0, 0.52);
          c.bezierCurveTo(-0.5, 0.15, -0.3, -0.12, 0, 0.08);
          c.bezierCurveTo(0.3, -0.12, 0.5, 0.15, 0, 0.52);
          c.fill();
          c.lineWidth = 0.04;
          c.stroke();
        } else if (sym === "star") {
          c.beginPath();
          for (let i = 0; i < 10; i++) {
            const a = -Math.PI / 2 + (i * Math.PI) / 5,
              r = i % 2 ? 0.1 : 0.27;
            c.lineTo(Math.cos(a) * r, 0.24 + Math.sin(a) * r);
          }
          c.closePath();
          c.fill();
        } else {
          c.beginPath();
          [
            [0.1, -0.1],
            [-0.15, 0.26],
            [0, 0.26],
            [-0.1, 0.56],
            [0.2, 0.16],
            [0.05, 0.16],
          ].forEach((v, i) =>
            i ? c.lineTo(v[0], v[1]) : c.moveTo(v[0], v[1]),
          );
          c.closePath();
          c.fill();
        }
      }
      function pickupIcon(c, k) {
        c.lineJoin = "round";
        c.lineCap = "round";
        const ol = (w) => {
          c.lineWidth = w;
          c.strokeStyle = "#000";
          c.stroke();
        };
        if (k === "mult") {
          c.beginPath();
          if (c.roundRect) c.roundRect(-0.62, -0.82, 1.24, 1.64, 0.26);
          else c.rect(-0.62, -0.82, 1.24, 1.64);
          const g = c.createLinearGradient(-0.6, -0.8, 0.6, 0.8);
          g.addColorStop(0, "#7A2090");
          g.addColorStop(1, "#3a0a4a");
          c.fillStyle = g;
          c.fill();
          ol(0.13);
          c.strokeStyle = "#FF60FF";
          c.lineWidth = 0.08;
          c.beginPath();
          if (c.roundRect) c.roundRect(-0.5, -0.7, 1, 1.4, 0.2);
          else c.rect(-0.5, -0.7, 1, 1.4);
          c.stroke();
          for (let i = -1; i <= 1; i++) {
            const yy = -0.2 + i * 0.32;
            c.strokeStyle = "rgba(255,150,255,.85)";
            c.lineWidth = 0.08;
            c.lineCap = "round";
            c.beginPath();
            c.moveTo(-0.05, yy);
            c.lineTo(0.3, yy);
            c.stroke();
            c.beginPath();
            c.arc(-0.15, yy, 0.16, 0, TAU);
            c.fillStyle = "#FFD0FF";
            c.fill();
            c.strokeStyle = "#000";
            c.lineWidth = 0.06;
            c.stroke();
          }
        } else if (k === "hp") bottle(c, "#FF3050", "heart");
        else if (k === "mana") bottle(c, "#3080FF", "star");
        else if (k === "haste") bottle(c, "#30FF50", "bolt");
        else if (k === "shield") {
          c.beginPath();
          c.moveTo(-0.72, -0.72);
          c.lineTo(0.72, -0.72);
          c.lineTo(0.72, 0.1);
          c.quadraticCurveTo(0.72, 0.7, 0, 0.98);
          c.quadraticCurveTo(-0.72, 0.7, -0.72, 0.1);
          c.closePath();
          const g = c.createLinearGradient(-0.7, -0.7, 0.7, 0.9);
          g.addColorStop(0, "#A0D0FF");
          g.addColorStop(1, "#2050C0");
          c.fillStyle = g;
          c.fill();
          ol(0.13);
          c.fillStyle = "#fff";
          c.beginPath();
          for (let i = 0; i < 10; i++) {
            const a = -Math.PI / 2 + (i * Math.PI) / 5,
              r = i % 2 ? 0.1 : 0.3;
            c.lineTo(Math.cos(a) * r, 0.05 + Math.sin(a) * r);
          }
          c.closePath();
          c.fill();
        } else if (k === "gem") {
          const P = [
            [-0.4, -0.62],
            [0.4, -0.62],
            [0.82, -0.1],
            [0, 0.9],
            [-0.82, -0.1],
          ];
          c.beginPath();
          P.forEach((v, i) =>
            i ? c.lineTo(v[0], v[1]) : c.moveTo(v[0], v[1]),
          );
          c.closePath();
          const g = c.createLinearGradient(-0.8, -0.6, 0.8, 0.9);
          g.addColorStop(0, "#FFF6A0");
          g.addColorStop(0.5, "#FFDD30");
          g.addColorStop(1, "#C88A00");
          c.fillStyle = g;
          c.fill();
          ol(0.12);
        } else if (k === "time") {
          c.beginPath();
          c.moveTo(-0.5, -0.72);
          c.lineTo(0.5, -0.72);
          c.lineTo(0.08, 0);
          c.lineTo(0.5, 0.72);
          c.lineTo(-0.5, 0.72);
          c.lineTo(-0.08, 0);
          c.closePath();
          c.fillStyle = "rgba(160,224,255,.6)";
          c.fill();
          ol(0.1);
          c.fillStyle = "#FFD060";
          c.beginPath();
          c.moveTo(-0.4, 0.7);
          c.lineTo(0.4, 0.7);
          c.lineTo(0.18, 0.3);
          c.lineTo(-0.18, 0.3);
          c.closePath();
          c.fill();
        } else {
          const e = +k[1],
            col = ELEMS[e].color === "#6A0DAD" ? "#B040FF" : ELEMS[e].color;
          c.beginPath();
          if (c.roundRect) c.roundRect(-0.62, -0.82, 1.24, 1.64, 0.26);
          else c.rect(-0.62, -0.82, 1.24, 1.64);
          const g = c.createLinearGradient(-0.6, -0.8, 0.6, 0.8);
          g.addColorStop(0, "#6a6a78");
          g.addColorStop(1, "#2a2a34");
          c.fillStyle = g;
          c.fill();
          ol(0.13);
          c.strokeStyle = col;
          c.lineWidth = 0.08;
          c.beginPath();
          if (c.roundRect) c.roundRect(-0.5, -0.7, 1, 1.4, 0.2);
          else c.rect(-0.5, -0.7, 1, 1.4);
          c.stroke();
          glyph(c, e, 0, 0, 0.45);
        }
      }

      async function buildIcons(prog) {
        const names = [];
        PK_KEYS.forEach((k) => names.push("p:" + k));
        for (let e = 0; e < 5; e++) names.push("e:" + e);
        for (let a = 0; a < 5; a++)
          for (let b = a; b < 5; b++) names.push("c:" + a + "-" + b);
        for (let e = 0; e < 5; e++) names.push("m:" + e);
        names.push("dash");
        names.push("ico_pause");
        let i = 0;
        for (const nm of names) {
          const S = 64,
            cv = mkc(S),
            c = cv.getContext("2d");
          c.translate(S / 2, S / 2);
          const [ty, id] = nm.split(":");
          if (ty === "p") {
            c.scale(26, 26);
            pickupIcon(c, id);
            IC[id] = cv;
          } else if (ty === "e") {
            glyph(c, +id, 0, 0, 27);
            IC["e" + id] = cv;
          } else if (ty === "c") {
            const [a, b] = id.split("-").map(Number);
            const ca = elemColor(a),
              cb = elemColor(b);
            const g = c.createRadialGradient(0, 0, 4, 0, 0, 31);
            g.addColorStop(0, shade(ca, -0.2));
            g.addColorStop(1, shade(cb, -0.55));
            c.beginPath();
            c.arc(0, 0, 30, 0, TAU);
            c.fillStyle = g;
            c.fill();
            c.lineWidth = 3;
            c.strokeStyle = "#000";
            c.stroke();
            c.beginPath();
            c.arc(0, 0, 27, 0, TAU);
            c.lineWidth = 2;
            c.strokeStyle = "#DAA520";
            c.stroke();
            comboGlyph(c, a, b, a === b ? 22 : 25);
            IC["c" + id] = cv;
          } else if (ty === "m") {
            const e = +id,
              col = elemColor(e);
            c.fillStyle = "rgba(255,215,60,.9)";
            c.beginPath();
            for (let k = 0; k < 24; k++) {
              const an = (k / 24) * TAU,
                r = k % 2 ? 24 : 31;
              c.lineTo(Math.cos(an) * r, Math.sin(an) * r);
            }
            c.closePath();
            c.fill();
            c.lineWidth = 2;
            c.strokeStyle = "#000";
            c.stroke();
            const g = c.createRadialGradient(0, 0, 3, 0, 0, 25);
            g.addColorStop(0, shade(col, 0.2));
            g.addColorStop(1, shade(col, -0.6));
            c.beginPath();
            c.arc(0, 0, 24, 0, TAU);
            c.fillStyle = g;
            c.fill();
            c.lineWidth = 3;
            c.strokeStyle = "#FFD84A";
            c.stroke();
            comboGlyph(c, e, e, 19);
            IC["m" + e] = cv;
          } else if (nm === "dash") {
            c.lineCap = "round";
            c.lineJoin = "round";
            c.strokeStyle = "#000";
            c.lineWidth = 9;
            c.beginPath();
            c.moveTo(-20, 0);
            c.lineTo(18, 0);
            c.moveTo(4, -14);
            c.lineTo(20, 0);
            c.lineTo(4, 14);
            c.stroke();
            c.strokeStyle = "#00F0FF";
            c.lineWidth = 5;
            c.stroke();
            c.strokeStyle = "#fff";
            c.lineWidth = 1.5;
            c.stroke();
            IC.dash = cv;
          } else {
            c.fillStyle = "#fff";
            c.fillRect(-8, -12, 6, 24);
            c.fillRect(2, -12, 6, 24);
            IC.ico_pause = cv;
          }
          if (++i % 6 === 0) {
            if (prog) prog(i / names.length);
            await new Promise((r) => setTimeout(r, 0));
          }
        }
      }

      /* START/END */
      const BOT_NAMES = [
        "Ignis",
        "Frostia",
        "Voltar",
        "Zephyr",
        "Umbra",
        "Pyra",
        "Glacius",
        "Nox",
      ];
      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      const colorHex = (id) =>
        (MAGE_COLORS.find((c) => c.id === id) || MAGE_COLORS[0]).hex;
      function elemFromColor(hex) {
        if (!hex) return rndi(0, 4);
        const h = hex.toLowerCase().replace("#", "");
        if (
          h.includes("4a2a8b") ||
          h.includes("1a1a2e") ||
          h.includes("0a0020")
        )
          return 4;
        if (
          h.includes("8b2f3f") ||
          h.includes("d45a20") ||
          h.includes("c8962a")
        )
          return 0;
        if (
          h.includes("2f5a8b") ||
          h.includes("a0a0b0") ||
          h.includes("3a78b8")
        )
          return 1;
        if (h.includes("b8862f")) return 2;
        if (h.includes("2f8b5a")) return 3;
        if (
          h.includes("ff9ac8") ||
          h.includes("ffc0e0") ||
          h.includes("ffb6d9")
        )
          return 1;
        return rndi(0, 4);
      }

      function newGame(o) {
        PP.clear();

        G = {
          mode: o.mode,

          role: o.role || "solo",
          theme: o.theme,
          opts: o,
          time: 0,
          mages: [],
          monsters: [],
          all: [],
          player: null,
          rocks: genRocks(o.seed || 1),
          zones: [],
          timers: [],
          emits: [],
          rings: [],
          bolts: [],
          arcs: [],
          tele: [],
          fall: [],
          gfx: [],
          debris: [],
          pickups: [],

          pkId: 1,
          pkT: 3,

          safeR: R_ARENA,

          shrinking: false,
          over: false,
          overT: 0,
          winner: null,
          wave: 0,
          waveLeft: 0,
          waveT: 0,
          spawnT: 0,

          uiPause: false,

          pendingQuit: false,
        };
      }

      function startMatch(o) {
        if (!o.online) {
          energyTick();
          if (SAVE.energy < 1) {
            $("sc-noenergy").classList.add("show");
            sfx("error");
            return false;
          }
          SAVE.energy--;
          persist();
        }
        o.seed = o.seed || (Math.random() * 1e9) | 0;
        ensureArena(o.theme);
        newGame(o);
        const startAng = rnd(0, TAU);
        if (o.mode === "online") {
          const n = o.players.length;
          o.players.forEach((p, i) => {
            const m = new Mage({
              id: p.id,
              name: p.nick,
              mantle: p.color,
              skin: p.skin,
              staff: p.staff || "wood",
            });
            m.elem = elemFromColor(p.color);
            m.auraElem = m.elem;
            m.isPlayer = p.id === o.myId;
            m.remote = o.role === "host" && p.id !== o.myId;
            m.snap = [];
            m.x = CX + Math.cos(startAng + (i / n) * TAU) * 600;
            m.y = CY + Math.sin(startAng + (i / n) * TAU) * 600;
            m.facing = m.x < CX ? 1 : -1;
            m.resetVerlet();
            G.mages.push(m);
            if (m.isPlayer) G.player = m;
          });
        } else {
          const pcol = o.color || colorHex(SAVE.color);
          const others = shuffle(
            MAGE_COLORS.map((c) => c.hex).filter((h) => h !== pcol),
          );
          const names = shuffle(BOT_NAMES.slice());
          const skinId = o.skin || SAVE.skin;
          const skinDef = SKIN_BY_ID[skinId] || SKINS[0];
          const useColor = skinDef.special ? skinDef.mantle || pcol : pcol;
          const pm = new Mage({
            name: SAVE.nick || "Mage",
            mantle: useColor,
            skin: skinId,
            staff: o.staff || SAVE.staff,
            isPlayer: true,
          });
          pm.elem = skinDef.special
            ? elemFromColor(skinDef.mantle || "#4A2A8B")
            : elemFromColor(pcol);
          if (skinDef.special) {
            if (skinId === "shark" || skinId === "cat") pm.elem = 1;
            else if (skinId === "archmage") pm.elem = 2;
            else if (skinId === "arcanvoid") pm.elem = 4;
          }
          pm.auraElem = pm.elem;
          G.player = pm;
          G.mages.push(pm);
          const diff = DIFF[SAVE.botDifficulty] || DIFF.normal;
          for (let i = 1; i < o.count; i++) {
            const b = new Mage({
              name: names[i % names.length],
              mantle: others[i % others.length],
              isBot: true,
            });
            b.elem = elemFromColor(others[i % others.length]);
            b.auraElem = b.elem;
            if (o.mode === "survival") {
              b.ai.skill = 1.1;
              b.up.mregen = 2.0;
            } else {
              b.ai.skill = diff.skill;
              b.ai.aimErr = diff.aimErr;
              b.ai.fireDelayMul = diff.fireDelayMul;
              b.ai.aggression = diff.aggression;
              b.ai.ultChance = diff.ultChance;
              b.ai.retreatHp = diff.retreatHp;
              b.ai.dodgeChance = diff.dodgeChance;
              b.up.mregen = diff.manaRegen;
              b.maxHp = Math.round(b.maxHp * diff.hpMul);
              b.hp = b.maxHp;
              b.up.dmg = diff.dmgMul;
            }
            G.mages.push(b);
          }
          const n = G.mages.length;
          G.mages.forEach((m, i) => {
            if (o.mode === "survival") {
              m.x = CX + (i ? Math.cos(i * 2.1) * 70 : 0);
              m.y = CY + (i ? Math.sin(i * 2.1) * 70 : 0);
            } else {
              m.x = CX + Math.cos(startAng + (i / n) * TAU) * 620;
              m.y = CY + Math.sin(startAng + (i / n) * TAU) * 620;
            }
            m.facing = m.x < CX ? 1 : -1;
            m.resetVerlet();
          });
        }
        cam.x = G.player.x;
        cam.y = G.player.y;
        cam.z = 1;
        G.player.hp = G.player.maxHp;
        state = "PLAYING";
        showScreen(null);
        resetAllInputs();
        MUS.tgt = 0.5;
        gameplayStart();
        canvas.focus();
        announce(
          o.mode === "survival"
            ? lang === "ru"
              ? "ВЫЖИВАНИЕ!"
              : "SURVIVE!"
            : lang === "ru"
              ? "В БОЙ!"
              : "FIGHT!",
          "#ffd23a",
        );
        if (o.mode === "survival") {
          G.waveT = 0;
          G.waveLeft = 0;
        }
        return true;
      }

      function pauseGame() {
        if (!G || state !== "PLAYING") return;
        if (G.uiPause) {
          resumeGame();
          return;
        }
        resetAllInputs();
        if (!G.online) {
          state = "PAUSED";
          gameplayStop();
        }
        G.uiPause = true;
        FX.shake = 0;
        FX.shakeT = 0;
        cam.sx = 0;
        cam.sy = 0;
        showScreen("sc-pause");
      }
      function resumeGame() {
        if (!G) return;
        if (state === "PAUSED") {
          state = "PLAYING";
          gameplayStart();
        }
        G.uiPause = false;
        showScreen(null);
        canvas.focus();
        lastTime = performance.now();
      }
      function autoPause() {
        if (state === "PLAYING" && G && !G.online) pauseGame();
      }

        $("sc-confirm").classList.remove("show");
        if (G) G.pendingQuit = false;

        if (G && !G.resultShown) gameplayStop();
        G = null;
        state = "MENU";
        resetAllInputs();
        stopHum();
        PP.clear();
        PR.clear();
        PT.clear();
        MUS.tgt = 0;
        Aud.duck = 1;
        applyVolumes();
        showScreen("sc-menu");

        updateQuestsBadge();
