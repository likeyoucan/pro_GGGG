<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ARCANE ARENA</title>
    <script
      src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
      onerror="window.PEERJS_FAILED = true"
    ></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        color: #fff;
        overscroll-behavior: none;
      }
      #gameCanvas {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        background: #000;
      }
      input,
      select {
        -webkit-user-select: text;
        user-select: text;
        touch-action: auto;
      }
      .screen {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        padding: 10px;
        pointer-events: none;
        gap: 10px;
      }
      .screen.show {
        display: flex;
        animation: fi 0.3s;
      }
      .screen > * {
        pointer-events: auto;
      }
      @keyframes fi {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .panel {
        background: rgba(20, 10, 30, 0.75);
        border: 2px solid rgba(218, 165, 32, 0.75);
        border-radius: 16px;
        box-shadow:
          inset 0 0 22px rgba(218, 165, 32, 0.14),
          0 8px 30px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(8px);
        padding: 14px 16px;
      }

      /* Улучшенный заголовок */
      .title {
        font-family: Georgia, serif;
        font-weight: 900;
        font-size: clamp(38px, 9vw, 82px);
        line-height: 1;
        margin: 0;
        text-align: center;
        letter-spacing: 2px;
        background: linear-gradient(
          180deg,
          #fffbc0 0%,
          #ffd23a 40%,
          #ff7a18 75%,
          #ff3a00 100%
        );
        background-size: 100% 220%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-stroke: 2px #1a0500;
        filter: drop-shadow(0 4px 0 #0a0200)
          drop-shadow(0 0 22px rgba(255, 110, 0, 0.9));
        animation: fl 2.2s ease-in-out infinite alternate;
      }
      @keyframes fl {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 0 100%;
        }
      }

      .h2 {
        font-family: Georgia, serif;
        font-size: clamp(24px, 4.4vw, 38px);
        margin: 0;
        color: #ffd23a;
        text-shadow:
          0 2px 0 #000,
          0 0 16px rgba(255, 160, 0, 0.7);
        text-align: center;
        -webkit-text-stroke: 1px #1a0500;
      }

      /* Улучшенные кнопки */
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 52px;
        padding: 12px 26px;
        font-size: clamp(16px, 2.6vw, 21px);
        font-weight: 800;
        letter-spacing: 1.5px;
        color: #fff;
        background: linear-gradient(
          180deg,
          rgba(90, 50, 140, 0.8),
          rgba(35, 15, 60, 0.9)
        );
        border: 2.5px solid #daa520;
        border-radius: 14px;
        cursor: pointer;
        box-shadow:
          0 5px 0 #1a0a24,
          0 0 20px rgba(218, 165, 32, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.28);
        transition:
          transform 0.25s,
          filter 0.25s;
        text-shadow: 0 2px 0 #000;
        white-space: nowrap;
      }
      .btn:hover {
        transform: translateY(-2px) scale(1.02);
        filter: brightness(1.2);
      }
      .btn:active {
        transform: translateY(2px) scale(0.98);
        box-shadow: 0 2px 0 #1a0a24;
      }
      .btn.primary {
        min-height: 68px;
        font-size: clamp(20px, 3.4vw, 28px);
        letter-spacing: 2px;
        background: linear-gradient(180deg, #ff9a1e, #c2410c);
        border-color: #ffe27a;
        box-shadow:
          0 6px 0 #5a1c00,
          0 0 30px rgba(255, 140, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
      }
      .btn.small {
        min-height: 40px;
        padding: 8px 14px;
        font-size: 15px;
        letter-spacing: 0.8px;
      }
      .btn.off {
        opacity: 0.45;
        filter: grayscale(1);
        pointer-events: none;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(360px, 92vw);
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
      }
      .chip {
        min-width: 44px;
        padding: 8px 14px;
        border: 2px solid rgba(218, 165, 32, 0.5);
        border-radius: 10px;
        background: rgba(30, 15, 45, 0.7);
        cursor: pointer;
        font-weight: 800;
        text-align: center;
        transition: all 0.25s;
        font-size: 15px;
      }
      .chip.sel {
        border-color: #ffe27a;
        background: rgba(218, 165, 32, 0.35);
        box-shadow: 0 0 14px rgba(255, 200, 60, 0.6);
      }
      .sw {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 3px solid #000;
        box-shadow: 0 0 0 2px rgba(218, 165, 32, 0.5);
        cursor: pointer;
        transition: transform 0.25s;
      }
      .sw.sel {
        box-shadow:
          0 0 0 3px #ffe27a,
          0 0 16px #ffd23a;
        transform: scale(1.12);
      }

      #topbar {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        z-index: 11;
      }
      #topbar > * {
        pointer-events: auto;
      }
      .cur {
        display: flex;
        gap: 12px;
        align-items: center;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        padding: 8px 14px;
        font-size: 16px;
      }

      .scroll,
      .scroll * {
        touch-action: pan-y;
      }
      .scroll {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px;
        width: 158px;
        border-radius: 12px;
        background: rgba(40, 20, 60, 0.7);
        border: 2px solid rgba(218, 165, 32, 0.4);
        text-align: center;
        font-size: 13px;
      }
      .card canvas {
        width: 100px;
        height: 120px;
        object-fit: contain;
      }
      .card .rar {
        font-size: 11px;
        font-weight: 800;
      }
      .shopgrid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      #toast {
        position: fixed;
        left: 50%;
        top: 14%;
        transform: translateX(-50%);
        z-index: 50;
        background: rgba(10, 5, 20, 0.95);
        border: 2px solid #daa520;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 800;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
        max-width: 90vw;
        text-align: center;
        font-size: 15px;
      }
      #toast.show {
        opacity: 1;
      }
      .code {
        font-family: Georgia, serif;
        font-size: clamp(40px, 12vw, 72px);
        font-weight: 900;
        color: #ffd23a;
        letter-spacing: 6px;
        text-shadow:
          0 3px 0 #3a1200,
          0 0 22px rgba(255, 170, 0, 0.7);
        text-align: center;
      }
      .inp {
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #daa520;
        border-radius: 10px;
        color: #fff;
        font-size: 22px;
        font-weight: 800;
        padding: 10px 14px;
        text-align: center;
        letter-spacing: 3px;
        width: min(280px, 82vw);
        outline: none;
      }
      .inp.err {
        border-color: #ff3030;
        box-shadow: 0 0 12px rgba(255, 48, 48, 0.6);
      }
      .plist {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: min(320px, 88vw);
      }
      .pl {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
        font-weight: 700;
        font-size: 15px;
      }
      .pl i {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid #000;
        display: inline-block;
      }

      input[type="range"] {
        width: 170px;
        accent-color: #daa520;
      }
      .srow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        min-width: min(360px, 88vw);
        font-weight: 700;
        font-size: 16px;
      }
      .bar {
        width: min(340px, 84vw);
        height: 16px;
        border-radius: 8px;
        border: 2px solid #daa520;
        background: #120818;
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #ff4500, #ffd23a);
        transition: width 0.2s;
      }
      .lbrow {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 6px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-variant-numeric: tabular-nums;
        font-size: 15px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
      }

      @media (max-height: 520px) {
        .title {
          font-size: 34px;
        }
        .stack {
          gap: 5px;
        }
        .btn {
          min-height: 38px;
          padding: 5px 16px;
        }
        .btn.primary {
          min-height: 48px;
        }
        .panel {
          padding: 8px 12px;
        }
      }
      @media (max-width: 480px) {
        .btn {
          padding: 10px 18px;
          min-height: 48px;
        }
        .btn.primary {
          min-height: 60px;
        }
        .srow {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" tabindex="0"></canvas>
    <div id="toast"></div>

    <div
      class="screen show"
      id="sc-loading"
      style="
        background: radial-gradient(ellipse at center, #2a0a2e 0%, #000 75%);
        z-index: 30;
        pointer-events: auto;
      "
    >
      <h1 class="title">ARCANE ARENA</h1>
      <div class="bar"><div id="loadBar"></div></div>
      <div id="loadTxt" style="font-weight: 700; color: #ffd23a">...</div>
      <div style="opacity: 0.5; font-size: 12px" id="studioTxt"></div>
    </div>

    <div id="topbar" style="display: none">
      <div class="panel cur">
        <span>Золото: <b id="goldV">0</b></span>
        <span>Кристаллы: <b id="gemsV">0</b></span>
        <span
          >Энергия: <b id="enV">5</b>/5
          <small id="enT" style="opacity: 0.7"></small
        ></span>
      </div>
      <select
        id="langSelect"
        class="btn small"
        style="
          background: rgba(20, 10, 30, 0.8);
          border: 2px solid #daa520;
          padding: 5px 10px;
          font-size: 14px;
          outline: none;
        "
      >
        <option value="ru" style="color: #000">РУССКИЙ</option>
        <option value="en" style="color: #000">ENGLISH</option>
      </select>
    </div>

    <div
      class="screen"
      id="sc-menu"
      style="justify-content: space-between; padding-top: 60px"
    >
      <h1 class="title" style="margin-top: 6px">ARCANE ARENA</h1>
      <div class="stack" style="margin-bottom: 10px">
        <button class="btn primary" data-act="play">
          <span data-i18n="play"></span>
        </button>
        <button class="btn" data-act="survival">
          <span data-i18n="survival"></span>
        </button>
        <button class="btn" data-act="online" id="onlineBtn">
          <span data-i18n="online"></span>
        </button>
        <div class="grid2">
          <button class="btn small" data-act="shop">
            <span data-i18n="shop"></span>
          </button>
          <button class="btn small" data-act="codex">
            <span data-i18n="codex"></span>
          </button>
          <button class="btn small" data-act="quests">
            <span data-i18n="quests"></span>
          </button>
          <button class="btn small" data-act="settings">
            <span data-i18n="settings"></span>
          </button>
          <button class="btn small" data-act="lb">
            <span data-i18n="lb"></span>
          </button>
          <button class="btn small" data-act="tutorial">
            <span data-i18n="tutorial"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="screen" id="sc-setup">
      <h2 class="h2" id="setupTitle"></h2>
      <div
        class="panel"
        style="
          display: flex;
          flex-direction: column;
          gap: 12px;
          align-items: center;
          max-width: 96vw;
        "
      >
        <div
          style="font-weight: 800; font-size: 16px"
          data-i18n="skinChoice"
        ></div>
        <div
          class="row"
          id="skinGrid"
          style="padding-bottom: 8px; flex-wrap: wrap; max-width: 96vw"
        ></div>
        <div
          style="font-weight: 800; font-size: 16px"
          data-i18n="colorChoice"
        ></div>
        <div class="row" id="colorGrid" style="padding-bottom: 8px"></div>
        <div
          style="font-weight: 800; font-size: 16px"
          data-i18n="arenaChoice"
        ></div>
        <div class="row" id="arenaSel"></div>
        <div style="font-weight: 800; font-size: 16px" id="countLbl"></div>
        <div class="row" id="countSel"></div>
        <div
          style="font-weight: 800; font-size: 16px"
          data-i18n="botDiff"
        ></div>
        <div class="row" id="diffSel"></div>
      </div>
      <div class="row">
        <button class="btn" data-act="back">
          <span data-i18n="back"></span>
        </button>
        <button class="btn primary" data-act="startSetup">
          <span data-i18n="startBattle"></span>
        </button>
      </div>
    </div>

    <div
      class="screen"
      id="sc-shop"
      style="justify-content: flex-start; padding-top: 60px"
    >
      <h2 class="h2">МАГАЗИН</h2>
      <div class="tabs" id="shopTabs"></div>
      <div
        class="panel scroll shopgrid"
        id="shopGrid"
        style="max-height: 62vh; width: min(960px, 96vw)"
      ></div>
      <button class="btn" data-act="back">
        <span data-i18n="back"></span>
      </button>
    </div>

    <div
      class="screen"
      id="sc-codex"
      style="justify-content: flex-start; padding-top: 60px"
    >
      <h2 class="h2">КОДЕКС</h2>
      <div
        class="panel scroll"
        id="codexBody"
        style="
          max-height: 68vh;
          width: min(760px, 96vw);
          font-size: 13px;
          line-height: 1.5;
        "
      ></div>
      <button class="btn" data-act="back">
        <span data-i18n="back"></span>
      </button>
    </div>

    <div
      class="screen"
      id="sc-tutorial"
      style="justify-content: flex-start; padding-top: 60px"
    >
      <h2 class="h2">ОБУЧЕНИЕ</h2>
      <div
        class="panel scroll"
        id="tutorialBody"
        style="
          max-height: 68vh;
          width: min(520px, 94vw);
          padding: 16px;
          font-size: 14px;
          line-height: 1.6;
        "
      ></div>
      <button class="btn primary" data-act="back">
        <span data-i18n="back"></span>
      </button>
    </div>

    <div
      class="screen"
      id="sc-quests"
      style="justify-content: flex-start; padding-top: 60px"
    >
      <h2 class="h2">ЗАДАНИЯ</h2>
      <div
        class="panel scroll"
        id="questsBody"
        style="max-height: 64vh; width: min(520px, 94vw); padding: 12px"
      ></div>
      <button class="btn" data-act="back">
        <span data-i18n="back"></span>
      </button>
    </div>

    <div class="screen" id="sc-settings">
      <h2 class="h2">НАСТРОЙКИ</h2>
      <div
        class="panel"
        style="
          display: flex;
          flex-direction: column;
          gap: 14px;
          align-items: center;
        "
      >
        <div class="srow">
          <span data-i18n="nick"></span
          ><input
            class="inp"
            style="font-size: 17px; width: 190px; letter-spacing: 0"
            id="nickIn"
            maxlength="12"
          />
        </div>
        <div class="srow">
          <span data-i18n="language"></span
          ><select
            id="qLang"
            class="inp"
            style="font-size: 15px; width: 140px; letter-spacing: 0"
          >
            <option value="ru" style="color: #000">РУССКИЙ</option>
            <option value="en" style="color: #000">ENGLISH</option>
          </select>
        </div>
        <div class="srow">
          <span data-i18n="music"></span
          ><input type="range" id="musIn" min="0" max="100" />
        </div>
        <div class="srow">
          <span data-i18n="sfx"></span
          ><input type="range" id="sfxIn" min="0" max="100" />
        </div>
        <div class="srow">
          <span data-i18n="vibration"></span
          ><input type="checkbox" id="vibIn" />
        </div>
        <div class="srow">
          <span data-i18n="muteAll"></span
          ><input type="checkbox" id="muteAllIn" />
        </div>
        <div class="srow">
          <span data-i18n="quality"></span
          ><select
            id="qIn"
            class="inp"
            style="font-size: 16px; width: 150px; letter-spacing: 0"
          >
            <option value="auto">Auto</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </div>
        <button class="btn small" data-act="fs">
          <span data-i18n="fullscreen"></span>
        </button>
      </div>
      <button class="btn" data-act="back">
        <span data-i18n="back"></span>
      </button>
    </div>

    <div
      class="screen"
      id="sc-lb"
      style="justify-content: flex-start; padding-top: 60px"
    >
      <h2 class="h2">РЕЙТИНГ</h2>
      <div
        class="panel scroll"
        id="lbBody"
        style="max-height: 64vh; width: min(460px, 94vw)"
      ></div>
      <button class="btn" data-act="back">
        <span data-i18n="back"></span>
      </button>
    </div>

    <div class="screen" id="sc-online">
      <h2 class="h2">ОНЛАЙН PVP</h2>
      <div class="stack">
        <button class="btn primary" data-act="createRoom">
          <span data-i18n="createRoom"></span>
        </button>
        <div
          class="panel"
          style="
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
          "
        >
          <input
            class="inp"
            id="codeIn"
            maxlength="7"
            placeholder="ABC-XYZ"
            autocomplete="off"
            autocapitalize="characters"
          />
          <button class="btn" data-act="doJoin" style="width: 100%">
            <span data-i18n="connect"></span>
          </button>
          <div
            id="joinStatus"
            style="
              min-height: 20px;
              font-weight: 700;
              color: #ffd23a;
              text-align: center;
            "
          ></div>
        </div>
        <button class="btn" data-act="back">
          <span data-i18n="back"></span>
        </button>
      </div>
    </div>

    <div class="screen" id="sc-room">
      <div style="font-weight: 800" data-i18n="roomCode"></div>
      <div class="code" id="roomCode">------</div>
      <button class="btn small" data-act="copyCode">КОПИРОВАТЬ</button>
      <div class="panel plist" id="roomPlayers"></div>
      <div
        class="panel"
        id="roomSettings"
        style="
          display: flex;
          flex-direction: column;
          gap: 6px;
          align-items: center;
        "
      >
        <div class="row" id="roomCount"></div>
        <div class="row" id="roomArena"></div>
      </div>
      <div class="row">
        <button class="btn" data-act="leaveRoom">ПОКИНУТЬ</button>
        <button class="btn primary" data-act="startOnline" id="startOnlineBtn">
          НАЧАТЬ
        </button>
      </div>
    </div>

    <div class="screen" id="sc-pause" style="background: rgba(0, 0, 0, 0.55)">
      <h2 class="h2">ПАУЗА</h2>
      <div class="stack">
        <button class="btn primary" data-act="resume">ПРОДОЛЖИТЬ</button>
        <button class="btn" data-act="pauseSettings">НАСТРОЙКИ</button>
        <button class="btn" data-act="fs">ПОЛНЫЙ ЭКРАН</button>
        <button class="btn" data-act="quit">В МЕНЮ</button>
      </div>
    </div>

    <div class="screen" id="sc-levelup" style="background: rgba(0, 0, 0, 0.6)">

          const tm = setTimeout(() => j(new Error("timeout")), to);
          s.onload = () => {
            clearTimeout(tm);
            r();
          };
          s.onerror = () => {
            clearTimeout(tm);
            j(new Error("load"));
          };
          document.head.appendChild(s);
        });

      class Pool {
        constructor(n, mk) {
          this.a = [];
          this.n = n;
          this.c = 0;
          this.active = [];
          for (let i = 0; i < n; i++) {
            const o = mk();
            o.on = false;
            o._inActive = false;
            this.a.push(o);
          }
        }
        get() {
          for (let k = 0; k < this.n; k++) {
            const i = (this.c + k) % this.n,
              o = this.a[i];
            if (!o.on) {
              this.c = (i + 1) % this.n;
              o.on = true;
              if (!o._inActive) {
                o._inActive = true;
                this.active.push(o);
              }
              return o;
            }
          }
          const o = this.a[this.c];
          this.c = (this.c + 1) % this.n;
          o.on = true;
          return o;
        }
        sweep() {
          let w = 0;
          for (let i = 0; i < this.active.length; i++) {
            const o = this.active[i];
            if (o.on) this.active[w++] = o;
            else o._inActive = false;
          }
          this.active.length = w;
        }
        clear() {
          for (const o of this.a) {
            o.on = false;
            o._inActive = false;
          }
          this.active.length = 0;
        }
      }

      function drawCape(c, m, pal) {

            b = s[Math.min(n - 1, i + 1)];

            dy = b.y - a.y,
            d = Math.hypot(dx, dy) || 1,

          R.push([s[i].x - nx * w, s[i].y - ny * w]);

              (L[i - 1][0] + L[i][0]) / 2,
              (L[i - 1][1] + L[i][1]) / 2,

          c.beginPath();
          c.ellipse(ox, oy, 14 + Math.sin(ra) * 2, 6, ra * 0.5, 0, TAU);
          c.stroke();
        }
        for (let i = 0; i < 4; i++) {
          const sa = TM * 3 + i * 1.7,
            sx = ox + Math.cos(sa) * 18,
            sy = oy + Math.sin(sa) * 10;
          c.fillStyle = "hsl(" + ((hue + i * 90) % 360) + ",100%,80%)";
          c.beginPath();
          c.arc(sx, sy, 1.6, 0, TAU);
          c.fill();
        }
        c.restore();
      }

      function drawStaffFire(c, m, f) {
        const bx = f * 14.5,
          tx = f * 18,
          topY = -37,
          px = f * 15,
          py = -14,
          sw = m.swing > 0 ? Math.sin((1 - m.swing) * Math.PI) * 1.9 * f : 0;
        c.save();
        c.translate(px, py);
        c.rotate(sw - f * 0.04);
        c.translate(-px, -py);
        c.lineCap = "round";
        c.lineJoin = "round";
        c.strokeStyle = "#000";
        c.lineWidth = 5.8;
        c.beginPath();
        c.moveTo(bx, 2);
        c.quadraticCurveTo(f * 13.5, -18, tx, topY);
        c.stroke();
        c.strokeStyle = "#3a1008";
        c.lineWidth = 3.6;
        c.stroke();
        c.strokeStyle = "#8a2008";
        c.lineWidth = 1.4;
        c.stroke();
        c.strokeStyle = "#FF6010";
        c.lineWidth = 1.2;
        for (let i = 0; i < 4; i++) {
          const u = 0.2 + i * 0.2,
            x = lerp(bx, tx, u) - f * 0.8,
            y = lerp(2, topY, u);
          c.beginPath();
          c.moveTo(x, y);
          c.lineTo(x + f * 1.5, y - 2);
          c.lineTo(x - f * 0.5, y - 5);
          c.stroke();
        }
        const ox = tx + f * 0.5,
          oy = topY - 8,
          pul = 0.8 + 0.2 * Math.sin(TM * 8 + m.id);
        c.globalCompositeOperation = "lighter";
        const gr = c.createRadialGradient(ox, oy, 2, ox, oy, 32);
        gr.addColorStop(0, "rgba(255,255,255," + 0.95 * pul + ")");
        gr.addColorStop(0.3, "rgba(255,238,0," + 0.8 * pul + ")");
        gr.addColorStop(0.6, "rgba(255,140,0," + 0.5 * pul + ")");
        gr.addColorStop(1, "rgba(255,69,0,0)");
        c.fillStyle = gr;
        c.beginPath();
        c.arc(ox, oy, 32, 0, TAU);
        c.fill();
        c.globalCompositeOperation = "source-over";
        for (let i = 0; i < 5; i++) {
          const a = TM * 4 + i * 1.26,
            bx2 = ox + Math.cos(a) * 5,
            by2 = oy + Math.sin(a) * 3,
            len = 12 + Math.sin(TM * 10 + i) * 4;
          c.beginPath();
          c.moveTo(bx2 - 3, by2 + 2);
          c.quadraticCurveTo(
            bx2 - 1,
            by2 - len * 0.6,
            bx2 + Math.sin(TM * 15 + i) * 3,
            by2 - len,
          );
          c.quadraticCurveTo(bx2 + 3, by2 - len * 0.4, bx2 + 3, by2 + 2);
          c.closePath();
          const fg = c.createLinearGradient(bx2, by2 + 2, bx2, by2 - len);
          fg.addColorStop(0, "rgba(255,69,0,.9)");
          fg.addColorStop(0.5, "rgba(255,180,0,.85)");
          fg.addColorStop(1, "rgba(255,255,200,.7)");
          c.fillStyle = fg;
          c.fill();
        }
        const og = c.createRadialGradient(ox - 1.5, oy - 1.5, 1, ox, oy, 9);
        og.addColorStop(0, "#FFFFFF");
        og.addColorStop(0.3, "#FFEE00");
        og.addColorStop(0.7, "#FF8C00");
        og.addColorStop(1, "#FF4500");
        c.fillStyle = og;
        c.beginPath();
        c.arc(ox, oy, 9, 0, TAU);
        c.fill();
        c.strokeStyle = "rgba(60,0,0,.6)";
        c.lineWidth = 1.5;
        c.stroke();
        for (let i = 0; i < 4; i++) {
          const sa = TM * 5 + i * 1.57,
            sx = ox + Math.cos(sa) * 16,
            sy = oy + Math.sin(sa) * 10;
          c.fillStyle = "#FFC040";
          c.beginPath();
          c.arc(sx, sy, 1.8, 0, TAU);
          c.fill();
        }
        c.restore();
      }

      function drawStaffCat(c, m, f) {
        const bx = f * 14.5,
          tx = f * 18,
          topY = -37,
          px = f * 15,
          py = -14,
          sw = m.swing > 0 ? Math.sin((1 - m.swing) * Math.PI) * 1.9 * f : 0;
        c.save();
        c.translate(px, py);
        c.rotate(sw - f * 0.04);
        c.translate(-px, -py);
        c.lineCap = "round";
        c.lineJoin = "round";
        c.strokeStyle = "#000";
        c.lineWidth = 5.4;
        c.beginPath();
        c.moveTo(bx, 2);
        c.quadraticCurveTo(f * 13.5, -18, tx, topY);
        c.stroke();
        c.strokeStyle = "#FFB6D9";
        c.lineWidth = 3.2;
        c.stroke();
        c.strokeStyle = "#FF69B4";
        c.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
          const u = 0.15 + i * 0.22,
            x = lerp(bx, tx, u) - f * 0.6,
            y = lerp(2, topY, u);
          c.beginPath();
          c.arc(x, y, 1.2, 0, TAU);
          c.stroke();
        }
        const ox = tx + f * 0.5,
          oy = topY - 6,
          pul = 0.85 + 0.15 * Math.sin(TM * 6 + m.id);
        c.globalCompositeOperation = "lighter";
        const gr = c.createRadialGradient(ox, oy, 2, ox, oy, 20);
        gr.addColorStop(0, rgba("#FFFFFF", 0.85 * pul));
        gr.addColorStop(0.35, rgba("#FFB6D9", 0.7 * pul));
        gr.addColorStop(1, rgba("#FFB6D9", 0));
        c.fillStyle = gr;
        c.beginPath();
        c.arc(ox, oy, 20, 0, TAU);
        c.fill();
        c.globalCompositeOperation = "source-over";
        c.fillStyle = "#FF69B4";
        c.strokeStyle = "#000";
        c.lineWidth = 1;
        c.beginPath();
        c.ellipse(ox, oy + 1, 3, 4, 0, 0, TAU);
        c.fill();
        c.stroke();
        for (let i = 0; i < 3; i++) {
          const a = -Math.PI / 2 + (i - 1) * 0.5;
          c.beginPath();
          c.ellipse(
            ox + Math.cos(a) * 3.5,
            oy - 2 + Math.sin(a) * 2.5,
            1.3,
            1.7,
            a,
            0,
            TAU,
          );
          c.fill();
          c.stroke();
        }
        c.restore();
      }

      function drawStaff(c, m, f) {
        const sk = m.staff.id;
        if (sk === "sharkstaff" || sk === "alpha") drawStaffShark(c, m, f);
        else if (sk === "catstaff" || sk === "meow") drawStaffCat(c, m, f);
        else if (
          sk === "starstaff" ||
          (sk === "gold" && m.skin.id === "archmage")
        )
          drawStaffStar(c, m, f);
        else if (sk === "voidstaff" || sk === "abyss") drawStaffVoid(c, m, f);
        else if (sk === "firestaff" || sk === "flame") drawStaffFire(c, m, f);
        else {
          const shaft =
              sk === "bone"
                ? "#E8E0C8"
                : sk === "crystal"
                  ? "#6a5a9a"
                  : "#8B6F3F",
            grain = sk === "bone" ? "#B0A888" : "#5A4A2F";
          const el = ELEMS[m.aura > 0 ? m.auraElem : m.elem],
            bx = f * 14.5,
            tx = f * 18,
            topY = -37,
            px = f * 15,
            py = -14,
            sw = m.swing > 0 ? Math.sin((1 - m.swing) * Math.PI) * 1.9 * f : 0;
          c.save();
          c.translate(px, py);
          c.rotate(sw - f * 0.04);
          c.translate(-px, -py);
          c.lineCap = "round";
          c.strokeStyle = "#000";
          c.lineWidth = 5.4;
          c.beginPath();
          c.moveTo(bx, 2);
          c.quadraticCurveTo(f * 13.5, -18, tx, topY);
          c.stroke();
          c.strokeStyle = shaft;
          c.lineWidth = 3.2;
          c.stroke();
          c.strokeStyle = grain;
          c.lineWidth = 0.9;
          for (let i = 0; i < 5; i++) {
            const u = 0.12 + i * 0.17,
              x = lerp(bx, tx, u) - f * 1.0,
              y = lerp(2, topY, u);
            c.beginPath();
            c.moveTo(x, y);
            c.lineTo(x + f * 0.6, y - 3);
            c.stroke();
          }
          const ox = tx + f * 0.5,
            oy = topY - 8,
            pul = 0.85 + 0.15 * Math.sin(TM * 6 + m.id),
            elc = el.color === "#6A0DAD" ? "#B040FF" : el.color;
          c.globalCompositeOperation = "lighter";
          const gr = c.createRadialGradient(ox, oy, 2, ox, oy, 22);
          gr.addColorStop(0, rgba(el.core, 0.9 * pul));
          gr.addColorStop(0.3, rgba(elc, 0.6 * pul));
          gr.addColorStop(1, rgba(elc, 0));
          c.fillStyle = gr;
          c.beginPath();
          c.arc(ox, oy, 22, 0, TAU);
          c.fill();
          c.globalCompositeOperation = "source-over";
          const og = c.createRadialGradient(ox - 1.5, oy - 1.5, 1, ox, oy, 8);
          og.addColorStop(0, "#FFFFFF");
          og.addColorStop(0.4, el.core);
          og.addColorStop(1, el.color);
          c.fillStyle = og;
          c.beginPath();
          c.arc(ox, oy, 7, 0, TAU);
          c.fill();
          c.strokeStyle = "rgba(0,0,0,0.5)";
          c.lineWidth = 1.5;
          c.stroke();
          c.restore();
        }
      }

      function drawMage(c, m, o) {
        o = o || {};
        const alpha = m.alpha * (o.alpha === undefined ? 1 : o.alpha);
        if (alpha <= 0.01) return;
        const f = m.facing,
          pal = palOf(m.mantle),
          sc = m.scale || 1;
        c.save();
        c.translate(m.x, m.y);
        c.scale(sc, sc);
        if (!o.noShadow) {
          const sa = 0.4 * alpha * (1 - clamp(m.lev / 40, 0, 0.6));
          c.fillStyle = "rgba(0,0,0," + sa * 0.5 + ")";
          c.beginPath();
          c.ellipse(0, 2, 16, 6, 0, 0, TAU);
          c.fill();
          c.fillStyle = "rgba(0,0,0," + sa + ")";
          c.beginPath();
          c.ellipse(0, 2, 11, 4, 0, 0, TAU);
          c.fill();
        }
        c.globalAlpha = alpha;
        const spd = Math.hypot(m.vx, m.vy),
          bob = m.dead
            ? 0
            : spd > 20
              ? Math.abs(Math.sin(m.walkT)) * 2.2
              : Math.sin(TM * 3 + m.id) * 0.5;
        c.translate(0, -m.lev - bob);
        if (m.dead) {
          const k = ease(clamp(m.deathT / 0.9, 0, 1));
          c.rotate(-f * k * 1.35);
          c.translate(0, k * 4);
        } else c.rotate(clamp(m.vx / 220, -1, 1) * 0.07);
        if (m.aura > 0) drawAuraBack(c, m);
        if (m.skin.catTail && m.tail) {
          const s = m.tail.s,
            n = s.length;
          c.lineCap = "round";
          c.lineJoin = "round";
          c.strokeStyle = "#000";
          c.lineWidth = 7;
          c.beginPath();
          c.moveTo(s[0].x, s[0].y);
          for (let i = 1; i < n - 1; i++) {
            const xc = (s[i].x + s[i + 1].x) / 2,
              yc = (s[i].y + s[i + 1].y) / 2;
            c.quadraticCurveTo(s[i].x, s[i].y, xc, yc);
          }
          c.lineTo(s[n - 1].x, s[n - 1].y);
          c.stroke();
          c.strokeStyle = pal.base;
          c.lineWidth = 4.5;
          c.stroke();
          c.fillStyle = m.skin.accent || "#FF69B4";
          c.beginPath();
          c.arc(s[n - 1].x, s[n - 1].y, 3.5, 0, TAU);
          c.fill();
          c.strokeStyle = "#000";
          c.lineWidth = 1.5;
          c.stroke();
        }
        if (m.skin.fin) {
          c.fillStyle = shade(m.mantle, -0.15);
          c.strokeStyle = "#000";
          c.lineWidth = 2.5;
          c.lineJoin = "round";
          c.beginPath();
          c.moveTo(-6, -18);
          c.lineTo(-16, -42);
          c.lineTo(-2, -24);
          c.closePath();
          c.fill();
          c.stroke();
          c.fillStyle = "rgba(255,255,255,.35)";
          c.beginPath();
          c.moveTo(-6, -20);
          c.lineTo(-12, -38);
          c.lineTo(-4, -26);
          c.closePath();
          c.fill();
        }
        drawCape(c, m, pal);
        drawRobe(c, m, pal);
        if (m.skin.shoulder) {
          c.fillStyle = "#A8F0FF";
          c.strokeStyle = "#000";
          c.lineWidth = 1.6;
          for (const s of [-1, 1]) {
            c.beginPath();
            c.moveTo(s * 8, -16);
            c.lineTo(s * 10.5, -23);
            c.lineTo(s * 12.5, -15.5);
            c.closePath();
            c.fill();
            c.stroke();
          }
        }
        c.fillStyle = "#2a1508";
        c.strokeStyle = "#000";
        c.lineWidth = 2;
        c.beginPath();
        if (c.roundRect) c.roundRect(-9.5, -15.5, 19, 4.5, 1.5);
        else c.rect(-9.5, -15.5, 19, 4.5);
        c.fill();
        c.stroke();
        c.fillStyle = m.skin.accent || "#DAA520";
        c.strokeStyle = "#5a3a00";
        c.lineWidth = 1.5;
        c.beginPath();
        c.rect(-3.5, -16.5, 7, 6.5);
        c.fill();
        c.stroke();
        c.fillStyle = "#FFEE80";
        c.beginPath();
        c.rect(-2.5, -15.5, 2, 4);
        c.fill();
        if (m.skin.id !== "base" && m.skin.gem)
          drawGem(c, m.skin.gem, 0, -13.2);
        c.lineCap = "round";
        c.strokeStyle = "#000";
        c.lineWidth = 6.5;
        c.beginPath();
        c.moveTo(-f * 7, -16);
        c.quadraticCurveTo(-f * 9, -13, -f * 10, -10);
        c.stroke();
        c.strokeStyle = pal.sh;
        c.lineWidth = 4;
        c.stroke();
        c.fillStyle = "#1A1520";
        c.strokeStyle = "#000";
        c.lineWidth = 1.8;
        c.beginPath();
        c.arc(-f * 10.5, -9.2, 3.2, 0, TAU);
        c.fill();
        c.stroke();
        c.fillStyle = "rgba(255,255,255,.15)";
        c.beginPath();
        c.arc(-f * 10, -8.8, 1, 0, TAU);
        c.fill();
        c.save();
        c.scale(-f, 1);
        hoodPath(c);
        const hg = c.createLinearGradient(-14, -48, 14, -14);
        hg.addColorStop(0, pal.hi);
        hg.addColorStop(0.45, pal.base);
        hg.addColorStop(1, pal.sh);
        c.fillStyle = hg;
        c.fill();
        c.lineWidth = 4.5;
        c.lineJoin = "round";
        c.strokeStyle = "#000";
        c.stroke();
        if (m.skin.sharkSkin) {
          c.fillStyle = "#FFFFFF";
          c.strokeStyle = "#000";
          c.lineWidth = 1;
          for (let i = 0; i < 6; i++) {
            const x = -10 + i * 3.5;
            c.beginPath();
            c.moveTo(x, -15);
            c.lineTo(x + 1.5, -11);
            c.lineTo(x + 3, -15);
            c.closePath();
            c.fill();
            c.stroke();
          }
          c.fillStyle = "#FF69B4";
          c.strokeStyle = "#000";
          c.lineWidth = 1.8;
          c.lineJoin = "round";
          c.beginPath();
          c.moveTo(-4, -47);
          c.lineTo(-7, -58);
          c.lineTo(0, -50);
          c.lineTo(3, -58);
          c.lineTo(5, -46);
          c.closePath();
          c.fill();
          c.stroke();
        }
        if (m.skin.catEars) {
          c.fillStyle = pal.hi;
          c.strokeStyle = "#000";
          c.lineWidth = 2.5;
          c.lineJoin = "round";
          for (const s of [-1, 1]) {
            const bx = s * 7;
            c.beginPath();
            c.moveTo(bx - 6, -44);
            c.quadraticCurveTo(bx - 3, -52, bx, -58);
            c.quadraticCurveTo(bx + 3, -52, bx + 6, -44);
            c.closePath();
            c.fill();
            c.stroke();
            c.fillStyle = "#FF69B4";
            c.beginPath();
            c.moveTo(bx - 3.5, -45);
            c.quadraticCurveTo(bx - 1.5, -51, bx, -54);
            c.quadraticCurveTo(bx + 1.5, -51, bx + 3.5, -45);
            c.closePath();
            c.fill();
            c.strokeStyle = "#FF69B4";
            c.lineWidth = 1;
            c.stroke();
            c.fillStyle = pal.hi;
            c.strokeStyle = "#000";
            c.lineWidth = 1.5;
            c.beginPath();
            c.moveTo(bx - 1, -53);
            c.lineTo(bx, -57);
            c.lineTo(bx + 1, -53);
            c.closePath();
            c.fill();
            c.stroke();
          }
        }
        c.strokeStyle = pal.dk;
        c.globalAlpha = alpha * 0.5;
        c.lineWidth = 1.4;
        c.beginPath();
        c.moveTo(8, -38);
        c.quadraticCurveTo(11, -30, 10, -22);
        c.moveTo(-10, -37);
        c.quadraticCurveTo(-13, -30, -12, -24);
        c.stroke();
        c.globalAlpha = alpha;
        c.restore();
        c.strokeStyle = pal.hi;
        c.globalAlpha = alpha * 0.85;
        c.lineWidth = 1.6;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(-13.5, -25);
        c.bezierCurveTo(-13.5, -33, -10, -39, -5.5, -42);
        c.stroke();
        c.globalAlpha = alpha;
        const fx = f * 1.2;
        c.fillStyle = "#050208";
        c.beginPath();
        c.ellipse(fx, -26, 11.5, 10.5, 0, 0, TAU);
        c.fill();
        c.lineWidth = 1.5;
        c.strokeStyle = "rgba(0,0,0,0.8)";
        c.stroke();
        if (m.skin.crown) {
          c.fillStyle = m.skin.accent || "#FFD84A";
          c.strokeStyle = "#000";
          c.lineWidth = 1.5;
          c.beginPath();
          c.moveTo(-8, -37);
          for (let i = 0; i < 5; i++) {
            c.lineTo(-8 + i * 4 + 2, -43 + (i % 2) * 2);
            c.lineTo(-8 + i * 4 + 4, -37);
          }
          c.closePath();
          c.fill();
          c.stroke();
        }
        drawEyes(c, m, fx, -26);
        drawStaff(c, m, f);
        const swingRot =
          m.swing > 0 ? Math.sin((1 - m.swing) * Math.PI) * 1.9 * f * 0.6 : 0;
        c.save();
        c.translate(f * 7, -17);
        c.rotate(f * -0.25 + swingRot);
        c.strokeStyle = "#000";
        c.lineWidth = 6.5;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(0, 0);
        c.quadraticCurveTo(f * 3.5, 1, f * 6, 3.5);
        c.stroke();
        c.strokeStyle = pal.sh;
        c.lineWidth = 4;
        c.stroke();
        c.restore();
        c.fillStyle = "#1A1520";
        c.strokeStyle = "#000";
        c.lineWidth = 1.8;
        c.beginPath();
        c.arc(f * 14.8, -14.2, 3.3, 0, TAU);
        c.fill();
        c.stroke();
        c.fillStyle = "rgba(255,255,255,.25)";
        c.beginPath();
        c.arc(f * 14, -15.2, 1.2, 0, TAU);
        c.fill();
        if (m.fx.slow > 0 && m.fx.freeze <= 0) {
          c.globalAlpha = alpha * 0.28;
          c.fillStyle = "#5080FF";
          c.beginPath();
          c.ellipse(0, -22, 18, 26, 0, 0, TAU);
          c.fill();
          c.globalAlpha = alpha;
          if (Q.pmul >= 0.5 && Math.random() < 0.4) {
            pt(
              m.x + rnd(-12, 12),
              m.y - rnd(5, 45),
              rnd(-10, 10),
              rnd(20, 40),
              0.7,
              2.2,
              pick(["#80C0FF", "#A0E0FF", "#E0F4FF"]),
              0,
              true,
              0.96,
            );
          }
          c.strokeStyle = "rgba(160,220,255,.55)";
          c.lineWidth = 1.5;
          c.beginPath();
          c.arc(0, -22, 20, -0.3, 0.3);
          c.stroke();
        }
        if (m.aura > 0) drawAuraFront(c, m);
        if (m.fx.freeze > 0) {
          c.globalAlpha = alpha * 0.45;
          c.fillStyle = "#9FE8FF";
          c.fillRect(-16, -50, 32, 54);
          c.globalAlpha = alpha;
          c.strokeStyle = "#E8FFFF";
          c.lineWidth = 2;
          c.strokeRect(-16, -50, 32, 54);
        }
        if (m.fx.shield > 0) {
          const sp = 0.6 + 0.2 * Math.sin(TM * 6);
          c.strokeStyle = "rgba(96,160,255," + sp + ")";
          c.fillStyle = "rgba(96,160,255,.14)";
          c.lineWidth = 2.5;
          c.beginPath();
          c.ellipse(0, -22, 20, 28, 0, 0, TAU);
          c.fill();
          c.stroke();
        }
        c.restore();
      }
      function drawGhostMage(c, x, y, f, col, alpha) {
        c.save();
        c.translate(x, y);
        c.globalAlpha = alpha;
        c.fillStyle = col;
        c.strokeStyle = col;
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(-13, -1);
        c.lineTo(-7, -17);
        c.lineTo(7, -17);
        c.lineTo(13, -1);
        c.closePath();
        c.fill();
        c.save();
        c.scale(-f, 1);
        hoodPath(c);
        c.restore();
        c.fill();
        c.restore();
      }

      /* ARENA */
      const ARENA = {
        A: null,
        B: null,
        S: 0.8,

      /* COMBAT */
      let G = null;

      function dealDamage(src, t, amt, o) {

      function killEntity(t, src) {

      function nearestFoe(o, x, y, maxd, ex) {

      function updateProjs(dt) {
        const a = PR.active,
          lim2 = (R_ARENA + 20) ** 2;
        for (let i = 0; i < a.length; i++) {
          const p = a[i];
          if (!p.on) continue;
          if (p.home) {
            const tg = nearestFoe(p.own, p.x, p.y, 600);
            if (tg) {
              const want = Math.atan2(tg.y - p.y, tg.x - p.x),
                cur = Math.atan2(p.vy, p.vx),
                na = cur + clamp(angDiff(cur, want), -5 * dt, 5 * dt),
                sp = Math.hypot(p.vx, p.vy);
              p.vx = Math.cos(na) * sp;
              p.vy = Math.sin(na) * sp;
            }
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.trailPts) {
            p.trailPts.push({ x: p.x, y: p.y });
            if (p.trailPts.length > 8) p.trailPts.shift();
          }
          if (Q.pmul >= 0.4) {
            const col =
              p.e === 4
                ? pick(["#6A0DAD", "#D070FF"])
                : pick([ELEMS[p.e].color, ELEMS[p.e].core]);
            pt(
              p.x,
              p.y,
              rnd(-25, 25),
              rnd(-25, 25) + (p.e === 0 ? -40 : 0),
              0.5,
              rnd(3.5, 7),
              col,
              0,
              true,
              0.96,
            );
            if (Math.random() < 0.6)
              pt(
                p.x + rnd(-3, 3),
                p.y + rnd(-3, 3),
                -p.vx * 0.08 + rnd(-20, 20),
                -p.vy * 0.08 + rnd(-20, 20),

                rnd(2, 4),
                "#fff",
                0,
                true,
                0.9,

            if (p.trail === "trail_rainbow") {
              for (let ti = 0; ti < 2; ti++)

                rnd(-30, 30) - 30,

            else if (p.trail === "trail_star")

                rnd(-20, 20),

                3.5,
                "#FFE060",
                0,
                true,
                0.94,
              );
            else if (p.trail === "trail_void")
              pt(
                p.x + rnd(-5, 5),
                p.y + rnd(-5, 5),
                rnd(-25, 25),
                rnd(-25, 25),
                0.9,
                5,
                pick(["#B040FF", "#6A0DAD", "#E0A0FF"]),
                0,
                true,
                0.95,
              );

              if (Math.random() < 0.5)

                  0.94,

          const dxc = p.x - CX,

              life: 10,

      function updateZones(dt) {
        for (let i = G.zones.length - 1; i >= 0; i--) {
          const z = G.zones[i];
          z.life -= dt;
          if (z.chase) {
            z.tgT -= dt;
            if (z.tgT <= 0 || !z.tg || z.tg.dead) {
              z.tg = nearestFoe(z.own, z.x, z.y, 1500);
              z.tgT = 0.4;
            }
            if (z.tg) {
              const a = Math.atan2(z.tg.y - z.y, z.tg.x - z.x);
              z.x += Math.cos(a) * z.chase * dt;
              z.y += Math.sin(a) * z.chase * dt;
            }
          }
          z.tick -= dt;
          const tk = z.tick <= 0;
          if (tk) z.tick = 0.5;
          const glob = z.r > 5000;
          for (let j = 0; j < G.all.length; j++) {
            const t = G.all[j];
            if (!isFoe(z.own, t)) continue;
            const dx = z.x - t.x,
              dy = z.y - t.y,
              d = Math.hypot(dx, dy);
            if (!glob && d > z.r + t.r) continue;
            if (z.pull && d > 8) {
              const fall = glob ? 1 : clamp(1.2 - d / (z.r * 1.2), 0.3, 1);
              t.x += (dx / d) * z.pull * fall * dt;
              t.y += (dy / d) * z.pull * fall * dt;
            }
            if (tk) {
              let dmg = z.dps * 0.5;
              if (z.core && d < z.core) dmg += z.coreDps * 0.5;
              if (dmg > 0)
                dealDamage(z.own, t, dmg, {
                  type: "dot",
                  col: elemColor(z.elem),
                });
              if (z.slow) applyStatus(t, "slow", 0.8, z.slow);
              if (z.burn) applyStatus(t, "burn", 2, 5);
            }
          }
          if (tk && z.zap) {
            const t = nearestFoe(z.own, z.x, z.y, z.r * 2.4);
            if (t) {
              G.bolts.push({
                pts: bolt(z.x, z.y - 40, t.x, t.y - 18, 6, 12),
                l: 0.25,
                c: "#FFEE00",
                w: 3,
              });
              dealDamage(z.own, t, z.zap, { type: "zone" });
              sfx("zap");
            }
          }
          if (!glob && Math.random() < 1) {
            const a = rnd(0, TAU),
              rr = z.r * rnd(0.3, 1);
            const col =
              z.elem === 0
                ? pick(["#FF4500", "#FFEE00"])
                : z.elem === 1
                  ? "#C8F8FF"
                  : z.elem === 2
                    ? "#FFEE00"
                    : z.elem === 3
                      ? "#E8FAFF"
                      : pick(["#6A0DAD", "#D070FF"]);
            pt(
              z.x + Math.cos(a) * rr,
              z.y + Math.sin(a) * rr * 0.6,
              -Math.sin(a) * 80,
              Math.cos(a) * 80 - (z.style === "tornado" ? 60 : 0),
              0.6,
              rnd(2, 4),
              col,
              0,
              true,
              0.98,
            );
          }
          if (!glob && Math.random() < 0.5) {
            const a2 = rnd(0, TAU),
              rr2 = rnd(0, z.r);
            pt(
              z.x + Math.cos(a2) * rr2,
              z.y + Math.sin(a2) * rr2 * 0.6,
              0,
              -rnd(60, 180),
              0.4,
              rnd(1.5, 3),
              "#fff",
              0,
              true,
              0.92,
            );
          }
          if (z.life <= 0) {
            if (z.end === "throw") {
              aoe(z.own, z.x, z.y, z.r, 40, { kb: 36 });
              splash(z.x, z.y, z.r, "#DDF4F8", 1.2);
            }
            G.zones.splice(i, 1);
          }
        }
      }

      function drawZone(c, z) {
        if (z.r > 5000) return;
        const k = clamp(Math.min(z.life, z.max - z.life + 0.2) / 0.5, 0, 1),
          col = elemColor(z.elem);
        if (z.style === "hole") {
          const g = c.createRadialGradient(z.x, z.y, 2, z.x, z.y, z.r);
          g.addColorStop(0, "rgba(0,0,0," + 0.95 * k + ")");
          g.addColorStop(0.55, "rgba(20,0,40," + 0.6 * k + ")");
          g.addColorStop(1, rgba(col, 0));
          c.fillStyle = g;
          c.beginPath();
          c.arc(z.x, z.y, z.r, 0, TAU);
          c.fill();
          c.lineWidth = 3;
          c.strokeStyle = rgba(col, 0.8 * k);
          for (let s = 0; s < 3; s++) {
            c.beginPath();
            for (let i = 0; i <= 20; i++) {
              const u = i / 20,
                a = TM * 4 + s * 2.1 + u * 5,
                r = z.r * (1 - u * 0.9),
                x = z.x + Math.cos(a) * r,
                y = z.y + Math.sin(a) * r * 0.65;
              if (i) c.lineTo(x, y);
              else c.moveTo(x, y);
            }
            c.stroke();
          }
        } else if (z.style === "tornado") {
          const h = z.r * 1.8;
          c.lineWidth = 3;
          for (let i = 0; i < 9; i++) {
            const u = i / 8,
              y = z.y - u * h,
              w = z.r * (0.25 + u * 0.75),
              a = TM * 8 + i;
            c.strokeStyle = rgba(col, (0.8 - u * 0.4) * k);
            c.fillStyle = rgba(col, 0.12 * k);
            c.beginPath();
            c.ellipse(z.x + Math.sin(a * 0.5) * 6, y, w, w * 0.3, 0, 0, TAU);
            c.fill();
            c.stroke();
          }
        } else if (z.style === "ice") {
          c.fillStyle = "rgba(160,232,255," + 0.45 * k + ")";
          c.strokeStyle = "rgba(255,255,255," + 0.8 * k + ")";
          c.lineWidth = 2;
          c.beginPath();
          c.ellipse(z.x, z.y, z.r, z.r * 0.6, 0, 0, TAU);
          c.fill();
          c.stroke();
        }
      }

      function randomPickupType() {
        let r = Math.random() * PK_WSUM;
        for (const k of PK_KEYS) {
          r -= PK[k].w;
          if (r <= 0) return k;
        }
        return "hp";
      }
      function spawnPickup(type, x, y) {
        G.pickups.push({ id: G.pkId++, type, x, y, t: 0, life: 45 });
      }
      function spawnRandomPickup() {
        let x = 0,
          y = 0,
          ok = false;
        for (let i = 0; i < 20; i++) {
          const a = rnd(0, TAU),
            r = Math.sqrt(Math.random()) * (G.safeR - 80);
          x = CX + Math.cos(a) * r;
          y = CY + Math.sin(a) * r;
          let clear = true;
          for (const rk of G.rocks)
            if (dist(x, y, rk.x, rk.y) < rk.r + 30) {
              clear = false;
              break;
            }
          if (clear) {
            ok = true;
            break;
          }
        }
        if (!ok) return;
        const type = randomPickupType();
        spawnPickup(type, x, y);
        G.spawnFx.push({ x, y, t: 1.2, m: 1.2, c: PK[type].col, w: 24 });
        burst(x, y, PK[type].col, 14, 120, 3, 0.6, true);
      }

      function addRune(m, e) {
        m.runes.push(e);
        if (m.runes.length > 3) m.runes.shift();
        m.elem = e;
      }
      function addMulti(m) {
        m.multiStacks = Math.min(15, m.multiStacks + 1);
      }
      function collect(m, p) {
        const k = p.type,
          info = PK[k];
        switch (k) {
          case "hp":
            heal(m, m.maxHp * 0.5);
            break;
          case "mana":
            m.mana = 100;
            break;
          case "haste":
            m.fx.haste = 8;
            break;
          case "shield":
            m.fx.shield = 25;
            break;
          case "gem":
            if (m === G.player || m.id === G.myId) G.goldEarn += 5;
            break;
          case "time":
            for (const t of G.all) if (isFoe(m, t)) t.fx.tslow = 4;
            break;
          case "mult":
            addMulti(m);
            break;
          default:
            addRune(m, +k[1]);
            break;
        }
        burst(p.x, p.y, info.col, 22, 200, 3.5, 0.6, true);
        emote(m, "pickup", 0.4, info.col);
        if (m === G.player) {
          sfx("pickup");
          vib(20);
          G.headIcons.push({ type: k, t: 0 });
          notice(info[lang], info.col);
        }
        G.events.push({ k: "pickup", id: m.id, type: k });
      }
      function updatePickups(dt) {
        for (let i = G.pickups.length - 1; i >= 0; i--) {
          const p = G.pickups[i];
          p.t += dt;
          p.life -= dt;
          if (p.life <= 0) {
            G.pickups.splice(i, 1);
            continue;
          }
          for (const m of G.mages) {
            if (m.dead) continue;
            const d = dist(m.x, m.y, p.x, p.y);
            if (d < 90 && (m === G.player || m.isBot)) {
              p.x += ((m.x - p.x) / d) * 120 * dt;
              p.y += ((m.y - 10 - p.y) / d) * 120 * dt;
            }
            if (d < 26) {
              collect(m, p);
              G.pickups.splice(i, 1);
              break;
            }
          }
        }
      }

      function aiUpdate(m, dt) {
        const a = m.ai;
        a.t -= dt;
        a.fireDelay -= dt;
        a.dodgeCd -= dt;
        a.strafeT -= dt;
        if (a.strafeT <= 0) {
          a.strafeT = rnd(1.8, 3.5);
          a.strafe = -a.strafe;
        }
        if (!a.tg || a.tg.dead) a.tg = nearestFoe(m, m.x, m.y, 1e9);
        const td = a.tg ? dist(m.x, m.y, a.tg.x, a.tg.y) : 999;
        a.td = td;
        if (a.t <= 0) {
          a.t = rnd(0.3, 0.45);
          a.pk = null;
          let bs = 1e9;
          if (m.hp < m.maxHp * (0.4 + a.aggression * 0.2) || m.mana < 30) {
            for (const p of G.pickups) {
              const d = dist(m.x, m.y, p.x, p.y);
              let sc = d;
              if (m.hp < m.maxHp * 0.5 && p.type === "hp") sc -= 400;
              else if (p.type === "mana" && m.mana < 30) sc -= 300;
              else if (p.type[0] === "r" && m.runes.length < 3) sc -= 250;
              else if (p.type === "mult" && m.multiStacks < 5) sc -= 200;
              else sc -= 500;
              if (d < 500 && sc < bs) {
                bs = sc;
                a.pk = p;
              }
            }
          }
        }
        let mx = 0,
          my = 0;
        const dc = dist(m.x, m.y, CX, CY);
        const wantDist =
          G.mode === "survival" ? 200 : Math.round(260 - a.aggression * 140);
        if (dc > G.safeR - 110) {
          mx = CX - m.x;
          my = CY - m.y;
        } else if (a.pk && (!a.tg || td > 300) && m.hp < m.maxHp * 0.4) {
          mx = a.pk.x - m.x;
          my = a.pk.y - m.y;
        } else if (a.tg) {
          const dx = a.tg.x - m.x,
            dy = a.tg.y - m.y,
            d = td || 1;
          const distErr = d - wantDist;
          if (Math.abs(distErr) > 70) {
            const sign = distErr > 0 ? 1 : -1;
            mx = (dx / d) * sign;
            my = (dy / d) * sign;
          } else if (Math.abs(distErr) > 25) {
            const sign = distErr > 0 ? 1 : -1;
            mx = (dx / d) * sign * 0.5;
            my = (dy / d) * sign * 0.5;
          }
          const strafeStrength = Math.abs(distErr) < 70 ? 1 : 0.4;
          mx += (-dy / d) * a.strafe * strafeStrength;
          my += (dx / d) * a.strafe * strafeStrength;
        } else {
          a.wander += rnd(-0.05, 0.05);
          mx = Math.cos(a.wander);
          my = Math.sin(a.wander);
        }
        if (a.dodgeCd <= 0) {
          for (const p of PR.active) {
            if (!p.on || !p.own || p.own === m || !isFoe(m, p.own)) continue;
            const rx = m.x - p.x,
              ry = m.y - p.y,
              d = Math.hypot(rx, ry);
            if (d > 150) continue;
            const sp = Math.hypot(p.vx, p.vy) || 1,
              dot = (rx * p.vx + ry * p.vy) / (d * sp);
            if (dot > 0.85 && Math.random() < a.dodgeChance * a.skill) {
              const side = Math.random() < 0.5 ? 1 : -1;
              mx = -p.vy * side;
              my = p.vx * side;
              a.dodgeCd = 0.6;
              if (m.dashCd <= 0 && Math.random() < 0.4)
                mageDash(m, Math.atan2(my, mx));
              break;
            }
          }
        }
        const l = Math.hypot(mx, my) || 1;
        m.mx = (mx / l) * (mx || my ? 1 : 0);
        m.my = (my / l) * (mx || my ? 1 : 0);
        if (
          a.tg &&
          !m.dead &&
          m.castLock <= 0 &&
          m.fx.stun <= 0 &&
          m.fx.freeze <= 0
        ) {
          const tg = a.tg,
            dx = tg.x - m.x,
            dy = tg.y - m.y;
          const fireRange = G.mode === "survival" ? 500 : 480;
          if (
            td < fireRange &&
            m.atkCd <= 0 &&
            a.fireDelay <= 0 &&
            m.mana >= 10
          ) {
            const lead = td / 520,
              predX = tg.x + (tg.vx || 0) * lead * 0.7,
              predY = tg.y + (tg.vy || 0) * lead * 0.7;
            const aimErr = (a.aimErr || 1) * 0.05;
            const ang =
              Math.atan2(predY - m.y, predX - m.x) + rnd(-aimErr, aimErr);
            if (mageAttack(m, ang)) {
              const fMul = a.fireDelayMul || 1;
              a.fireDelay = (rnd(0.15, 0.35) * fMul) / a.skill;
            }
          }
          if (
            m.ultCharge >= 100 &&
            td < 400 &&
            Math.random() < dt * a.ultChance
          )
            castUlt(m, tg.x, tg.y);
          if (
            m.hp < m.maxHp * a.retreatHp &&
            td < 150 &&
            m.dashCd <= 0 &&
            Math.random() < dt * 2
          )
            mageDash(m, Math.atan2(-dy, -dx));
        }
      }

      function collideWorld(e) {
        for (const rk of G.rocks) {
          const dx = e.x - rk.x,
            dy = e.y - rk.y,
            md = rk.r + e.r * 0.8,
            d2 = dx * dx + dy * dy;
          if (d2 < md * md && d2 > 0.0001) {
            const d = Math.sqrt(d2);
            e.x = rk.x + (dx / d) * md;
            e.y = rk.y + (dy / d) * md;
          }
        }
        const dx = e.x - CX,
          dy = e.y - CY,
          d = Math.hypot(dx, dy),
          lim = R_ARENA - e.r - 22;
        if (d > lim) {
          e.x = CX + (dx / d) * lim;
          e.y = CY + (dy / d) * lim;
        }
      }

      function updateVisual(m, dt) {
        const shx = clamp(m.x - m.px, -40, 40),
          shy = clamp(m.y - m.py, -40, 40);
        m.px = m.x;
        m.py = m.y;

        m.cape.step(bx * 5, -17, shx, shy, TM, bx * 0.16, 0.3, 0.1);
        m.hemL.step(-6.5, -15, shx, shy, TM, 0, 0.3, 0.05);
        m.hemR.step(6.5, -15, shx, shy, TM, 0, 0.3, 0.05);
        if (m.tail)
          m.tail.step(-8, -6, shx * 0.8, shy * 0.8, TM, -0.1, 0.15, 0.2);
        m.walkT += Math.hypot(m.vx, m.vy) * dt * 0.05;

          if (isMe && SAVE.fxTrail && Math.hypot(m.vx, m.vy) > 30) {
