      function endMatch(win) {
        if (!G || G.resultShown) return;
        G.resultShown = true;
        state = "RESULT";
        gameplayStop();
        resetAllInputs();
        MUS.tgt = 0;
        const p = G.player;
        let reward, line1;
        if (G.mode === "survival") {
          const waves = Math.max(0, G.wave - 1);
          reward = clamp(10 + waves * 4, 10, 50);
          line1 = t("survived") + ": <b>" + waves + "</b>";
          const score = G.wave * 100 + G.kills * 5;
          SAVE.lb.push({ n: SAVE.nick, s: score, m: "S", d: Date.now() });
          submitScore(score);
        } else {
          const rank =
            G.ranks && G.ranks[p.id]
              ? G.ranks[p.id]
              : win
                ? 1
                : p.deadAlive || G.mages.length;
          reward = clamp(10 + p.kills * 8 + (win ? 20 : 0), 10, 50);
          line1 = t("rank") + ": <b>#" + rank + "</b> / " + G.mages.length;
          const score =
            (G.mages.length - rank + 1) * 100 + p.kills * 25 + (win ? 200 : 0);
          SAVE.lb.push({ n: SAVE.nick, s: score, m: "A", d: Date.now() });
          submitScore(score);
          if (win && !SAVE.firstWin) {
            SAVE.firstWin = true;
            SAVE.gems += 5;
          }
        }
        if (SAVE.vip) reward = Math.round(reward * 1.2);
        const total = reward + G.goldEarn;
        SAVE.gold += total;
        SAVE.stats.matches++;
        SAVE.stats.kills += p.kills;
        if (win) SAVE.stats.wins++;
        SAVE.lb.sort((a, b) => b.s - a.s);
        SAVE.lb.length = Math.min(SAVE.lb.length, 20);
        persist();
        checkQuests();
        const survWin = G.mode === "survival";
        $("resTitle").textContent = survWin
          ? lang === "ru"
            ? "КОНЕЦ ИГРЫ"
            : "GAME OVER"
          : win
            ? t("victory")
            : t("defeat");
        $("resBody").innerHTML =
          line1 +
          "<br>" +
          t("kills") +
          ": <b>" +
          p.kills +
          "</b><br>" +
          t("reward") +
          ': <b style="color:#ffd23a">+' +
          total +
          " 🪙</b>";
        $("rematchBtn").style.display = G.online ? "none" : "flex";
        $("backToRoomBtn").style.display = G.online ? "flex" : "none";
        sfx(win ? "win" : "lose");
        showScreen("sc-result");
        if (G.role === "host") netBroadcastEnd();
      }

      /* RENDER */
      const DR = [];
      function rr(c, x, y, w, h, r) {
        c.beginPath();
        if (c.roundRect) c.roundRect(x, y, w, h, r);
        else c.rect(x, y, w, h);
      }
      function txt(c, s, x, y, size, col, align, sw) {
        c.font = "800 " + size + 'px "Segoe UI",Roboto,Arial,sans-serif';
        c.textAlign = align || "center";
        c.textBaseline = "middle";
        c.lineJoin = "round";
        c.lineWidth = sw === undefined ? Math.max(1.5, size / 8) : sw;
        c.strokeStyle = "#000";
        if (c.lineWidth > 0) c.strokeText(s, x, y);
        c.fillStyle = col || "#fff";
        c.fillText(s, x, y);
      }

      function drawParticles(c, x0, y0, x1, y1) {
        const a = PP.active;
        for (let pass = 0; pass < 2; pass++) {
          c.globalCompositeOperation =
            pass && Q.glow ? "lighter" : "source-over";
          const want = pass === 1;
          for (let i = 0; i < a.length; i++) {
            const p = a[i];
            if (
              !p.on ||
              p.add !== want ||
              p.x < x0 ||
              p.x > x1 ||
              p.y < y0 ||
              p.y > y1
            )
              continue;
            const k = p.l / p.m;
            c.globalAlpha = clamp(k * 1.6, 0, 1);
            c.fillStyle = p.c;
            if (p.sq) {
              const s = p.s * (0.5 + 0.5 * k);
              c.fillRect(p.x - s / 2, p.y - s / 2, s, s);
            } else {
              c.beginPath();
              c.arc(p.x, p.y, Math.max(0.4, p.s * (0.4 + 0.6 * k)), 0, TAU);
              c.fill();
            }
          }
        }
        c.globalAlpha = 1;
        c.globalCompositeOperation = "source-over";
      }

      function drawProjShape(c, p, col) {
        const style = p.style || "orb",
          r = p.r || 7;
        if (style === "heart") {
          c.fillStyle = "rgba(255,154,200,.35)";
          c.beginPath();
          c.arc(p.x, p.y, r * 2.5, 0, TAU);
          c.fill();
          c.fillStyle = "#FF6AA0";
          c.strokeStyle = "#FF3080";
          c.lineWidth = 1.8;
          c.save();
          c.translate(p.x, p.y);
          c.beginPath();
          c.moveTo(0, r * 0.7);
          c.bezierCurveTo(-r * 1.5, -r * 0.6, -r * 0.9, -r * 1.7, 0, -r * 0.7);
          c.bezierCurveTo(r * 0.9, -r * 1.7, r * 1.5, -r * 0.6, 0, r * 0.7);
          c.fill();
          c.stroke();
          c.restore();
        } else if (style === "wave") {
          c.fillStyle = "rgba(255,154,200,.4)";
          c.beginPath();
          c.arc(p.x, p.y, r * 2.5, 0, TAU);
          c.fill();
          const ang = Math.atan2(p.vy, p.vx);
          c.save();
          c.translate(p.x, p.y);
          c.rotate(ang);
          c.strokeStyle = "#FF9AC8";
          c.lineWidth = 2.5;
          c.lineCap = "round";
          for (let i = 0; i < 3; i++) {
            c.beginPath();
            c.arc(0, 0, r * (1.2 + i * 0.4), -0.9, 0.9);
            c.stroke();
          }
          c.restore();
        } else if (style === "void") {
          c.globalCompositeOperation = "lighter";
          const gr = c.createRadialGradient(p.x, p.y, 1, p.x, p.y, r * 2.5);
          gr.addColorStop(0, "rgba(176,64,255,.6)");
          gr.addColorStop(1, "rgba(176,64,255,0)");
          c.fillStyle = gr;
          c.beginPath();
          c.arc(p.x, p.y, r * 2.5, 0, TAU);
          c.fill();
          c.globalCompositeOperation = "source-over";
          c.fillStyle = "#0a0010";
          c.beginPath();
          c.arc(p.x, p.y, r * 0.9, 0, TAU);
          c.fill();
          c.strokeStyle = "#B040FF";
          c.lineWidth = 2;
          c.beginPath();
          c.arc(p.x, p.y, r * 0.9, 0, TAU);
          c.stroke();
        } else if (style === "rainbow") {
          const hue = (TM * 200) % 360;
          c.globalCompositeOperation = "lighter";
          const gr = c.createRadialGradient(p.x, p.y, 1, p.x, p.y, r * 2.7);
          gr.addColorStop(0, `hsla(${hue},100%,70%,.6)`);
          gr.addColorStop(1, `hsla(${hue},100%,50%,0)`);
          c.fillStyle = gr;
          c.beginPath();
          c.arc(p.x, p.y, r * 2.7, 0, TAU);
          c.fill();
          c.globalCompositeOperation = "source-over";
          for (let i = 0; i < 5; i++) {
            const a0 = (i / 5) * TAU + TM * 4;
            c.fillStyle = `hsl(${(hue + i * 72) % 360},100%,60%)`;
            c.beginPath();
            c.moveTo(p.x, p.y);
            c.arc(p.x, p.y, r * 0.85, a0, a0 + TAU / 5);
            c.closePath();
            c.fill();
          }
        } else if (style === "flame") {
          c.globalCompositeOperation = "lighter";
          const gr = c.createRadialGradient(p.x, p.y, 1, p.x, p.y, r * 2.7);
          gr.addColorStop(0, "rgba(255,69,0,.65)");
          gr.addColorStop(1, "rgba(255,69,0,0)");
          c.fillStyle = gr;
          c.beginPath();
          c.arc(p.x, p.y, r * 2.7, 0, TAU);
          c.fill();
          c.globalCompositeOperation = "source-over";
          c.fillStyle = "#FF4500";
          c.beginPath();
          c.arc(p.x, p.y, r * 0.8, 0, TAU);
          c.fill();
          c.fillStyle = "#FFEE00";
          c.beginPath();
          c.arc(p.x, p.y, r * 0.45, 0, TAU);
          c.fill();
        } else if (style === "ice") {
          c.globalCompositeOperation = "lighter";
          const gr = c.createRadialGradient(p.x, p.y, 1, p.x, p.y, r * 2.5);
          gr.addColorStop(0, "rgba(0,221,255,.6)");
          gr.addColorStop(1, "rgba(0,221,255,0)");
          c.fillStyle = gr;
          c.beginPath();
          c.arc(p.x, p.y, r * 2.5, 0, TAU);
          c.fill();
          c.globalCompositeOperation = "source-over";
          const ang = Math.atan2(p.vy, p.vx);
          c.save();
          c.translate(p.x, p.y);
          c.rotate(ang);
          c.fillStyle = "#E8FFFF";
          c.strokeStyle = "#00DDFF";
          c.lineWidth = 1.5;
          c.beginPath();
          c.moveTo(r * 1.2, 0);
          c.lineTo(0, -r * 0.7);
          c.lineTo(-r * 1, 0);
          c.lineTo(0, r * 0.7);
          c.closePath();
          c.fill();
          c.stroke();
          c.restore();
        } else {
          if (Q.glow) {
            c.globalCompositeOperation = "lighter";
            c.fillStyle = rgba(col, 0.35);
            c.beginPath();
            c.arc(p.x, p.y, r * 2.7, 0, TAU);
            c.fill();
            c.globalCompositeOperation = "source-over";
          }
          c.fillStyle = p.e === 4 ? "#1a0030" : ELEMS[p.e].core;
          c.beginPath();
          c.arc(p.x, p.y, r * 0.8, 0, TAU);
          c.fill();
          c.lineWidth = 2.5;
          c.strokeStyle = col;
          c.stroke();
        }
      }

      function drawProjectiles(c) {
        for (const p of PR.active) {
          if (!p.on) continue;
          const col = p.col || elemColor(p.e);
          if (p.trailPts && p.trailPts.length > 1) {
            const tp = p.trailPts,
              N = tp.length;
            c.globalCompositeOperation = Q.glow ? "lighter" : "source-over";
            c.lineCap = "round";
            for (let i = 1; i < N; i++) {
              const a = i / N;
              c.strokeStyle = rgba(col, 0.12 * a);
              c.lineWidth = p.r * 5 * a;
              c.beginPath();
              c.moveTo(tp[i - 1].x, tp[i - 1].y);
              c.lineTo(tp[i].x, tp[i].y);
              c.stroke();
            }
            c.globalCompositeOperation = "source-over";
            for (let i = 1; i < N; i++) {
              const a = i / N;
              c.strokeStyle = "rgba(255,255,255," + 0.85 * a + ")";
              c.lineWidth = p.r * 1.3 * a;
              c.beginPath();
              c.moveTo(tp[i - 1].x, tp[i - 1].y);
              c.lineTo(tp[i].x, tp[i].y);
              c.stroke();
            }
          }
          drawProjShape(c, p, col);
        }
      }

      function drawEffects(c) {
        for (const sf of G.spawnFx) {
          const k = clamp(sf.t / sf.m, 0, 1),
            h = 280 * k,
            w = (sf.w || 24) * (0.6 + 0.4 * k);
          const g = c.createLinearGradient(sf.x, sf.y - h, sf.x, sf.y);
          g.addColorStop(0, rgba(sf.c, 0));
          g.addColorStop(0.5, rgba(sf.c, 0.35 * k));
          g.addColorStop(1, rgba(sf.c, 0.85 * k));
          c.fillStyle = g;
          c.fillRect(sf.x - w / 2, sf.y - h, w, h);
          const rg = c.createRadialGradient(sf.x, sf.y, 2, sf.x, sf.y, 40 * k);
          rg.addColorStop(0, rgba(sf.c, 0.9 * k));
          rg.addColorStop(1, rgba(sf.c, 0));
          c.fillStyle = rg;
          c.beginPath();
          c.ellipse(sf.x, sf.y, 40 * k, 14 * k, 0, 0, TAU);
          c.fill();
        }
        for (const r of G.rings) {
          const k = 1 - r.l / r.m,
            rad = lerp(r.r0, r.r1, ease(k));
          c.globalAlpha = clamp((r.l / r.m) * 1.4, 0, 1);
          c.lineWidth = Math.max(0.5, r.w * (r.l / r.m));
          c.strokeStyle = r.c;
          c.beginPath();
          c.arc(r.x, r.y, rad, 0, TAU);
          c.stroke();
        }
        c.globalAlpha = 1;
        c.lineJoin = "round";
        c.lineCap = "round";
        for (const b of G.bolts) {
          const a = clamp(b.l * 4, 0, 1);
          c.globalAlpha = a;
          c.lineWidth = b.w * 2.2;
          c.strokeStyle = rgba(b.c, 0.5);
          c.beginPath();
          b.pts.forEach((v, i) =>
            i ? c.lineTo(v[0], v[1]) : c.moveTo(v[0], v[1]),
          );
          c.stroke();
          c.lineWidth = b.w * 0.6;
          c.strokeStyle = "#fff";
          c.stroke();
        }
        c.globalAlpha = 1;
        for (const t of G.tele) {
          const k = t.t / t.m;
          c.fillStyle = rgba(t.c, 0.14 + 0.1 * (1 - k));
          c.strokeStyle = rgba(t.c, 0.9);
          c.lineWidth = 2;
          c.setLineDash([8, 6]);
          c.beginPath();
          c.arc(t.x, t.y, t.r, 0, TAU);
          c.fill();
          c.stroke();
          c.setLineDash([]);
          c.beginPath();
          c.arc(t.x, t.y, t.r * (1 - k), 0, TAU);
          c.stroke();
        }
        if (G.pillar) {
          const pl = G.pillar;
          pl.t -= 1 / 60;
          if (pl.t <= 0) G.pillar = null;
          else {
            const g = c.createLinearGradient(pl.x, pl.y - 900, pl.x, pl.y);
            g.addColorStop(0, "rgba(255,215,0,0)");
            g.addColorStop(
              1,
              "rgba(255,230,120," + clamp(pl.t, 0, 1) * 0.8 + ")",
            );
            c.fillStyle = g;
            c.fillRect(pl.x - 40, pl.y - 900, 80, 900);
          }
        }
      }

      function drawDebris(c) {
        for (const d of G.debris) {
          c.save();
          c.translate(d.x, d.y);
          c.rotate(d.ang + 1.2);
          c.lineCap = "round";
          c.strokeStyle = "#000";
          c.lineWidth = 5;
          c.beginPath();
          c.moveTo(0, -18);
          c.lineTo(0, 18);
          c.stroke();
          c.strokeStyle = "#8B6F3F";
          c.lineWidth = 3;
          c.stroke();
          c.restore();
        }
      }
      function drawPickup(c, p) {
        const bob = Math.sin(TM * 3 + p.id) * 3,
          col = PK[p.type].col;
        if (p.life < 6 && Math.floor(TM * 6) % 2) return;
        c.fillStyle = "rgba(0,0,0,.35)";
        c.beginPath();
        c.ellipse(p.x, p.y, 11, 4, 0, 0, TAU);
        c.fill();
        c.globalCompositeOperation = Q.glow ? "lighter" : "source-over";
        const g = c.createRadialGradient(
          p.x,
          p.y - 14 + bob,
          2,
          p.x,
          p.y - 14 + bob,
          26,
        );
        g.addColorStop(0, rgba(col, 0.55));
        g.addColorStop(1, rgba(col, 0));
        c.fillStyle = g;
        c.beginPath();
        c.arc(p.x, p.y - 14 + bob, 26, 0, TAU);
        c.fill();
        c.globalCompositeOperation = "source-over";
        const im = IC[p.type];
        if (im) c.drawImage(im, p.x - 16, p.y - 32 + bob, 32, 32);
      }

      function drawAimIndicators(c) {
        const p = G.player;
        if (!p || p.dead) return;
        for (const n in B) {
          if (B[n].st !== 2) continue;
          const a = aimFor(n),
            cx = p.x,
            cy = p.y - 14,
            ca = Math.cos(a.ang),
            sa = Math.sin(a.ang),
            pul = 0.6 + 0.4 * Math.sin(TM * 8);
          if (n === "dash") {
            let L = 180,
              dx = clamp(p.x + ca * L, 0, 2500),
              dy = p.y + sa * L;
            const dd = dist(dx, dy, CX, CY);
            if (dd > R_ARENA - 30) {
              dx = CX + ((dx - CX) / dd) * (R_ARENA - 30);
              dy = CY + ((dy - CY) / dd) * (R_ARENA - 30);
            }
            c.lineCap = "round";
            c.strokeStyle = "rgba(0,240,255,.35)";
            c.lineWidth = 12;
            c.beginPath();
            c.moveTo(cx, cy);
            c.lineTo(dx, dy - 14);
            c.stroke();
            c.strokeStyle = "#00F0FF";
            c.lineWidth = 4;
            c.stroke();
            drawGhostMage(c, dx, dy, ca >= 0 ? 1 : -1, "#00F0FF", 0.35);
          } else if (n === "attack") {
            const col = elemColor(p.elem),
              len = 300 * (p.elem === 1 ? 1.2 : 1),
              ex = cx + ca * len,
              ey = cy + sa * len;
            const g = c.createLinearGradient(cx, cy, ex, ey);
            g.addColorStop(0, rgba(col, 0.95));
            g.addColorStop(1, rgba(col, 0));
            c.strokeStyle = g;
            c.lineWidth = 3;
            c.lineCap = "round";
            c.setLineDash([2, 9]);
            c.beginPath();
            c.moveTo(cx + ca * 20, cy + sa * 20);
            c.lineTo(ex, ey);
            c.stroke();
            c.setLineDash([]);
          } else {
            const u = ultKey(p),
              col = elemColor(u.e),
              ai = ULT_AIM[u.key] || ["circle", 120],
              tx = cx + ca * a.d,
              ty = cy + sa * a.d;
            if (ai[0] === "circle" || ai[0] === "self") {
              const px = ai[0] === "self" ? cx : tx,
                py = ai[0] === "self" ? cy : ty,
                r = ai[1];
              c.fillStyle = rgba(col, 0.3);
              c.strokeStyle = col;
              c.lineWidth = 2;
              c.beginPath();
              c.arc(px, py, r, 0, TAU);
              c.fill();
              c.stroke();
            } else if (ai[0] === "line") {
              c.strokeStyle = col;
              c.lineWidth = 6;
              c.globalAlpha = 0.4 * pul + 0.3;
              c.beginPath();
              c.moveTo(cx, cy);
              c.lineTo(cx + ca * ai[1], cy + sa * ai[1]);
              c.stroke();
              c.globalAlpha = 1;
            } else {
              c.strokeStyle = rgba(col, 0.35 + 0.4 * pul);
              c.lineWidth = 6;
              c.beginPath();
              c.arc(cx, cy, 60 + 340 * ((TM * 1.2) % 1), 0, TAU);
              c.stroke();
            }
          }
        }
      }

      function drawWorldText(c) {
        for (const p of PT.active) {
          if (!p.on) continue;
          c.globalAlpha = clamp((p.l / p.m) * 2, 0, 1);
          const s = p.s * (1 + 0.4 * clamp(p.l / p.m - 0.7, 0, 1) * 3);
          txt(c, p.txt, p.x, p.y, s, p.c, "center", 3);
        }
        c.globalAlpha = 1;
      }

      function updateCamera(rd) {
        let tg = G.player && !G.player.dead ? G.player : null;
        if (!tg)
          tg = G.mages.find((m) => !m.dead && m !== G.player) || G.player;
        if (tg) {
          const k = 1 - Math.exp(-rd * 9);
          cam.x += (tg.x - cam.x) * k;
          cam.y += (tg.y - 14 - cam.y) * k;
        }
        FX.zoom -= FX.zoom * Math.min(1, rd * 3);
        cam.z +=
          (1 + FX.zoom + (G.player && G.player.dead ? 0.12 : 0) - cam.z) *
          Math.min(1, rd * 8);
        FX.flash = Math.max(0, FX.flash - rd * 1.6);
        FX.dark = Math.max(0, FX.dark - rd * 2);
        FX.chroma = Math.max(0, FX.chroma - rd * 12);
        FX.vig = Math.max(0, FX.vig - rd * 1.6);
        if (state !== "PAUSED") FX.shake *= Math.pow(0.85, rd * 60);
        if (FX.shake > 0.4) {
          FX.shakeT += rd * 55;
          cam.sx = Math.sin(FX.shakeT) * FX.shake * 0.75;
          cam.sy = Math.cos(FX.shakeT * 1.7) * FX.shake * 0.55;
        } else {
          FX.shake = 0;
          cam.sx = 0;
          cam.sy = 0;
        }
      }

      function renderWorld() {
        const th = THEMES[G.theme] || THEMES.lava,
          s = viewScale();
        ctx.fillStyle = th.outside;
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.translate(Math.round(W / 2), Math.round(H / 2));
        ctx.scale(s, s);
        ctx.translate(-cam.x + cam.sx, -cam.y + cam.sy);
        const hw = W / 2 / s + 90,
          hh = H / 2 / s + 90,
          vx0 = cam.x - hw,
          vx1 = cam.x + hw,
          vy0 = cam.y - hh,
          vy1 = cam.y + hh;
        drawArenaLayers(ctx, vx0, vy0, vx1, vy1, th);
        if (G.mode !== "survival" && G.safeR < R_ARENA - 1) {
          ctx.fillStyle =
            "rgba(255,40,0," + (0.16 + 0.07 * Math.sin(TM * 4)) + ")";
          ctx.beginPath();
          ctx.arc(CX, CY, R_ARENA, 0, TAU);
          ctx.arc(CX, CY, G.safeR, 0, TAU, true);
          ctx.fill();
          ctx.save();
          ctx.shadowColor = "rgba(255,140,80,0.85)";
          ctx.shadowBlur = 30;
          ctx.strokeStyle = "rgba(255,140,80,0.55)";
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.arc(CX, CY, G.safeR, 0, TAU);
          ctx.stroke();
          ctx.strokeStyle = "rgba(255,180,100,0.35)";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(CX, CY, G.safeR, 0, TAU);
          ctx.stroke();
          ctx.restore();
        }
        drawAmbient(ctx);
        for (const z of G.zones)
          if (z.style === "ice" || z.style === "hole") drawZone(ctx, z);
        DR.length = 0;
        const inV = (x, y, m) =>
          x > vx0 - m && x < vx1 + m && y > vy0 - m && y < vy1 + m + 60;
        for (const m of G.mages)
          if (inV(m.x, m.y, 80)) DR.push({ y: m.y, o: m, t: 0 });
        for (const m of G.monsters)
          if (!m.dead && inV(m.x, m.y, 80)) DR.push({ y: m.y, o: m, t: 1 });
        for (const p of G.pickups)
          if (inV(p.x, p.y, 40)) DR.push({ y: p.y, o: p, t: 2 });
        for (const r of G.rocks)
          if (inV(r.x, r.y, 90)) DR.push({ y: r.y + r.r * 0.3, o: r, t: 3 });
        DR.sort((a, b) => a.y - b.y);
        for (const d of DR) {
          if (d.t === 0) drawMage(ctx, d.o);
          else if (d.t === 1) drawMonster(ctx, d.o);
          else if (d.t === 2) drawPickup(ctx, d.o);
          else drawRock(ctx, d.o, th);
        }
        drawDebris(ctx);
        for (const z of G.zones) if (z.style === "tornado") drawZone(ctx, z);
        drawEffects(ctx);
        drawProjectiles(ctx);
        drawParticles(ctx, vx0, vy0, vx1, vy1);
        drawWorldText(ctx);
        for (const cel of G.celebrate) {
          const k = cel.life / cel.maxLife;
          ctx.save();
          ctx.translate(cel.x, cel.y);
          ctx.rotate(cel.rot);
          ctx.globalAlpha = clamp(k * 1.5, 0, 1);
          ctx.font = "900 " + cel.size + "px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(cel.emoji, 0, 0);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        drawAimIndicators(ctx);
        ctx.restore();
      }

      /* HUD */
      function getBuffs(m) {
        const r = [],
          f = m.fx;
        if (f.shield > 0) r.push(["shield", f.shield / 25]);
        if (f.haste > 0) r.push(["haste", f.haste / 8]);
        if (m.aura > 0) r.push(["m" + m.auraElem, m.aura / 10]);
        if (f.tslow > 0) r.push(["time", f.tslow / 4]);
        if (f.burn > 0) r.push(["e0", f.burn / 3]);
        if (f.freeze > 0) r.push(["e1", f.freeze / 3]);
        else if (f.slow > 0) r.push(["e1", f.slow / 3]);
        if (f.amp > 0) r.push(["e4", f.amp / 5]);
        return r;
      }
      function drawBuffRow(c, m, cx, y, u) {
        const bs = getBuffs(m);
        if (!bs.length) return;
        const sz = 16 * u,
          gap = 3 * u,
          tw = bs.length * (sz + gap) - gap;
        let x = cx - tw / 2;
        for (const b of bs) {
          const im = IC[b[0]];
          c.fillStyle = "rgba(0,0,0,.55)";
          c.beginPath();
          c.arc(x + sz / 2, y + sz / 2, sz / 2 + 1, 0, TAU);
          c.fill();
          if (im) c.drawImage(im, x, y, sz, sz);
          c.strokeStyle = "#FFD84A";
          c.lineWidth = 2;
          c.beginPath();
          c.arc(
            x + sz / 2,
            y + sz / 2,
            sz / 2 + 1,
            -Math.PI / 2,
            -Math.PI / 2 + TAU * clamp(b[1], 0, 1),
          );
          c.stroke();
          x += sz + gap;
        }
      }

      function drawNameplates() {
        const u = UIS * 1.15,
          c = ctx;
        for (const m of G.mages) {
          if (m.dead && m.alpha < 0.1) continue;
          const sp = w2s(m.x, m.y - 52 - m.lev);
          if (sp.x < -80 || sp.x > W + 80 || sp.y < -60 || sp.y > H + 60)
            continue;
          c.globalAlpha = m.dead ? m.alpha : 1;
          const x = Math.round(sp.x),
            me = m === G.player;
          let y = Math.round(sp.y) - 4 * u;
          if (!me && !m.dead) {
            const w = 66 * u,
              hh = 5.5 * u,
              mh = 3.5 * u;
            c.fillStyle = "#000";
            c.fillRect(x - w / 2 - 1, y - mh - 1, w + 2, mh + 2);
            const mg = c.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
            mg.addColorStop(0, "#2060FF");
            mg.addColorStop(1, "#60C0FF");
            c.fillStyle = mg;
            c.fillRect(x - w / 2, y - mh, w * clamp(m.mana / 100, 0, 1), mh);
            y -= mh + 3 * u;
            const hr = clamp(m.hp / m.maxHp, 0, 1);
            c.fillStyle = "#000";
            c.fillRect(x - w / 2 - 2, y - hh - 2, w + 4, hh + 4);
            const g = c.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
            g.addColorStop(0, "#FF2020");
            g.addColorStop(0.5, "#FFD020");
            g.addColorStop(1, "#30E040");
            c.fillStyle = g;
            c.fillRect(x - w / 2, y - hh, w * hr, hh);
            c.strokeStyle = "#DAA520";
            c.lineWidth = 1.5;
            c.strokeRect(x - w / 2 - 1.5, y - hh - 1.5, w + 3, hh + 3);
            y -= hh + 8 * u;
          }
          c.font = "800 " + 13 * u + 'px "Segoe UI",Arial,sans-serif';
          const tw = c.measureText(m.name).width,
            ic = 13 * u,
            total = tw + (me ? 0 : ic + 3 * u);
          let tx = x - total / 2;
          if (!me) {
            const im = IC["e" + m.elem];
            if (im) c.drawImage(im, tx, y - ic / 2 - 1, ic, ic);
            tx += ic + 3 * u;
          }
          txt(c, m.name, tx, y, 13 * u, me ? "#ffe27a" : "#fff", "left", 3);
          if (!m.dead) drawBuffRow(c, m, x, y - 28 * u, u);
        }
        c.globalAlpha = 1;
        const p = G.player;
        if (p)
          for (const h of G.headIcons) {
            const sp = w2s(p.x, p.y - 80 - p.lev),
              k = h.t / 1.2,
              im = IC[h.type];
            if (!im) continue;
            const sz = 32 * u * (1 + 0.2 * Math.sin(k * 6));
            c.globalAlpha = clamp((1 - k) * 1.6, 0, 1);
            const col = PK[h.type].col,
              y = sp.y - 30 * h.t * u - 18 * u;
            const g = c.createRadialGradient(sp.x, y, 2, sp.x, y, sz);
            g.addColorStop(0, rgba(col, 0.6));
            g.addColorStop(1, rgba(col, 0));
            c.fillStyle = g;
            c.beginPath();
            c.arc(sp.x, y, sz, 0, TAU);
            c.fill();
            c.drawImage(im, sp.x - sz / 2, y - sz / 2, sz, sz);
          }
        c.globalAlpha = 1;
      }

      function drawPanel(c, x, y, w, h, r) {
        rr(c, x, y, w, h, r || 12);
        c.fillStyle = "rgba(20,10,30,.6)";
        c.fill();
        c.lineWidth = 2;
        c.strokeStyle = "rgba(218,165,32,.8)";
        c.stroke();
      }
      function ultIconFor(p) {
        const u = ultKey(p);
        if (u.mega) return { img: IC["m" + u.e], mega: true, e: u.e };
        if (p.runes.length >= 2) return { img: IC["c" + u.key], e: u.e };
        return {
          img: IC[
            "e" + (p.runes.length ? p.runes[p.runes.length - 1] : p.elem)
          ],
          e: u.e,
        };
      }
      function drawRing(c, x, y, r, prog, col, w) {
        c.lineWidth = w;
        c.strokeStyle = "rgba(0,0,0,.5)";
        c.beginPath();
        c.arc(x, y, r, 0, TAU);
        c.stroke();
        c.strokeStyle = col;
        c.lineCap = "round";
        c.beginPath();
        c.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(prog, 0, 1));
        c.stroke();
        c.lineCap = "butt";
      }

      function drawActionBtn(c, n, p, L, ui) {
        const b = L[n],
          st = B[n],
          held = st.st > 0,
          aimm = st.st === 2,
          u = UIS;
        const sh = st.shake > 0 ? Math.sin(TM * 60) * 4 * u : 0,
          scl = held ? 1.1 : 1,
          pul = aimm ? 0.6 + 0.4 * Math.sin(TM * 12) : 0;
        c.save();
        c.translate(b.x + sh, b.y);
        c.scale(scl, scl);
        let ready = true,
          prog = 1,
          rc = "#fff",
          img = null,
          key = "",
          mega = false;
        if (n === "dash") {
          prog =
            1 -
            clamp(p.dashCd / (2 * (p.elem === 3 ? 0.85 : 1) * p.up.dash), 0, 1);
          ready = p.dashCd <= 0;
          rc = "#00F0FF";
          img = IC.dash;
          key = "SPACE";
        } else if (n === "attack") {
          prog =
            clamp(1 - p.atkCd / 0.35, 0, 1) * (p.mana >= 15 ? 1 : p.mana / 15);
          ready = p.mana >= 15;
          rc = elemColor(p.elem);
          img = IC["e" + p.elem];
          key = "LMB";
        } else {
          if (ui) {
            img = ui.img;
            mega = !!ui.mega;
          }
          prog = p.ultCharge / 100;
          ready = p.ultCharge >= 100;
          rc = ready ? "#FFD84A" : elemColor(ui ? ui.e : p.elem);
          key = "Q/RMB";
        }
        const glow = n === "ult" && ready ? 0.5 + 0.3 * Math.sin(TM * 6) : 0;
        if (glow || held) {
          c.shadowColor = held ? rc : "#FFD84A";
          c.shadowBlur = (held ? 22 + pul * 14 : 18 * glow + 8) * u;
        }
        const g = c.createRadialGradient(0, -b.r * 0.3, b.r * 0.1, 0, 0, b.r);
        g.addColorStop(0, "rgba(70,40,100,.9)");
        g.addColorStop(1, "rgba(15,5,25,.92)");
        c.beginPath();
        c.arc(0, 0, b.r, 0, TAU);
        c.fillStyle = g;
        c.fill();
        c.lineWidth = (mega ? 5 : 3) * u;
        c.strokeStyle =
          n === "dash"
            ? "#00F0FF"
            : mega || (n === "ult" && ready)
              ? "#FFD84A"
              : "#DAA520";
        c.stroke();
        c.shadowBlur = 0;
        if (img) {
          const s = b.r * 1.35;
          c.globalAlpha = ready ? 1 : 0.55;
          c.drawImage(img, -s / 2, -s / 2, s, s);
          c.globalAlpha = 1;
        }
        drawRing(
          c,
          0,
          0,
          b.r + 6 * u,
          prog,
          ready && n === "ult" ? "#FFD84A" : rc,
          4 * u,
        );
        if (!touchMode) {
          c.font = "800 " + 9 * u + "px Arial";
          c.textAlign = "center";
          c.fillStyle = "rgba(255,255,255,.7)";
          c.fillText(key, 0, b.r + 18 * u);
        }
        c.restore();
      }

      function drawHUD() {
        const c = ctx,
          u = UIS,
          p = G.player;
        if (!p) return;
        const L = btnLayout(),
          _uk = ultKey(p),
          _ui = ultIconFor(p),
          _buffs = getBuffs(p);
        if (SAVE.devMode) {
          c.font = "800 " + 12 * u + "px monospace";
          c.textAlign = "center";
          c.fillStyle = "#FF40FF";
          c.shadowColor = "#FF00FF";
          c.shadowBlur = 8;
          c.fillText("DEV MODE", W / 2, H - 6 * u);
          c.shadowBlur = 0;
        }
        const px = 10 * u,
          py = 10 * u,
          pw = 250 * u,
          ph = 80 * u;
        drawPanel(c, px, py, pw, ph, 14 * u);
        const cx = px + 42 * u,
          cy = py + ph / 2,
          pr = 30 * u;
        c.save();
        c.beginPath();
        c.arc(cx, cy, pr, 0, TAU);
        c.fillStyle = "#0a0510";
        c.fill();
        c.clip();
        c.translate(cx, cy + 6 * u);
        const k = pr / 22;
        c.scale(k, k);
        c.translate(-p.x, -(p.y - 30));
        drawMage(c, p, { noShadow: true });
        c.restore();
        c.beginPath();
        c.arc(cx, cy, pr, 0, TAU);
        c.lineWidth = 3 * u;
        c.strokeStyle = "#DAA520";
        c.stroke();
        const bx = px + 80 * u,
          bw = 160 * u;
        txt(
          c,
          p.name + (G.mode === "survival" ? "  Lv." + p.level : ""),
          bx,
          py + 15 * u,
          14 * u,
          "#fff",
          "left",
          3,
        );
        const hr = clamp(p.hp / p.maxHp, 0, 1);
        rr(c, bx, py + 28 * u, bw, 13 * u, 5 * u);
        c.fillStyle = "#000";
        c.fill();
        const hg = c.createLinearGradient(bx, 0, bx + bw, 0);
        hg.addColorStop(0, "#FF2020");
        hg.addColorStop(0.5, "#FFD020");
        hg.addColorStop(1, "#30E040");
        rr(c, bx + 1, py + 29 * u, Math.max(0, (bw - 2) * hr), 11 * u, 4 * u);
        c.fillStyle = hg;
        c.fill();
        rr(c, bx, py + 28 * u, bw, 13 * u, 5 * u);
        c.lineWidth = 1.5;
        c.strokeStyle = "#DAA520";
        c.stroke();
        txt(
          c,
          Math.ceil(Math.max(0, p.hp)) + "/" + p.maxHp,
          bx + bw / 2,
          py + 34.5 * u,
          10 * u,
          "#fff",
          "center",
          2,
        );
        rr(c, bx, py + 46 * u, bw, 9 * u, 4 * u);
        c.fillStyle = "#000";
        c.fill();
        const mg = c.createLinearGradient(bx, 0, bx + bw, 0);
        mg.addColorStop(0, "#2060FF");
        mg.addColorStop(1, "#60D0FF");
        rr(
          c,
          bx + 1,
          py + 47 * u,
          Math.max(0, (bw - 2) * clamp(p.mana / 100, 0, 1)),
          7 * u,
          3 * u,
        );
        c.fillStyle = mg;
        c.fill();
        rr(c, bx, py + 46 * u, bw, 9 * u, 4 * u);
        c.lineWidth = 1.5;
        c.strokeStyle = "#DAA520";
        c.stroke();
        if (G.mode === "survival") {
          rr(c, bx, py + 60 * u, bw, 5 * u, 2 * u);
          c.fillStyle = "#000";
          c.fill();
          rr(
            c,
            bx,
            py + 60 * u,
            bw * clamp(p.xp / p.xpNeed, 0, 1),
            5 * u,
            2 * u,
          );
          c.fillStyle = "#B060FF";
          c.fill();
        }
        if (G.online && NET.ping)
          txt(
            c,
            t("ping") + ": " + NET.ping + " ms",
            px + 4 * u,
            py + ph + 12 * u,
            11 * u,
            "#bfe",
            "left",
            2,
          );
        const ts = Math.floor(G.time),
          tm = Math.floor(ts / 60) + ":" + String(ts % 60).padStart(2, "0");
        txt(c, tm, W / 2, 24 * u, 32 * u, "#fff", "center", (5 * u) / 1.5);
        const alive = G.mages.filter((m) => !m.dead).length;
        txt(
          c,
          G.mode === "survival"
            ? t("wave") + " " + G.wave + "  ·  ☠ " + G.kills
            : "👥 " + alive + "/" + G.mages.length,
          W / 2,
          54 * u,
          15 * u,
          "#ffd23a",
          "center",
          3,
        );
        const pb = L.pause;
        c.beginPath();
        c.arc(pb.x, pb.y, pb.r, 0, TAU);
        c.fillStyle = "rgba(20,10,30,.7)";
        c.fill();
        c.lineWidth = 2;
        c.strokeStyle = "#DAA520";
        c.stroke();
        c.drawImage(
          IC.ico_pause,
          pb.x - pb.r * 0.6,
          pb.y - pb.r * 0.6,
          pb.r * 1.2,
          pb.r * 1.2,
        );
        const boss = G.monsters.find((m) => m.boss && !m.dead);
        if (boss) {
          const bw2 = Math.min(360 * u, W * 0.5),
            bx2 = W / 2 - bw2 / 2;
          rr(c, bx2, 70 * u, bw2, 12 * u, 5 * u);
          c.fillStyle = "#000";
          c.fill();
          rr(
            c,
            bx2,
            70 * u,
            bw2 * clamp(boss.hp / boss.maxHp, 0, 1),
            12 * u,
            5 * u,
          );
          c.fillStyle = "#E02020";
          c.fill();
          rr(c, bx2, 70 * u, bw2, 12 * u, 5 * u);
          c.strokeStyle = "#DAA520";
          c.lineWidth = 2;
          c.stroke();
          txt(c, boss.name, W / 2, 96 * u, 13 * u, "#ff8060", "center", 3);
        }
        const mr = 44 * u,
          mx = W - 10 * u - mr,
          my = 52 * u + mr,
          ms = mr / R_ARENA;
        c.save();
        c.beginPath();
        c.arc(mx, my, mr, 0, TAU);
        c.fillStyle = "rgba(10,5,15,.7)";
        c.fill();
        c.clip();
        c.strokeStyle = "rgba(255,255,255,.7)";
        c.lineWidth = 1.5;
        c.beginPath();
        c.arc(mx, my, G.safeR * ms, 0, TAU);
        c.stroke();
        for (const pk of G.pickups) {
          c.fillStyle = PK[pk.type].col;
          c.fillRect(
            mx + (pk.x - CX) * ms - 1,
            my + (pk.y - CY) * ms - 1,
            2,
            2,
          );
        }
        for (const mo of G.monsters) {
          c.fillStyle = mo.boss ? "#ff00ff" : "#ff4040";
          const sz = mo.boss ? 4 : 2;
          c.fillRect(
            mx + (mo.x - CX) * ms - sz / 2,
            my + (mo.y - CY) * ms - sz / 2,
            sz,
            sz,
          );
        }
        for (const m of G.mages) {
          if (m.dead) continue;
          c.fillStyle =
            m === p ? "#fff" : G.mode === "survival" ? "#50ff70" : "#ff5050";
          c.beginPath();
          c.arc(
            mx + (m.x - CX) * ms,
            my + (m.y - CY) * ms,
            m === p ? 3.2 : 2.4,
            0,
            TAU,
          );
          c.fill();
        }
        c.restore();
        c.beginPath();
        c.arc(mx, my, mr, 0, TAU);
        c.lineWidth = 2.5;
        c.strokeStyle = "#DAA520";
        c.stroke();
        const ry = H - 52 * u,
          rx = 16 * u;
        for (let i = 0; i < 3; i++) {
          const x = rx + i * 38 * u + 16 * u;
          c.beginPath();
          c.arc(x, ry, 15 * u, 0, TAU);
          c.fillStyle = "rgba(20,10,30,.7)";
          c.fill();
          c.lineWidth = 2;
          c.strokeStyle =
            p.runes[i] !== undefined
              ? elemColor(p.runes[i])
              : "rgba(218,165,32,.5)";
          c.stroke();
          if (p.runes[i] !== undefined)
            c.drawImage(
              IC["e" + p.runes[i]],
              x - 12 * u,
              ry - 12 * u,
              24 * u,
              24 * u,
            );
        }
        if (p.multiStacks > 1) {
          const mx2 = rx + 3 * 38 * u + 16 * u + 8 * u;
          c.beginPath();
          c.arc(mx2, ry, 15 * u, 0, TAU);
          c.fillStyle = "rgba(40,10,50,.85)";
          c.fill();
          c.lineWidth = 2.5;
          c.strokeStyle = "#FF60FF";
          c.stroke();
          if (IC.mult)
            c.drawImage(IC.mult, mx2 - 11 * u, ry - 11 * u, 22 * u, 22 * u);
          c.font = "900 " + 14 * u + 'px "Segoe UI",Arial';
          const lbl = "×" + p.multiStacks,
            tw = c.measureText(lbl).width;
          c.fillStyle = "rgba(0,0,0,.75)";
          c.beginPath();
          if (c.roundRect)
            c.roundRect(mx2 + 12 * u, ry - 10 * u, tw + 6 * u, 20 * u, 5 * u);
          else c.rect(mx2 + 12 * u, ry - 10 * u, tw + 6 * u, 20 * u);
          c.fill();
          txt(c, lbl, mx2 + 15 * u, ry, 14 * u, "#FFB0FF", "left", 3);
        }
        const nm = t("ult") + ": " + ultName(_uk.key);
        c.font = "800 " + 13 * u + 'px "Segoe UI",Arial';
        if (_ui.img)
          c.drawImage(_ui.img, rx, H - 28 * u - 10 * u, 20 * u, 20 * u);
        txt(
          c,
          nm,
          rx + 24 * u,
          H - 28 * u,
          13 * u,
          p.ultCharge >= 100 ? "#FFD84A" : "#ccc",
          "left",
          3,
        );
        let bxx = rx;
        for (const b of _buffs) {
          const sz = 24 * u,
            im = IC[b[0]];
          c.fillStyle = "rgba(0,0,0,.55)";
          c.beginPath();
          c.arc(bxx + sz / 2, H - 100 * u, sz / 2 + 2, 0, TAU);
          c.fill();
          if (im) c.drawImage(im, bxx, H - 100 * u - sz / 2, sz, sz);
          drawRing(
            c,
            bxx + sz / 2,
            H - 100 * u,
            sz / 2 + 2,
            b[1],
            "#FFD84A",
            2.5,
          );
          bxx += sz + 8 * u;
        }
        drawActionBtn(c, "dash", p, L);
        drawActionBtn(c, "attack", p, L);
        drawActionBtn(c, "ult", p, L, _ui);
        if (joy.on) {
          c.globalAlpha = 0.35;
          c.beginPath();
          c.arc(joy.sx, joy.sy, 60 * u, 0, TAU);
          c.fillStyle = "#fff";
          c.fill();
          c.globalAlpha = 0.75;
          c.beginPath();
          c.arc(joy.cx, joy.cy, 26 * u, 0, TAU);
          c.fillStyle = "#DAA520";
          c.fill();
          c.globalAlpha = 1;
        }
        if (G.notice) {
          const n = G.notice,
            a = clamp(Math.min(n.t * 5, (2 - n.t) * 3), 0, 1);
          c.globalAlpha = a;
          c.font = "800 " + 16 * u + "px Arial";
          const w = c.measureText(n.txt).width + 36 * u,
            y = 118 * u - (1 - a) * 10;
          drawPanel(c, W / 2 - w / 2, y, w, 30 * u, 15 * u);
          txt(c, n.txt, W / 2, y + 15 * u, 16 * u, n.c, "center", 3);
          c.globalAlpha = 1;
        }
        G.ann.forEach((a, i) => {
          const k = a.t,
            sc = k < 0.25 ? lerp(1.7, 1, ease(k / 0.25)) : 1,
            al = k > 1.4 ? clamp((1.8 - k) / 0.4, 0, 1) : 1,
            fs = clamp(64 * u * 0.8, 30, 80) * sc;
          c.save();
          c.globalAlpha = al;
          c.shadowColor = a.c;
          c.shadowBlur = 16;
          txt(
            c,
            a.txt,
            W / 2,
            H * 0.3 + i * fs * 0.9,
            fs,
            a.c,
            "center",
            fs / 9,
          );
          c.restore();
        });
        if (G.online && p.dead && !G.over)
          txt(
            c,
            "👁 " + t("spectate"),
            W / 2,
            H - 40 * u,
            18 * u,
            "#fff",
            "center",
            3,
          );
      }

      function drawOverlays() {
        const c = ctx,
          p = G.player;
        if (p && !p.dead && p.hp < p.maxHp * 0.25) {
          const base = p.hp < p.maxHp * 0.15 ? 1.2 : 1,
            a = (0.3 + 0.3 * (0.5 + 0.5 * Math.sin(TM * TAU * 1.5))) * base;
          const g = c.createRadialGradient(
            W / 2,
            H / 2,
            Math.min(W, H) * 0.3,
            W / 2,
            H / 2,
            Math.max(W, H) * 0.75,
          );
          g.addColorStop(0, "rgba(180,0,0,0)");
          g.addColorStop(1, "rgba(200,0,0," + clamp(a, 0, 0.85) + ")");
          c.fillStyle = g;
          c.fillRect(0, 0, W, H);
        }
        if (FX.vig > 0) {
          const g = c.createRadialGradient(
            W / 2,
            H / 2,
            Math.min(W, H) * 0.35,
            W / 2,
            H / 2,
            Math.max(W, H) * 0.7,
          );
          g.addColorStop(0, "rgba(255,0,0,0)");
          g.addColorStop(1, "rgba(255,0,0," + FX.vig * 0.6 + ")");
          c.fillStyle = g;
          c.fillRect(0, 0, W, H);
        }
        if (aiming) {
          c.globalCompositeOperation = "saturation";
          c.fillStyle = "rgba(128,128,128,.12)";
          c.fillRect(0, 0, W, H);
          c.globalCompositeOperation = "source-over";
        }
        for (const g of G.gfx) {
          const k = g.t / g.m;
          if (g.k === "ice") {
            c.fillStyle = "rgba(120,220,255," + 0.16 * Math.min(1, k * 3) + ")";
            c.fillRect(0, 0, W, H);
          } else if (g.k === "blizzard") {
            c.fillStyle = "rgba(210,240,255," + 0.12 * Math.min(1, k * 3) + ")";
            c.fillRect(0, 0, W, H);
          } else if (g.k === "lava") {
            c.fillStyle =
              "rgba(255,80,0," +
              (0.1 + 0.06 * Math.sin(TM * 5)) * Math.min(1, k * 3) +
              ")";
            c.fillRect(0, 0, W, H);
          } else if (g.k === "wrath") {
            if (Math.floor(TM * 14) % 3 === 0) {
              c.fillStyle = "rgba(255,255,200,.12)";
              c.fillRect(0, 0, W, H);
            }
            c.fillStyle = "rgba(20,20,40,.25)";
            c.fillRect(0, 0, W, H);
          } else if (g.k === "oblivion") {
            const gr = c.createRadialGradient(
              W / 2,
              H / 2,
              20,
              W / 2,
              H / 2,
              Math.max(W, H) * 0.7,
            );
            gr.addColorStop(0, "rgba(0,0,0,.6)");
            gr.addColorStop(
              1,
              "rgba(40,0,70," + 0.5 * Math.min(1, k * 3) + ")",
            );
            c.fillStyle = gr;
            c.fillRect(0, 0, W, H);
          }
        }
        if (FX.dark > 0) {
          c.fillStyle = "rgba(0,0,0," + FX.dark * 0.6 + ")";
          c.fillRect(0, 0, W, H);
        }
        if (FX.flash > 0) {
          c.globalAlpha = clamp(FX.flash, 0, 1) * 0.8;
          c.fillStyle = FX.flashC;
          c.fillRect(0, 0, W, H);
          c.globalAlpha = 1;
        }
      }
      function renderGame() {
        renderWorld();
        drawNameplates();
        drawHUD();
        drawOverlays();
      }

      /* MENU */
      let menuMages = [],
        menuBolt = null,
        menuBoltT = 1;
      function initMenuMages() {
        const owned = (SAVE.skins || ["base"]).filter((id) => SKIN_BY_ID[id]),
          allIds = SKINS.map((s) => s.id),
          picks = [SAVE.skin],
          used = new Set(picks);
        const shuffledOwned = shuffle(owned.filter((id) => !used.has(id)));
        for (const id of shuffledOwned) {
          if (picks.length >= 5) break;
          picks.push(id);
          used.add(id);
        }
        const shuffledAll = shuffle(allIds.filter((id) => !used.has(id)));
        for (const id of shuffledAll) {
          if (picks.length >= 5) break;
          picks.push(id);
          used.add(id);
        }
        const showExtra = !(IS_MOBILE && !IS_TABLET);
        const positions = [
          { x: 0.5, y: 0.52, s: 1.15, f: 1 },
          { x: 0.25, y: 0.56, s: IS_TABLET ? 0.75 : 0.7, f: 1 },
          { x: 0.75, y: 0.56, s: IS_TABLET ? 0.75 : 0.7, f: -1 },
          { x: 0.08, y: 0.62, s: IS_TABLET ? 0.55 : 0.5, f: 1 },
          { x: 0.92, y: 0.62, s: IS_TABLET ? 0.55 : 0.5, f: -1 },
        ];
        const count = showExtra ? Math.min(5, picks.length) : 1;
        menuMages = picks.slice(0, count).map((skinId, i) => {
          const sk = SKIN_BY_ID[skinId] || SKINS[0],
            d = positions[i],
            staffId =
              i === 0
                ? SAVE.staff
                : SKIN_STAFF[skinId] || pick(STAFFS.map((s) => s.id));
          const m = new Mage({
            id: 900 + i,
            mantle: sk.mantle || colorHex(SAVE.color),
            skin: skinId,
            staff: staffId,
            name: "m",
          });
          m.def = d;
          m.facing = d.f;
          m.resetVerlet();
          if (i > 0 && !sk.mantle) {
            const cols = ["#8B2F3F", "#2F5A8B", "#2F8B5A", "#B8862F"];
            m.mantle = cols[(i - 1) % cols.length];
          }
          return m;
        });
        setMenuHero();
      }
      function setMenuHero() {
        const m = menuMages[0];
        if (!m) return;
        const sk = SKIN_BY_ID[SAVE.skin] || SKINS[0];
        m.skin = sk;
        m.staff = STAFF_BY_ID[SAVE.staff] || STAFFS[0];
        m.mantle =
          sk.mantle ||
          (typeof setup !== "undefined" && setup.hex
            ? setup.hex
            : colorHex(SAVE.color));
        m.elem = 0;
      }

      function renderMenu(rd) {
        const c = ctx;
        c.fillStyle = "#050208";
        c.fillRect(0, 0, W, H);
        const breath = 0.5 + 0.5 * Math.sin(TM * 0.4);
        const bg = c.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(
          0,
          `rgb(${(8 + breath * 8) | 0},${(4 + breath * 4) | 0},${(18 + breath * 6) | 0})`,
        );
        bg.addColorStop(
          0.35,
          `rgb(${(40 + breath * 20) | 0},${(10 + breath * 8) | 0},${(50 + breath * 15) | 0})`,
        );
        bg.addColorStop(
          0.7,
          `rgb(${(80 + breath * 30) | 0},${(20 + breath * 10) | 0},${(20 + breath * 15) | 0})`,
        );
        bg.addColorStop(1, "#100208");
        c.fillStyle = bg;
        c.fillRect(0, 0, W, H);
        c.globalCompositeOperation = "lighter";
        for (let i = 0; i < 4; i++) {
          const px =
              W * (0.2 + i * 0.22) + Math.sin(TM * 0.3 + i * 1.7) * W * 0.1,
            py = H * 0.15 + Math.sin(TM * 0.5 + i) * H * 0.05,
            rr2 = W * (0.25 + 0.05 * Math.sin(TM * 0.4 + i)),
            hue = (i * 60 + TM * 10) % 360;
          const g = c.createRadialGradient(px, py, 2, px, py, rr2);
          g.addColorStop(
            0,
            `hsla(${hue},80%,55%,${0.12 + 0.05 * Math.sin(TM + i)})`,
          );
          g.addColorStop(1, `hsla(${hue},80%,30%,0)`);
          c.fillStyle = g;
          c.beginPath();
          c.arc(px, py, rr2, 0, TAU);
          c.fill();
        }
        c.globalCompositeOperation = "source-over";
        c.globalCompositeOperation = Q.glow ? "lighter" : "source-over";
        for (let i = 0; i < 3; i++) {
          const x = W * (0.35 + i * 0.15) + Math.sin(TM * 0.7 + i) * 30,
            y = H * 0.42 + Math.cos(TM * 0.9 + i * 2) * 20,
            r = Math.min(W, H) * (0.32 + 0.05 * Math.sin(TM * 2 + i));
          const g = c.createRadialGradient(x, y, 5, x, y, r);
          g.addColorStop(0, "rgba(255,200,60,.42)");
          g.addColorStop(0.35, "rgba(255,90,10,.22)");
          g.addColorStop(1, "rgba(255,40,0,0)");
          c.fillStyle = g;
          c.beginPath();
          c.arc(x, y, r, 0, TAU);
          c.fill();
        }
        c.globalCompositeOperation = "source-over";
        for (let i = 0; i < 3; i++) {
          const x = ((TM * (15 + i * 8) + i * W * 0.4) % (W + 200)) - 100,
            y = H * 0.25 + Math.sin(TM * 0.4 + i) * 40,
            r = W * 0.25;
          const g = c.createRadialGradient(x, y, 5, x, y, r);
          g.addColorStop(
            0,
            `rgba(120,60,180,${0.04 + 0.02 * Math.sin(TM + i)})`,
          );
          g.addColorStop(1, "rgba(120,60,180,0)");
          c.fillStyle = g;
          c.beginPath();
          c.arc(x, y, r, 0, TAU);
          c.fill();
        }
        const horizonY = H * 0.5;
        const blendTop = c.createLinearGradient(
          0,
          horizonY - H * 0.15,
          0,
          horizonY + H * 0.05,
        );
        blendTop.addColorStop(0, "rgba(40,10,25,0)");
        blendTop.addColorStop(
          0.5,
          `rgba(60,15,30,${0.35 + 0.1 * Math.sin(TM * 0.5)})`,
        );
        blendTop.addColorStop(1, "rgba(20,6,10,0.85)");
        c.fillStyle = blendTop;
        c.fillRect(0, horizonY - H * 0.15, W, H * 0.2);
        c.fillStyle = "rgba(15,5,10,0.75)";
        for (let i = 0; i < 8; i++) {
          const bx = W * (i / 7) + Math.sin(TM * 0.1 + i * 2) * 8,
            bh = 40 + Math.sin(i * 1.7) * 25 + Math.cos(i * 3.1) * 15;
          c.beginPath();
          c.moveTo(bx - 70, horizonY - 10);
          c.lineTo(bx - 40, horizonY - bh);
          c.lineTo(bx - 15, horizonY - bh * 0.85);
          c.lineTo(bx + 10, horizonY - bh * 1.1);
          c.lineTo(bx + 40, horizonY - bh * 0.7);
          c.lineTo(bx + 70, horizonY - 10);
          c.closePath();
          c.fill();
        }
        for (let i = 0; i < 5; i++) {
          const bx = W * (i / 4) + Math.sin(TM * 0.2 + i * 3) * 20,
            bh = 60 + Math.sin(i * 2.3) * 35;
          c.fillStyle = "rgba(20,8,15,0.9)";
          c.beginPath();
          c.moveTo(bx - 90, horizonY + 5);
          c.lineTo(bx - 50, horizonY - bh * 0.6);
          c.lineTo(bx - 20, horizonY - bh);
          c.lineTo(bx + 25, horizonY - bh * 0.8);
          c.lineTo(bx + 60, horizonY - bh * 0.4);
          c.lineTo(bx + 90, horizonY + 5);
          c.closePath();
          c.fill();
          c.strokeStyle = `rgba(255,${(100 + Math.sin(TM * 1.5 + i) * 50) | 0},20,${0.4 + 0.2 * Math.sin(TM + i)})`;
          c.lineWidth = 1.5;
          c.beginPath();
          c.moveTo(bx - 20, horizonY - bh * 0.4);
          c.lineTo(bx - 10, horizonY - bh * 0.15);
          c.lineTo(bx + 5, horizonY - bh * 0.3);
          c.moveTo(bx + 30, horizonY - bh * 0.5);
          c.lineTo(bx + 35, horizonY - bh * 0.2);
          c.stroke();
        }
        c.save();
        c.beginPath();
        c.rect(0, horizonY, W, H - horizonY);
        c.clip();
        c.translate(W / 2, horizonY + (H - horizonY) * 0.55);
        const sc = Math.max(W / 1000, H / 650);
        c.scale(sc, sc * 0.55);
        c.translate(-CX, -(CY + 250));
        if (ARENA.ok) drawArenaLayers(c, 0, 0, 2500, 2500, THEMES.lava);
        c.restore();
        const fg = c.createLinearGradient(0, horizonY, 0, horizonY + H * 0.12);
        fg.addColorStop(0, "rgba(20,6,10,.95)");
        fg.addColorStop(1, "rgba(20,6,10,0)");
        c.fillStyle = fg;
        c.fillRect(0, horizonY, W, H * 0.12);
        menuBoltT -= rd;
        if (menuBoltT <= 0) {
          menuBoltT = rnd(0.8, 2.2);
          const sx =
            Math.random() < 0.5 ? W * rnd(0.02, 0.3) : W * rnd(0.7, 0.98);
          menuBolt = {
            pts: bolt(sx, 0, sx + rnd(-90, 90), H * 0.5, 9, 28),
            l: 0.18,
          };
        }
        if (menuBolt) {
          menuBolt.l -= rd;
          if (menuBolt.l <= 0) menuBolt = null;
          else {
            c.lineJoin = "round";
            c.lineWidth = 6;
            c.strokeStyle = "rgba(255,220,80,.5)";
            c.beginPath();
            menuBolt.pts.forEach((v, i) =>
              i ? c.lineTo(v[0], v[1]) : c.moveTo(v[0], v[1]),
            );
            c.stroke();
            c.lineWidth = 2;
            c.strokeStyle = "#fff";
            c.stroke();
          }
        }
        if (Math.random() < 0.5)
          pt(
            rnd(0, W),
            H + 8,
            rnd(-20, 20),
            -rnd(50, 140),
            rnd(2.5, 4.5),
            rnd(1.5, 3),
            pick(["#FF8C00", "#FFEE00", "#FF4500"]),
            0,
            true,
          );
        const menuBase = IS_TABLET ? H / 150 : IS_MOBILE ? H / 155 : H / 175;
        const order = menuMages.slice().sort((a, b) => a.def.y - b.def.y);
        for (const m of order) {
          m.x = W * m.def.x;
          m.y = H * m.def.y;
          updateVisual(m, rd);
          updateEyes(m, rd);
          m.scale = m.def.s * menuBase;
          m.vx = 0;
          m.vy = 0;
          drawMage(c, m);
        }
        drawParticles(c, -50, -50, W + 50, H + 50);
        const vg = c.createRadialGradient(
          W / 2,
          H / 2,
          Math.min(W, H) * 0.4,
          W / 2,
          H / 2,
          Math.max(W, H) * 0.8,
        );
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(0,0,0,.6)");
        c.fillStyle = vg;
        c.fillRect(0, 0, W, H);
      }

          setup.mode === "arena" ? t("colorChoice") : t("survival");

            const s = document.createElement("div");
            s.className = "rar";
            s.style.color = subCol;
            s.textContent = sub;
            c.appendChild(s);
          }
          grid.appendChild(c);
          return { c, cv };
        };
        const btns = (list, id, gold, gems, ownedCheck, equipped, onEquip) => {
          const box = document.createElement("div");
          box.style.cssText =
            "display:flex;gap:4px;flex-wrap:wrap;justify-content:center";
          const mk = (txt, cb, off) => {
            const b = document.createElement("button");
            b.className = "btn small" + (off ? " off" : "");
            b.textContent = txt;
            b.onclick = () => {
              sfx("click");
              cb();
            };
            box.appendChild(b);
          };
          if (ownedCheck)
            mk(equipped ? "✓ " + t("equipped") : t("equip"), onEquip, equipped);
          else {
            const buy = (cur) => {
              const price = cur === "gold" ? gold : gems;
              if (!SAVE.devMode && SAVE[cur] < price) {
                toast(t("notEnough"));
                sfx("error");
                return;
              }
              if (!SAVE.devMode) SAVE[cur] -= price;
              SAVE[list].push(id);
              sfx("purchase");
              persist();
              buildShop();
            };
            if (gold) mk("🪙 " + gold, () => buy("gold"));
            if (gems) mk("💎 " + gems, () => buy("gems"));
          }
          return box;
        };
        if (shopTab === "skins")
          for (const s of SKINS) {
            const k = card(s[lang], s.rar.toUpperCase(), RAR_COL[s.rar]);
            drawSkinPreview(k.cv, s);
            k.c.appendChild(
              btns(
                "skins",
                s.id,
                s.gold,
                s.gems,
                SAVE.skins.indexOf(s.id) >= 0,
                SAVE.skin === s.id,
                () => {
                  SAVE.skin = s.id;
                  persist();
                  initMenuMages();
                  buildShop();
                },
              ),
            );
          }
        else if (shopTab === "staffs")
          for (const st of STAFFS) {
            const k = card(
              st[lang],
              st.rar.toUpperCase(),
              RAR_COL[st.rar] || "#ccc",
            );
            drawStaffPreview(k.cv, st);
            k.c.appendChild(
              btns(
                "staffs",
                st.id,
                st.gold,
                st.gems,
                SAVE.staffs.indexOf(st.id) >= 0,
                SAVE.staff === st.id,
                () => {
                  SAVE.staff = st.id;
                  persist();
                  initMenuMages();
                  buildShop();
                },
              ),
            );
          }
        else if (shopTab === "fx")
          for (const f of EFFECTS) {
            const k = card(
              f[lang],
              f.type === "trail" ? "TRAIL" : "AURA",
              "#9cf",
            );
            const c = k.cv.getContext("2d");
            k.cv.width = 180;
            k.cv.height = 200;
            c.translate(90, 100);
            for (let i = 0; i < 14; i++) {
              if (f.col === "rainbow")
                c.fillStyle = "hsl(" + i * 25 + ",100%,60%)";
              else if (f.id === "trail_hearts")
                c.fillStyle = pick(["#FF69B4", "#FFB6D9", "#FFC0E0"]);
              else c.fillStyle = f.col;
              c.globalAlpha = 1 - i / 16;
              c.beginPath();
              c.arc(-60 + i * 9, Math.sin(i * 0.7) * 18, 10 - i * 0.5, 0, TAU);
              c.fill();
            }
            const key = f.type === "trail" ? "fxTrail" : "fxAura";
            k.c.appendChild(
              btns(
                "fx",
                f.id,
                f.gold,
                0,
                SAVE.fx.indexOf(f.id) >= 0,
                SAVE[key] === f.id,
                () => {

            {

      function buildCodex() {
        const sec = (title, content) =>
          `<h3 style="color:#ffd23a;margin:14px 0 8px;padding-bottom:4px;border-bottom:2px solid rgba(218,165,32,.4);font-size:16px">${title}</h3>${content}`;
        let h = "";
        const EMO_E = ["🔥", "❄️", "⚡", "💨", "🌑"];
        let secE = "";
        for (const e of ELEMS) {
          secE += `<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;margin:4px 0;border-left:3px solid ${elemColor(e.id)}"><span style="font-size:20px;width:26px;text-align:center">${EMO_E[e.id]}</span><div style="flex:1"><b style="color:${elemColor(e.id)};font-size:13px">${e[lang]}</b><div style="opacity:.75;font-size:11px;margin-top:2px">${ELEM_BUFF[lang][e.id]}</div></div></div>`;
        }
        h += sec("⚗️ " + t("codexElems"), secE);
        let secC = "";
        for (let a = 0; a < 5; a++)
          for (let b = a; b < 5; b++) {
            const k = a + "-" + b,
              desc = lang === "ru" ? ULT_DESC[k] : "";
            secC += `<div style="padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;margin:4px 0;border-left:3px solid ${elemColor(b)}"><b style="color:${elemColor(b)};font-size:13px">${ULTS[k][lang]}</b><div style="opacity:.75;font-size:11px;margin-top:2px">${ELEMS[a][lang]} + ${ELEMS[b][lang]}${desc ? " — " + desc : ""}</div></div>`;
          }
        h += sec("✨ " + t("codexCombos"), secC);
        let secM = "";
        for (let e = 0; e < 5; e++) {
          const k = e + "-" + e + "-" + e,
            desc = lang === "ru" ? ULT_DESC[k] : "";
          secM += `<div style="padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;margin:4px 0;border-left:3px solid ${elemColor(e)}"><b style="color:${elemColor(e)};font-size:13px">${ULTS[k][lang]}</b><div style="opacity:.75;font-size:11px;margin-top:2px">${ELEMS[e][lang]} ×3${desc ? " — " + desc : ""}</div></div>`;
        }
        h += sec("💥 " + t("codexMega"), secM);
        const itemInfo = {
          hp: { e: "❤️", ru: "+50 HP", en: "+50 HP" },
          mana: { e: "💧", ru: "Полная мана", en: "Full mana" },
          haste: { e: "⚡", ru: "+30% скорости", en: "+30% speed" },
          shield: { e: "🛡️", ru: "Блок атаки", en: "Blocks attack" },
          gem: { e: "💎", ru: "+5 золота", en: "+5 gold" },
          time: { e: "⏰", ru: "Замедление 4с", en: "Slow 4s" },
          r0: { e: "🔥", ru: "Руна огня", en: "Fire rune" },
          r1: { e: "❄️", ru: "Руна льда", en: "Ice rune" },
          r2: { e: "⚡", ru: "Руна молнии", en: "Lightning rune" },
          r3: { e: "💨", ru: "Руна воздуха", en: "Air rune" },
          r4: { e: "🌑", ru: "Руна пустоты", en: "Void rune" },
          mult: { e: "✴️", ru: "+1 снаряд", en: "+1 projectile" },
        };
        let secP = "";
        for (const k of PK_KEYS) {
          const info = itemInfo[k];
          if (!info) continue;
          secP += `<div style="padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;margin:4px 0;border-left:3px solid ${PK[k].col}"><b style="color:${PK[k].col};font-size:13px">${info.e} ${PK[k][lang]}</b><div style="opacity:.75;font-size:11px;margin-top:2px">${info[lang]}</div></div>`;
        }
        h += sec("🎁 " + (lang === "ru" ? "ПРЕДМЕТЫ" : "ITEMS"), secP);
        let secF = "";
        for (const m of MONSTERS) {
          const hp = Math.round(m[3]);
          secF += `<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;margin:4px 0;border-left:3px solid ${m[7]}"><canvas data-monster="${m[0]}" width="80" height="80" style="width:60px;height:60px"></canvas><div style="flex:1"><b style="color:${m[7]};font-size:13px">${lang === "ru" ? m[0] : m[1]}</b><div style="opacity:.75;font-size:11px;margin-top:2px">${lang === "ru" ? "Волна" : "Wave"} ${m[2]}+ · HP ${hp} · DMG ${m[5]}</div></div></div>`;
        }
        h += sec("👺 " + (lang === "ru" ? "ВРАГИ" : "ENEMIES"), secF);
        let secB = "";
        for (const wave in BOSSES) {
          const b = BOSSES[wave];
          secB += `<div style="padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;margin:4px 0;border-left:3px solid ${b[6]}"><b style="color:${b[6]};font-size:13px">💀 ${lang === "ru" ? b[0] : b[1]}</b><div style="opacity:.75;font-size:11px;margin-top:2px">${lang === "ru" ? "Волна" : "Wave"} ${wave} · HP ${b[2]} · DMG ${b[4]}</div></div>`;
        }
        h += sec("☠️ " + (lang === "ru" ? "БОССЫ" : "BOSSES"), secB);
        let secS = "";
        for (const s of SKINS) {
          const col = RAR_COL[s.rar] || "#fff";
          const price =
            s.gold === 0
              ? lang === "ru"
                ? "Бесплатно"
                : "Free"
              : s.gold
                ? `🪙 ${s.gold}` + (s.gems ? ` / 💎 ${s.gems}` : "")
                : "";
          secS += `<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;margin:4px 0;border-left:3px solid ${col}"><canvas data-skin="${s.id}" width="80" height="100" style="width:60px;height:75px"></canvas><div style="flex:1"><b style="color:${col};font-size:13px">${s[lang]}</b><div style="opacity:.75;font-size:11px;margin-top:2px">${s.rar.toUpperCase()} · ${price}</div></div></div>`;
        }
        h += sec("🎨 " + (lang === "ru" ? "СКИНЫ" : "SKINS"), secS);
        h += sec(
          "🎮 " + t("codexTips"),
          `<div style="line-height:1.7;padding:8px;background:rgba(255,255,255,.03);border-radius:8px">${t("tipsBody")}</div>`,
        );
        $("codexBody").innerHTML = h;
        document.querySelectorAll("canvas[data-monster]").forEach((cv) => {
          const nm = cv.getAttribute("data-monster"),
            md = MONSTERS.find((m) => m[0] === nm);
          if (!md) return;
          const c = cv.getContext("2d"),
            previewScale = IS_MOBILE && Math.min(W, H) < 700 ? 0.8 : 1,
            scale = Math.min(70 / (md[6] * 3), 1.5) * previewScale;
          c.save();
          c.translate(40, 60);
          c.scale(scale, scale);
          const mo = {
            isMonster: true,
            id: 0,
            x: 0,
            y: 0,
            vx: 1,
            vy: 0,
            kvx: 0,
            kvy: 0,
            r: md[6],
            col: md[7],
            shape: md[8],
            dead: false,
            alpha: 1,
            scale: 1,
            inv: 0,
            aura: "",
            boss: false,
            fx: {
              haste: 0,
              shield: 0,
              slow: 0,
              slowF: 1,
              freeze: 0,
              burn: 0,
              stun: 0,
              blind: 0,
              amp: 0,
              tslow: 0,
            },
            atkCd: 999,
            an: 0,
            tg: null,
            tT: 0,
            bdps: 0,
            dotAcc: 0,
            shootCd: 3,
            lastHit: null,
            hp: md[3],
            maxHp: md[3],
          };
          drawMonster(c, mo);
          c.restore();
        });
        document.querySelectorAll("canvas[data-skin]").forEach((cv) => {
          const sid = cv.getAttribute("data-skin"),
            skin = SKIN_BY_ID[sid];
          if (!skin) return;
          const c = cv.getContext("2d"),
            skinStaffId = SKIN_STAFF[sid] || "wood";
          const mm = new Mage({
            mantle: skin.mantle || "#4A2A8B",
            skin: sid,
            staff: skinStaffId,
          });
          mm.x = 0;
          mm.y = 0;
          mm.facing = 1;
          mm.resetVerlet();
          c.save();
          c.translate(40, 80);
          const skinScale = IS_MOBILE && Math.min(W, H) < 700 ? 1.1 : 1.4;
          c.scale(skinScale, skinScale);
          drawMage(c, mm, { noShadow: false });
          c.restore();
        });
      }

      /* NETWORK */

      function netCleanup() {

      function hostHandle(conn, d) {
        if (!d || typeof d !== "object") return;
        if (d.type === "join") {
          if (G || NET.players.length >= NET.settings.count) {
            sendTo(conn, { type: "full" });
            setTimeout(() => {
              try {
                conn.close();

            return;

          if (conn.pid) return;
          const joinNick = String(d.nick || "")
            .replace(/[<>]/g, "")
            .trim()
            .slice(0, 12);
          if (joinNick === "") {
            sendTo(conn, { type: "error", msg: "nickEmpty" });
            return;
          }
          const lowerNick = joinNick.toLowerCase();
          if (
            NET.players.some((p) => (p.nick || "").toLowerCase() === lowerNick)
          ) {
            sendTo(conn, { type: "error", msg: "nickTaken" });
            return;

          const id = NET.nextId++;
          conn.pid = id;
          NET.players.push({
            id,
            nick: joinNick,
            skin: SKIN_BY_ID[d.skin] ? d.skin : "base",
            staff: STAFF_BY_ID[d.staff] ? d.staff : "wood",
            conn,
          });
          sendTo(conn, { type: "welcome", id, code: NET.code });
          renderRoom();
          broadcastLobby();
          sfx("pickup");
        } else if (d.type === "input") {
          if (!G || !conn.pid) return;
          const m = G.mages.find((x) => x.id === conn.pid);
          if (!m || m.dead) return;
          const mx = +d.moveX,
            my = +d.moveY;
          m.netIn = {
            mx: isFinite(mx) ? clamp(mx, -1, 1) : 0,
            my: isFinite(my) ? clamp(my, -1, 1) : 0,
          };
          if (Array.isArray(d.acts))
            for (const a of d.acts.slice(0, 6)) {
              const ang = +a.ang;
              if (!isFinite(ang)) continue;
              if (a.k === "a") mageAttack(m, ang);
              else if (a.k === "d") mageDash(m, ang);
              else if (a.k === "u") {
                const dd = clamp(+a.d || 200, 0, 400);
                castUlt(m, m.x + Math.cos(ang) * dd, m.y + Math.sin(ang) * dd);
              }
            }
        } else if (d.type === "ping") sendTo(conn, { type: "pong", t: d.t });
      }
      function hostDrop(conn) {
        const i = NET.players.findIndex((p) => p.conn === conn);
        if (i < 0) return;
        const p = NET.players[i];
        NET.players.splice(i, 1);
        if (G && G.online) {
          const m = G.mages.find((x) => x.id === p.id);

            lang = SAVE.lang;
        } catch (e) {}
        SAVE.lang = lang;
        if (SAVE.arenas.indexOf("lava") < 0) SAVE.arenas.push("lava");
        applyQuality();
        applyLang();
        updateTopbar();
        setInterval(updateTopbar, 1000);
        setInterval(() => {
          try {
            if (SAVE && SAVE.v)
              localStorage.setItem("arcane_save_backup", JSON.stringify(SAVE));
          } catch (e) {}
        }, 60000);
        try {
          if (Aud.ctx && Aud.ctx.state === "suspended") Aud.ctx.resume();
        } catch (e) {}
        applyVolumes();
        setProg(30, "boot3");
        await buildIcons((p) => setProg(30 + p * 50));
        setProg(82, "boot4");
        await delay(30);
        ensureArena("lava");
        initMenuMages();
        if (!isPeerJSAvailable()) {
          $("onlineBtn").classList.add("off");
          const sp = $("onlineBtn").querySelector("span");
          if (sp) {
            sp.dataset.i18n = "unavailable";
            applyLang();
          }
        }
        setProg(100, "boot5");
        await delay(250);
        try {
          if (window.ysdk && ysdk.features && ysdk.features.LoadingAPI)
            ysdk.features.LoadingAPI.ready();
        } catch (e) {}
        $("sc-loading").classList.remove("show");
        $("sc-loading").style.display = "none";
        state = "MENU";
        showScreen("sc-menu");
        updateQuestsBadge();
        canvas.focus();
        setTimeout(() => {
          if (state === "MENU") showDaily();
        }, 600);
      }
      requestAnimationFrame(gameLoop);
      boot().catch((e) => {
        try {
          $("sc-loading").style.display = "none";
          initMenuMages();
          state = "MENU";
          showScreen("sc-menu");
        } catch (er) {}
      });
    </script>
  </body>
</html>
