<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>ARCANE ARENA</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- PeerJS для онлайн PvP (с запасным вариантом при недоступности) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="window.PEERJS_FAILED=true;"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;overscroll-behavior:none}
#gameCanvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;outline:none;background:#000}
input,select{-webkit-user-select:text;user-select:text;touch-action:auto}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:10px;pointer-events:none;gap:10px}
.screen.show{display:flex;animation:fadeIn .3s cubic-bezier(.4,0,.2,1)}
.screen>*{pointer-events:auto}
@keyframes fadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.panel{background:rgba(20,10,30,.62);border:2px solid rgba(218,165,32,.75);border-radius:16px;box-shadow:inset 0 0 22px rgba(218,165,32,.14),0 8px 30px rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 16px}
.title{font-family:Georgia,'Times New Roman',serif;font-weight:900;font-size:clamp(34px,8.5vw,72px);line-height:1;margin:0;text-align:center;letter-spacing:1px;background:linear-gradient(180deg,#fffbc0 0%,#ffd23a 40%,#ff7a18 75%,#ff3a00 100%);background-size:100% 220%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a0800) drop-shadow(0 0 14px rgba(255,110,0,.75));animation:flame 2.2s ease-in-out infinite alternate}
@keyframes flame{from{background-position:0 0}to{background-position:0 100%}}
.h2{font-family:Georgia,serif;font-size:clamp(22px,4vw,34px);margin:0;color:#ffd23a;text-shadow:0 2px 0 #000,0 0 12px rgba(255,160,0,.5);text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 20px;font-size:clamp(14px,2.2vw,18px);font-weight:800;letter-spacing:.5px;color:#fff;background:linear-gradient(180deg,rgba(90,50,140,.75),rgba(35,15,60,.85));border:2px solid #DAA520;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #1a0a24,0 0 16px rgba(218,165,32,.25),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .3s cubic-bezier(.4,0,.2,1),filter .3s,box-shadow .3s;text-shadow:0 2px 0 #000}
.btn:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.2)}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 1px 0 #1a0a24}
.btn.primary{min-height:58px;font-size:clamp(18px,3vw,24px);background:linear-gradient(180deg,#ff9a1e,#c2410c);border-color:#ffe27a;box-shadow:0 5px 0 #5a1c00,0 0 24px rgba(255,140,0,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.off{opacity:.45;filter:grayscale(1);pointer-events:none}
.stack{display:flex;flex-direction:column;gap:8px;width:min(320px,90vw)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{min-width:44px;padding:6px 12px;border:2px solid rgba(218,165,32,.5);border-radius:10px;background:rgba(30,15,45,.7);cursor:pointer;font-weight:800;text-align:center;transition:all .3s cubic-bezier(.4,0,.2,1)}
.chip.sel{border-color:#ffe27a;background:rgba(218,165,32,.35);box-shadow:0 0 14px rgba(255,200,60,.6)}
.chip.lock{opacity:.55}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid #000;box-shadow:0 0 0 2px rgba(218,165,32,.5);cursor:pointer;position:relative;transition:transform .3s}
.sw.sel{box-shadow:0 0 0 3px #ffe27a,0 0 16px #ffd23a;transform:scale(1.12)}
.sw .pr{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;background:#000;border-radius:6px;padding:0 4px;color:#ffd23a;white-space:nowrap}
#topbar{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:10px;justify-content:space-between;align-items:center;pointer-events:none;z-index:11}
#topbar>*{pointer-events:auto}
.cur{display:flex;gap:12px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums;padding:6px 12px;font-size:15px}
.scroll,.scroll *{touch-action:pan-y}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;width:150px;border-radius:12px;background:rgba(40,20,60,.7);border:2px solid rgba(218,165,32,.4);text-align:center;font-size:13px}
.card canvas{width:90px;height:100px}
.card .rar{font-size:11px;font-weight:800}
.shopgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:50;background:rgba(10,5,20,.9);border:2px solid #DAA520;border-radius:12px;padding:10px 18px;font-weight:800;pointer-events:none;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.code{font-family:Georgia,serif;font-size:clamp(40px,12vw,72px);font-weight:900;color:#ffd23a;letter-spacing:6px;text-shadow:0 3px 0 #3a1200,0 0 18px rgba(255,170,0,.6);text-align:center}
.inp{background:rgba(0,0,0,.5);border:2px solid #DAA520;border-radius:10px;color:#fff;font-size:22px;font-weight:800;padding:8px 12px;text-align:center;letter-spacing:3px;width:min(260px,80vw);outline:none}
.plist{display:flex;flex-direction:column;gap:6px;min-width:min(300px,86vw)}
.pl{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.07);font-weight:700}
.pl i{width:18px;height:18px;border-radius:50%;border:2px solid #000;display:inline-block}
input[type=range]{width:160px;accent-color:#DAA520}
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;min-width:min(340px,86vw);font-weight:700}
.bar{width:min(320px,80vw);height:14px;border-radius:8px;border:2px solid #DAA520;background:#120818;overflow:hidden}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#ff4500,#ffd23a);transition:width .2s}
.lbrow{display:flex;justify-content:space-between;gap:20px;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.1);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lang{font-size:14px}
@media (max-height:520px){.title{font-size:34px}.stack{gap:5px}.btn{min-height:36px;padding:4px 14px}.btn.primary{min-height:44px}.panel{padding:8px 12px}}
</style>
</head>
<body>
<canvas id="gameCanvas" tabindex="0" style="outline:none;"></canvas>
<div id="toast"></div>

<!-- ЭКРАН ЗАГРУЗКИ -->
<div class="screen show" id="sc-loading" style="background:radial-gradient(ellipse at center,#2a0a2e 0%,#000 75%);z-index:30;pointer-events:auto">
  <h1 class="title">ARCANE ARENA</h1>
  <div class="bar"><div id="loadBar"></div></div>
  <div id="loadTxt" style="font-weight:700;color:#ffd23a">...</div>
  <div style="opacity:.5;font-size:12px" id="studioTxt"></div>
</div>

<!-- ВЕРХНЯЯ ПАНЕЛЬ ВАЛЮТ -->
<div id="topbar" style="display:none">
  <div class="panel cur"><span>🪙 <b id="goldV">0</b></span><span>💎 <b id="gemsV">0</b></span><span>⚡ <b id="enV">5</b>/5 <small id="enT" style="opacity:.7"></small></span></div>
  <button class="btn small lang" data-act="lang" id="langBtn">RU</button>
</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="screen" id="sc-menu" style="justify-content:space-between;padding-top:56px">
  <h1 class="title" style="margin-top:6px">ARCANE ARENA</h1>
  <div class="stack" style="margin-bottom:6px">
    <button class="btn primary" data-act="play">▶️ <span data-i18n="play"></span></button>
    <button class="btn" data-act="survival">🧟 <span data-i18n="survival"></span></button>
    <button class="btn" data-act="online" id="onlineBtn">🌐 <span data-i18n="online"></span></button>
    <div class="grid2">
      <button class="btn small" data-act="shop">🛍️ <span data-i18n="shop"></span></button>
      <button class="btn small" data-act="codex">📚 <span data-i18n="codex"></span></button>
      <button class="btn small" data-act="settings">⚙️ <span data-i18n="settings"></span></button>
      <button class="btn small" data-act="lb">🏆 <span data-i18n="lb"></span></button>
    </div>
  </div>
</div>

<!-- ВЫБОР ЦВЕТА / НАСТРОЙКА МАТЧА -->
<div class="screen" id="sc-setup">
  <h2 class="h2" id="setupTitle"></h2>
  <div class="panel" style="display:flex;flex-direction:column;gap:10px;align-items:center;max-width:96vw">
    <div style="font-weight:800" data-i18n="colorChoice"></div>
    <div class="row" id="colorGrid" style="padding-bottom:8px"></div>
    <div style="font-weight:800" data-i18n="arenaChoice"></div>
    <div class="row" id="arenaSel"></div>
    <div style="font-weight:800" id="countLbl"></div>
    <div class="row" id="countSel"></div>
  </div>
  <div class="row">
    <button class="btn" data-act="back">◀ <span data-i18n="back"></span></button>
    <button class="btn primary" data-act="startSetup">⚔️ <span data-i18n="startBattle"></span></button>
  </div>
</div>

<!-- МАГАЗИН -->
<div class="screen" id="sc-shop" style="justify-content:flex-start;padding-top:60px">
  <h2 class="h2">🛍️ <span data-i18n="shop"></span></h2>
  <div class="tabs" id="shopTabs"></div>
  <div class="panel scroll shopgrid" id="shopGrid" style="max-height:62vh;width:min(960px,96vw)"></div>
  <button class="btn" data-act="back">◀ <span data-i18n="back"></span></button>
</div>

<!-- КОДЕКС -->
<div class="screen" id="sc-codex" style="justify-content:flex-start;padding-top:60px">
  <h2 class="h2">📚 <span data-i18n="codex"></span></h2>
  <div class="panel scroll" id="codexBody" style="max-height:68vh;width:min(760px,96vw);font-size:14px;line-height:1.5"></div>
  <button class="btn" data-act="back">◀ <span data-i18n="back"></span></button>
</div>

<!-- НАСТРОЙКИ -->
<div class="screen" id="sc-settings">
  <h2 class="h2">⚙️ <span data-i18n="settings"></span></h2>
  <div class="panel" style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <div class="srow"><span data-i18n="nick"></span><input class="inp" style="font-size:16px;width:170px;letter-spacing:0" id="nickIn" maxlength="12"></div>
    <div class="srow"><span data-i18n="language"></span><button class="btn small" data-act="lang">RU / EN</button></div>
    <div class="srow"><span data-i18n="music"></span><input type="range" id="musIn" min="0" max="100"></div>
    <div class="srow"><span data-i18n="sfx"></span><input type="range" id="sfxIn" min="0" max="100"></div>
    <div class="srow"><span data-i18n="vibration"></span><input type="checkbox" id="vibIn"></div>
    <div class="srow"><span data-i18n="quality"></span>
      <select id="qIn" class="inp" style="font-size:15px;width:140px;letter-spacing:0"><option value="auto">Auto</option><option value="high">High</option><option value="low">Low</option></select></div>
    <button class="btn small" data-act="fs">⛶ <span data-i18n="fullscreen"></span></button>
  </div>
  <button class="btn" data-act="back">◀ <span data-i18n="back"></span></button>
</div>

<!-- РЕЙТИНГ -->
<div class="screen" id="sc-lb" style="justify-content:flex-start;padding-top:60px">
  <h2 class="h2">🏆 <span data-i18n="lb"></span></h2>
  <div class="panel scroll" id="lbBody" style="max-height:64vh;width:min(460px,94vw)"></div>
  <button class="btn" data-act="back">◀ <span data-i18n="back"></span></button>
</div>

<!-- ОНЛАЙН: ВХОД В МЕНЮ -->
<div class="screen" id="sc-online">
  <h2 class="h2">🌐 <span data-i18n="online"></span></h2>
  <div class="stack">
    <button class="btn primary" data-act="createRoom">➕ <span data-i18n="createRoom"></span></button>
    <div class="panel" style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <input class="inp" id="codeIn" maxlength="7" placeholder="ABC-XYZ" autocomplete="off" autocapitalize="characters">
      <button class="btn" data-act="doJoin" style="width:100%">🔗 <span data-i18n="connect"></span></button>
      <div id="joinStatus" style="min-height:20px;font-weight:700;color:#ffd23a;text-align:center"></div>
    </div>
    <button class="btn" data-act="back">◀ <span data-i18n="back"></span></button>
  </div>
</div>

<!-- ОНЛАЙН: КОМНАТА -->
<div class="screen" id="sc-room">
  <div style="font-weight:800" data-i18n="roomCode"></div>
  <div class="code" id="roomCode">------</div>
  <button class="btn small" data-act="copyCode">📋 <span data-i18n="copy"></span></button>
  <div class="panel plist" id="roomPlayers"></div>
  <div class="panel" id="roomSettings" style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div class="row" id="roomCount"></div>
    <div class="row" id="roomArena"></div>
  </div>
  <div class="row">
    <button class="btn" data-act="leaveRoom">🚪 <span data-i18n="leave"></span></button>
    <button class="btn primary" data-act="startOnline" id="startOnlineBtn">⚔️ <span data-i18n="startOnline"></span></button>
  </div>
</div>

<!-- ПАУЗА -->
<div class="screen" id="sc-pause" style="background:rgba(0,0,0,.55)">
  <h2 class="h2" data-i18n="paused"></h2>
  <div class="stack">
    <button class="btn primary" data-act="resume">▶ <span data-i18n="resume"></span></button>
    <button class="btn" data-act="fs">⛶ <span data-i18n="fullscreen"></span></button>
    <button class="btn" data-act="quit">🏠 <span data-i18n="toMenu"></span></button>
  </div>
</div>

<!-- ПРОКАЧКА (SURVIVAL) -->
<div class="screen" id="sc-levelup" style="background:rgba(0,0,0,.6)">
  <h2 class="h2">⭐ <span data-i18n="levelUp"></span></h2>
  <div class="row" id="upgRow"></div>
</div>

<!-- РЕЗУЛЬТАТ -->
<div class="screen" id="sc-result" style="background:rgba(0,0,0,.5)">
  <h1 class="title" id="resTitle" style="font-size:clamp(34px,9vw,80px)"></h1>
  <div class="panel" id="resBody" style="text-align:center;font-size:18px;font-weight:700;line-height:1.7;min-width:min(320px,86vw)"></div>
  <div class="row">
    <button class="btn primary" data-act="rematch" id="rematchBtn">🔁 <span data-i18n="rematch"></span></button>
    <button class="btn" data-act="quit">🏠 <span data-i18n="toMenu"></span></button>
  </div>
</div>

<!-- МОДАЛКА НЕТ ЭНЕРГИИ -->
<div class="screen" id="sc-noenergy" style="background:rgba(0,0,0,.65);z-index:40">
  <div class="panel" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">
    <div style="font-size:40px">⚡</div>
    <div style="font-weight:800;font-size:18px" data-i18n="noEnergy"></div>
    <button class="btn primary" data-act="adEnergy">📺 <span data-i18n="watchAd"></span></button>
    <button class="btn" data-act="closeModal"><span data-i18n="back"></span></button>
  </div>
</div>

<script>

/* ====== ЛОКАЛИЗАЦИЯ ====== */

    if (G.role === 'client') updateClientGame(dt); else updateGame(dt);
    updateParticles(dt); FX.shake *= .85;
    const s = viewScale(), hw = W / 2 / s, hh = H / 2 / s; updateAmbient(dt, cam.x - hw, cam.y - hh, cam.x + hw, cam.y + hh);
    if (G.role !== 'host') G.events.length = 0;
    G.ambT = (G.ambT || 0) - dt; if (G.ambT <= 0) { G.ambT = rnd(3, 6); sfx((THEMES[G.theme] || {}).amb === 'cloud' ? 'wind' : 'lava'); }
}
function frame(rd) {
    readInput(); adaptQuality(rd);
    if (state === 'PLAYING' && G) {
        let sc = 1; if (!G.online) { if (aiming) sc = .5; if (FX.slow.t > 0) { sc = Math.min(sc, FX.slow.s); FX.slow.t -= rd; } }
        if (G.player) { const p = G.player; MUS.tgt = (G.epicT > 0 || p.hp < p.maxHp * .25 || G.monsters.some(m => m.boss)) ? 1 : .55; }
        if (FX.hs > 0) { FX.hs -= rd * 1000; render(rd); return; }
        acc += rd * sc; let steps = 0; while (acc >= FIXED_DT && steps < 5) { if (state !== 'PLAYING' || !G) break; simStep(FIXED_DT); acc -= FIXED_DT; steps++; } if (steps >= 5) acc = 0;
        if (G) netTick(rd);
    } else if (state === 'RESULT' && G) { TM += rd; updateParticles(rd); }
    render(rd);
}
function render(rd) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (G && (state === 'PLAYING' || state === 'PAUSED' || state === 'LEVELUP' || state === 'RESULT')) { if (state === 'PLAYING') updateCamera(rd); renderGame(); }
    else if (state === 'BOOT' || state === 'LOADING') { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
    else { TM += rd; updateParticles(rd); renderMenu(rd); }
}
function gameLoop(now) {
    requestAnimationFrame(gameLoop); frameNo++;
    const rd = Math.min((now - lastTime) / 1000, .1); lastTime = now;
    try { frame(rd); } catch (e) { if (CONFIG.DEBUG_MODE) console.error(e); }
}
/* ============================================================
   ЗАГРУЗКА
   ============================================================ */
const delay = ms => new Promise(r => setTimeout(r, ms));
function setProg(p, key) { $('loadBar').style.width = Math.round(p) + '%'; if (key) $('loadTxt').textContent = t(key); }
async function boot() {
    state = 'LOADING'; $('studioTxt').textContent = CONFIG.STUDIO_NAME + ' · v' + CONFIG.GAME_VERSION; resize(); setProg(5, 'boot1');
    try { const l = localStorage.getItem('arcane_lang'); if (l) lang = l; } catch (e) { }
    setProg(15, 'boot2'); await Promise.race([initYandexSDK(), delay(4500)]);
    try { const saved = await loadCloud(); if (saved && saved.v) { const st = Object.assign({}, SAVE.stats, saved.stats || {}); Object.assign(SAVE, saved); SAVE.stats = st; } } catch (e) { }
    if (!SAVE.nick) SAVE.nick = (lang === 'ru' ? 'Маг' : 'Mage') + rndi(100, 999);
    try { if (!localStorage.getItem('arcane_lang') && SAVE.lang) lang = SAVE.lang; } catch (e) { }
    SAVE.lang = lang; if (SAVE.arenas.indexOf('lava') < 0) SAVE.arenas.push('lava'); applyQuality(); applyLang(); updateTopbar(); setInterval(updateTopbar, 1000);
    setProg(30, 'boot3'); await buildIcons(p => setProg(30 + p * 50));
    setProg(82, 'boot4'); await delay(30); ensureArena('lava'); initMenuMages(); applyVolumes();
    if (!isPeerJSAvailable()) { $('onlineBtn').classList.add('off'); const sp = $('onlineBtn').querySelector('span'); sp.dataset.i18n = 'unavailable'; applyLang(); }
    setProg(100, 'boot5'); await delay(250);
    try { if (window.ysdk && ysdk.features && ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready(); } catch (e) { }
    $('sc-loading').classList.remove('show'); $('sc-loading').style.display = 'none'; state = 'MENU'; showScreen('sc-menu'); canvas.focus();
}
requestAnimationFrame(gameLoop);
boot().catch(e => { try { $('sc-loading').style.display = 'none'; initMenuMages(); state = 'MENU'; showScreen('sc-menu'); } catch (er) { } });
