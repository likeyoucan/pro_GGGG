<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090812">
  <title>Arcane Arena</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="/sdk.js" async></script>
  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd36a;
      --gold-deep: #b87520;
      --violet: #8f56ff;
      --cyan: #58dcff;
      --ink: #090812;
      --glass: rgba(15, 12, 27, .78);
      --line: rgba(255, 218, 135, .35);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: #fff; font-family: Inter, "Segoe UI", Arial, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
    button, input { font: inherit; }
    button { color: inherit; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #shade { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 35%, rgba(4, 4, 12, .48) 100%); }
    #ui { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: calc(22px + var(--safe-top)) 22px calc(22px + var(--safe-bottom)); overflow-y: auto; overscroll-behavior: contain; pointer-events: auto; touch-action: pan-y; animation: screen-in .35s cubic-bezier(.22, 1, .36, 1) both; }
    .screen.menu-screen { justify-content: space-between; gap: 12px; padding-top: calc(5vh + var(--safe-top)); padding-bottom: calc(5vh + var(--safe-bottom)); background: linear-gradient(180deg, rgba(5, 7, 15, .62) 0%, rgba(5, 7, 15, .07) 38%, rgba(8, 5, 12, .28) 64%, rgba(8, 5, 12, .78) 100%); }
    .screen.mode-screen, .screen.shop-screen, .screen.settings-screen, .screen.result-screen, .screen.pause-screen, .screen.level-screen { background: linear-gradient(180deg, rgba(5, 5, 14, .62), rgba(6, 4, 12, .88)); }
    @keyframes screen-in { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
    .brand { text-align: center; position: relative; z-index: 1; }
    .brand-kicker { color: #ffc45c; text-transform: uppercase; letter-spacing: .42em; font-size: clamp(10px, 1.6vw, 14px); font-weight: 800; text-shadow: 0 2px 10px #000; }
    .brand h1 { margin: 8px 0 0; color: #ffe7a1; font-family: Georgia, "Times New Roman", serif; font-size: clamp(46px, 10vw, 116px); font-weight: 900; letter-spacing: .025em; line-height: .84; text-transform: uppercase; text-shadow: 0 3px 0 #5e2109, 0 7px 0 #170b11, 0 0 24px rgba(255, 124, 28, .72); animation: title-glow 3.5s ease-in-out infinite; }
    .brand h1 span { display: block; color: #ffbe58; font-size: .68em; letter-spacing: .19em; margin-top: .1em; }
    @keyframes title-glow { 50% { filter: brightness(1.13); text-shadow: 0 3px 0 #5e2109, 0 7px 0 #170b11, 0 0 36px rgba(255, 124, 28, .95); } }
    .menu-copy { width: min(600px, 100%); text-align: center; margin-top: auto; padding-bottom: clamp(8px, 4vh, 42px); }
    .menu-copy p { margin: 0 auto 22px; color: rgba(255, 239, 216, .9); max-width: 480px; font-size: clamp(14px, 2vw, 18px); line-height: 1.55; text-shadow: 0 2px 8px #000; }
    .button-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .button { min-height: 50px; min-width: 150px; padding: 12px 22px; border: 1px solid rgba(255, 246, 210, .5); border-radius: 13px; background: linear-gradient(180deg, #ffe298 0%, #d99431 58%, #9f5519 100%); color: #241307; font-size: 15px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 4px 0 #542811, 0 9px 24px rgba(0,0,0,.45); cursor: pointer; transition: transform .14s ease, filter .14s ease, box-shadow .14s ease; }
    .button:hover { filter: brightness(1.12); transform: translateY(-2px); }
    .button:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 2px 0 #542811, 0 5px 12px rgba(0,0,0,.4); }
    .button.secondary { color: #fff0d0; background: linear-gradient(180deg, rgba(94, 62, 144, .95), rgba(40, 22, 75, .98)); border-color: rgba(205, 177, 255, .5); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 4px 0 #211238, 0 8px 20px rgba(0,0,0,.42); }
    .button.quiet { min-width: 0; min-height: 44px; padding: 10px 16px; color: #f8e8cf; background: rgba(12, 10, 22, .72); border-color: rgba(255,255,255,.22); box-shadow: 0 4px 14px rgba(0,0,0,.32); }
    .button.danger { color: #fff; background: linear-gradient(#c94639, #712520); border-color: #df7564; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 4px 0 #391411, 0 8px 18px rgba(0,0,0,.4); }
    .button:disabled { filter: grayscale(.8) brightness(.65); cursor: default; transform: none; }
    .menu-foot { color: rgba(255, 231, 190, .68); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 2px 6px #000; }
    .panel-title { margin: 0; color: #ffe19a; font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 5vw, 48px); line-height: 1; text-align: center; text-shadow: 0 3px 0 #34151a, 0 0 18px rgba(255, 172, 61, .4); }
    .panel-subtitle { max-width: 680px; margin: -6px auto 2px; color: rgba(255, 241, 220, .78); font-size: 14px; line-height: 1.55; text-align: center; }
    .mode-list { width: min(800px, 100%); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .mode-option { position: relative; min-height: 205px; padding: 22px; border: 1px solid rgba(255, 213, 132, .35); border-radius: 18px; background: linear-gradient(145deg, rgba(26, 17, 40, .92), rgba(9, 8, 19, .86)); text-align: left; cursor: pointer; overflow: hidden; transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .mode-option::after { content: ""; position: absolute; width: 180px; height: 180px; right: -55px; bottom: -82px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 123, 36, .25), transparent 70%); pointer-events: none; }
    .mode-option:hover { transform: translateY(-3px); border-color: rgba(255, 220, 142, .8); background: linear-gradient(145deg, rgba(47, 28, 67, .96), rgba(12, 9, 23, .92)); }
    .mode-option strong { display: block; margin: 10px 0 8px; color: #ffe6b0; font-family: Georgia, "Times New Roman", serif; font-size: 24px; }
    .mode-option p { max-width: 330px; margin: 0; color: rgba(255,255,255,.74); font-size: 13px; line-height: 1.5; }
    .mode-mark { display: inline-block; width: 42px; height: 42px; border: 1px solid rgba(255,220,150,.6); border-radius: 50%; color: #ffb957; font-size: 20px; line-height: 40px; text-align: center; box-shadow: 0 0 18px rgba(255,120,32,.2); }
    .count-row { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 16px; }
    .count-button { width: 42px; height: 38px; border: 1px solid rgba(255,255,255,.2); border-radius: 9px; background: rgba(0,0,0,.32); cursor: pointer; }
    .count-button.active { color: #221306; background: linear-gradient(#ffe49d, #d89436); border-color: #fff0bb; font-weight: 900; }
    .content-panel { width: min(760px, 100%); padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: rgba(13, 10, 25, .8); box-shadow: 0 18px 60px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06); }
    .shop-grid { width: 100%; max-height: min(55vh, 520px); overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; padding: 3px; touch-action: pan-y; }
    .skin-item { display: flex; min-height: 145px; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 1px solid rgba(255,255,255,.12); border-radius: 13px; background: rgba(38, 27, 61, .56); text-align: center; }
    .skin-item.active { border-color: var(--gold); box-shadow: 0 0 16px rgba(255,211,106,.16); }
    .skin-swatch { width: 48px; height: 48px; border: 2px solid rgba(255,225,161,.85); border-radius: 50% 50% 44% 44%; box-shadow: 0 0 19px rgba(151,86,255,.4); }
    .skin-name { min-height: 32px; font-size: 12px; font-weight: 800; }
    .skin-item .button { min-width: 0; min-height: 34px; padding: 7px 12px; font-size: 11px; }
    .setting-row { display: flex; width: min(440px, 100%); align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.1); color: #f4e8d8; }
    .setting-row:last-child { border-bottom: 0; }
    .setting-row input[type="range"] { width: min(180px, 42vw); accent-color: #f4bd58; }
    .stat-line { color: rgba(255,255,255,.75); font-size: 13px; text-align: center; line-height: 1.8; }
    .result-number { color: var(--gold); font-size: 22px; font-weight: 900; }
    .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .back-button { margin-top: 2px; }
    .game-hud { position: fixed; inset: 0; z-index: 4; display: none; pointer-events: none; padding: calc(12px + var(--safe-top)) 14px calc(12px + var(--safe-bottom)); }
    .game-hud.active { display: block; }
    .hud-top { display: grid; grid-template-columns: minmax(140px, 1fr) auto minmax(48px, 1fr); align-items: start; gap: 8px; }
    .hud-block { width: fit-content; min-width: 160px; padding: 10px 12px; border: 1px solid rgba(255, 221, 143, .35); border-radius: 13px; background: rgba(10, 8, 20, .72); box-shadow: 0 8px 22px rgba(0,0,0,.24); backdrop-filter: blur(8px); }
    .hud-center { min-width: 112px; padding: 9px 14px; border: 1px solid rgba(255, 221, 143, .28); border-radius: 13px; background: rgba(10, 8, 20, .68); text-align: center; backdrop-filter: blur(8px); }
    .hud-small { color: rgba(255,255,255,.7); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .hud-value { margin-top: 2px; color: #fff2d3; font-size: 15px; font-weight: 900; }
    .hud-bar { height: 8px; margin-top: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); border-radius: 99px; background: rgba(0,0,0,.45); }
    .hud-bar span { display: block; height: 100%; width: 50%; border-radius: inherit; transition: width .12s linear; }
    #healthFill { background: linear-gradient(90deg, #a52638, #ff6a57); }
    #manaFill { background: linear-gradient(90deg, #3669d8, #65dcff); }
    #ultFill { background: linear-gradient(90deg, #8b4cff, #ffe073); }
    .hud-right { display: flex; justify-content: flex-end; pointer-events: auto; }
    .pause-button { width: 42px; height: 42px; border: 1px solid rgba(255,225,150,.45); border-radius: 50%; background: rgba(12,9,24,.78); color: #ffe5aa; font-size: 16px; font-weight: 900; cursor: pointer; }
    .hud-bottom { position: absolute; left: 14px; bottom: calc(14px + var(--safe-bottom)); width: min(220px, 42vw); padding: 9px 11px; border: 1px solid rgba(255,221,143,.28); border-radius: 12px; background: rgba(10,8,20,.68); }
    .hud-bottom-line { display: flex; justify-content: space-between; gap: 8px; color: #ffe5aa; font-size: 11px; font-weight: 800; }
    .hud-note { color: rgba(255,255,255,.64); font-size: 10px; }
    #touch-controls { position: fixed; inset: 0; z-index: 8; display: none; pointer-events: none; }
    #touch-controls.active { display: block; }
    #stick { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: calc(22px + var(--safe-bottom)); width: 142px; height: 142px; border: 1px solid rgba(255,255,255,.28); border-radius: 50%; background: radial-gradient(circle, rgba(135,113,184,.16), rgba(20,15,36,.25)); pointer-events: auto; touch-action: none; }
    #stick::before { content: ""; position: absolute; inset: 19px; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; }
    #stick-knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border: 1px solid rgba(255,255,255,.45); border-radius: 50%; background: rgba(219,204,255,.26); box-shadow: 0 0 16px rgba(137,88,255,.3); transform: translate(0,0); pointer-events: none; }
    .touch-actions { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: calc(22px + var(--safe-bottom)); width: 190px; height: 174px; pointer-events: none; }
    .touch-button { position: absolute; display: grid; place-items: center; border: 1px solid rgba(255,226,154,.58); border-radius: 50%; background: radial-gradient(circle at 35% 28%, rgba(96,75,137,.9), rgba(17,12,31,.94)); color: #ffe7b1; font-size: 10px; font-weight: 900; letter-spacing: .08em; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 5px 16px rgba(0,0,0,.45); pointer-events: auto; touch-action: none; }
    .touch-button:active, .touch-button.down { transform: scale(.92); filter: brightness(1.28); }
    #touchAttack { right: 0; bottom: 10px; width: 82px; height: 82px; }
    #touchDash { left: 0; bottom: 0; width: 60px; height: 60px; }
    #touchUlt { right: 10px; top: 0; width: 60px; height: 60px; border-color: rgba(190,151,255,.85); }
    #toast { position: fixed; left: 50%; top: calc(18% + var(--safe-top)); z-index: 20; max-width: min(90vw, 420px); padding: 10px 16px; border: 1px solid rgba(255,220,140,.6); border-radius: 12px; background: rgba(15,10,28,.94); color: #fff0cf; font-size: 13px; font-weight: 800; text-align: center; box-shadow: 0 12px 34px rgba(0,0,0,.42); opacity: 0; transform: translate(-50%, -8px); transition: opacity .2s ease, transform .2s ease; pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .keyboard-help { margin-top: 16px; color: rgba(255,255,255,.65); font-size: 11px; letter-spacing: .04em; }
    .small-label { color: rgba(255,255,255,.62); font-size: 11px; text-align: center; }
    @media (pointer: coarse), (max-width: 760px) {
      .keyboard-help { display: none; }
      .screen.menu-screen { padding-top: calc(4vh + var(--safe-top)); padding-bottom: calc(4vh + var(--safe-bottom)); }
      .brand h1 { font-size: clamp(42px, 13vw, 74px); }
      .menu-copy { padding-bottom: 3vh; }
      .mode-list { grid-template-columns: 1fr; max-width: 520px; }
      .mode-option { min-height: 158px; padding: 16px; }
      .content-panel { padding: 16px; }
      .hud-block { min-width: 132px; padding: 8px 9px; }
      .hud-center { min-width: 82px; padding: 8px; }
      .hud-value { font-size: 12px; }
      .hud-bottom { bottom: calc(172px + var(--safe-bottom)); width: min(178px, 45vw); }
    }
    @media (max-height: 540px) and (orientation: landscape) {
      .screen { gap: 12px; padding-top: calc(10px + var(--safe-top)); padding-bottom: calc(10px + var(--safe-bottom)); }
      .screen.menu-screen { padding-top: calc(10px + var(--safe-top)); padding-bottom: calc(10px + var(--safe-bottom)); }
      .brand h1 { font-size: clamp(36px, 9vh, 64px); }
      .menu-copy { padding-bottom: 0; }
      .menu-copy p { margin-bottom: 10px; font-size: 13px; }
      .button { min-height: 42px; padding: 9px 15px; }
      #stick { width: 112px; height: 112px; bottom: calc(12px + var(--safe-bottom)); }
      .touch-actions { transform: scale(.82); transform-origin: bottom right; bottom: calc(12px + var(--safe-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Arcane Arena game"></canvas>
  <div id="shade"></div>
  <div id="ui"></div>
  <div id="hud" class="game-hud" aria-live="polite">
    <div class="hud-top">
      <div class="hud-block">
        <div class="hud-small" id="playerName">Mage</div>
        <div class="hud-bar"><span id="healthFill"></span></div>
        <div class="hud-bar"><span id="manaFill"></span></div>
      </div>
      <div class="hud-center">
        <div class="hud-small" id="matchMode">ARENA</div>
        <div class="hud-value" id="matchValue">00:00</div>
      </div>
      <div class="hud-right"><button id="pauseButton" class="pause-button" aria-label="Pause">II</button></div>
    </div>
    <div class="hud-bottom">
      <div class="hud-bottom-line"><span id="ultLabel">ULTIMATE</span><span id="ultPercent">0%</span></div>
      <div class="hud-bar"><span id="ultFill"></span></div>
      <div class="hud-note" id="hudNote">WASD / arrows to move</div>
    </div>
  </div>
  <div id="touch-controls" aria-label="Touch controls">
    <div id="stick" aria-label="Movement joystick"><div id="stick-knob"></div></div>
    <div class="touch-actions">
      <button id="touchUlt" class="touch-button" aria-label="Ultimate">ULT</button>
      <button id="touchDash" class="touch-button" aria-label="Dash">DASH</button>
      <button id="touchAttack" class="touch-button" aria-label="Attack">CAST</button>
    </div>
  </div>
  <div id="toast" role="status"></div>

  <script>
  'use strict';

  const CONFIG = { title: 'Arcane Arena', version: '2.0.0', saveKey: 'arcane_arena_v2' };
  const TAU = Math.PI * 2;
  const $ = selector => document.querySelector(selector);
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const choose = list => list[Math.floor(Math.random() * list.length)];
  const safeCall = fn => { try { return fn(); } catch (e) { return null; } };
  const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const tr = (ru, en) => LANG === 'ru' ? ru : en;

  const SKINS = [
    { id: 'violet', name: ['Пурпурный маг', 'Violet Mage'], robe: '#52248e', trim: '#e8b654', price: 0 },
    { id: 'crimson', name: ['Багровый маг', 'Crimson Mage'], robe: '#8b2938', trim: '#f3bf59', price: 0 },
    { id: 'azure', name: ['Лазурный маг', 'Azure Mage'], robe: '#245b9e', trim: '#9ce5ff', price: 70 },
    { id: 'emerald', name: ['Изумрудный маг', 'Emerald Mage'], robe: '#27734f', trim: '#e8c66a', price: 90 },
    { id: 'void', name: ['Архимаг Бездны', 'Void Archmage'], robe: '#23113c', trim: '#d5a5ff', price: 150 },
    { id: 'solar', name: ['Солнечный мудрец', 'Solar Sage'], robe: '#a54a19', trim: '#ffe28b', price: 180 }
  ];
  const UPGRADES = [
    { id: 'power', title: ['Сила магии', 'Arcane power'], copy: ['Урон заклинаний +20%', 'Spell damage +20%'] },
    { id: 'haste', title: ['Быстрое заклинание', 'Rapid casting'], copy: ['Скорострельность +15%', 'Attack speed +15%'] },
    { id: 'health', title: ['Жизненная сила', 'Vitality'], copy: ['Максимум здоровья +25', 'Maximum health +25'] },
    { id: 'multicast', title: ['Мультикаст', 'Multicast'], copy: ['Еще один снаряд за атаку', 'One extra projectile'] },
    { id: 'speed', title: ['Легкие ноги', 'Fleet feet'], copy: ['Скорость движения +10%', 'Movement speed +10%'] },
    { id: 'mana', title: ['Поток маны', 'Mana flow'], copy: ['Регенерация маны +50%', 'Mana regeneration +50%'] }
  ];
  const ELEMENTS = [
    { id: 'fire', color: '#ff672d' }, { id: 'ice', color: '#6be6ff' }, { id: 'storm', color: '#f9e35c' },
    { id: 'void', color: '#bb79ff' }, { id: 'arcane', color: '#e7b7ff' }
  ];

  function defaultSave() {
    return { nick: 'Mage', gems: 35, wins: 0, matches: 0, bestWave: 0, skin: 'violet', skins: ['violet', 'crimson'], lang: null, sound: .55, sfx: .75, updatedAt: 0 };
  }
  let save = defaultSave();
  let LANG = 'ru';
  let ysdk = null;
  let ysPlayer = null;
  let cloudTimer = 0;
  let state = 'menu';
  let game = null;
  let W = 0, H = 0, DPR = 1;
  let sceneTime = 0;
  let lastFrame = 0;
  let hudTimer = 0;
  let selectedBots = 3;
  let toastTimer = 0;
  let audioContext = null;
  let audioMaster = null;
  let audioMuted = false;
  let audioUnlockNeeded = true;
  let lastAdTime = 0;
  let screenData = {};

  const canvas = $('#game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const ui = $('#ui');
  const hud = $('#hud');
  const touchControls = $('#touch-controls');
  const touchStick = $('#stick');
  const touchKnob = $('#stick-knob');

  const input = {
    keys: Object.create(null), mouseX: 0, mouseY: 0, mouseDown: false, mouseUsed: false,
    joyId: null, joyX: 0, joyY: 0, joyCenterX: 0, joyCenterY: 0,
    attackHeld: false, dashPressed: false, ultPressed: false, pausePressed: false,
    pointers: new Map(), lastPointerType: 'mouse'
  };

  const TITLE_STARS = Array.from({ length: 95 }, () => ({ x: Math.random(), y: Math.random() * .8, r: rand(.4, 1.7), phase: rand(0, TAU), speed: rand(.7, 2.1) }));
  const TITLE_ROCKS = Array.from({ length: 42 }, (_, i) => ({ x: rand(-.08, 1.08), y: rand(.7, 1.08), w: rand(.045, .18), h: rand(.018, .07), seed: i * 17 + rand(0, 40), z: rand(.4, 1) })).sort((a, b) => a.y - b.y);

  function loadSave() {
    try {
      const raw = JSON.parse(localStorage.getItem(CONFIG.saveKey) || '{}');
      const base = defaultSave();
      save = Object.assign(base, raw && typeof raw === 'object' ? raw : {});
      if (typeof save.gems !== 'number' || !Number.isFinite(save.gems)) save.gems = base.gems;
      if (!Array.isArray(save.skins)) save.skins = base.skins.slice();

    touchStick.addEventListener('pointerup', endStick); touchStick.addEventListener('pointercancel', endStick); touchStick.addEventListener('lostpointercapture', endStick);
    function moveStick(event) {
      event.preventDefault(); input.joyX = event.clientX; input.joyY = event.clientY;
      const dx = input.joyX - input.joyCenterX, dy = input.joyY - input.joyCenterY, d = Math.hypot(dx, dy) || 1, radius = 42, m = Math.min(radius, d);
      touchKnob.style.transform = `translate(${dx / d * m}px, ${dy / d * m}px)`;
    }
    $('#pauseButton').addEventListener('click', () => { if (state === 'playing') setScreen('pause'); });
    const bindTouchButton = (id, action) => {
      const button = $(id);
      button.addEventListener('pointerdown', event => {
        if (state !== 'playing') return;
        event.preventDefault(); event.stopPropagation(); initAudio(); button.classList.add('down'); input.lastPointerType = 'touch'; input.mouseUsed = false;
        if (action === 'attack') input.attackHeld = true;
        if (action === 'dash') input.dashPressed = true;
        if (action === 'ult') input.ultPressed = true;
        try { button.setPointerCapture(event.pointerId); } catch (e) { /* optional */ }
      }, { passive: false });
      const release = event => { if (action === 'attack') input.attackHeld = false; button.classList.remove('down'); };
      button.addEventListener('pointerup', release); button.addEventListener('pointercancel', release); button.addEventListener('lostpointercapture', release);
    };
    bindTouchButton('#touchAttack', 'attack'); bindTouchButton('#touchDash', 'dash'); bindTouchButton('#touchUlt', 'ult');
  }

  function handleAction(action, data) {
    sound('click');
    if (action === 'open-modes') setScreen('modes');
    else if (action === 'menu') setMenu();
    else if (action === 'shop') setScreen('shop');
    else if (action === 'settings') setScreen('settings');
    else if (action === 'count') { selectedBots = clamp(Number(data.count) || 3, 2, 5); renderScreen(); }
    else if (action === 'start') startMatch(data.mode === 'survival' ? 'survival' : 'arena');
    else if (action === 'equip') { if (save.skins.includes(data.id)) { save.skin = data.id; saveGame(); renderScreen(); } }
    else if (action === 'buy-skin') {
      const skin = getSkin(data.id);
      if (save.gems < skin.price) toast(tr('Не хватает кристаллов', 'Not enough crystals'));
      else if (!save.skins.includes(skin.id)) { save.gems -= skin.price; save.skins.push(skin.id); save.skin = skin.id; saveGame(); toast(tr('Новый образ открыт', 'New robe unlocked')); renderScreen(); }
    }
    else if (action === 'language') { LANG = data.lang === 'en' ? 'en' : 'ru'; save.lang = LANG; saveGame(); renderScreen(); }
    else if (action === 'resume') setScreen('playing');
    else if (action === 'quit') {
      const finish = () => { game = null; setMenu(); };
      if (state === 'result') showInterstitial(finish); else finish();
    }
    else if (action === 'replay') startMatch(game ? game.mode : 'arena');
    else if (action === 'upgrade' && game) applyUpgrade(data.id);
    else if (action === 'double-reward' && state === 'result' && !screenData.doubled) {
      showRewarded(() => {
        if (!screenData.doubled && screenData.result) {
          screenData.doubled = true; save.gems += screenData.result.reward; saveGame(); renderScreen(); toast(tr('Награда удвоена', 'Reward doubled'));
        }
      });
    }
  }
  ui.addEventListener('click', event => {
    const target = event.target.closest('[data-action]');
    if (!target || target.disabled) return;
    if (target.dataset.action === 'count') { event.stopPropagation(); }
    handleAction(target.dataset.action, target.dataset);
  });
  ui.addEventListener('input', event => {
    const target = event.target;
    if (target.dataset.setting === 'sfx') { save.sfx = clamp(Number(target.value) / 100, 0, 1); if (audioMaster && audioContext && !audioMuted) audioMaster.gain.setTargetAtTime(save.sfx, audioContext.currentTime, .05); saveGame(); }
    if (target.dataset.setting === 'nick') { save.nick = String(target.value).replace(/[<>]/g, '').slice(0, 14) || 'Mage'; if (game && game.player) game.player.name = save.nick; saveGame(); }
  });

  function loop(timestamp) {
    requestAnimationFrame(loop);
    if (!lastFrame) lastFrame = timestamp;
    const raw = Math.min(.05, Math.max(0, (timestamp - lastFrame) / 1000)); lastFrame = timestamp; sceneTime += raw;
    if (state === 'playing' && game) {
      updateGame(raw); hudTimer += raw; updateHud(false);
    }
    if (game && ['playing', 'pause', 'levelup', 'result'].includes(state)) drawWorld();
    else drawTitleScene(sceneTime);
  }

  async function boot() {
    if (!ctx) {
      ui.innerHTML = '<main class="screen"><h1>Arcane Arena</h1><p>Your browser does not support Canvas.</p></main>';
      return;
    }
    resize(); window.addEventListener('resize', resize, { passive: true });
    loadSave(); if (save.lang) LANG = save.lang;
    bindInput(); renderScreen(); requestAnimationFrame(loop);
    initYandex();
  }
  boot();
  </script>
</body>
</html>
