<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05030a;color:#fff;font-family:'Trebuchet MS',Verdana,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:fixed;inset:0;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;z-index:10}
.scr.on{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .3s cubic-bezier(.2,.8,.2,1),visibility 0s 0s}
.glass{background:rgba(20,10,30,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid #DAA520;border-radius:12px;box-shadow:inset 0 0 14px rgba(255,200,80,.15),0 4px 18px rgba(0,0,0,.5)}
/* ---- Загрузка ---- */
#loading{background:radial-gradient(ellipse at center,#2a0d18 0%,#07040c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50}
#loading h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(34px,8vw,64px);margin:0;color:#FFD34D;text-shadow:0 0 18px #FF6A1A,0 3px 0 #000;letter-spacing:2px}
.bar{width:min(320px,70vw);height:12px;border:2px solid #DAA520;border-radius:8px;background:#120a1c;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF6A1A,#FFEE00);transition:width .15s}
.studio{font-style:italic;font-family:Georgia,serif;font-size:14px;opacity:.5}
/* ---- Главное меню ---- */
#scr-menu{display:block}
#mstack{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px;transform-origin:center center}
#title{font-family:Georgia,'Times New Roman',serif;font-weight:900;font-size:clamp(40px,9vw,72px);margin:0 0 6px;letter-spacing:2px;text-align:center;background:linear-gradient(180deg,#FFEE00,#FF6A1A,#FFEE00);background-size:100% 300%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #3a1200;filter:drop-shadow(0 0 14px rgba(255,160,30,.9)) drop-shadow(0 0 34px rgba(255,90,0,.6));animation:tflame 2.4s ease-in-out infinite,tbounce 2s ease-in-out infinite}
@keyframes tflame{0%,100%{background-position:0 0}50%{background-position:0 100%}}
@keyframes tbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
#mbtns{display:flex;flex-direction:column;align-items:center;gap:10px}
.mbtn{width:280px;height:60px;border-radius:12px;border:2px solid #DAA520;background:rgba(20,10,30,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 16px rgba(255,200,80,.2),0 0 10px rgba(218,165,32,.25);color:#fff;font:bold 20px 'Trebuchet MS',Verdana,sans-serif;display:flex;align-items:center;gap:12px;padding:0 18px;cursor:pointer;transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .15s;text-shadow:0 0 1px #DAA520,1px 0 #8a6a1a,-1px 0 #8a6a1a,0 1px #8a6a1a,0 -1px #8a6a1a}
.mbtn .ic{font-size:24px;width:30px;text-align:center;text-shadow:none}
.mbtn .tx{flex:1;text-align:center;padding-right:30px}
.mbtn:hover{transform:scale(1.05);box-shadow:inset 0 0 22px rgba(255,210,90,.4),0 0 24px rgba(255,190,50,.6)}
.mbtn:active{transform:scale(.95)}
.mbtn.primary{width:320px;height:70px;font-size:24px;animation:ppulse 1.6s ease-in-out infinite}
@keyframes ppulse{0%,100%{box-shadow:inset 0 0 16px rgba(255,200,80,.25),0 0 14px rgba(255,200,50,.4)}50%{box-shadow:inset 0 0 26px rgba(255,220,100,.5),0 0 34px rgba(255,200,50,.9)}}
#credit{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:italic 13px Georgia,serif;opacity:.5;pointer-events:none}
#prof{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;transform-origin:left top}
#prof canvas{width:48px;height:48px;border-radius:50%;border:2px solid #DAA520;background:#1a0f26}
#prof .pi{display:flex;flex-direction:column;font-size:13px;line-height:1.25}
#prof b{font-size:14px}
#eng{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;transform-origin:right top}
#orbs{display:flex;gap:4px}
#orbs i{width:18px;height:18px;border-radius:50%;border:2px solid #000;background:#2a2238;display:block}
#orbs i.f{background:radial-gradient(circle at 35% 30%,#fff,#7fe0ff 40%,#2a7bd8);box-shadow:0 0 8px #5cf}
#eTimer{font-size:12px;min-width:34px}
.mini{width:26px;height:26px;border-radius:50%;border:2px solid #DAA520;background:#3a2a10;color:#FFD34D;font-weight:bold;cursor:pointer}
@media (max-height:560px){#mbtns{display:grid;grid-template-columns:repeat(2,auto);gap:8px 12px}.mbtn.primary{grid-column:1/3;justify-self:center}}
/* ---- Панели ---- */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,96vw);max-height:94vh;overflow:auto;padding:14px 16px;touch-action:pan-y;background:rgba(14,8,24,.82)}
.panel h2{margin:0 0 10px;font-family:Georgia,serif;color:#FFD34D;text-shadow:0 2px 0 #000;font-size:26px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.chip,.tab,.btn{border:2px solid #DAA520;background:rgba(40,24,60,.8);color:#fff;border-radius:10px;padding:8px 14px;font:bold 14px 'Trebuchet MS',Verdana,sans-serif;cursor:pointer;transition:transform .12s,background .2s}
.chip:hover,.tab:hover,.btn:hover{transform:scale(1.05)}
.chip:active,.tab:active,.btn:active{transform:scale(.95)}
.chip.sel,.tab.sel{background:linear-gradient(180deg,#FFB830,#C2701A);color:#1a0a00;text-shadow:none}
.btn.go{background:linear-gradient(180deg,#FFD34D,#E0791A);color:#1a0a00;font-size:18px;padding:10px 26px}
.btn[disabled],.chip.dis{opacity:.45;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.card{border:2px solid #4a3a6a;background:rgba(30,18,46,.8);border-radius:10px;padding:8px;display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.3}
.card canvas{width:44px;height:44px;flex:none}
.card b{color:#FFD34D;font-size:14px}
.card.lock{opacity:.5}
.close{position:absolute;right:10px;top:8px}
.pbar{height:10px;background:#1a1226;border:2px solid #000;border-radius:6px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,#FF6A1A,#FFEE00)}
input[type=range]{accent-color:#FFB830}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
#scr-pause,#scr-levelup,#scr-end,#scr-queue,#modal,#adov{background:rgba(5,2,12,.7);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}
#scr-levelup .cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ucard{width:200px;padding:14px;cursor:pointer;transition:transform .15s}
.ucard:hover{transform:translateY(-4px) scale(1.04)}
.ucard .big{font-size:42px}
#scr-end h1{font-family:Georgia,serif;font-size:clamp(36px,9vw,72px);margin:0;text-shadow:0 0 20px currentColor,0 4px 0 #000}
#toast{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);z-index:80;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:rgba(20,10,30,.9);border:2px solid #DAA520;border-radius:10px;padding:8px 16px;font-weight:bold;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#adov{z-index:90}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{border:2px solid #4a3a6a;border-radius:8px;padding:6px 2px;font-size:12px;background:rgba(30,18,46,.8)}
.cal .d.cur{border-color:#FFD34D;box-shadow:0 0 12px #FFB830}
.cal .d.got{opacity:.5}
</style>

<script>
'use strict';
/* =====================================================================
   ARCANE ARENA — единый файл. Всё процедурно: Canvas 2D + Web Audio.

const CONFIG = {

  GAME_TITLE: "ARCANE ARENA",
  GAME_VERSION: "15.2.0",

/* ---------- Утилиты ---------- */
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);

const TAU = Math.PI * 2;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIO = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const dist = (a, b, c, d) => Math.hypot(c - a, d - b);
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(h, a) { const c = hexRgb(h); return 'rgb(' + c.map(v => clamp(Math.round(a >= 0 ? v + (255 - v) * a : v * (1 + a)), 0, 255)).join(',') + ')'; }
function rgba(h, a) { const c = hexRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function mix(h1, h2, t) { const a = hexRgb(h1), b = hexRgb(h2); return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',') + ')'; }
const now = () => performance.now() / 1000;

/* ---------- Локализация ---------- */
const L = {
  ru: { play: 'ИГРАТЬ', surv: 'ВЫЖИВАНИЕ', shop: 'МАГАЗИН', codex: 'КОДЕКС', settings: 'НАСТРОЙКИ', lb: 'РЕЙТИНГ', back: 'Назад', start: 'В БОЙ!', arena: 'Арена', online: 'Онлайн', players: 'Число магов', party: 'Отряд магов', solo: 'Против ИИ', pvp: 'Онлайн PvP', coop: 'Кооператив онлайн', solom: 'Соло против монстров', theme: 'Арена', locked: 'Откроется на ур. ', noEnergy: 'Нет энергии!', ad3: '+3 энергии (реклама)', lvl: 'Ур.', victory: 'ПОБЕДА!', defeat: 'ПОРАЖЕНИЕ', replay: 'Ещё раз', menu: 'В меню', resume: 'Продолжить', paused: 'ПАУЗА', revive: 'Воскреснуть (реклама)', x2: 'x2 награда (реклама)', next: 'Следующая награда', lang: 'Язык', music: 'Музыка', sfx: 'Звуки', vib: 'Вибрация', quality: 'Качество', auto: 'Авто', low: 'Низкое', high: 'Высокое', tv: 'ТВ-режим', nick: 'Никнейм', studio: 'Игра от', loading: 'Загрузка', search: 'Поиск соперников...', wave: 'Волна', kills: 'Убийств', time: 'Время', day: 'День', claim: 'Забрать', claimed: 'Получено', quests: 'Задания', pass: 'Пропуск', free: 'Бесплатно', prem: 'Премиум', buy: 'Купить', equip: 'Надеть', equipped: 'Надето', owned: 'Есть', trial: 'Попробовать (реклама)', skins: 'Скины', gemsT: 'Кристаллы', spells: 'Заклинания', items: 'Предметы', best: 'Бестиарий', upg: 'Улучшения', achs: 'Достижения', lvlup: 'НОВЫЙ УРОВЕНЬ!', choose: 'Выбери улучшение', room: 'Код комнаты', create: 'Создать', join: 'Войти', p2p: 'P2P недоступен — игра с ботами', noSdk: 'Покупки доступны на Яндекс Играх', quick: 'Быстрая игра', fps: 'Показывать FPS', quit: 'Выйти', rewards: 'Награда', wins: 'Победы', bestw: 'Лучшая волна', mode: 'Режим', calT: 'Ежедневная награда', calSub: 'Заходи каждый день — на 7-й день легендарный сундук!', noads: 'Без рекламы', vip: 'VIP-пропуск (30 дней)', starter: 'Стартовый набор', soon: 'Скоро', fight: 'Бои', gone: 'Выбыл', alive: 'Живы', pause: 'Пауза', levelShort: 'Ур.', adT: 'Реклама', adS: 'Демо-реклама...', rewarded: 'Награда получена!', cost: 'Цена', passInfo: 'Опыт за матчи открывает награды', notEnough: 'Не хватает валюты', clutch: 'ПОБЕДА НА ВОЛОСКЕ!', quitQ: 'Выйти в меню?' },
  en: { play: 'PLAY', surv: 'SURVIVAL', shop: 'SHOP', codex: 'CODEX', settings: 'SETTINGS', lb: 'LEADERBOARD', back: 'Back', start: 'FIGHT!', arena: 'Arena', online: 'Online', players: 'Mages', party: 'Party size', solo: 'Solo vs AI', pvp: 'Online PvP', coop: 'Co-op online', solom: 'Solo vs monsters', theme: 'Arena', locked: 'Unlocks at lvl ', noEnergy: 'No energy!', ad3: '+3 energy (ad)', lvl: 'Lv.', victory: 'VICTORY!', defeat: 'DEFEAT', replay: 'Replay', menu: 'Menu', resume: 'Resume', paused: 'PAUSED', revive: 'Revive (ad)', x2: 'x2 rewards (ad)', next: 'Next unlock', lang: 'Language', music: 'Music', sfx: 'SFX', vib: 'Vibration', quality: 'Quality', auto: 'Auto', low: 'Low', high: 'High', tv: 'TV mode', nick: 'Nickname', studio: 'A Game by', loading: 'Loading', search: 'Searching for opponents...', wave: 'Wave', kills: 'Kills', time: 'Time', day: 'Day', claim: 'Claim', claimed: 'Claimed', quests: 'Quests', pass: 'Pass', free: 'Free', prem: 'Premium', buy: 'Buy', equip: 'Equip', equipped: 'Equipped', owned: 'Owned', trial: 'Try (ad)', skins: 'Skins', gemsT: 'Gems', spells: 'Spell Chains', items: 'Potions & Items', best: 'Bestiary', upg: 'Upgrades', achs: 'Achievements', lvlup: 'LEVEL UP!', choose: 'Choose an upgrade', room: 'Room code', create: 'Create', join: 'Join', p2p: 'P2P unavailable — playing with bots', noSdk: 'Purchases are available on Yandex Games', quick: 'Quick match', fps: 'Show FPS', quit: 'Quit', rewards: 'Rewards', wins: 'Wins', bestw: 'Best wave', mode: 'Mode', calT: 'Daily reward', calSub: 'Come back daily — Legendary Chest on day 7!', noads: 'No Ads', vip: 'VIP Pass (30 days)', starter: 'Starter Pack', soon: 'Soon', fight: 'Fights', gone: 'Out', alive: 'Alive', pause: 'Pause', levelShort: 'Lv.', adT: 'Advertisement', adS: 'Demo ad...', rewarded: 'Reward received!', cost: 'Cost', passInfo: 'Match XP unlocks rewards', notEnough: 'Not enough currency', clutch: 'CLUTCH WIN!', quitQ: 'Quit to menu?' }
};
let lang = CONFIG.DEFAULT_LANGUAGE;
const t = k => (L[lang] && L[lang][k]) || L.ru[k] || k;
const tt = p => p[lang === 'ru' ? 0 : 1];

/* ---------- Сохранения (локально + облако Яндекс) ---------- */
const SKEY = 'arcane_arena_v15';
const DEF = { nick: 'Маг', gold: 150, gems: 30, xp: 0, lvl: 1, energy: 5, eT: 0, lang: null, mv: .6, sv: .9, vib: true, q: 'auto', tv: false, fps: false, skin: 'default', skins: { default: 1 }, stats: {}, ach: {}, quests: { day: '', list: [] }, login: { day: '', streak: 0 }, pass: { xp: 0, prem: false, cl: {}, clp: {} }, noAds: false, vip: 0, starter: false, wins: 0, bestWave: 0, ts: 0 };
let S = JSON.parse(JSON.stringify(DEF));
function mergeDeep(a, b) { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') mergeDeep(a[k], b[k]); else a[k] = b[k]; } }
function loadSave() { try { const raw = localStorage.getItem(SKEY); if (raw) mergeDeep(S, JSON.parse(raw)); } catch (e) { } if (!S.eT) S.eT = Date.now(); }
let saveTimer = 0;
function persist() {
  S.ts = Date.now();
  try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) { }
  if (YA.player && !saveTimer) { saveTimer = setTimeout(() => { saveTimer = 0; try { YA.player.setData({ save: JSON.stringify(S) }, false).catch(() => { }); } catch (e) { } }, 3000); }
}
/* Энергия: 5 ядер, +1 за 5 минут */
const E_REGEN = 300000;
function energyTick() {
  if (S.energy >= 5) { S.energy = 5; S.eT = Date.now(); return; }
  const n = Math.floor((Date.now() - S.eT) / E_REGEN);
  if (n > 0) { S.energy = Math.min(5, S.energy + n); S.eT += n * E_REGEN; if (S.energy >= 5) S.eT = Date.now(); persist(); }
}
function useEnergy() { energyTick(); if (S.energy <= 0) return false; if (S.energy >= 5) S.eT = Date.now(); S.energy--; persist(); return true; }

/* ---------- Яндекс SDK ---------- */
const YA = { sdk: null, player: null, lastAdv: Date.now() - 120000, gp: false, lb: null };
async function initYandex() {
  try {
    if (!window.YaGames) return;
    const sdk = await Promise.race([YaGames.init(), new Promise((_, r) => setTimeout(() => r('timeout'), 2500))]);
    YA.sdk = sdk; window.ysdk = sdk;
    try { const lc = sdk.environment && sdk.environment.i18n && sdk.environment.i18n.lang; if (lc && !S.lang) lang = ['ru', 'be', 'kk', 'uk', 'uz'].includes(lc) ? 'ru' : 'en'; } catch (e) { }
    try {

/* ---- Рейтинг ---- */

const FPS = { v: 60, acc: 0, n: 0, win: 0 };
let lastT = performance.now(), menuFrame = 0;
function updateUIreal(real) {

  if (M.notif) M.notif.t += real; if (M.notif2) M.notif2.t += real; if (M.ann) M.ann.t += real; if (M.ultBanner) M.ultBanner.t += real; if (M.iconFlash > 0) M.iconFlash -= real * 2;
