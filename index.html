<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ARCANE ARENA v15.0</title>
    <style>
      /* Базовые стили и сброс */
      :root {
        --gold: #daa520;
        --gold-bright: #ffd76a;
        --purple: #4a2a8b;
        --bg: #05030a;
        --glass: rgba(20, 15, 35, 0.75);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      body {
        background: var(--bg);
        color: #fff;
        font-family: "Trebuchet MS", sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      /* Игровой холст */
      #gameCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* UI Оверлей */
      #uiLayer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
      }

      /* Стеклянные панели (Glassmorphism) */
      .glass-panel {
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 215, 120, 0.2);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        pointer-events: auto;
      }

      /* Экранные меню */
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at center,
          rgba(40, 20, 80, 0.8),
          rgba(5, 3, 10, 0.95)
        );
        pointer-events: auto;
        z-index: 20;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .screen.active {
        opacity: 1;
      }
      .screen.hidden {
        display: none;
      }

      h1 {
        font-size: clamp(40px, 8vw, 80px);
        text-align: center;
        color: var(--gold-bright);
        text-shadow:
          0 4px 0 #000,
          0 0 20px rgba(255, 200, 0, 0.5);
        margin-bottom: 10px;
        line-height: 1;
      }
      h2 {
        font-size: clamp(24px, 5vw, 40px);
        color: var(--gold);
        text-shadow: 0 2px 0 #000;
        margin-bottom: 20px;
      }
      .subtitle {
        font-size: 14px;
        color: #aaa;
        letter-spacing: 2px;
        margin-bottom: 40px;
        text-transform: uppercase;
      }

      /* Кнопки */
      .btn {
        background: linear-gradient(180deg, var(--gold-bright), var(--gold));
        color: #1a0a00;
        font-weight: 900;
        font-size: 18px;
        padding: 12px 32px;
        border: 3px solid #000;
        border-radius: 12px;
        cursor: pointer;
        box-shadow:
          0 4px 0 #6b4607,
          0 8px 15px rgba(0, 0, 0, 0.5);
        transition:
          transform 0.1s,
          filter 0.2s;
        margin: 10px;
        pointer-events: auto;
        min-width: 200px;
        text-align: center;
      }
      .btn:active {
        transform: translateY(4px);
        box-shadow: 0 0 0 #6b4607;
      }
      .btn:hover {
        filter: brightness(1.1);
      }
      .btn.small {
        font-size: 14px;
        padding: 8px 16px;
        min-width: 100px;
      }
      .btn.secondary {
        background: linear-gradient(180deg, #7a52d0, var(--purple));
        color: #fff;
        box-shadow: 0 4px 0 #1d0f45;
        border-color: #000;
      }

      /* HUD */
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: none;
      }
      .hud-top-left {
        position: absolute;
        top: 15px;
        left: 15px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .bar-container {
        width: 200px;
        height: 16px;
        background: #000;
        border: 2px solid #333;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
      }
      .bar-fill {
        height: 100%;
        width: 100%;
        transition: width 0.1s;
      }
      .hp-fill {
        background: linear-gradient(90deg, #ff2a2a, #ff6a6a);
      }
      .mana-fill {
        background: linear-gradient(90deg, #2a6aff, #6ab4ff);
        height: 10px;
      }
      .ult-fill {
        background: linear-gradient(90deg, #d070ff, #ffd76a);
        height: 10px;
      }
      .bar-text {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: bold;
        text-shadow: 1px 1px 0 #000;
      }

      .hud-bottom-left {
        position: absolute;
        bottom: 15px;
        left: 15px;
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .rune-slots {
        display: flex;
        gap: 5px;
      }
      .rune {
        width: 30px;
        height: 30px;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #555;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }
      .rune.active {
        border-color: var(--gold);
        box-shadow: 0 0 10px var(--gold);
      }

      /* Кнопки управления (Справа) */
      .controls {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 15px;
        pointer-events: none;
      }
      .action-btn {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: rgba(20, 15, 35, 0.8);
        border: 3px solid rgba(255, 215, 120, 0.5);
        color: #fff;
        font-weight: bold;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: auto;
        box-shadow:
          inset 0 0 15px rgba(0, 0, 0, 0.8),
          0 0 10px rgba(0, 0, 0, 0.5);
        position: relative;
      }
      .action-btn:active {
        transform: scale(0.95);
        background: rgba(40, 30, 70, 0.9);
      }
      .action-btn.attack {
        width: 90px;
        height: 90px;
        border-color: #ff6a6a;
      }
      .action-btn.dash {
        width: 60px;
        height: 60px;
        margin-right: 20px;
        border-color: #6ab4ff;
      }
      .action-btn.ult {
        width: 70px;
        height: 70px;
        border-color: #d070ff;
      }
      .action-btn.ult.ready {
        border-color: var(--gold);
        box-shadow: 0 0 20px var(--gold);
        animation: pulse 1s infinite alternate;
      }

      /* Индикатор кулдауна на кнопке */
      .cd-overlay {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          rgba(0, 0, 0, 0.8) var(--cd, 0%),
          transparent 0
        );
        pointer-events: none;
      }

      @keyframes pulse {
        from {
          box-shadow: 0 0 10px var(--gold);
        }
        to {
          box-shadow: 0 0 25px var(--gold-bright);
        }
      }

      /* Вибрация (Low HP) */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 15;
        opacity: 0;
        background: radial-gradient(
          circle,
          transparent 50%,
          rgba(255, 0, 0, 0.6) 100%
        );
        transition: opacity 0.3s;
      }

      /* Всплывающий текст и уведомления */
      #notifications {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        pointer-events: none;
      }
      .notif {
        background: rgba(0, 0, 0, 0.7);
        color: var(--gold-bright);
        padding: 5px 15px;
        border-radius: 20px;
        font-weight: bold;
        animation: slideDown 2s forwards;
      }
      @keyframes slideDown {
        0% {
          opacity: 0;
          transform: translateY(-20px);
        }
        10% {
          opacity: 1;
          transform: translateY(0);
        }
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(20px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>
    <div id="vignette"></div>

    <!-- Игровой HUD -->
    <div id="hud">
      <div class="hud-top-left">
        <div class="bar-container">
          <div class="bar-fill hp-fill" id="hud-hp"></div>
          <div class="bar-text" id="hud-hp-text">100 / 100</div>
        </div>
        <div class="bar-container" style="height: 10px; width: 160px">
          <div class="bar-fill mana-fill" id="hud-mana"></div>

        <div class="bar-container" style="height: 10px; width: 160px">
          <div class="bar-fill ult-fill" id="hud-ult"></div>

      </div>

      <div class="hud-bottom-left">
        <div class="rune-slots" id="hud-runes">

          <div class="rune"></div>
          <div class="rune"></div>
        </div>
        <div id="hud-buffs" style="display: flex; gap: 5px"></div>
      </div>

      <div class="controls">
        <div class="action-btn dash" id="btn-dash">
          РЫВОК<br /><span style="font-size: 10px">Space</span>
          <div class="cd-overlay" id="cd-dash"></div>
        </div>
        <div style="display: flex; gap: 15px; align-items: flex-end">

            УЛЬТ<br /><span style="font-size: 10px">E / ПКМ</span>
            <div class="cd-overlay" id="cd-ult"></div>
          </div>
          <div class="action-btn attack" id="btn-attack">
            АТАКА<br /><span style="font-size: 10px">ЛКМ</span>

      </div>
    </div>

    <div id="notifications"></div>

    <!-- Экранные меню -->
    <div id="menu" class="screen active">
      <h1>ARCANE<br />ARENA</h1>
      <div class="subtitle" id="studio-name">A Game by YOUR_STUDIO</div>
      <div
        class="glass-panel"
        style="
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 10px;
          min-width: 300px;
          align-items: center;
        "
      >
        <button class="btn" onclick="Game.startMode('arena')">

        </button>
        <button class="btn secondary" onclick="Game.startMode('survival')">
          ВЫЖИВАНИЕ (PvE)
        </button>
        <button class="btn secondary" onclick="Game.startMode('online')">
          ОНЛАЙН (Мокап)
        </button>
        <div style="display: flex; gap: 10px; margin-top: 10px">
          <button class="btn small secondary" onclick="Game.showShop()">
            МАГАЗИН
          </button>
          <button class="btn small secondary" onclick="Game.showCodex()">
            КОДЕКС
          </button>
        </div>
      </div>
      <div class="subtitle" style="margin-top: 20px; font-size: 12px">
        v15.0.0
      </div>
    </div>

    <div id="shop" class="screen hidden">
      <h2>МАГАЗИН СКИНОВ</h2>
      <div
        class="glass-panel"
        style="
          padding: 20px;
          display: flex;
          flex-wrap: wrap;
          gap: 15px;
          max-width: 800px;
          justify-content: center;
        "
      >
        <!-- Скины будут добавлены через JS -->
        <div
          id="shop-items"
          style="
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
          "
        ></div>
      </div>
      <button class="btn" onclick="Game.hideScreens()" style="margin-top: 20px">
        НАЗАД
      </button>
    </div>

    <div id="levelup" class="screen hidden">
      <h2>НОВЫЙ УРОВЕНЬ!</h2>
      <div
        class="glass-panel"
        style="
          padding: 20px;
          display: flex;
          gap: 20px;
          flex-wrap: wrap;
          justify-content: center;
        "
        id="upgrade-choices"
      >
        <!-- Улучшения будут добавлены через JS -->
      </div>
    </div>

    <div id="result" class="screen hidden">
      <h1 id="result-title">ПОБЕДА!</h1>
      <div
        class="glass-panel"
        style="
          padding: 20px;
          text-align: center;
          font-size: 18px;
          margin-bottom: 20px;
        "
      >
        <div>Убийств: <span id="res-kills">0</span></div>
        <div>Волна: <span id="res-wave">0</span></div>
        <div>
          Получено кристаллов:
          <span id="res-gems" style="color: var(--gold-bright)">0</span>
        </div>
      </div>
      <button class="btn" onclick="Game.restart()">ЕЩЕ РАЗ</button>
      <button class="btn secondary" onclick="Game.backToMenu()">В МЕНЮ</button>
    </div>

    <script>
      // ==========================================
      // 1. КОНФИГУРАЦИЯ И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
      // ==========================================
      const CONFIG = {
        STUDIO_NAME: "YOUR_STUDIO_NAME",
        VERSION: "15.0.0",
        IS_PRODUCTION: true,
      };
      document.getElementById("studio-name").innerText =
        "A Game by " + CONFIG.STUDIO_NAME;

      const TAU = Math.PI * 2;
      const rand = (min, max) => Math.random() * (max - min) + min;
      const randi = (min, max) =>
        Math.floor(Math.random() * (max - min + 1)) + min;
      const clamp = (val, min, max) => Math.min(Math.max(val, min), max);
      const lerp = (a, b, t) => a + (b - a) * t;
      const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

      // Элементы
      const ELEMENTS = [
        { id: "fire", name: "Огонь", color: "#FF4500", light: "#FFB070" },
        { id: "ice", name: "Лёд", color: "#00DDFF", light: "#C8F6FF" },
        { id: "lightning", name: "Молния", color: "#FFEE00", light: "#FFFBB0" },
        { id: "air", name: "Воздух", color: "#B0E0E6", light: "#FFFFFF" },
        { id: "void", name: "Пустота", color: "#6A0DAD", light: "#C07AFF" },
      ];

      // Комбинации ультов (15 обычных + 5 мега)
      const ULTS = {
        arcane: { name: "Аркановзрыв", desc: "Кольцо магии", color: "#C9A0FF" },
        "00": { name: "Метеорит", desc: "Урон по площади", color: "#FF4500" },
        "01": { name: "Термошок", desc: "Пар и замедление", color: "#FFB070" },
        "02": { name: "Плазма", desc: "Цепная молния", color: "#FFEE00" },
        "03": {
          name: "Огненный шторм",
          desc: "Торнадо огня",
          color: "#FF4500",
        },
        "04": {
          name: "Врата ада",
          desc: "Портал притягивает",
          color: "#6A0DAD",
        },
        11: {
          name: "Ледяная тюрьма",
          desc: "Заморозка всех",
          color: "#00DDFF",
        },
        12: { name: "Гроза", desc: "Молнии в лужи", color: "#FFEE00" },
        13: { name: "Метель", desc: "Ледяная буря", color: "#C8F6FF" },
        14: {
          name: "Абсолютный ноль",
          desc: "Мгновенная заморозка",
          color: "#00DDFF",
        },
        22: { name: "Перегрузка", desc: "10 молний", color: "#FFEE00" },
        23: { name: "Вихрь", desc: "Торнадо с молниями", color: "#B0E0E6" },
        24: { name: "Громовая пустота", desc: "Самонаводка", color: "#6A0DAD" },
        33: { name: "Циклон", desc: "Отбрасывает врагов", color: "#B0E0E6" },
        34: { name: "Разлом", desc: "Телепорт на край", color: "#6A0DAD" },
        44: { name: "Чёрная дыра", desc: "Сингулярность", color: "#6A0DAD" },
        // Мега-ульты
        "000": {
          name: "Апокалипсис",
          desc: "Метеоритный дождь",
          color: "#FF4500",
          mega: true,
        },
        111: {
          name: "Ледниковый период",
          desc: "Вся арена замерзает",
          color: "#00DDFF",
          mega: true,
        },
        222: {
          name: "Гнев богов",
          desc: "Непрерывная гроза",
          color: "#FFEE00",
          mega: true,
        },
        333: {
          name: "Ураган",
          desc: "Гигантский вихрь",
          color: "#B0E0E6",
          mega: true,
        },
        444: {
          name: "Забвение",
          desc: "Зона смерти",
          color: "#6A0DAD",
          mega: true,
        },
      };

      // Улучшения для выживания
      const UPGRADES = [
        {
          name: "Сила магии",
          desc: "+20% урона",
          apply: (p) => (p.dmgMult += 0.2),
        },
        {
          name: "Скорострельность",
          desc: "+15% скорости атаки",
          apply: (p) => (p.attackSpeedMult += 0.15),
        },
        {
          name: "Лёгкие ноги",
          desc: "+10% скорости",
          apply: (p) => (p.speed *= 1.1),
        },
        {
          name: "Крепкая плоть",
          desc: "+25 макс. HP",
          apply: (p) => {
            p.maxHp += 25;
            p.hp += 25;
          },
        },
        {
          name: "Мультикаст",
          desc: "+1 снаряд",
          apply: (p) => (p.multiShot += 1),
        },
        {
          name: "Пронзание",
          desc: "+1 пробитие",
          apply: (p) => (p.pierce += 1),
        },
        {
          name: "Вампиризм",
          desc: "3% урона лечит",
          apply: (p) => (p.lifesteal += 0.03),
        },
        {
          name: "Магнит",
          desc: "+40% радиус подбора",
          apply: (p) => (p.magnetRadius += 0.4),
        },
      ];

      // Скины
      const SKINS = [
        {
          id: "purple",
          name: "Пурпурный",
          mantle: "#4A2A8B",
          trim: "#DAA520",
          price: 0,
        },
        {
          id: "crimson",
          name: "Багровый",
          mantle: "#8B2F3F",
          trim: "#DAA520",
          price: 0,
        },
        {
          id: "emerald",
          name: "Изумрудный",
          mantle: "#2F8B5A",
          trim: "#DAA520",
          price: 0,
        },
        {
          id: "gold",
          name: "Золотой",
          mantle: "#B8862F",
          trim: "#FFF2A0",
          price: 0,
        },
        {
          id: "azure",
          name: "Лазурный",
          mantle: "#2F5A8B",
          trim: "#DAA520",
          price: 0,
        },
        {
          id: "void",
          name: "Архимаг Бездны",
          mantle: "#1B0F3A",
          trim: "#FFD700",
          price: 500,
          aura: "#9B5CFF",
        },
      ];

      // ==========================================
      // 2. ИНИЦИАЛИЗАЦИЯ ЯНДЕКС SDK И АУДИО
      // ==========================================
      let ysdk = null;
      let audioCtx = null;
      let isAudioReady = false;
      let musicGain, sfxGain;

      function initYandexSDK() {
        if (typeof YaGames === "undefined") {
          console.log("Yandex SDK не найден. Работа в демо-режиме.");
          return;
        }
        YaGames.init()
          .then((sdk) => {
            ysdk = sdk;
            console.log("Yandex SDK инициализирован");
            if (ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready();
          })
          .catch((err) => console.error("Ошибка SDK:", err));
      }

      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const compressor = audioCtx.createDynamicsCompressor();
        compressor.connect(audioCtx.destination);

        musicGain = audioCtx.createGain();
        musicGain.gain.value = 0.3;
        musicGain.connect(compressor);

        sfxGain = audioCtx.createGain();
        sfxGain.gain.value = 0.6;
        sfxGain.connect(compressor);
        isAudioReady = true;
      }

      function playSound(type, freq, duration, vol = 0.5) {
        if (!isAudioReady || audioCtx.state === "suspended") return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        if (type === "sawtooth" || type === "square") {
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + duration,
          );
        } else {
          gain.gain.setValueAtTime(0, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + duration,
          );
        }

        osc.connect(gain);
        gain.connect(sfxGain);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

      // ==========================================
      // 3. ГРАФИЧЕСКИЕ УТИЛИТЫ И ПУЛЫ ОБЪЕКТОВ
      // ==========================================
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      let W, H, DPR;

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.scale(DPR, DPR);
      }
      window.addEventListener("resize", resize);
      resize();

      // Пул частиц
      const MAX_PARTICLES = 1000;
      const particles = Array.from({ length: MAX_PARTICLES }, () => ({
        active: false,
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        life: 0,
        maxLife: 1,
        color: "#fff",
        size: 2,
        gravity: 0,
      }));
      let particleIndex = 0;

      function spawnParticle(x, y, vx, vy, life, color, size, gravity = 0) {
        const p = particles[particleIndex];
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = vx;
        p.vy = vy;
        p.life = life;
        p.maxLife = life;
        p.color = color;
        p.size = size;
        p.gravity = gravity;
        particleIndex = (particleIndex + 1) % MAX_PARTICLES;
      }

      function updateParticles(dt) {
        for (let i = 0; i < MAX_PARTICLES; i++) {
          const p = particles[i];
          if (!p.active) continue;
          p.life -= dt;
          if (p.life <= 0) {
            p.active = false;
            continue;
          }
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
        }
      }

      function drawParticles() {
        ctx.globalCompositeOperation = "lighter";
        for (let i = 0; i < MAX_PARTICLES; i++) {
          const p = particles[i];
          if (!p.active) continue;
          ctx.globalAlpha = p.life / p.maxLife;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }

      // Пул снарядов
      const MAX_PROJECTILES = 200;
      const projectiles = Array.from({ length: MAX_PROJECTILES }, () => ({
        active: false,
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        radius: 0,
        damage: 0,
        team: 0,
        color: "#fff",
        life: 0,
        pierce: 0,
      }));

      function spawnProjectile(
        x,
        y,
        angle,
        speed,
        damage,
        team,
        color,
        radius = 6,
        pierce = 0,
      ) {
        const p = projectiles.find((proj) => !proj.active);
        if (!p) return;
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed;
        p.damage = damage;
        p.team = team;
        p.color = color;
        p.radius = radius;
        p.life = 2.0;
        p.pierce = pierce;
      }

      function updateProjectiles(dt) {
        for (let i = 0; i < MAX_PROJECTILES; i++) {
          const p = projectiles[i];
          if (!p.active) continue;
          p.life -= dt;
          if (p.life <= 0) {
            p.active = false;
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;

          // Проверка выхода за границы арены (упрощенно)
          if (Math.abs(p.x) > 1000 || Math.abs(p.y) > 1000) {
            p.active = false;
            continue;
          }

          // Коллизии
          for (const unit of Game.units) {
            if (!unit.active || unit.dead || unit.team === p.team) continue;
            if (dist(p.x, p.y, unit.x, unit.y) < unit.radius + p.radius) {
              unit.takeDamage(p.damage, p.x, p.y);
              spawnParticle(
                p.x,
                p.y,
                rand(-50, 50),
                rand(-50, 50),
                0.3,
                p.color,
                3,
              );
              if (p.pierce > 0) {
                p.pierce--;
              } else {
                p.active = false;
                break;
              }
            }
          }
        }
      }

      function drawProjectiles() {
        ctx.globalCompositeOperation = "lighter";
        for (let i = 0; i < MAX_PROJECTILES; i++) {
          const p = projectiles[i];
          if (!p.active) continue;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 1.5, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 0.5, 0, TAU);
          ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";
      }

      // ==========================================
      // 4. ПРОЦЕДУРНАЯ ГЕНЕРАЦИЯ АРЕНЫ
      // ==========================================
      let arenaCanvas = null;

      function generateArena(size) {
        const c = document.createElement("canvas");
        c.width = size;
        c.height = size;
        const g = c.getContext("2d");
        const half = size / 2;

        // Фон - темный базальт
        g.fillStyle = "#1a1520";
        g.fillRect(0, 0, size, size);

        // Плитка
        const tileSize = 60;
        for (let y = 0; y < size; y += tileSize) {
          for (let x = 0; x < size; x += tileSize) {
            const shade = randi(20, 40);
            g.fillStyle = `rgb(${shade}, ${shade - 5}, ${shade + 10})`;
            g.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
            g.strokeStyle = "#0a0510";
            g.lineWidth = 2;
            g.strokeRect(x, y, tileSize, tileSize);
          }
        }

        // Трещины с лавой
        g.globalCompositeOperation = "lighter";
        for (let i = 0; i < 50; i++) {
          let x = rand(0, size);
          let y = rand(0, size);
          g.beginPath();
          g.moveTo(x, y);
          for (let j = 0; j < 5; j++) {
            x += rand(-40, 40);
            y += rand(-40, 40);
            g.lineTo(x, y);
          }
          g.strokeStyle = `rgba(255, ${randi(50, 150)}, 0, ${rand(0.3, 0.8)})`;
          g.lineWidth = rand(2, 6);
          g.stroke();
        }
        g.globalCompositeOperation = "source-over";

        // Виньетка (затемнение краев)
        const gradient = g.createRadialGradient(
          half,
          half,
          half * 0.5,
          half,
          half,
          half,
        );
        gradient.addColorStop(0, "rgba(0,0,0,0)");
        gradient.addColorStop(1, "rgba(0,0,0,0.8)");
        g.fillStyle = gradient;
        g.fillRect(0, 0, size, size);

        return c;
      }

      // ==========================================
      // 5. ИКОНКИ (ПРЕДРЕНДЕР)
      // ==========================================
      const ICONS = {};
      function generateIcons() {
        // Огонь
        let c = document.createElement("canvas");
        c.width = c.height = 32;
        let g = c.getContext("2d");
        g.fillStyle = "#FF4500";
        g.beginPath();
        g.moveTo(16, 4);
        g.bezierCurveTo(24, 16, 28, 24, 16, 28);
        g.bezierCurveTo(4, 24, 8, 16, 16, 4);
        g.fill();
        g.fillStyle = "#FFB070";
        g.beginPath();
        g.arc(16, 20, 6, 0, TAU);
        g.fill();
        ICONS.fire = c;

        // Лед
        c = document.createElement("canvas");
        c.width = c.height = 32;
        g = c.getContext("2d");
        g.strokeStyle = "#00DDFF";
        g.lineWidth = 3;
        g.lineCap = "round";
        for (let i = 0; i < 3; i++) {
          const a = (i * Math.PI) / 3;
          g.beginPath();
          g.moveTo(16 - Math.cos(a) * 12, 16 - Math.sin(a) * 12);
          g.lineTo(16 + Math.cos(a) * 12, 16 + Math.sin(a) * 12);
          g.stroke();
        }
        ICONS.ice = c;

        // Молния
        c = document.createElement("canvas");
        c.width = c.height = 32;
        g = c.getContext("2d");
        g.fillStyle = "#FFEE00";
        g.beginPath();
        g.moveTo(18, 2);
        g.lineTo(8, 18);
        g.lineTo(16, 18);
        g.lineTo(14, 30);
        g.lineTo(24, 14);
        g.lineTo(16, 14);
        g.fill();
        ICONS.lightning = c;

        // Воздух
        c = document.createElement("canvas");
        c.width = c.height = 32;
        g = c.getContext("2d");
        g.strokeStyle = "#B0E0E6";
        g.lineWidth = 3;
        g.lineCap = "round";
        g.beginPath();
        g.moveTo(4, 10);
        g.quadraticCurveTo(16, 5, 28, 10);
        g.stroke();
        g.beginPath();
        g.moveTo(4, 16);
        g.quadraticCurveTo(16, 21, 28, 16);
        g.stroke();
        g.beginPath();
        g.moveTo(4, 22);
        g.quadraticCurveTo(16, 27, 28, 22);
        g.stroke();
        ICONS.air = c;

        // Пустота
        c = document.createElement("canvas");
        c.width = c.height = 32;
        g = c.getContext("2d");
        g.fillStyle = "#000";
        g.beginPath();
        g.arc(16, 16, 12, 0, TAU);
        g.fill();
        g.strokeStyle = "#C07AFF";
        g.lineWidth = 3;
        g.beginPath();
        g.arc(16, 16, 12, 0.5, 5.5);
        g.stroke();
        ICONS.void = c;

        // Кнопки
        ICONS.attack = document.createElement("canvas");
        ICONS.attack.width = ICONS.attack.height = 64;
        g = ICONS.attack.getContext("2d");
        g.fillStyle = "#fff";
        g.beginPath();
        g.arc(32, 32, 20, 0, TAU);
        g.fill();
        g.fillStyle = "#ff6a6a";
        g.beginPath();
        g.arc(32, 32, 12, 0, TAU);
        g.fill();

        ICONS.dash = document.createElement("canvas");
        ICONS.dash.width = ICONS.dash.height = 64;
        g = ICONS.dash.getContext("2d");
        g.strokeStyle = "#fff";
        g.lineWidth = 6;
        g.lineCap = "round";
        g.beginPath();
        g.moveTo(10, 20);
        g.lineTo(30, 32);
        g.lineTo(10, 44);
        g.stroke();
        g.beginPath();
        g.moveTo(26, 20);
        g.lineTo(46, 32);
        g.lineTo(26, 44);
        g.stroke();

        ICONS.ult = document.createElement("canvas");
        ICONS.ult.width = ICONS.ult.height = 64;
        g = ICONS.ult.getContext("2d");
        g.fillStyle = "#FFD76A";
        g.beginPath();
        g.moveTo(32, 8);
        g.lineTo(40, 24);
        g.lineTo(56, 32);
        g.lineTo(40, 40);
        g.lineTo(32, 56);
        g.lineTo(24, 40);
        g.lineTo(8, 32);
        g.lineTo(24, 24);
        g.fill();
      }

      // ==========================================
      // 6. ИГРОВАЯ ЛОГИКА (СУЩНОСТИ)
      // ==========================================
      class Unit {
        constructor(x, y, team, isPlayer = false, skin = SKINS[0]) {
          this.x = x;
          this.y = y;
          this.vx = 0;
          this.vy = 0;
          this.kx = 0;
          this.ky = 0; // Отбрасывание
          this.radius = 14;
          this.team = team;
          this.isPlayer = isPlayer;
          this.skin = skin;
          this.active = true;
          this.dead = false;

          this.maxHp = 100;
          this.hp = 100;
          this.maxMana = 100;
          this.mana = 100;
          this.ultCharge = 0;
          this.speed = 160;

          this.dmgMult = 1;
          this.attackSpeedMult = 1;
          this.multiShot = 0;
          this.pierce = 0;
          this.lifesteal = 0;
          this.magnetRadius = 1;

          this.faceAngle = 0;
          this.targetAngle = 0;

          this.atkCd = 0;
          this.dashCd = 0;
          this.dashT = 0;
          this.dashDir = { x: 1, y: 0 };
          this.iframes = 0;
          this.hitFlash = 0;
          this.lift = 0;

          this.runes = [];
          this.statusEffects = { slow: 0, frozen: 0, haste: 0, shield: 0 };

          // Для ИИ
          this.aiTimer = 0;
          this.aiState = "wander";
        }

        update(dt) {
          if (this.dead) return;

          // Таймеры
          if (this.atkCd > 0) this.atkCd -= dt;
          if (this.dashCd > 0) this.dashCd -= dt;
          if (this.iframes > 0) this.iframes -= dt;
          if (this.hitFlash > 0) this.hitFlash -= dt;
          for (let k in this.statusEffects) {
            if (this.statusEffects[k] > 0) this.statusEffects[k] -= dt;
          }

          // Регенерация маны и ульта
          this.mana = Math.min(this.maxMana, this.mana + 10 * dt);
          this.ultCharge = Math.min(100, this.ultCharge + (100 / 30) * dt); // 30 секунд на полный заряд

          // Движение (Рывок)
          if (this.dashT > 0) {
            this.dashT -= dt;
            this.vx = this.dashDir.x * 600;
            this.vy = this.dashDir.y * 600;
            this.lift = -20 * Math.sin(Math.PI * (1 - this.dashT / 0.3)); // Взлет

            // Оставляем следы
            if (Math.random() < 0.5) {
              spawnParticle(
                this.x,
                this.y - 10,
                rand(-10, 10),
                rand(-10, 10),
                0.3,
                this.skin.mantle,
                4,
              );
            }
          } else {
            // Затухание отбрасывания
            this.vx += this.kx;
            this.vy += this.ky;
            this.kx *= 0.88;
            this.ky *= 0.88;

            // Применение скорости
            let speedMult = 1;
            if (this.statusEffects.slow > 0) speedMult *= 0.5;
            if (this.statusEffects.haste > 0) speedMult *= 1.3;
            if (this.statusEffects.frozen > 0) speedMult = 0;

            this.vx = lerp(this.vx, 0, 0.1); // Трение
            this.vy = lerp(this.vy, 0, 0.1);
            this.lift = lerp(this.lift, 0, 0.2);
          }

          this.x += this.vx * dt * (this.statusEffects.frozen > 0 ? 0 : 1);
          this.y += this.vy * dt * (this.statusEffects.frozen > 0 ? 0 : 1);

          // Ограничение арены
          const distFromCenter = Math.hypot(this.x, this.y);
          if (distFromCenter > Game.arenaRadius) {
            const angle = Math.atan2(this.y, this.x);
            this.x = Math.cos(angle) * Game.arenaRadius;
            this.y = Math.sin(angle) * Game.arenaRadius;
            // Урон от лавы
            if (Math.random() < 0.1) this.takeDamage(5, this.x, this.y);
          }
        }

        takeDamage(amount, sourceX, sourceY) {
          if (this.dead || this.iframes > 0) return;

          if (this.statusEffects.shield > 0) {
            this.statusEffects.shield = 0;
            this.iframes = 0.5;
            return;
          }

          this.hp -= amount;
          this.hitFlash = 0.1;

          // Отбрасывание
          const angle = Math.atan2(this.y - sourceY, this.x - sourceX);
          this.kx += Math.cos(angle) * 200;
          this.ky += Math.sin(angle) * 200;

          // Заряд ульта от полученного урона (если это игрок)
          if (this.isPlayer)
            this.ultCharge = Math.min(100, this.ultCharge + amount * 0.1);

          if (this.hp <= 0) this.die();
        }

        die() {
          this.dead = true;
          spawnParticle(this.x, this.y, 0, -50, 1, this.skin.mantle, 6);
          for (let i = 0; i < 10; i++)
            spawnParticle(
              this.x,
              this.y,
              rand(-100, 100),
              rand(-100, 100),
              0.5,
              "#fff",
              2,
            );
        }

        tryDash(dx, dy) {
          if (this.dashCd > 0 || this.dead || this.statusEffects.frozen > 0)
            return;
          const len = Math.hypot(dx, dy);
          if (len < 0.1) return;

          this.dashDir = { x: dx / len, y: dy / len };
          this.dashT = 0.3;
          this.dashCd = 2.0;
          this.iframes = 0.3;

          // Звук и частицы
          playSound("sine", 300, 0.2, 0.3);
          for (let i = 0; i < 8; i++) {
            spawnParticle(
              this.x,
              this.y,
              rand(-50, 50),
              rand(-50, 50),
              0.4,
              "#aaa",
              3,
            );
          }
        }

        tryAttack(targetX, targetY) {
          if (this.atkCd > 0 || this.dead || this.statusEffects.frozen > 0)
            return;

          const angle = Math.atan2(targetY - this.y, targetX - this.x);
          this.faceAngle = angle;

          const distToTarget = dist(this.x, this.y, targetX, targetY);

          if (this.mana >= 10 && distToTarget > 45) {
            // Дальняя атака
            this.mana -= 10;
            const color =
              this.runes.length > 0
                ? ELEMENTS[this.runes[this.runes.length - 1]].color
                : "#C9A0FF";
            const numProj = 1 + this.multiShot;

            for (let i = 0; i < numProj; i++) {
              const spread = numProj > 1 ? (i - (numProj - 1) / 2) * 0.15 : 0;
              spawnProjectile(
                this.x + Math.cos(angle) * 15,
                this.y + Math.sin(angle) * 15,
                angle + spread,
                400,
                15 * this.dmgMult,
                this.team,
                color,
                6,
                this.pierce,
              );
            }

            this.atkCd = 0.3 / this.attackSpeedMult;
            playSound("triangle", 500, 0.1, 0.2);
          } else {
            // Ближняя атака (Посох)
            this.atkCd = 0.5 / this.attackSpeedMult;
            this.mana = Math.min(this.maxMana, this.mana + 15); // Восстановление маны
            playSound("sawtooth", 150, 0.15, 0.4);

            // Проверка врагов в радиусе
            for (const u of Game.units) {
              if (!u.active || u.dead || u.team === this.team) continue;
              const d = dist(this.x, this.y, u.x, u.y);
              const a = Math.atan2(u.y - this.y, u.x - this.x);
              let angleDiff = Math.abs(angle - a);
              if (angleDiff > Math.PI) angleDiff = TAU - angleDiff;

              if (d < 60 && angleDiff < Math.PI / 3) {
                // 120 градусов
                u.takeDamage(25 * this.dmgMult, this.x, this.y);
                playSound("square", 100, 0.1, 0.3);
              }
            }
            // Вспышка посоха
            for (let i = 0; i < 5; i++)
              spawnParticle(
                this.x + Math.cos(angle) * 30,
                this.y + Math.sin(angle) * 30,
                rand(-30, 30),
                rand(-30, 30),
                0.2,
                "#FFD700",
                3,
              );
          }
        }

        tryUlt() {
          if (this.ultCharge < 100 || this.dead) return;

          this.ultCharge = 0;
          let key = "arcane";

          if (this.runes.length === 3) {
            // Мега-ульт
            if (
              this.runes[0] === this.runes[1] &&
              this.runes[1] === this.runes[2]
            ) {
              key = `${this.runes[0]}${this.runes[0]}${this.runes[0]}`;
            } else {
              // Комбо (сортируем для стабильности)
              const sorted = [...this.runes].sort();
              key = `${sorted[0]}${sorted[1]}`;
            }
          } else if (this.runes.length === 2) {
            const sorted = [...this.runes].sort();
            key = `${sorted[0]}${sorted[1]}`;
          } else if (this.runes.length === 1) {
            key = `${this.runes[0]}${this.runes[0]}`; // Упрощение для 1 руны
          }

          Game.castUlt(this, key);
          this.runes = []; // Очищаем руны
        }

        draw(ctx, time) {
          if (this.dead) return;

          ctx.save();
          ctx.translate(this.x, this.y + this.lift);

          // Тень
          ctx.fillStyle = "rgba(0,0,0,0.4)";
          ctx.beginPath();
          ctx.ellipse(0, 5, 12, 5, 0, 0, TAU);
          ctx.fill();

          // Аура от скина
          if (this.skin.aura) {
            ctx.globalCompositeOperation = "lighter";
            ctx.fillStyle = this.skin.aura;
            ctx.globalAlpha = 0.2 + Math.sin(time * 5) * 0.1;
            ctx.beginPath();
            ctx.arc(0, -10, 25, 0, TAU);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = "source-over";
          }

          // Вспышка при получении урона
          if (this.hitFlash > 0) {
            ctx.filter = "brightness(2)";
          }

          ctx.lineJoin = "round";
          ctx.lineCap = "round";

          // Мантия (Треугольник с изгибами)
          ctx.beginPath();
          ctx.moveTo(-14, 0);
          ctx.bezierCurveTo(-12, -15, -8, -25, 0, -28);
          ctx.bezierCurveTo(8, -25, 12, -15, 14, 0);
          ctx.quadraticCurveTo(0, 4, -14, 0);

          // Заливка мантии
          ctx.fillStyle = this.skin.mantle;
          ctx.fill();

          // Обводка
          ctx.lineWidth = 4;
          ctx.strokeStyle = "#000";
          ctx.stroke();

          // Кайма (Золото)
          ctx.beginPath();
          ctx.moveTo(-14, 0);
          ctx.quadraticCurveTo(0, 4, 14, 0);
          ctx.lineWidth = 2;
          ctx.strokeStyle = this.skin.trim;
          ctx.stroke();

          // Пояс
          ctx.fillStyle = "#2b1a10";
          ctx.beginPath();
          ctx.rect(-8, -12, 16, 4);
          ctx.fill();
          ctx.stroke();

          // Ромб на поясе
          ctx.fillStyle = "#DAA520";
          ctx.beginPath();
          ctx.moveTo(0, -14);
          ctx.lineTo(3, -10);
          ctx.lineTo(0, -6);
          ctx.lineTo(-3, -10);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Капюшон
          ctx.beginPath();
          ctx.moveTo(-8, -18);
          ctx.bezierCurveTo(-10, -35, 10, -35, 8, -18);
          ctx.quadraticCurveTo(0, -14, -8, -18);
          ctx.fillStyle = this.skin.mantle;
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = "#000";
          ctx.stroke();

          // Внутренняя часть капюшона (Лицо)
          ctx.fillStyle = "#000";
          ctx.beginPath();
          ctx.ellipse(0, -21, 6, 5, 0, 0, TAU);
          ctx.fill();

          // Глаза (Светящиеся)
          ctx.fillStyle = "#fff";
          ctx.globalCompositeOperation = "lighter";

          let eyeSquint = 1;
          let eyeColor = "#fff";

          if (this.hp < this.maxHp * 0.3) {
            eyeSquint = 1.5; // Широко раскрыты
            eyeColor = "#ffaaaa";
          } else if (this.atkCd > 0.2) {
            eyeSquint = 0.5; // Прищур (атака)
          }

          // Свечение глаз
          ctx.globalAlpha = 0.5;
          ctx.beginPath();
          ctx.arc(-2, -22, 4, 0, TAU);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(2, -22, 4, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 1;

          ctx.fillStyle = eyeColor;
          ctx.beginPath();
          ctx.ellipse(-2, -22, 1.5, 2 * eyeSquint, 0.2, 0, TAU);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(2, -22, 1.5, 2 * eyeSquint, -0.2, 0, TAU);
          ctx.fill();

          ctx.globalCompositeOperation = "source-over";

          // Посох
          const staffAngle = this.faceAngle + Math.PI / 2; // Смотрит в сторону взгляда
          ctx.save();
          ctx.rotate(staffAngle);
          ctx.translate(14, 0);

          // Древко
          ctx.beginPath();
          ctx.moveTo(0, -15);
          ctx.lineTo(0, 10);
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#7a4a22";
          ctx.stroke();

          // Кристалл (Светится)
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = "#FFD700";
          ctx.beginPath();
          ctx.arc(0, -18, 8, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 0.5;
          ctx.beginPath();
          ctx.arc(0, -18, 12, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";

          ctx.restore();

          ctx.filter = "none";

          // Полоски над головой
          if (!this.isPlayer) {
            const barWidth = 30;
            const barY = -45;

            // HP
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(-barWidth / 2, barY, barWidth, 4);
            ctx.fillStyle = this.hp > this.maxHp * 0.3 ? "#2ecc71" : "#e74c3c";
            ctx.fillRect(
              -barWidth / 2,
              barY,
              barWidth * (this.hp / this.maxHp),
              4,
            );

            // Мана
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(-barWidth / 2, barY + 5, barWidth, 3);
            ctx.fillStyle = "#3498db";
            ctx.fillRect(
              -barWidth / 2,
              barY + 5,
              barWidth * (this.mana / this.maxMana),
              3,
            );
          }

          ctx.restore();
        }
      }

      // ==========================================
      // 7. ОСНОВНОЙ КЛАСС ИГРЫ
      // ==========================================
      const Game = {
        state: "MENU", // MENU, PLAYING, PAUSED, LEVELUP, RESULT
        mode: "arena", // arena, survival, online
        units: [],
        pickups: [],
        player: null,
        arenaRadius: 500,
        targetRadius: 500,
        time: 0,
        wave: 1,
        waveTimer: 0,
        hitstop: 0,
        screenShake: 0,
        slowMo: 0,
        megaUltDarkness: 0,
        megaUltFlash: 0,

        // Ввод
        keys: {},
        mouse: { x: 0, y: 0, down: false },
        isTouch: false,
        joyStick: { active: false, startX: 0, startY: 0, x: 0, y: 0 },

        init() {
          this.bindInput();
          this.arenaBg = generateArena(1200); // 1200x1200 для арены
          generateIcons();
          document.getElementById("hud").style.display = "none";

          // Запускаем главный цикл
          let lastTime = performance.now();
          const loop = (time) => {
            const rawDt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;
            this.update(rawDt);
            this.render();
            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
        },

        bindInput() {
          window.addEventListener("keydown", (e) => {
            this.keys[e.code] = true;
            if (e.code === "Space") {
              e.preventDefault();
              if (this.state === "PLAYING" && this.player)
                this.player.tryDash(this.player.mx || 0, this.player.my || 0);
            }
            if (e.code === "KeyE" || e.code === "KeyQ") {
              if (this.state === "PLAYING" && this.player) this.player.tryUlt();
            }
          });
          window.addEventListener("keyup", (e) => (this.keys[e.code] = false));

          canvas.addEventListener("mousemove", (e) => {
            this.mouse.x = e.clientX;
            this.mouse.y = e.clientY;
          });
          canvas.addEventListener("mousedown", (e) => {
            if (e.button === 0) {
              this.mouse.down = true;
              if (this.state === "PLAYING" && this.player)
                this.player.tryAttack(e.clientX, e.clientY);
            }
            if (e.button === 2) {
              if (this.state === "PLAYING" && this.player) this.player.tryUlt();
            }
          });
          canvas.addEventListener("mouseup", () => (this.mouse.down = false));
          canvas.addEventListener("contextmenu", (e) => e.preventDefault());

          // Кнопки HUD
          document
            .getElementById("btn-attack")
            .addEventListener("pointerdown", (e) => {
              e.preventDefault();
              if (this.player)
                this.player.tryAttack(
                  this.player.x + Math.cos(this.player.faceAngle) * 100,
                  this.player.y + Math.sin(this.player.faceAngle) * 100,
                );
            });
          document
            .getElementById("btn-dash")
            .addEventListener("pointerdown", (e) => {
              e.preventDefault();
              if (this.player)
                this.player.tryDash(
                  this.player.mx || Math.cos(this.player.faceAngle),
                  this.player.my || Math.sin(this.player.faceAngle),
                );
            });
          document
            .getElementById("btn-ult")
            .addEventListener("pointerdown", (e) => {
              e.preventDefault();
              if (this.player) this.player.tryUlt();
            });
        },

        startMode(mode) {
          initAudio();
          if (ysdk && ysdk.features.GameplayAPI)
            ysdk.features.GameplayAPI.start();

          this.mode = mode;
          this.state = "PLAYING";
          this.time = 0;
          this.wave = 1;
          this.waveTimer = 0;
          this.units = [];
          this.pickups = [];
          this.arenaRadius = 500;
          this.targetRadius = 500;

          document
            .querySelectorAll(".screen")
            .forEach((s) => s.classList.add("hidden"));
          document.getElementById("hud").style.display = "block";

          const centerX = W / 2;
          const centerY = H / 2;

          // Создаем игрока
          this.player = new Unit(centerX, centerY, 0, true, SKINS[0]);
          this.units.push(this.player);

          if (mode === "arena" || mode === "online") {
            // Спавним ботов
            const botCount = 4;
            for (let i = 0; i < botCount; i++) {
              const angle = (i / botCount) * TAU;
              const bx = centerX + Math.cos(angle) * 300;
              const by = centerY + Math.sin(angle) * 300;
              const botSkin = SKINS[randi(1, SKINS.length - 1)];
              const bot = new Unit(bx, by, i + 1, false, botSkin);
              bot.aiState = "chase";
              this.units.push(bot);
            }
            if (mode === "online") {
              // Мокап имен из лидерборда
              this.units.forEach((u, i) => {
                if (i > 0)
                  u.name = ["Merlin", "Ivan_Storm", "NightOwl", "Zephyr"][
                    i - 1
                  ];
              });
            }
          } else if (mode === "survival") {
            // Выживание
            this.spawnWave();
          }

          // Сброс UI
          this.updateHud();
        },

        spawnWave() {
          const count = 5 + this.wave * 2;
          for (let i = 0; i < count; i++) {
            const angle = rand(0, TAU);
            const r = rand(400, 500);
            const mx = W / 2 + Math.cos(angle) * r;
            const my = H / 2 + Math.sin(angle) * r;

            // Создаем монстра (используем Unit с параметрами монстра)
            const m = new Unit(mx, my, 1, false, {
              mantle: "#8B2F3F",
              trim: "#000",
            });
            m.maxHp = 20 + this.wave * 10;
            m.hp = m.maxHp;
            m.speed = 100 + this.wave * 1.5; // +1.5% скорости за волну
            m.isMonster = true;
            m.aiState = "chase";
            this.units.push(m);
          }
          this.showNotif("ВОЛНА " + this.wave);
        },

        castUlt(caster, key) {
          const data = ULTS[key] || ULTS["arcane"];

          if (data.mega) {
            // Глобальный эффект мега-ульта
            this.megaUltFlash = 0.1;
            this.megaUltDarkness = 2.0;
            this.slowMo = 1.0;
            this.hitstop = 0.2;
            this.screenShake = 25;
            playSound("sawtooth", 50, 1.5, 0.8);
          } else {
            this.screenShake = 10;
            playSound("square", 200, 0.5, 0.5);
          }

          this.showNotif(data.name);

          // Визуальные эффекты (упрощенные для примера)
          for (let i = 0; i < 50; i++) {
            spawnParticle(
              caster.x,
              caster.y,
              rand(-300, 300),
              rand(-300, 300),
              1.0,
              data.color,
              4,
            );
          }

          // Логика урона (радиус)
          const radius = data.mega ? 1000 : 150;
          for (const u of this.units) {
            if (!u.active || u.dead || u.team === caster.team) continue;
            if (dist(caster.x, caster.y, u.x, u.y) < radius) {
              u.takeDamage(data.mega ? 100 : 40, caster.x, caster.y);
            }
          }
        },

        update(dt) {
          if (this.state !== "PLAYING") return;

          // Обработка хитстопа и слоу-мо
          let timeScale = 1;
          if (this.slowMo > 0) {
            this.slowMo -= dt;
            timeScale = 0.1;
          }
          if (this.hitstop > 0) {
            this.hitstop -= dt;
            return;
          } // Пропуск кадра
          dt *= timeScale;

          this.time += dt;

          // Управление игроком
          if (this.player && !this.player.dead) {
            let dx = 0,
              dy = 0;
            if (this.keys["KeyW"] || this.keys["ArrowUp"]) dy -= 1;
            if (this.keys["KeyS"] || this.keys["ArrowDown"]) dy += 1;
            if (this.keys["KeyA"] || this.keys["ArrowLeft"]) dx -= 1;
            if (this.keys["KeyD"] || this.keys["ArrowRight"]) dx += 1;

            this.player.mx = dx;
            this.player.my = dy;

            if (dx !== 0 || dy !== 0) {
              const len = Math.hypot(dx, dy);
              this.player.vx = (dx / len) * this.player.speed;
              this.player.vy = (dy / len) * this.player.speed;
            } else if (this.player.dashT <= 0) {
              this.player.vx *= 0.8;
              this.player.vy *= 0.8;
            }

            // Прицеливание (всегда в сторону мыши, если не используется джойстик)
            if (!this.isTouch) {
              this.player.faceAngle = Math.atan2(
                this.mouse.y - this.player.y,
                this.mouse.x - this.player.x,
              );
            }
          }

          // Обновление ИИ ботов и монстров
          for (const u of this.units) {
            if (u.dead || u.isPlayer) continue;

            // Простейший ИИ: идти к ближайшему врагу и атаковать
            let nearest = null;
            let minDist = 9999;
            for (const target of this.units) {
              if (target.team === u.team || target.dead) continue;
              const d = dist(u.x, u.y, target.x, target.y);
              if (d < minDist) {
                minDist = d;
                nearest = target;
              }
            }

            if (nearest) {
              const angle = Math.atan2(nearest.y - u.y, nearest.x - u.x);
              u.faceAngle = angle;

              if (minDist > 100) {
                u.vx = Math.cos(angle) * u.speed;
                u.vy = Math.sin(angle) * u.speed;
              } else {
                u.vx *= 0.8;
                u.vy *= 0.8;
                if (Math.random() < 0.02) u.tryAttack(nearest.x, nearest.y);
              }

              if (Math.random() < 0.005)
                u.tryDash(Math.cos(angle), Math.sin(angle));
              if (u.ultCharge >= 100 && Math.random() < 0.01) u.tryUlt();
            }
          }

          // Обновление пулов
          for (const u of this.units) u.update(dt);
          updateParticles(dt);
          updateProjectiles(dt);

          // Сужение арены (Арена)
          if (this.mode === "arena" && this.time > 10) {
            this.targetRadius = Math.max(100, this.targetRadius - 5 * dt);
            this.arenaRadius = lerp(this.arenaRadius, this.targetRadius, 0.05);
          }

          // Волны (Выживание)
          if (this.mode === "survival") {
            this.waveTimer += dt;
            if (this.waveTimer > 15) {
              this.waveTimer = 0;
              this.wave++;
              this.spawnWave();
            }
          }

          // Проверка победы/поражения
          if (this.player.dead) {
            this.gameOver(false);
          } else {
            const enemiesAlive = this.units.filter(
              (u) => u.team !== 0 && !u.dead,
            ).length;
            if (
              enemiesAlive === 0 &&
              (this.mode === "arena" || this.mode === "online")
            ) {
              this.gameOver(true);
            }
          }

          // Обновление HUD (каждый кадр)
          this.updateHud();
        },

        updateHud() {
          if (!this.player) return;
          const p = this.player;

          document.getElementById("hud-hp").style.width =
            `${(p.hp / p.maxHp) * 100}%`;
          document.getElementById("hud-hp-text").innerText =
            `${Math.ceil(p.hp)} / ${p.maxHp}`;
          document.getElementById("hud-mana").style.width =
            `${(p.mana / p.maxMana) * 100}%`;
          document.getElementById("hud-ult").style.width = `${p.ultCharge}%`;

          // Кулдауны
          document
            .getElementById("cd-dash")
            .style.setProperty("--cd", `${(p.dashCd / 2.0) * 100}%`);
          document
            .getElementById("cd-attack")
            .style.setProperty("--cd", `${(p.atkCd / 0.5) * 100}%`);

          const btnUlt = document.getElementById("btn-ult");
          if (p.ultCharge >= 100) btnUlt.classList.add("ready");
          else btnUlt.classList.remove("ready");

          // Виньетка (Low HP)
          const vig = document.getElementById("vignette");
          if (p.hp / p.maxHp < 0.2 && !p.dead) {
            vig.style.opacity = 0.5 + Math.sin(this.time * 10) * 0.3;
            // Звук сердцебиения
            if (Math.random() < 0.05) playSound("sine", 60, 0.2, 0.4);
          } else {
            vig.style.opacity = 0;
          }
        },

        render() {
          // Очистка экрана
          ctx.fillStyle = "#05030a";
          ctx.fillRect(0, 0, W, H);

          if (this.state === "MENU") {
            this.renderMenu();
            return;
          }

          if (!this.arenaBg) return;

          // Тряска камеры
          let shakeX = 0,
            shakeY = 0;
          if (this.screenShake > 0) {
            shakeX = rand(-this.screenShake, this.screenShake);
            shakeY = rand(-this.screenShake, this.screenShake);
            this.screenShake *= 0.9;
            if (this.screenShake < 0.5) this.screenShake = 0;
          }

          ctx.save();
          ctx.translate(W / 2 + shakeX, H / 2 + shakeY);

          // Отрисовка арены (Центрируем на игроке)
          if (this.player) {
            ctx.translate(-this.player.x, -this.player.y);
          }

          // Фон (Ограничиваем кругом, если арена)
          if (this.mode === "arena") {
            ctx.beginPath();
            ctx.arc(0, 0, this.arenaRadius, 0, TAU);
            ctx.clip();
          }
          ctx.drawImage(this.arenaBg, -600, -600);

          // Отрисовка границы (Лава)
          if (this.mode === "arena") {
            ctx.strokeStyle = "#FF4500";
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.arc(0, 0, this.arenaRadius, 0, TAU);
            ctx.stroke();
          }

          // Отрисовка пикапов (упрощенно)
          // ...

          // Отрисовка юнитов (Сортировка по Y)
          const sortedUnits = [...this.units].sort((a, b) => a.y - b.y);
          for (const u of sortedUnits) u.draw(ctx, this.time);

          // Отрисовка снарядов и частиц
          drawProjectiles();
          drawParticles();

          ctx.restore();

          // Затемнение от мега-ульта
          if (this.megaUltDarkness > 0) {
            this.megaUltDarkness -= 0.016;
            ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(0.6, this.megaUltDarkness)})`;
            ctx.fillRect(0, 0, W, H);
          }

          // Вспышка от мега-ульта
          if (this.megaUltFlash > 0) {
            this.megaUltFlash -= 0.016;
            ctx.fillStyle = `rgba(255, 255, 255, ${this.megaUltFlash * 5})`;
            ctx.fillRect(0, 0, W, H);
            // Звездная пыль
            ctx.fillStyle = "#fff";
            for (let i = 0; i < 50; i++)
              ctx.fillRect(rand(0, W), rand(0, H), 2, 2);
          }

          // HUD отрисовывается через DOM (см. CSS)
        },

        renderMenu() {
          // Отрисовка фона меню
          ctx.drawImage(this.arenaBg, -200, -200, W + 400, H + 400);

          // Отрисовка двух магов, скрестивших посохи
          const t = performance.now() / 1000;
          ctx.save();
          ctx.translate(W / 2, H / 2 + 100);

          // Маг 1 (Огонь)
          ctx.save();
          ctx.translate(-50, 0);
          ctx.rotate(-0.2);
          const m1 = new Unit(0, 0, 0, true, SKINS[0]);
          m1.lift = Math.sin(t * 2) * 5;
          m1.faceAngle = -Math.PI / 4;
          m1.draw(ctx, t);
          ctx.restore();

          // Маг 2 (Пустота)
          ctx.save();
          ctx.translate(50, 0);
          ctx.rotate(0.2);
          const m2 = new Unit(0, 0, 1, false, SKINS[5]);
          m2.lift = Math.cos(t * 2) * 5;
          m2.faceAngle = Math.PI + Math.PI / 4;
          m2.draw(ctx, t);
          ctx.restore();

          // Эффект скрещивания (Вспышка)
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = "#C9A0FF";
          ctx.globalAlpha = 0.5 + Math.sin(t * 5) * 0.2;
          ctx.beginPath();
          ctx.arc(0, -20, 30 + Math.sin(t * 3) * 10, 0, TAU);
          ctx.fill();
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;

          ctx.restore();
        },

        showNotif(text) {
          const notifLayer = document.getElementById("notifications");
          const el = document.createElement("div");
          el.className = "notif";
          el.innerText = text;
          notifLayer.appendChild(el);
          setTimeout(() => el.remove(), 2000);
        },

        gameOver(isWin) {
          this.state = "RESULT";
          document.getElementById("hud").style.display = "none";
          if (ysdk && ysdk.features.GameplayAPI)
            ysdk.features.GameplayAPI.stop();

          document.getElementById("result-title").innerText = isWin
            ? "ПОБЕДА!"
            : "ПОРАЖЕНИЕ";
          document.getElementById("result-title").style.color = isWin
            ? "var(--gold-bright)"
            : "#ff6a6a";
          document.getElementById("res-kills").innerText = this.units.filter(
            (u) => u.dead && u.team !== 0,
          ).length;
          document.getElementById("res-wave").innerText =
            this.mode === "survival" ? this.wave : "-";
          document.getElementById("res-gems").innerText = isWin ? 50 : 10;

          document.getElementById("result").classList.remove("hidden");

          if (isWin) playSound("sine", 400, 0.5, 0.5);
          else playSound("sawtooth", 100, 1.0, 0.5);
        },

        restart() {
          document.getElementById("result").classList.add("hidden");
          this.startMode(this.mode);
        },

        backToMenu() {
          this.state = "MENU";
          document.getElementById("result").classList.add("hidden");
          document.getElementById("menu").classList.remove("hidden");
          if (ysdk && ysdk.features.GameplayAPI)
            ysdk.features.GameplayAPI.stop();
        },

        hideScreens() {
          document
            .querySelectorAll(".screen")
            .forEach((s) => s.classList.add("hidden"));
          document.getElementById("menu").classList.remove("hidden");
        },

        showShop() {
          document.getElementById("menu").classList.add("hidden");
          document.getElementById("shop").classList.remove("hidden");
          const container = document.getElementById("shop-items");
          container.innerHTML = "";
          SKINS.forEach((skin) => {
            const div = document.createElement("div");
            div.className = "glass-panel";
            div.style.padding = "10px";
            div.style.textAlign = "center";
            div.innerHTML = `
                <div style="width: 50px; height: 50px; background: ${skin.mantle}; border-radius: 50%; margin: 0 auto 10px; border: 2px solid ${skin.trim};"></div>
                <div style="font-weight: bold; margin-bottom: 5px;">${skin.name}</div>
                <button class="btn small" onclick="Game.equipSkin('${skin.id}')">Выбрать</button>
            `;
            container.appendChild(div);
          });
        },

        equipSkin(id) {
          const skin = SKINS.find((s) => s.id === id);
          if (skin) {
            // В реальной игре проверка цены и покупка
            this.showNotif("Скин выбран: " + skin.name);
          }
        },

        showCodex() {
          // Заглушка для кодекса
          this.showNotif("Кодекс в разработке");
        },
      };

      // Запуск
      window.onload = () => {
        initYandexSDK();
        Game.init();
      };
    </script>
  </body>
